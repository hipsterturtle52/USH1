as called the \"<strong>burned-over district<\/strong>.\"<\/p>\n<p>The Awakening's message differed from Puritan predestination. Preachers stressed <strong>free will<\/strong>: anyone could choose salvation, and believers could work toward <strong>perfection<\/strong> — personal and social. <strong>Methodists and Baptists<\/strong> grew fastest. <strong>Women<\/strong> formed the majority of converts and organized many church and charitable societies.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Market revolution and social change; belief in free will and human perfectibility<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Second Great Awakening revivals<\/div><span>→<\/span><div><b>Consequence<\/b>Wave of reform movements — temperance, abolition, education, asylums, women's rights<\/div><\/div>\n<p>The religious ferment also produced new faiths:<\/p>\n<ul><li><strong>Mormons<\/strong> (Church of Jesus Christ of Latter-day Saints): <strong>Joseph Smith<\/strong> published the <em>Book of Mormon<\/em> (1830) in New York. Persecuted for their beliefs and practices (including polygamy), Mormons moved to Ohio, Missouri, and Illinois, where Smith was killed by a mob (1844). <strong>Brigham Young<\/strong> led them to the Great Salt Lake in <strong>Utah (1847)<\/strong>.<\/li><li><strong>Shakers:<\/strong> a celibate community that shared property and worshiped through dance; it grew only by conversion.<\/li><\/ul>\n<h2>Utopian communities<\/h2>\n<p>Some reformers tried to build perfect societies in miniature: <strong>Brook Farm<\/strong> (Massachusetts, linked to transcendentalists), <strong>New Harmony<\/strong> (Indiana, founded by the Welsh socialist <strong>Robert Owen<\/strong>), and the <strong>Oneida Community<\/strong> (New York, John Humphrey Noyes, which practiced \"complex marriage\" and shared property). Most utopias failed within a few years.<\/p>\n<h2>Transcendentalism and the American Renaissance<\/h2>\n<p><strong>Transcendentalism<\/strong> was a New England intellectual movement influenced by European <strong>Romanticism<\/strong>. It held that truth could be found through <strong>intuition, nature, and the individual soul<\/strong>, \"transcending\" reason and the senses, and it prized <strong>self-reliance<\/strong> and <strong>nonconformity<\/strong>.<\/p>\n<ul><li><strong>Ralph Waldo Emerson<\/strong> — essays like \"<strong>Self-Reliance<\/strong>\"; his address \"The American Scholar\" (1837) called for an independent American intellectual culture.<\/li><li><strong>Henry David Thoreau<\/strong> — <strong>Walden<\/strong> (1854), about two years of simple living by Walden Pond; and \"<strong>Civil Disobedience<\/strong>\" (1849), written after he went to jail for refusing to pay a tax supporting the <strong>Mexican War<\/strong> and slavery. He argued individuals must refuse to obey unjust laws — an idea that later inspired Gandhi and Martin Luther King Jr.<\/li><li><strong>Margaret Fuller<\/strong> — editor of the transcendentalist journal <em>The Dial<\/em>; <em>Woman in the Nineteenth Century<\/em> (1845), an early feminist work.<\/li><\/ul>\n<p>Other writers of the \"<strong>American Renaissance<\/strong>\": <strong>Nathaniel Hawthorne<\/strong> (<em>The Scarlet Letter<\/em>, a critique of Puritan hypocrisy), <strong>Herman Melville<\/strong> (<em>Moby-Dick<\/em>), <strong>Edgar Allan Poe<\/strong> (horror and detective stories), <strong>Walt Whitman<\/strong> (<em>Leaves of Grass<\/em>, democratic free verse), <strong>James Fenimore Cooper<\/strong> (frontier novels such as <em>The Last of the Mohicans<\/em>), and <strong>Washington Irving<\/strong> (\"Rip Van Winkle\"). In painting, the <strong>Hudson River School<\/strong> (Thomas Cole) celebrated the grandeur of American landscapes.<\/p>\n<div class=\"tip\"><b>Exam tip:<\/b> Romanticism (emotion, nature, the individual) was a reaction against the Enlightenment's emphasis on reason. Transcendentalism is the American version.<\/div>\n<h2>The reform impulse<\/h2>\n<ul><li><strong>Temperance:<\/strong> Americans drank enormous amounts of alcohol, which reformers linked to poverty, crime, and domestic abuse. The <strong>American Temperance Society (1826)<\/strong> urged abstinence; <strong>Maine<\/strong> passed the first statewide <strong>prohibition<\/strong> law (1851).<\/li><li><strong>Public education:<\/strong> <strong>Horace Mann<\/strong>, secretary of the <strong>Massachusetts Board of Education<\/strong> (1837), led the <strong>common school<\/strong> movement for free, tax-supported public schools with trained teachers and longer school years. <strong>McGuffey Readers<\/strong> taught reading and moral values.<\/li><li><strong>Asylums and prisons:<\/strong> <strong>Dorothea Dix<\/strong> documented the brutal treatment of the <strong>mentally ill<\/strong> in jails and persuaded states to build <strong>mental hospitals<\/strong>. Reformers also built <strong>penitentiaries<\/strong> meant to rehabilitate criminals through discipline and reflection.<\/li><\/ul>\n<h2>Women: separate spheres and women's rights<\/h2>\n<p>The market revolution moved paid work out of the home. Middle-class culture embraced the \"<strong>cult of domesticity<\/strong>\" (or \"<strong>separate spheres<\/strong>\"): men belonged in the competitive public world; women were to be pious, pure, and devoted to the home as moral guardians. Ironically, this moral role justified women's activism in <strong>reform<\/strong> — temperance, charity, and abolition.<\/p>\n<p>Working in the abolition movement, women discovered their own lack of rights; at the 1840 World Anti-Slavery Convention in London, female delegates were not allowed to participate. In <strong>1848<\/strong>, <strong>Elizabeth Cady Stanton<\/strong> and <strong>Lucretia Mott<\/strong> organized the <strong>Seneca Falls Convention<\/strong> in New York. Its <strong>Declaration of Sentiments<\/strong>, modeled on the Declaration of Independence, declared that \"all men <strong>and women<\/strong> are created equal\" and listed grievances — including the demand for the <strong>right to vote<\/strong>, the most controversial resolution. Other leaders included <strong>Susan B. Anthony<\/strong> (who joined in the 1850s), the <strong>Grimké sisters<\/strong> (southern-born abolitionists), and <strong>Sojourner Truth<\/strong>, a formerly enslaved woman known for her speech \"Ain't I a Woman?\" (1851).<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Women's work in reform movements exposes their own lack of rights<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Seneca Falls Convention (1848) and the Declaration of Sentiments<\/div><span>→<\/span><div><b>Consequence<\/b>Organized women's rights movement begins; suffrage becomes a long-term goal<\/div><\/div>\n<h2>Abolitionism<\/h2>\n<p>Early antislavery efforts were cautious. The <strong>American Colonization Society (1816)<\/strong> proposed freeing enslaved people gradually and sending free Black Americans to Africa; it founded <strong>Liberia<\/strong>. Most African Americans rejected colonization — they considered America their home.<\/p>\n<p>In the 1830s, abolitionism became radical:<\/p>\n<ul><li><strong>William Lloyd Garrison<\/strong> began publishing <strong>The Liberator (1831)<\/strong>, demanding <strong>immediate, uncompensated emancipation<\/strong>. He called the Constitution \"a covenant with death\" because it protected slavery. He co-founded the <strong>American Anti-Slavery Society (1833)<\/strong>.<\/li><li><strong>Frederick Douglass<\/strong>, who escaped slavery in Maryland, became the movement's most powerful speaker; he wrote the <strong>Narrative of the Life of Frederick Douglass<\/strong> (1845) and published the newspaper <strong>The North Star<\/strong>. Unlike Garrison, he came to see the Constitution as an antislavery tool and supported political action.<\/li><li><strong>David Walker's Appeal (1829)<\/strong>, by a free Black Bostonian, urged enslaved people to resist, by force if necessary.<\/li><li><strong>Harriet Tubman<\/strong> escaped slavery and returned repeatedly to guide others north on the <strong>Underground Railroad<\/strong>, a secret network of safe houses.<\/li><li>Political abolitionists formed the <strong>Liberty Party (1840)<\/strong>.<\/li><\/ul>\n<p>Abolitionists were a <strong>small and unpopular minority<\/strong>, even in the North. Mobs attacked them; the editor <strong>Elijah Lovejoy<\/strong> was killed in Illinois (1837). Southern states banned abolitionist mail, and from 1836 to 1844 the House of Representatives enforced a <strong>gag rule<\/strong> that automatically tabled antislavery petitions — opposed relentlessly by former president <strong>John Quincy Adams<\/strong>, then a congressman.<\/p>\n<h2>The slave South and \"King Cotton\"<\/h2>\n<p>After the cotton gin, cotton spread across the Deep South — Alabama, Mississippi, Louisiana, Texas. By 1860, cotton made up more than half of US exports, and southerners boasted that \"<strong>Cotton is King<\/strong>.\" The enslaved population grew from about 1.5 million (1820) to about <strong>4 million (1860)<\/strong>, mostly by natural increase, since the international trade was banned in 1808. A massive <strong>domestic slave trade<\/strong> forcibly moved roughly a million people from the Upper South to the cotton states, tearing families apart.<\/p>\n<p>White southern society was a pyramid:<\/p>\n<ul><li>A small <strong>planter elite<\/strong> (owners of 20 or more enslaved people) dominated politics.<\/li><li>Most slaveholders owned only a few enslaved people — yet because large plantations held so many people, about half of all enslaved people lived on holdings of 20 or more.<\/li><li>About <strong>three-quarters of white southern families owned no enslaved people at all<\/strong>; most were <strong>yeoman farmers<\/strong>, who nevertheless generally supported slavery because of racial attitudes, hopes of becoming slaveholders, and kinship ties.<\/li><li><strong>Free Black southerners<\/strong> (about 250,000) faced severe legal restrictions.<\/li><\/ul>\n<p>The South industrialized little and built fewer railroads and schools than the North; its wealth was tied up in land and enslaved people.<\/p>\n<p>Enslaved people built a resilient culture: extended <strong>families<\/strong> (though marriages had no legal standing), <strong>Christianity<\/strong> blended with African traditions, <strong>spirituals<\/strong> that often carried hidden messages of freedom, and folktales. They resisted through work slowdowns, sabotage, escape, and occasionally revolt. <strong>Denmark Vesey's<\/strong> planned rebellion in Charleston (1822) was betrayed. <strong>Nat Turner's Rebellion (1831)<\/strong> in Virginia killed about 60 whites; in response, southern states passed <strong>harsher slave codes<\/strong>, restricted education and assembly of enslaved people, and ended open debate about gradual emancipation.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Nat Turner's Rebellion (1831) and rising northern abolitionism<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Southern crackdown: harsher slave codes, censorship of abolitionist mail<\/div><span>→<\/span><div><b>Consequence<\/b>The South shifts from calling slavery a \"necessary evil\" to defending it as a \"positive good\"<\/div><\/div>\n<p>Southern defenders like <strong>John C. Calhoun<\/strong> argued slavery was a \"<strong>positive good<\/strong>\" that civilized and cared for enslaved people, and <strong>George Fitzhugh<\/strong> claimed enslaved people were better off than northern \"<strong>wage slaves<\/strong>.\"<\/p>\n<h2>Immigration and nativism<\/h2>\n<p>Immigration surged in the 1840s–1850s. <strong>Irish<\/strong> immigrants, fleeing the <strong>potato famine<\/strong> (1845–1849), were mostly poor <strong>Catholics<\/strong> who settled in eastern cities, took low-paying jobs (canals, railroads, domestic service), and usually voted <strong>Democratic<\/strong>. <strong>Germans<\/strong>, including many fleeing the failed revolutions of 1848, often had more money and moved to Midwestern farms and cities. Most immigrants avoided the South, which had few factory jobs.<\/p>\n<p>Native-born Protestants responded with <strong>nativism<\/strong> — hostility to immigrants and Catholics. The secretive Order of the Star-Spangled Banner grew into the <strong>Know-Nothing (American) Party<\/strong> in the 1850s, which sought to limit immigrant political power.<\/p>\n<p>Workers also organized. In <strong>Commonwealth v. Hunt (1842)<\/strong>, the Massachusetts Supreme Court ruled that <strong>labor unions were not illegal<\/strong> conspiracies.<\/p>","words":1837,"minutes":12,"must":["<strong>Second Great Awakening:<\/strong> Charles <strong>Finney<\/strong>, camp meetings, \"burned-over district,\" <strong>free will and perfectionism<\/strong> → fueled reform.","<strong>Transcendentalism:<\/strong> <strong>Emerson<\/strong> (\"Self-Reliance\"), <strong>Thoreau<\/strong> (<em>Walden<\/em>, \"<strong>Civil Disobedience<\/strong>\"), Margaret <strong>Fuller<\/strong>.","Writers: Hawthorne (<em>Scarlet Letter<\/em>), Melville (<em>Moby-Dick<\/em>), Whitman (<em>Leaves of Grass<\/em>), Cooper; painters: <strong>Hudson River School<\/strong>.","Reformers: <strong>Horace Mann<\/strong> (public schools), <strong>Dorothea Dix<\/strong> (mental asylums), temperance (Maine law 1851).","<strong>Seneca Falls (1848):<\/strong> Stanton and Mott; <strong>Declaration of Sentiments<\/strong>; demanded women's suffrage.","<strong>Cult of domesticity / separate spheres<\/strong> = women's \"proper\" place was the home.","<strong>Garrison<\/strong> (<em>The Liberator<\/em>, 1831, immediate emancipation), <strong>Frederick Douglass<\/strong>, <strong>Harriet Tubman<\/strong>, <strong>American Colonization Society<\/strong> (Liberia).","<strong>Gag rule (1836–44)<\/strong> blocked antislavery petitions in the House.","<strong>Nat Turner's Rebellion (1831)<\/strong> → harsher slave codes; South defends slavery as a \"<strong>positive good<\/strong>.\"","About <strong>three-quarters of white southern families owned no enslaved people<\/strong>; ~4 million enslaved by 1860; \"<strong>King Cotton<\/strong>.\"","<strong>Irish<\/strong> (famine, Catholic, cities) and <strong>German<\/strong> immigrants → <strong>nativism<\/strong> and the <strong>Know-Nothing Party<\/strong>."],"timeline":[{"y":"1801","e":"Cane Ridge camp meeting","th":"C","key":false},{"y":"1816","e":"American Colonization Society founded","th":"S","key":false},{"y":"1822","e":"Denmark Vesey conspiracy","th":"S","key":false},{"y":"1826","e":"American Temperance Society founded","th":"S","key":false},{"y":"1830","e":"Joseph Smith publishes the Book of Mormon","th":"C","key":false},{"y":"1831","e":"Garrison's The Liberator; Nat Turner's Rebellion","th":"S","key":true},{"y":"1833","e":"American Anti-Slavery Society founded","th":"S","key":false},{"y":"1836–1844","e":"House gag rule on antislavery petitions","th":"P","key":false},{"y":"1837","e":"Horace Mann leads the Massachusetts Board of Education","th":"C","key":false},{"y":"1842","e":"Commonwealth v. Hunt","th":"E","key":false},{"y":"1845","e":"Douglass's Narrative published; Irish potato famine begins","th":"C","key":false},{"y":"1847","e":"Mormons reach the Great Salt Lake","th":"C","key":false},{"y":"1848","e":"Seneca Falls Convention","th":"S","key":true},{"y":"1849","e":"Thoreau's \"Civil Disobedience\"","th":"C","key":false},{"y":"1851","e":"Maine prohibition law; Sojourner Truth's \"Ain't I a Woman?\"","th":"S","key":false},{"y":"1854","e":"Thoreau's Walden; Know-Nothings at their peak","th":"C","key":false}],"cards":[{"id":"c9-1","u":9,"f":"Second Great Awakening","b":"Protestant revivals (1790s–1840s) stressing free will and perfectionism; inspired reform movements."},{"id":"c9-2","u":9,"f":"Charles Grandison Finney","b":"Leading revivalist of the Second Great Awakening, active in New York's \"burned-over district.\""},{"id":"c9-3","u":9,"f":"Burned-over district","b":"Western New York, so often swept by revival fires that it became a hotbed of new faiths and reforms."},{"id":"c9-4","u":9,"f":"Mormons","b":"Founded by Joseph Smith (Book of Mormon, 1830); persecuted; Brigham Young led them to Utah (1847)."},{"id":"c9-5","u":9,"f":"Transcendentalism","b":"Philosophy that truth is found through intuition, nature, and the individual soul; Emerson, Thoreau, Fuller."},{"id":"c9-6","u":9,"f":"Ralph Waldo Emerson","b":"Transcendentalist essayist (\"Self-Reliance,\" \"The American Scholar\")."},{"id":"c9-7","u":9,"f":"\"Civil Disobedience\"","b":"Thoreau's 1849 essay arguing individuals should refuse to obey unjust laws (he protested the Mexican War and slavery)."},{"id":"c9-8","u":9,"f":"Utopian communities","b":"Experimental societies — Brook Farm, New Harmony (Owen), Oneida (Noyes), Shakers — most short-lived."},{"id":"c9-9","u":9,"f":"Hudson River School","b":"Romantic landscape painters (Thomas Cole) celebrating American wilderness."},{"id":"c9-10","u":9,"f":"Horace Mann","b":"Massachusetts reformer who led the common (free public) school movement."},{"id":"c9-11","u":9,"f":"Dorothea Dix","b":"Reformer who exposed the mistreatment of the mentally ill and won state-funded asylums."},{"id":"c9-12","u":9,"f":"Temperance movement","b":"Campaign to reduce or ban alcohol; American Temperance Society (1826); Maine law (1851)."},{"id":"c9-13","u":9,"f":"Cult of domesticity","b":"Ideal of women as pious, pure moral guardians confined to the home (\"separate spheres\")."},{"id":"c9-14","u":9,"f":"Seneca Falls Convention (1848)","b":"First women's rights convention; Stanton and Mott; Declaration of Sentiments demanded suffrage."},{"id":"c9-15","u":9,"f":"Declaration of Sentiments","b":"Seneca Falls document modeled on the Declaration of Independence: \"all men and women are created equal.\""},{"id":"c9-16","u":9,"f":"American Colonization Society","b":"Founded 1816 to send free Black Americans to Africa (Liberia); rejected by most Black Americans."},{"id":"c9-17","u":9,"f":"William Lloyd Garrison","b":"Radical abolitionist; The Liberator (1831); demanded immediate emancipation."},{"id":"c9-18","u":9,"f":"Frederick Douglass","b":"Escaped from slavery; abolitionist orator and author (Narrative, 1845); published The North Star."},{"id":"c9-19","u":9,"f":"Underground Railroad","b":"Secret network helping enslaved people escape north; Harriet Tubman was its most famous \"conductor.\""},{"id":"c9-20","u":9,"f":"Gag rule (1836–44)","b":"House rule automatically tabling antislavery petitions; fought by John Quincy Adams."},{"id":"c9-21","u":9,"f":"Nat Turner's Rebellion (1831)","b":"Virginia slave revolt that killed about 60 whites; led to harsher slave codes."},{"id":"c9-22","u":9,"f":"\"Positive good\" argument","b":"Proslavery claim (Calhoun, Fitzhugh) that slavery benefited enslaved people and society."},{"id":"c9-23","u":9,"f":"Nativism","b":"Hostility toward immigrants, especially Irish Catholics; produced the Know-Nothing (American) Party."}],"quiz":["q9-1","q9-2","q9-3","q9-4","q9-5","q9-6","q9-7","q9-8","q9-9","q9-10","q9-11","q9-12","q9-13"]},{"n":10,"title":"Manifest Destiny & Sectional Crisis","short":"Expansion & Crisis","years":"1840–1861","weight":12,"lesson":"<h2>Why this unit matters<\/h2>\n<p>This is the <strong>most heavily weighted unit<\/strong>. The story is one long chain: <strong>expansion<\/strong> added new land → every new territory reopened the question <strong>\"Will slavery be allowed there?\"<\/strong> → each attempted compromise failed → the parties broke apart → <strong>secession<\/strong>. If you can explain each link in that chain, you can answer most questions in this unit. Learn the compromises and laws <strong>in order<\/strong> and what each did about slavery in the territories.<\/p>\n<h2>Manifest Destiny<\/h2>\n<p>In 1845 the editor <strong>John L. O'Sullivan<\/strong> wrote that it was America's \"<strong>manifest destiny<\/strong> to overspread the continent allotted by Providence.\" The phrase captured a belief that the United States was <strong>destined by God<\/strong> to expand to the Pacific, spreading democracy and Protestant civilization. Motives included land hunger, Pacific ports for Asian trade, fear of British influence, and — for many southerners — new land for <strong>slavery and cotton<\/strong>. The idea also carried assumptions of racial superiority over Mexicans and Native peoples.<\/p>\n<h2>Texas<\/h2>\n<p>After <strong>Mexico<\/strong> won independence from Spain (1821), it invited Americans to settle Texas; <strong>empresarios<\/strong> like <strong>Stephen F. Austin<\/strong> brought in settlers who agreed to become Mexican citizens and Catholics. By 1830 Americans (many with enslaved people) far outnumbered Mexicans in Texas. Tension grew when Mexico <strong>abolished slavery (1829)<\/strong>, restricted further American immigration, and <strong>General Antonio López de Santa Anna<\/strong> centralized power.<\/p>\n<p>In the <strong>Texas Revolution (1835–1836)<\/strong>, Santa Anna wiped out the defenders of the <strong>Alamo<\/strong> in San Antonio (March 1836) — \"Remember the Alamo!\" — but <strong>Sam Houston's<\/strong> army defeated and captured him at <strong>San Jacinto<\/strong> (April 1836). Texas became the independent <strong>Lone Star Republic<\/strong> and asked to join the US. Presidents Jackson and Van Buren held back: annexing Texas would add a huge <strong>slave state<\/strong> and risk <strong>war with Mexico<\/strong>, which never recognized Texas's independence.<\/p>\n<h2>Oregon and the election of 1844<\/h2>\n<p>Thousands of families followed the <strong>Oregon Trail<\/strong> in the 1840s to the fertile Willamette Valley, which the US and Britain jointly occupied. In the <strong>election of 1844<\/strong>, the Democrats nominated a \"dark horse,\" <strong>James K. Polk<\/strong> of Tennessee, on a platform of expansion: the \"<strong>reoccupation of Oregon and the reannexation of Texas<\/strong>.\" Some Democrats demanded all of Oregon up to 54°40′ (\"<strong>Fifty-four forty or fight!<\/strong>\"). Polk beat Henry Clay. Interpreting the vote as a mandate, outgoing President Tyler got Congress to annex <strong>Texas by joint resolution (1845)<\/strong> (a joint resolution needed only a majority in each house, not the two-thirds Senate vote a treaty required).<\/p>\n<p>Polk then compromised with Britain: the <strong>Oregon Treaty (1846)<\/strong> extended the border along the <strong>49th parallel<\/strong> to the Pacific. Polk avoided war with Britain because he was preparing for war with Mexico.<\/p>\n<h2>The Mexican–American War (1846–1848)<\/h2>\n<p>The US and Mexico disputed Texas's southern border: Texans claimed the <strong>Rio Grande<\/strong>, Mexico the <strong>Nueces River<\/strong> farther north. Polk also wanted <strong>California<\/strong>, but Mexico refused to sell. Polk sent General <strong>Zachary Taylor<\/strong> into the disputed zone. When Mexican troops attacked an American patrol there, Polk told Congress that Mexico had \"shed <strong>American blood upon American soil<\/strong>,\" and Congress declared war (May 1846).<\/p>\n<p>Many <strong>Whigs and abolitionists<\/strong> opposed the war as a land grab for slavery. A first-term Whig congressman, <strong>Abraham Lincoln<\/strong>, introduced \"<strong>spot resolutions<\/strong>\" demanding Polk identify the exact spot where American blood was shed. Thoreau went to jail rather than pay taxes supporting the war.<\/p>\n<p>The US won quickly: Taylor won in northern Mexico; <strong>Stephen Kearny<\/strong> took New Mexico; Americans in California revolted (the <strong>Bear Flag Revolt<\/strong>); and <strong>Winfield Scott<\/strong> captured <strong>Mexico City<\/strong> (1847).<\/p>\n<p>The <strong>Treaty of Guadalupe Hidalgo (1848)<\/strong> gave the US the <strong>Mexican Cession<\/strong> — California, Nevada, Utah, and most of Arizona and New Mexico — and confirmed the <strong>Rio Grande<\/strong> border of Texas. The US paid <strong>$15 million<\/strong> and assumed Americans' claims against Mexico. In the <strong>Gadsden Purchase (1853)<\/strong>, the US bought a strip of southern Arizona and New Mexico for a southern railroad route.<\/p>\n<p>Expansionism also reached beyond the continent. In the <strong>Ostend Manifesto (1854)<\/strong>, American diplomats urged buying <strong>Cuba<\/strong> from Spain — or seizing it if Spain refused. Northerners, seeing a plot to add slave territory, denounced it when it became public. In the Pacific, <strong>Commodore Matthew Perry's<\/strong> naval expedition (1853–1854) pressured <strong>Japan<\/strong> to open its ports to American trade, reflecting the hope that Pacific ports would bring Asian markets.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Manifest Destiny; Polk's desire for California; disputed Texas border<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Mexican–American War (1846–1848)<\/div><span>→<\/span><div><b>Consequence<\/b>Huge Mexican Cession — and an explosive question: would slavery be allowed in the new land?<\/div><\/div>\n<h2>The question of slavery in the territories<\/h2>\n<p>In <strong>1846<\/strong>, Pennsylvania Congressman <strong>David Wilmot<\/strong> proposed the <strong>Wilmot Proviso<\/strong>: slavery would be <strong>banned in any land acquired from Mexico<\/strong>. It passed the House (where the North had more seats) repeatedly but <strong>failed in the Senate<\/strong>. Votes split along <strong>sectional<\/strong>, not party, lines — a dangerous sign.<\/p>\n<p>Four positions emerged: 1. <strong>Free soil:<\/strong> Congress should ban slavery in all territories (Wilmot Proviso). Many free-soilers wanted the West for <strong>white farmers and free labor<\/strong>, not necessarily equality for Black people. 2. <strong>Extend the Missouri Compromise line (36°30′)<\/strong> to the Pacific. 3. <strong>Popular sovereignty:<\/strong> let the <strong>settlers of each territory vote<\/strong> on slavery (Senator <strong>Lewis Cass<\/strong>, later <strong>Stephen Douglas<\/strong>). Appealing because it seemed democratic and kept Congress out of it — but vague about <em>when<\/em> settlers could decide. 4. <strong>Calhoun's view:<\/strong> slaves were property protected by the Constitution, so <strong>neither Congress nor territorial governments could ban slavery<\/strong> in any territory.<\/p>\n<p>In <strong>1848<\/strong>, antislavery Democrats, Whigs, and Liberty Party men formed the <strong>Free Soil Party<\/strong> (\"Free Soil, Free Speech, Free Labor, and Free Men\"), nominating <strong>Martin Van Buren<\/strong>. Whig war hero <strong>Zachary Taylor<\/strong> won.<\/p>\n<h2>The Compromise of 1850<\/h2>\n<p>The <strong>California Gold Rush (1849)<\/strong> brought about 100,000 \"forty-niners,\" and California quickly applied to enter the Union as a <strong>free state<\/strong> — which would break the 15–15 balance of free and slave states in the Senate. Southerners threatened secession. In the Senate's last great debate, <strong>Henry Clay<\/strong> proposed a compromise, <strong>Daniel Webster<\/strong> supported it in his \"Seventh of March\" speech (\"I wish to speak today, not as a Massachusetts man, nor as a Northern man, but as an American\"), and the dying <strong>John C. Calhoun<\/strong> opposed it. President Taylor opposed it, but he died in July 1850; President <strong>Millard Fillmore<\/strong> supported it, and <strong>Stephen Douglas<\/strong> passed it as separate bills.<\/p>\n<p>The <strong>Compromise of 1850<\/strong>:<\/p>\n<ul><li><strong>California<\/strong> admitted as a <strong>free state<\/strong> (for the North).<\/li><li><strong>New Mexico and Utah<\/strong> territories organized with <strong>popular sovereignty<\/strong> on slavery (for the South).<\/li><li><strong>Slave trade (not slavery) banned in Washington, D.C.<\/strong> (for the North).<\/li><li>A much stronger <strong>Fugitive Slave Act<\/strong> (for the South).<\/li><li>Texas gave up land claims in New Mexico in exchange for federal payment of its debts.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>California's application as a free state threatens the Senate balance<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Compromise of 1850<\/div><span>→<\/span><div><b>Consequence<\/b>Brief calm — but the new Fugitive Slave Act radicalizes many northerners<\/div><\/div>\n<h2>The Fugitive Slave Act and Uncle Tom's Cabin<\/h2>\n<p>The <strong>Fugitive Slave Act<\/strong> denied accused runaways a <strong>jury trial<\/strong> or the right to testify, paid federal commissioners <strong>$10<\/strong> if they returned a person to slavery but only <strong>$5<\/strong> if they freed them, and required northern citizens to <strong>assist<\/strong> in captures. Free Black northerners were kidnapped into slavery. Northerners who had ignored slavery now saw it enforced on their streets. Crowds tried to rescue captives, and several states passed <strong>personal liberty laws<\/strong> to obstruct the Act. In <strong>1854<\/strong>, it took federal troops to return <strong>Anthony Burns<\/strong> from Boston to slavery.<\/p>\n<p><strong>Harriet Beecher Stowe's<\/strong> novel <strong>Uncle Tom's Cabin (1852)<\/strong>, written in response to the Act, portrayed slavery's cruelty — especially the breakup of families — and sold hundreds of thousands of copies. It turned many northerners against slavery and outraged southerners, who called it lies.<\/p>\n<h2>The Kansas–Nebraska Act and Bleeding Kansas<\/h2>\n<p>Senator <strong>Stephen Douglas<\/strong> of Illinois wanted a <strong>transcontinental railroad<\/strong> on a northern route through Chicago, which required organizing the land west of Missouri. To win southern votes, his <strong>Kansas–Nebraska Act (1854)<\/strong> created two territories, Kansas and Nebraska, to decide slavery by <strong>popular sovereignty<\/strong> — which <strong>repealed the Missouri Compromise<\/strong> line, since both lay north of 36°30′.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Douglas wants a northern railroad route and southern votes<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Kansas–Nebraska Act (1854) repeals the Missouri Compromise<\/div><span>→<\/span><div><b>Consequence<\/b>Bleeding Kansas, death of the Whig Party, birth of the Republican Party<\/div><\/div>\n<p>Northerners were furious. In Kansas, proslavery and antislavery settlers rushed in to win the vote. Thousands of \"<strong>border ruffians<\/strong>\" from Missouri crossed over to vote illegally, electing a proslavery legislature; free-staters formed a rival government. Violence followed — <strong>Bleeding Kansas<\/strong>: proslavery men sacked the free-state town of <strong>Lawrence<\/strong> (1856), and the abolitionist <strong>John Brown<\/strong> led the murder of five proslavery settlers at <strong>Pottawatomie Creek<\/strong>. Violence reached Congress: after Massachusetts Senator <strong>Charles Sumner<\/strong> gave his \"Crime Against Kansas\" speech, South Carolina Congressman <strong>Preston Brooks<\/strong> beat him nearly to death with a cane on the Senate floor (1856). Southerners sent Brooks new canes; northerners saw southern brutality.<\/p>\n<h2>The party system collapses<\/h2>\n<p>The <strong>Whig Party<\/strong> split over Kansas–Nebraska and disappeared. In <strong>1854<\/strong>, opponents of the Act founded the <strong>Republican Party<\/strong>, a purely <strong>northern<\/strong> party committed to stopping the <strong>expansion<\/strong> of slavery into the territories (not abolishing it where it existed). Republicans celebrated \"<strong>free labor<\/strong>\" — the idea that a man could work for wages, save, and become an independent farmer or businessman, which they believed slavery degraded.<\/p>\n<p>In <strong>1856<\/strong>, Republican <strong>John C. Frémont<\/strong> carried most northern states; Democrat <strong>James Buchanan<\/strong> won, with ex-president Fillmore running for the Know-Nothings. The Democrats were now the only truly national party.<\/p>\n<h2>Dred Scott and Lecompton<\/h2>\n<p><strong>Dred Scott<\/strong>, an enslaved man, sued for freedom because his owner had taken him to live in free Illinois and the free Wisconsin Territory. In <strong>Dred Scott v. Sandford (1857)<\/strong>, Chief Justice <strong>Roger Taney<\/strong> ruled that:<\/p>\n<ul><li>Black people, enslaved or free, were <strong>not citizens<\/strong> and could not sue in federal court;<\/li><li>Congress had <strong>no power to ban slavery in the territories<\/strong>, because enslaved people were property protected by the <strong>Fifth Amendment<\/strong> — so the <strong>Missouri Compromise had been unconstitutional<\/strong>.<\/li><\/ul>\n<p>The decision thrilled the South and enraged the North: it seemed to make slavery legal in every territory and destroyed the Republicans' core program — and even undercut popular sovereignty.<\/p>\n<p>In Kansas, the proslavery minority wrote the <strong>Lecompton Constitution<\/strong> (1857). Buchanan backed it; Stephen Douglas opposed it as a fraud on popular sovereignty, splitting the Democrats. Kansas voters rejected it, and Kansas entered as a free state in 1861. The <strong>Panic of 1857<\/strong> hit the North harder than the cotton South, convincing southerners that \"King Cotton\" made them strong.<\/p>\n<h2>Lincoln–Douglas debates and Harpers Ferry<\/h2>\n<p>In <strong>1858<\/strong>, Abraham Lincoln challenged Douglas for his Illinois Senate seat. Accepting the nomination, Lincoln declared: \"<strong>A house divided against itself cannot stand.<\/strong> I believe this government cannot endure, permanently half slave and half free.\" In the <strong>Lincoln–Douglas debates<\/strong>, Lincoln pressed Douglas on how popular sovereignty could survive Dred Scott. In the <strong>Freeport Doctrine<\/strong>, Douglas answered that territories could still keep slavery out by refusing to pass the local laws (slave codes) needed to protect it. Douglas kept his Senate seat but <strong>lost southern support<\/strong>; Lincoln became nationally known.<\/p>\n<p>In <strong>October 1859<\/strong>, John Brown led about 20 men in a raid on the federal arsenal at <strong>Harpers Ferry<\/strong>, Virginia, hoping to arm enslaved people for a revolt. He was captured and <strong>hanged<\/strong>. Many northerners mourned him as a martyr; southerners concluded the North wanted to incite slave rebellion.<\/p>\n<h2>The election of 1860 and secession<\/h2>\n<p>In <strong>1860<\/strong>, the <strong>Democratic Party split<\/strong>: northern Democrats nominated <strong>Douglas<\/strong> (popular sovereignty), and southern Democrats nominated <strong>John C. Breckinridge<\/strong> (federal protection of slavery in all territories). The new <strong>Constitutional Union Party<\/strong> nominated <strong>John Bell<\/strong>, who simply urged preserving the Union. The Republicans nominated <strong>Lincoln<\/strong> on a platform opposing the <strong>expansion<\/strong> of slavery, plus a protective tariff, a <strong>homestead<\/strong> law, and a transcontinental railroad.<\/p>\n<p>Lincoln won with about <strong>40% of the popular vote<\/strong> — every northern free state's electoral votes and <strong>none from the South<\/strong> (he was not even on the ballot in most southern states).<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Lincoln, a Republican opposed to slavery's expansion, wins without any southern electoral votes<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Secession of the Deep South (Dec. 1860–Feb. 1861)<\/div><span>→<\/span><div><b>Consequence<\/b>Confederate States of America formed; crisis over federal forts leads to war<\/div><\/div>\n<p><strong>South Carolina<\/strong> seceded in <strong>December 1860<\/strong>, followed by six more Deep South states by February 1861. They formed the <strong>Confederate States of America<\/strong>, with <strong>Jefferson Davis<\/strong> as president. Secessionists said they were protecting their rights and property; their declarations stated plainly that the protection of <strong>slavery<\/strong> was the central cause.<\/p>\n<p>Senator <strong>John J. Crittenden<\/strong> of Kentucky proposed the <strong>Crittenden Compromise<\/strong>, which would have extended the <strong>36°30′ line to the Pacific<\/strong> and protected slavery south of it with constitutional amendments. Lincoln <strong>rejected<\/strong> any extension of slavery into the territories, and the plan died.<\/p>\n<p>In his <strong>inaugural address (March 1861)<\/strong>, Lincoln said he had no intention of interfering with slavery where it existed, declared secession illegal, and pledged to hold federal property: \"We are not enemies, but friends.\" When he sent supplies to <strong>Fort Sumter<\/strong> in Charleston Harbor, Confederate batteries opened fire on <strong>April 12, 1861<\/strong>. The fort surrendered; Lincoln called for 75,000 volunteers; and <strong>Virginia, North Carolina, Tennessee, and Arkansas<\/strong> then seceded. The Civil War had begun.<\/p>","words":2519,"minutes":17,"must":["<strong>Manifest Destiny<\/strong> (O'Sullivan, 1845): God-given right to expand to the Pacific.","<strong>Texas:<\/strong> independence 1836 (Alamo, San Jacinto); annexed <strong>1845<\/strong> by joint resolution.","<strong>Oregon Treaty (1846):<\/strong> 49th parallel. <strong>Polk<\/strong> (1844) = expansionist president.","<strong>Mexican–American War (1846–48)<\/strong> → <strong>Treaty of Guadalupe Hidalgo (1848):<\/strong> Mexican Cession, Rio Grande border. Lincoln's \"spot resolutions\"; Whig opposition.","<strong>Wilmot Proviso (1846):<\/strong> ban slavery in Mexican Cession; passed House, failed Senate.","<strong>Popular sovereignty<\/strong> (Cass, Douglas): territorial settlers decide slavery.","<strong>Compromise of 1850:<\/strong> California free; Utah/New Mexico popular sovereignty; D.C. slave trade banned; tougher <strong>Fugitive Slave Act<\/strong>.","<strong>Uncle Tom's Cabin (1852)<\/strong> turned northern opinion against slavery.","<strong>Kansas–Nebraska Act (1854):<\/strong> popular sovereignty; <strong>repealed the Missouri Compromise<\/strong> → <strong>Bleeding Kansas<\/strong>; <strong>Republican Party<\/strong> founded.","<strong>Dred Scott (1857):<\/strong> Black people not citizens; Congress can't ban slavery in territories; Missouri Compromise unconstitutional.","<strong>Lincoln–Douglas debates (1858):<\/strong> \"House divided\"; <strong>Freeport Doctrine<\/strong>. <strong>John Brown<\/strong> at Harpers Ferry (1859).","<strong>Election of 1860:<\/strong> Democrats split; Lincoln wins with ~40% and no southern electoral votes → secession; <strong>Fort Sumter (April 1861)<\/strong>."],"timeline":[{"y":"1836","e":"Texas independence (Alamo, San Jacinto)","th":"D","key":true},{"y":"1844","e":"Polk elected on an expansion platform","th":"P","key":false},{"y":"1845","e":"Texas annexed; \"manifest destiny\" coined","th":"D","key":true},{"y":"1846","e":"Mexican–American War begins; Oregon Treaty; Wilmot Proviso","th":"D","key":true},{"y":"1848","e":"Treaty of Guadalupe Hidalgo; Free Soil Party; gold discovered in California","th":"D","key":true},{"y":"1849","e":"California Gold Rush","th":"E","key":false},{"y":"1850","e":"Compromise of 1850; Fugitive Slave Act","th":"P","key":true},{"y":"1852","e":"Uncle Tom's Cabin published","th":"C","key":true},{"y":"1853","e":"Gadsden Purchase","th":"D","key":false},{"y":"1854","e":"Ostend Manifesto; Perry opens Japan to US trade","th":"D","key":false},{"y":"1854","e":"Kansas–Nebraska Act; Republican Party founded","th":"P","key":true},{"y":"1856","e":"Bleeding Kansas; caning of Charles Sumner","th":"S","key":false},{"y":"1857","e":"Dred Scott v. Sandford; Lecompton Constitution; Panic of 1857","th":"P","key":true},{"y":"1858","e":"Lincoln–Douglas debates; \"House Divided\" speech","th":"P","key":true},{"y":"1859","e":"John Brown's raid on Harpers Ferry","th":"S","key":true},{"y":"1860","e":"Lincoln elected; South Carolina secedes","th":"P","key":true},{"y":"1861","e":"Confederacy formed (February); Crittenden Compromise fails","th":"P","key":false},{"y":"1861","e":"Confederates fire on Fort Sumter (April 12)","th":"D","key":true}],"cards":[{"id":"c10-1","u":10,"f":"Manifest Destiny","b":"Belief (O'Sullivan, 1845) that the US was destined by God to expand across North America."},{"id":"c10-2","u":10,"f":"Texas Revolution (1835–36)","b":"Texans won independence from Mexico; Alamo (defeat) and San Jacinto (victory, Sam Houston)."},{"id":"c10-3","u":10,"f":"Annexation of Texas (1845)","b":"Accomplished by joint resolution of Congress under Tyler after Polk's election."},{"id":"c10-4","u":10,"f":"James K. Polk","b":"Expansionist Democratic president (1845–49): Oregon Treaty, Mexican War, Mexican Cession."},{"id":"c10-5","u":10,"f":"Oregon Treaty (1846)","b":"Divided Oregon Country with Britain at the 49th parallel."},{"id":"c10-6","u":10,"f":"\"Spot resolutions\"","b":"Lincoln's challenge to Polk to name the exact spot where \"American blood\" was shed to start the Mexican War."},{"id":"c10-7","u":10,"f":"Treaty of Guadalupe Hidalgo (1848)","b":"Ended the Mexican War; US gained the Mexican Cession and the Rio Grande border for $15 million."},{"id":"c10-8","u":10,"f":"Gadsden Purchase (1853)","b":"Strip of southern Arizona/New Mexico bought from Mexico for a southern railroad route."},{"id":"c10-9","u":10,"f":"Wilmot Proviso (1846)","b":"Proposal to ban slavery in land taken from Mexico; passed the House, failed in the Senate."},{"id":"c10-10","u":10,"f":"Popular sovereignty","b":"Letting territorial settlers vote on slavery; championed by Lewis Cass and Stephen Douglas."},{"id":"c10-11","u":10,"f":"Free Soil Party (1848)","b":"Opposed slavery's expansion into the territories; nominated Martin Van Buren."},{"id":"c10-12","u":10,"f":"Compromise of 1850","b":"California free; Utah and New Mexico popular sovereignty; D.C. slave trade banned; stronger Fugitive Slave Act."},{"id":"c10-13","u":10,"f":"Fugitive Slave Act (1850)","b":"Denied accused runaways jury trials and required northerners to help capture them."},{"id":"c10-14","u":10,"f":"Personal liberty laws","b":"Northern state laws designed to obstruct enforcement of the Fugitive Slave Act."},{"id":"c10-15","u":10,"f":"Uncle Tom's Cabin (1852)","b":"Harriet Beecher Stowe's antislavery novel; hardened northern opinion against slavery."},{"id":"c10-16","u":10,"f":"Kansas–Nebraska Act (1854)","b":"Douglas's law applying popular sovereignty to Kansas and Nebraska; repealed the Missouri Compromise."},{"id":"c10-17","u":10,"f":"Bleeding Kansas","b":"Violence between proslavery and antislavery settlers (sack of Lawrence, Pottawatomie massacre), 1854–1856."},{"id":"c10-18","u":10,"f":"Sumner–Brooks caning (1856)","b":"Rep. Preston Brooks beat Sen. Charles Sumner in the Senate after his \"Crime Against Kansas\" speech."},{"id":"c10-19","u":10,"f":"Republican Party (1854)","b":"Northern party opposing the expansion of slavery; promoted \"free labor.\""},{"id":"c10-20","u":10,"f":"Dred Scott v. Sandford (1857)","b":"Taney: Black people not citizens; Congress cannot ban slavery in territories; Missouri Compromise void."},{"id":"c10-21","u":10,"f":"Lecompton Constitution","b":"Fraudulent proslavery Kansas constitution backed by Buchanan, opposed by Douglas; split the Democrats."},{"id":"c10-22","u":10,"f":"Freeport Doctrine (1858)","b":"Douglas's claim that territories could exclude slavery by refusing to pass slave codes."},{"id":"c10-23","u":10,"f":"\"House Divided\" speech (1858)","b":"Lincoln: the nation \"cannot endure, permanently half slave and half free.\""},{"id":"c10-24","u":10,"f":"Harpers Ferry (1859)","b":"John Brown's failed raid on a federal arsenal to spark a slave revolt; he was hanged and became a northern martyr."},{"id":"c10-25","u":10,"f":"Election of 1860","b":"Democrats split (Douglas, Breckinridge); Bell ran for Constitutional Union; Lincoln won with ~40% and no southern electoral votes."},{"id":"c10-26","u":10,"f":"Crittenden Compromise","b":"Failed 1860–61 plan to extend 36°30′ to the Pacific and protect slavery; Lincoln rejected it."},{"id":"c10-27","u":10,"f":"Fort Sumter (April 12, 1861)","b":"Confederate attack on the federal fort in Charleston Harbor; began the Civil War."}],"quiz":["q10-1","q10-2","q10-3","q10-4","q10-5","q10-6","q10-7","q10-8","q10-9","q10-10","q10-11","q10-12","q10-13","q10-14","q10-15"]},{"n":11,"title":"The Civil War","short":"Civil War","years":"1861–1865","weight":11,"lesson":"<h2>Why this unit matters<\/h2>\n<p>The Civil War was the deadliest conflict in American history — roughly <strong>620,000 to 750,000<\/strong> soldiers died — and it settled two great questions: the Union could not be broken by secession, and <strong>slavery would end<\/strong>. The exam focuses less on battle tactics than on <strong>why the North won<\/strong>, <strong>turning points<\/strong>, <strong>emancipation<\/strong>, <strong>diplomacy<\/strong>, and the <strong>home fronts<\/strong> (draft, finance, wartime laws). Learn about five battles well; learn the policies thoroughly.<\/p>\n<h2>The two sides<\/h2>\n<p>After Fort Sumter, eleven states formed the Confederacy. Four slave <strong>border states<\/strong> — <strong>Delaware, Maryland, Kentucky, and Missouri<\/strong> — stayed in the Union, and <strong>West Virginia<\/strong> broke away from Virginia to join the Union (1863). Keeping the border states was vital: Maryland surrounded Washington, D.C., and Kentucky controlled the Ohio River. To hold Maryland, Lincoln <strong>suspended the writ of habeas corpus<\/strong> there, jailing suspected secessionists without trial — one of several actions that expanded presidential power in wartime. (After the war, in <em>Ex parte Milligan<\/em>, 1866, the Supreme Court ruled that military trials of civilians where civilian courts were open were unconstitutional.)<\/p>\n<p><strong>Northern advantages:<\/strong> about <strong>22 million<\/strong> people vs. <strong>9 million<\/strong> in the South (about 3.5 million of them enslaved); around <strong>90% of the nation's manufacturing<\/strong>; most of the <strong>railroads<\/strong>; a <strong>navy<\/strong>; an established government and financial system; and more food.<\/p>\n<p><strong>Southern advantages:<\/strong> it only had to <strong>defend<\/strong> and outlast the North, not conquer; it fought on familiar home ground with high morale; and it had excellent generals such as <strong>Robert E. Lee<\/strong> and <strong>Thomas \"Stonewall\" Jackson<\/strong>. Southerners also hoped \"<strong>King Cotton<\/strong>\" would force Britain and France to intervene.<\/p>\n<p><strong>Strategies:<\/strong> the Union's <strong>Anaconda Plan<\/strong> (General Winfield Scott) aimed to <strong>blockade<\/strong> southern ports and <strong>seize the Mississippi River<\/strong>, squeezing the Confederacy, while also trying to capture the Confederate capital, <strong>Richmond<\/strong>. The Confederacy fought a mostly <strong>defensive<\/strong> war, occasionally invading the North (Antietam, Gettysburg) hoping to win foreign recognition and break northern will.<\/p>\n<h2>The early war (1861–1862)<\/h2>\n<ul><li><strong>First Battle of Bull Run (Manassas), July 1861:<\/strong> a Confederate victory that shattered northern hopes of a quick war.<\/li><li><strong>Monitor vs. Merrimack (Virginia), March 1862:<\/strong> the first battle between <strong>ironclad<\/strong> warships, a draw that made wooden navies obsolete.<\/li><li>In the <strong>West<\/strong>, General <strong>Ulysses S. Grant<\/strong> captured Forts Henry and Donelson (1862) and won the bloody <strong>Battle of Shiloh<\/strong> (April 1862). Admiral <strong>David Farragut<\/strong> captured <strong>New Orleans<\/strong> (April 1862).<\/li><li>In the <strong>East<\/strong>, General <strong>George McClellan<\/strong> — a skilled organizer but overly cautious — failed to take Richmond in the <strong>Peninsula Campaign<\/strong> (1862).<\/li><\/ul>\n<p><strong>Antietam (September 17, 1862)<\/strong> in Maryland was the <strong>bloodiest single day<\/strong> in American history (about 23,000 casualties). Lee's first invasion of the North was stopped. It was not a clear victory, but it gave Lincoln the opportunity he needed to issue the <strong>preliminary Emancipation Proclamation<\/strong> — and it discouraged Britain from recognizing the Confederacy. Lincoln later removed McClellan for failing to pursue Lee.<\/p>\n<h2>Emancipation<\/h2>\n<p>At first, Lincoln insisted the war was to <strong>preserve the Union<\/strong>, not to end slavery — partly to keep the border states loyal. (\"If I could save the Union without freeing any slave I would do it,\" he wrote in 1862.) But enslaved people forced the issue by escaping to Union lines. General Benjamin Butler declared such escapees \"<strong>contraband of war<\/strong>\" and refused to return them. Congress passed <strong>Confiscation Acts<\/strong> (1861, 1862) to seize Confederate property, including enslaved people, <strong>abolished slavery in Washington, D.C.<\/strong> (1862, with compensation to owners), and banned slavery in the territories (1862).<\/p>\n<p>The <strong>Emancipation Proclamation<\/strong>, effective <strong>January 1, 1863<\/strong>, declared free all enslaved people in areas <strong>still in rebellion<\/strong> against the United States. Issued under Lincoln's power as <strong>commander in chief<\/strong>, it was a <strong>war measure<\/strong>.<\/p>\n<ul><li>It did <strong>not<\/strong> apply to the loyal <strong>border states<\/strong> or Union-occupied areas — so on the day it took effect it immediately freed few people.<\/li><li>But it <strong>changed the war's purpose<\/strong> to include ending slavery; every advance of Union troops now meant freedom.<\/li><li>It made British or French recognition of the Confederacy politically impossible, since their publics opposed slavery.<\/li><li>It authorized the enlistment of <strong>Black soldiers<\/strong>.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Union need for manpower, escapes by enslaved people, and the \"victory\" at Antietam<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Emancipation Proclamation (Jan. 1, 1863)<\/div><span>→<\/span><div><b>Consequence<\/b>War aims expand to ending slavery; Britain stays out; about 180,000 Black men serve in the Union army<\/div><\/div>\n<p>About <strong>180,000 African American soldiers<\/strong> served in the <strong>US Colored Troops<\/strong> (about 10% of the Union army), plus thousands in the navy. The <strong>54th Massachusetts<\/strong> regiment's assault on <strong>Fort Wagner<\/strong> (1863) proved their courage to doubting whites. Black soldiers served in segregated units under white officers and received <strong>lower pay<\/strong> until Congress equalized it in 1864. Confederates sometimes executed captured Black soldiers, as at Fort Pillow (1864).<\/p>\n<p>Because the Proclamation was a war measure that might not survive peace, Lincoln pushed for a constitutional amendment. Congress passed the <strong>13th Amendment<\/strong>, abolishing slavery throughout the United States, in <strong>January 1865<\/strong>; it was ratified in <strong>December 1865<\/strong>.<\/p>\n<div class=\"tip\"><b>Exam tip:<\/b> Classic exam point: the Emancipation Proclamation freed enslaved people <strong>only in Confederate-held territory<\/strong>; the <strong>13th Amendment<\/strong> ended slavery everywhere.<\/div>\n<h2>Turning points: Gettysburg and Vicksburg (July 1863)<\/h2>\n<p>After winning at Fredericksburg (December 1862) and Chancellorsville (May 1863, where Stonewall Jackson was accidentally shot by his own men), Lee invaded the North again.<\/p>\n<ul><li><strong>Gettysburg (July 1–3, 1863)<\/strong>, Pennsylvania: General George Meade's Union army repulsed Lee; the disastrous Confederate assault on the third day is known as <strong>Pickett's Charge<\/strong>. Lee never again invaded the North. In November, Lincoln's <strong>Gettysburg Address<\/strong> redefined the war as a struggle for \"<strong>a new birth of freedom<\/strong>\" and \"government of the people, by the people, for the people.\"<\/li><li><strong>Vicksburg (surrendered July 4, 1863)<\/strong>: after a long siege, Grant captured the last major Confederate stronghold on the Mississippi. The Union now controlled the river, <strong>splitting the Confederacy in two<\/strong> — fulfilling the Anaconda Plan.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Lee's second invasion of the North; Grant's siege of Vicksburg<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Union victories at Gettysburg and Vicksburg (July 1863)<\/div><span>→<\/span><div><b>Consequence<\/b>Turning point: Confederacy split, Lee on the defensive, foreign intervention no longer likely<\/div><\/div>\n<h2>Total war and the end (1864–1865)<\/h2>\n<p>Lincoln made <strong>Grant<\/strong> general-in-chief in 1864. Grant pressed Lee relentlessly in Virginia (the Wilderness, Spotsylvania, Cold Harbor) despite huge losses, then besieged <strong>Petersburg<\/strong>, the rail hub protecting Richmond. Meanwhile <strong>William Tecumseh Sherman<\/strong> captured <strong>Atlanta (September 1864)<\/strong> and then made his <strong>March to the Sea<\/strong> to Savannah, destroying railroads, crops, and property to break southern civilians' ability and will to fight — <strong>total war<\/strong>.<\/p>\n<p>The fall of Atlanta helped Lincoln win the <strong>election of 1864<\/strong> against Democrat <strong>George McClellan<\/strong>, whose party's platform called the war a failure. Lincoln ran on a \"National Union\" ticket with <strong>Andrew Johnson<\/strong>, a pro-Union Democrat from Tennessee, as his running mate.<\/p>\n<p>Lee abandoned Richmond in April 1865 and surrendered to Grant at <strong>Appomattox Court House<\/strong>, Virginia, on <strong>April 9, 1865<\/strong>. Grant offered generous terms: Confederate soldiers could go home and keep their horses. Five days later, on <strong>April 14<\/strong>, <strong>John Wilkes Booth<\/strong> shot Lincoln at <strong>Ford's Theatre<\/strong>; he died the next morning, and Andrew Johnson became president.<\/p>\n<h2>Diplomacy<\/h2>\n<p>The Confederacy's hope for European recognition rested on <strong>King Cotton diplomacy<\/strong>. It failed because:<\/p>\n<ul><li>Britain had a <strong>surplus of cotton<\/strong> stored from bumper crops before the war and developed new sources in <strong>Egypt and India<\/strong>.<\/li><li>Britain needed northern <strong>wheat<\/strong> (\"King Corn\") after poor harvests.<\/li><li>After <strong>Antietam<\/strong> and the <strong>Emancipation Proclamation<\/strong>, siding with a slaveholding nation became politically impossible; British workers largely supported the Union.<\/li><li>US Minister <strong>Charles Francis Adams<\/strong> skillfully managed relations in London.<\/li><\/ul>\n<p>Crises still occurred. In the <strong>Trent Affair (1861)<\/strong>, a US warship stopped a British ship and seized two Confederate diplomats, <strong>Mason and Slidell<\/strong>; Lincoln released them to avoid war (\"one war at a time\"). British shipyards built Confederate raiders like the <strong>CSS Alabama<\/strong>, which sank many Union merchant ships — leading to the postwar \"Alabama claims\" that Britain paid. France used the war to install <strong>Maximilian<\/strong> as emperor of <strong>Mexico<\/strong> (1864), defying the Monroe Doctrine; after the war, US pressure helped force the French out.<\/p>\n<h2>The Union home front<\/h2>\n<p>With southern Democrats gone from Congress, Republicans passed long-stalled economic programs:<\/p>\n<ul><li><strong>Homestead Act (1862):<\/strong> <strong>160 acres<\/strong> of western public land free to settlers who lived on and farmed it for <strong>five years<\/strong>.<\/li><li><strong>Morrill Land-Grant College Act (1862):<\/strong> federal land to states to fund <strong>agricultural and mechanical colleges<\/strong>.<\/li><li><strong>Pacific Railway Act (1862):<\/strong> land grants and loans for the <strong>transcontinental railroad<\/strong> (completed 1869).<\/li><li>High protective <strong>tariffs<\/strong> (Morrill Tariff).<\/li><li><strong>National Banking Acts (1863–1864):<\/strong> a system of national banks and a uniform national currency.<\/li><li>The first federal <strong>income tax<\/strong> and paper money called <strong>greenbacks<\/strong> (not backed by gold), plus massive bond sales.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Secession removes southern opposition in Congress; war needs revenue<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Homestead Act, transcontinental railroad, national banks, tariffs, greenbacks<\/div><span>→<\/span><div><b>Consequence<\/b>Expanded federal power over the economy and a boost to northern industry and the West<\/div><\/div>\n<p>The Union adopted a <strong>draft<\/strong> in <strong>1863<\/strong>. A man could avoid service by hiring a <strong>substitute<\/strong> or paying a <strong>$300 commutation fee<\/strong>, leading to complaints of \"<strong>a rich man's war and a poor man's fight<\/strong>.\" In July 1863, the <strong>New York City draft riots<\/strong> — largely by Irish immigrant workers who feared competition from freed Black laborers — killed over 100 people, including many African Americans who were lynched.<\/p>\n<p><strong>Copperheads<\/strong> (Peace Democrats), such as Ohio's <strong>Clement Vallandigham<\/strong>, opposed the war and called for a negotiated peace; Vallandigham was arrested and banished to the Confederacy.<\/p>\n<p><strong>Women<\/strong> took over farms, shops, and factory jobs, and served as nurses. <strong>Clara Barton<\/strong> cared for the wounded (she later founded the American Red Cross), <strong>Dorothea Dix<\/strong> was superintendent of Union army nurses, and the <strong>US Sanitary Commission<\/strong>, largely run by women volunteers, improved camp hygiene and medical care.<\/p>\n<h2>The Confederate home front<\/h2>\n<p>The Confederacy struggled to fight a modern war:<\/p>\n<ul><li>It passed the first <strong>conscription<\/strong> law in American history (<strong>1862<\/strong>), but exempted men who owned <strong>twenty or more enslaved people<\/strong> — fueling resentment among poor whites.<\/li><li>It printed huge amounts of paper money, causing <strong>inflation<\/strong> of roughly 9,000%; food shortages led to <strong>bread riots<\/strong> (Richmond, 1863).<\/li><li>Its commitment to <strong>states' rights<\/strong> hampered President <strong>Jefferson Davis<\/strong>; some governors resisted central control of troops and supplies.<\/li><li>The Union <strong>blockade<\/strong> grew tighter, cutting off imports and cotton exports.<\/li><li>Late in the war, enslaved people increasingly escaped or slowed work, weakening the South from within. Desperate, the Confederate Congress voted in March 1865 to arm some enslaved men — far too late to matter.<\/li><\/ul>\n<h2>Results<\/h2>\n<p>The war <strong>preserved the Union<\/strong>, established that states could not secede, <strong>ended slavery<\/strong>, and greatly <strong>expanded federal power<\/strong> — including the first national taxes, currency, and draft. The North's economy grew, while the South's was devastated: its railroads, cities, and farms lay in ruins, and its wealth in enslaved people was gone. Reconstruction (Unit 12) would decide what freedom meant.<\/p>","words":2096,"minutes":14,"must":["<strong>Border states<\/strong> (DE, MD, KY, MO) stayed in the Union; Lincoln <strong>suspended habeas corpus<\/strong> in Maryland.","<strong>North's advantages:<\/strong> population, industry (~90%), railroads, navy. <strong>South's:<\/strong> defensive war, generals (Lee, Jackson).","<strong>Anaconda Plan:<\/strong> blockade + control the Mississippi.","<strong>Antietam (Sept. 1862)<\/strong> = bloodiest single day → <strong>Emancipation Proclamation<\/strong>.","<strong>Emancipation Proclamation (Jan. 1, 1863):<\/strong> freed enslaved people <strong>only in areas in rebellion<\/strong>; changed war aims; allowed Black enlistment; kept Britain out.","<strong>Gettysburg + Vicksburg (July 1863)<\/strong> = turning point; Vicksburg gave the Union the Mississippi.","<strong>Gettysburg Address:<\/strong> \"a new birth of freedom\"; \"government of the people, by the people, for the people.\"","<strong>Sherman's March to the Sea (1864)<\/strong> = total war; Atlanta's fall helped Lincoln win reelection over McClellan.","<strong>Appomattox (April 9, 1865)<\/strong>; Lincoln assassinated April 14, 1865.","<strong>King Cotton diplomacy failed<\/strong> (British cotton surplus, Egypt/India, need for wheat, emancipation). <strong>Trent Affair<\/strong> settled peacefully.","<strong>Homestead Act<\/strong> (160 acres), <strong>Morrill Land-Grant Act<\/strong>, <strong>Pacific Railway Act<\/strong>, <strong>National Banking Act<\/strong>, greenbacks, income tax.","<strong>Draft (1863):<\/strong> $300 commutation → <strong>NYC draft riots<\/strong>; <strong>Copperheads<\/strong> = Peace Democrats.","<strong>13th Amendment<\/strong> abolished slavery (passed Congress Jan. 1865; ratified Dec. 1865)."],"timeline":[{"y":"1861","e":"Fort Sumter (April); First Bull Run (July); Trent Affair","th":"D","key":true},{"y":"1861","e":"Lincoln suspends habeas corpus in Maryland","th":"P","key":false},{"y":"1862","e":"Monitor vs. Merrimack; Shiloh; New Orleans captured","th":"D","key":false},{"y":"1862","e":"Homestead Act; Morrill Act; Pacific Railway Act","th":"E","key":true},{"y":"1862","e":"Antietam (September 17)","th":"D","key":true},{"y":"1863","e":"Emancipation Proclamation takes effect (January 1)","th":"S","key":true},{"y":"1863","e":"National Banking Act; Union draft","th":"E","key":false},{"y":"1863","e":"Gettysburg (July 1–3) and Vicksburg (July 4)","th":"D","key":true},{"y":"1863","e":"New York City draft riots; 54th Massachusetts at Fort Wagner","th":"S","key":false},{"y":"1863","e":"Gettysburg Address (November)","th":"C","key":false},{"y":"1864","e":"Sherman takes Atlanta; March to the Sea; Lincoln reelected","th":"D","key":true},{"y":"1865","e":"13th Amendment passes Congress (January)","th":"P","key":false},{"y":"1865","e":"Lee surrenders at Appomattox (April 9); Lincoln assassinated (April 14)","th":"P","key":true},{"y":"1865","e":"13th Amendment ratified (December)","th":"P","key":true}],"cards":[{"id":"c11-1","u":11,"f":"Border states","b":"Slave states that stayed in the Union: Delaware, Maryland, Kentucky, Missouri (plus West Virginia, 1863)."},{"id":"c11-2","u":11,"f":"Habeas corpus suspension","b":"Lincoln's wartime suspension in Maryland, allowing arrests without trial; challenged in Ex parte Merryman."},{"id":"c11-3","u":11,"f":"Anaconda Plan","b":"Union strategy: blockade southern ports and seize the Mississippi River to strangle the Confederacy."},{"id":"c11-4","u":11,"f":"First Bull Run (1861)","b":"Confederate victory near Washington that ended hopes of a short war."},{"id":"c11-5","u":11,"f":"Antietam (1862)","b":"Bloodiest single day in US history; stopped Lee's invasion; gave Lincoln the moment to announce emancipation."},{"id":"c11-6","u":11,"f":"Emancipation Proclamation (1863)","b":"Freed enslaved people in areas in rebellion; a war measure; excluded border states."},{"id":"c11-7","u":11,"f":"Contraband of war","b":"Butler's 1861 term for enslaved people who escaped to Union lines and were not returned."},{"id":"c11-8","u":11,"f":"US Colored Troops","b":"About 180,000 Black soldiers in the Union army; 54th Massachusetts at Fort Wagner; unequal pay until 1864."},{"id":"c11-9","u":11,"f":"Gettysburg (1863)","b":"Union victory (July 1–3); Pickett's Charge failed; Lee never again invaded the North."},{"id":"c11-10","u":11,"f":"Vicksburg (1863)","b":"Grant's siege captured the last Confederate stronghold on the Mississippi (July 4), splitting the Confederacy."},{"id":"c11-11","u":11,"f":"Gettysburg Address","b":"Lincoln's 1863 speech: \"a new birth of freedom\" and \"government of the people, by the people, for the people.\""},{"id":"c11-12","u":11,"f":"Total war","b":"Destroying the enemy's resources and civilian will to fight; Sherman's March to the Sea (1864)."},{"id":"c11-13","u":11,"f":"Appomattox Court House","b":"Where Lee surrendered to Grant on April 9, 1865."},{"id":"c11-14","u":11,"f":"King Cotton diplomacy","b":"Confederate hope that cotton dependence would force Britain/France to intervene; failed."},{"id":"c11-15","u":11,"f":"Trent Affair (1861)","b":"US seizure of Confederate envoys Mason and Slidell from a British ship; Lincoln released them."},{"id":"c11-16","u":11,"f":"Homestead Act (1862)","b":"160 acres of public land free to settlers who farmed it for five years."},{"id":"c11-17","u":11,"f":"Morrill Land-Grant Act (1862)","b":"Federal land grants to states to fund agricultural and mechanical colleges."},{"id":"c11-18","u":11,"f":"Pacific Railway Act (1862)","b":"Federal support for the first transcontinental railroad (completed 1869)."},{"id":"c11-19","u":11,"f":"National Banking Acts (1863–64)","b":"Created national banks and a uniform national currency."},{"id":"c11-20","u":11,"f":"Greenbacks","b":"Paper money issued by the Union during the war, not backed by gold."},{"id":"c11-21","u":11,"f":"NYC draft riots (1863)","b":"Violent protest against the Union draft and its $300 exemption; rioters killed many Black residents."},{"id":"c11-22","u":11,"f":"Copperheads","b":"Northern Peace Democrats who opposed the war and favored negotiation (Clement Vallandigham)."},{"id":"c11-23","u":11,"f":"Twenty-negro law","b":"Confederate draft exemption for men owning 20+ enslaved people; \"rich man's war, poor man's fight.\""},{"id":"c11-24","u":11,"f":"13th Amendment","b":"Abolished slavery throughout the United States; ratified December 1865."}],"quiz":["q11-1","q11-2","q11-3","q11-4","q11-5","q11-6","q11-7","q11-8","q11-9","q11-10","q11-11","q11-12","q11-13","q11-14"]},{"n":12,"title":"Reconstruction","short":"Reconstruction","years":"1865–1877","weight":10,"lesson":"<h2>Why this unit matters<\/h2>\n<p><strong>Reconstruction<\/strong> (1865–1877) asked: How would the Confederate states rejoin the Union, and what would freedom mean for four million formerly enslaved people? The answers produced three constitutional amendments that still shape American law — the <strong>13th, 14th, and 15th<\/strong> — a battle between <strong>President Andrew Johnson<\/strong> and the <strong>Radical Republicans<\/strong>, the first Black officeholders in the South, and then a violent backlash that ended Reconstruction with the <strong>Compromise of 1877<\/strong>. The exam heavily tests <strong>the amendments<\/strong>, <strong>competing plans<\/strong>, <strong>Black Codes<\/strong>, <strong>sharecropping<\/strong>, and <strong>why Reconstruction ended<\/strong>.<\/p>\n<h2>Lincoln's plan<\/h2>\n<p>In December 1863, Lincoln announced his lenient <strong>Ten Percent Plan<\/strong>: a Confederate state could form a new government once <strong>10% of its 1860 voters<\/strong> swore loyalty to the Union and accepted emancipation. Most Confederates would be pardoned. Lincoln's goal was a quick reunion.<\/p>\n<p>Radical Republicans in Congress thought this far too easy. Their <strong>Wade–Davis Bill (1864)<\/strong> required a <strong>majority<\/strong> of a state's white men to take a loyalty oath and barred anyone who had voluntarily supported the Confederacy from voting for the new state convention. Lincoln killed it with a <strong>pocket veto<\/strong>. The dispute raised a lasting question: Was Reconstruction the job of the <strong>president<\/strong> or of <strong>Congress<\/strong>?<\/p>\n<p>In March 1865, Congress created the <strong>Freedmen's Bureau<\/strong>, the first major federal social-welfare agency. Headed by General <strong>Oliver O. Howard<\/strong>, it provided food, clothing, and medical care, negotiated <strong>labor contracts<\/strong>, and — its greatest success — founded <strong>schools<\/strong> for freed people, working with northern missionary societies to establish colleges such as <strong>Howard University<\/strong> and <strong>Fisk University<\/strong>. But it never achieved meaningful <strong>land redistribution<\/strong>. General Sherman's <strong>Field Order No. 15<\/strong> (January 1865) had set aside coastal land for freed families in 40-acre plots — the origin of the hope for \"<strong>forty acres and a mule<\/strong>\" — but President Johnson returned most of that land to its former owners.<\/p>\n<h2>Johnson's plan (Presidential Reconstruction, 1865)<\/h2>\n<p>After Lincoln's assassination, <strong>Andrew Johnson<\/strong>, a Tennessee Democrat who had stayed loyal to the Union, became president. Johnson hated the planter elite but also held deeply racist views and strongly supported <strong>states' rights<\/strong>. His plan required southern states to:<\/p>\n<ul><li>repeal or void their <strong>secession<\/strong> ordinances,<\/li><li>ratify the <strong>13th Amendment<\/strong>, and<\/li><li>repudiate Confederate war debts.<\/li><\/ul>\n<p>Wealthy Confederates had to apply to Johnson personally for <strong>pardons<\/strong> — and he granted them by the thousands. Southern voters promptly elected former Confederate leaders to Congress, including the Confederacy's vice president, <strong>Alexander Stephens<\/strong>.<\/p>\n<p>The new southern governments passed <strong>Black Codes<\/strong> — laws that restricted freedpeople's lives in ways that resembled slavery. They required Black Southerners to sign yearly <strong>labor contracts<\/strong>, allowed arrest for \"<strong>vagrancy<\/strong>\" (unemployment) with punishment by forced labor, limited the jobs they could hold and their right to own or rent land, and barred them from serving on juries or testifying against whites.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Johnson's lenient plan returns former Confederates to power<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Black Codes (1865–1866) restrict freedpeople<\/div><span>→<\/span><div><b>Consequence<\/b>Northern outrage; Congress takes control of Reconstruction from the president<\/div><\/div>\n<p>When Congress met in December 1865, it <strong>refused to seat<\/strong> the newly elected southern representatives.<\/p>\n<h2>Congress strikes back<\/h2>\n<p>Johnson <strong>vetoed<\/strong> a bill extending the Freedmen's Bureau and the <strong>Civil Rights Act of 1866<\/strong>, which declared Black Americans citizens with equal legal rights. Congress <strong>overrode<\/strong> the Civil Rights Act veto — the first time it overrode a president on a major bill.<\/p>\n<p>To put these rights beyond the reach of future majorities, Congress passed the <strong>14th Amendment<\/strong> (1866; ratified <strong>1868<\/strong>):<\/p>\n<ul><li>All persons <strong>born or naturalized<\/strong> in the United States are <strong>citizens<\/strong> (overturning <strong>Dred Scott<\/strong>).<\/li><li>No state may deny any person \"<strong>due process of law<\/strong>\" or \"the <strong>equal protection of the laws<\/strong>.\"<\/li><li>States that denied adult male citizens the vote would lose representation in Congress.<\/li><li>Former Confederate officials were barred from office unless Congress removed the ban, and the Confederate debt was declared void.<\/li><\/ul>\n<p>Johnson urged southern states to <strong>reject<\/strong> the amendment, and all but Tennessee did. He then campaigned against Radicals in the <strong>1866 midterm elections<\/strong> with an angry speaking tour (\"swing around the circle\"). Northern voters responded by giving Republicans a <strong>veto-proof majority<\/strong> in Congress.<\/p>\n<h2>Radical (Congressional) Reconstruction<\/h2>\n<p><strong>Radical Republicans<\/strong> — led by Representative <strong>Thaddeus Stevens<\/strong> and Senator <strong>Charles Sumner<\/strong> — wanted to transform the South, protect freedpeople's rights, and punish secession. Their <strong>Military Reconstruction Act of 1867<\/strong>:<\/p>\n<ul><li>divided the ten unreconstructed southern states into <strong>five military districts<\/strong> under Union generals;<\/li><li>required each state to write a new constitution guaranteeing <strong>Black male suffrage<\/strong>;<\/li><li>required each to ratify the <strong>14th Amendment<\/strong> before being readmitted.<\/li><\/ul>\n<p>Congress also tried to limit Johnson. The <strong>Tenure of Office Act (1867)<\/strong> barred the president from firing cabinet officers without Senate approval. When Johnson fired Secretary of War <strong>Edwin Stanton<\/strong>, a Radical ally, the House <strong>impeached<\/strong> Johnson in <strong>1868<\/strong> — the first presidential impeachment. The Senate <strong>acquitted<\/strong> him by <strong>one vote<\/strong> short of the two-thirds needed to remove him. Johnson finished his term with little power.<\/p>\n<p>In <strong>1868<\/strong>, war hero <strong>Ulysses S. Grant<\/strong> won the presidency, his popular margin made possible by about 500,000 new Black voters in the South. Congress then passed the <strong>15th Amendment<\/strong> (1869; ratified <strong>1870<\/strong>): the right to vote cannot be denied \"on account of <strong>race, color, or previous condition of servitude<\/strong>.\" It did not ban <strong>literacy tests, poll taxes, or property requirements<\/strong>, loopholes the South later exploited — and it did not include <strong>women<\/strong>.<\/p>\n<p>The women's movement split over the 15th Amendment. <strong>Elizabeth Cady Stanton<\/strong> and <strong>Susan B. Anthony<\/strong> opposed it for excluding women and formed the <strong>National Woman Suffrage Association<\/strong>; <strong>Lucy Stone<\/strong> and others supported it and formed the <strong>American Woman Suffrage Association<\/strong> (both 1869).<\/p>\n<div class=\"tip\"><b>Exam tip:<\/b> Know the three amendments cold: <strong>13th<\/strong> = abolished slavery; <strong>14th<\/strong> = citizenship + equal protection + due process; <strong>15th<\/strong> = voting cannot be denied by race. Mnemonic: <em>free, citizen, vote<\/em>.<\/div>\n<h2>Reconstruction governments in the South<\/h2>\n<p>Under the new constitutions, southern <strong>Republican<\/strong> governments came to power, supported by three groups:<\/p>\n<ul><li><strong>Freedmen<\/strong>, who voted in large numbers. About <strong>2,000<\/strong> African Americans held public office; <strong>Hiram Revels<\/strong> of Mississippi became the first Black <strong>US senator<\/strong> (1870), followed by <strong>Blanche K. Bruce<\/strong>. African Americans held a majority only in the lower house of South Carolina's legislature and never controlled any state government.<\/li><li>\"<strong>Carpetbaggers<\/strong>\" — the insulting name for northerners who moved south (teachers, businessmen, Union veterans, Freedmen's Bureau agents).<\/li><li>\"<strong>Scalawags<\/strong>\" — the insulting name for white southern Republicans, often small farmers from the hill country who had opposed secession.<\/li><\/ul>\n<p>These governments created the South's first <strong>public school systems<\/strong>, rebuilt railroads, expanded the rights of women to property, and opened hospitals and orphanages. They raised taxes and some officials were corrupt — charges that opponents exaggerated to discredit Black political power.<\/p>\n<h2>Freedom in everyday life<\/h2>\n<p>Freedpeople acted quickly on their freedom. They traveled to <strong>reunite families<\/strong> separated by slavery and legalized marriages. They withdrew from white-controlled churches to build their own, especially the <strong>African Methodist Episcopal (AME)<\/strong> Church and Baptist congregations, which became centers of community life. They flocked to <strong>schools<\/strong> — adults and children alike.<\/p>\n<p>Economically, freedpeople wanted <strong>land<\/strong>; planters wanted controlled labor. Without land redistribution, most freedpeople became <strong>sharecroppers<\/strong>. A landowner provided land, a cabin, and often tools and seed; the sharecropper farmed it and gave a share of the crop (often half) as rent. Many also became <strong>tenant farmers<\/strong> who paid rent. Local merchants sold supplies on credit secured by the future crop (the <strong>crop-lien system<\/strong>), at high interest. Low cotton prices and debts trapped many Black and poor white farmers in a <strong>cycle of debt<\/strong> that tied them to the land almost like the old system.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Freedpeople lack land; planters lack cash to pay wages<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Sharecropping and the crop-lien system<\/div><span>→<\/span><div><b>Consequence<\/b>Cycle of debt; continued dependence on cotton and on landowners<\/div><\/div>\n<h2>White resistance and the retreat from Reconstruction<\/h2>\n<p>Southern Democrats who wanted to restore white supremacy called themselves \"<strong>Redeemers<\/strong>.\" Terrorist groups — above all the <strong>Ku Klux Klan<\/strong> (founded 1866 in Tennessee) — beat and murdered Black voters, teachers, and white Republicans. Congress responded with the <strong>Enforcement Acts (1870–1871)<\/strong>, including the <strong>Ku Klux Klan Act<\/strong>, and Grant used federal troops and prosecutions to break up the Klan. But violence by other groups continued, notably the <strong>Colfax Massacre<\/strong> in Louisiana (1873), where scores of Black men were killed.<\/p>\n<p>Northern support for Reconstruction faded for several reasons:<\/p>\n<ul><li><strong>Scandals<\/strong> in Grant's administration, such as <strong>Crédit Mobilier<\/strong> (a railroad construction company that bribed congressmen) and the <strong>Whiskey Ring<\/strong> (officials stealing liquor taxes), discredited Republican government. Reform-minded <strong>Liberal Republicans<\/strong> broke away in 1872.<\/li><li>The <strong>Panic of 1873<\/strong> began a long depression, shifting northern attention to economic problems.<\/li><li>Many northerners were <strong>weary<\/strong> of the \"southern question\" and shared racist assumptions.<\/li><li>The <strong>Amnesty Act (1872)<\/strong> restored the right to hold office to most former Confederates.<\/li><li>The <strong>Supreme Court<\/strong> narrowed federal protections. In the <strong>Slaughterhouse Cases (1873)<\/strong>, it read the 14th Amendment's protections narrowly. In <strong>United States v. Cruikshank (1876)<\/strong>, arising from the Colfax Massacre, it ruled that the 14th Amendment restricted the actions of <strong>states<\/strong>, not private individuals, weakening federal power to prosecute racial violence.<\/li><\/ul>\n<p>Congress's final Reconstruction law, the <strong>Civil Rights Act of 1875<\/strong>, banned racial discrimination in public accommodations like inns and theaters, but it was weakly enforced (and struck down by the Court in 1883).<\/p>\n<p>One by one, Redeemer Democrats retook southern states, often through fraud and intimidation. Under the <strong>Mississippi Plan (1875)<\/strong>, armed white groups openly threatened Black voters and the federal government did not intervene.<\/p>\n<h2>The Compromise of 1877<\/h2>\n<p>The <strong>election of 1876<\/strong> between Republican <strong>Rutherford B. Hayes<\/strong> and Democrat <strong>Samuel Tilden<\/strong> was disputed: Tilden won the popular vote, but the electoral votes of <strong>Florida, Louisiana, and South Caroli
