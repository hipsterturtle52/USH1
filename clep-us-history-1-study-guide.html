na<\/strong> — the last southern states with Republican governments — were contested. A special <strong>electoral commission<\/strong> awarded all the disputed votes to Hayes. In the informal <strong>Compromise of 1877<\/strong>, southern Democrats accepted Hayes's election; in return, Hayes <strong>withdrew the last federal troops<\/strong> from the South (and Democrats expected federal aid for southern internal improvements, such as a railroad, and a southerner in the cabinet).<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Disputed 1876 election; northern retreat from Reconstruction<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Compromise of 1877<\/div><span>→<\/span><div><b>Consequence<\/b>Federal troops withdrawn; Redeemer Democrats control the South; Black rights eroded through disfranchisement and segregation (Jim Crow)<\/div><\/div>\n<p>Reconstruction was over. Over the following decades, southern states used <strong>poll taxes, literacy tests, and violence<\/strong> to disfranchise most Black voters and imposed segregation under <strong>Jim Crow<\/strong> laws. Yet Reconstruction left a permanent legacy: the <strong>14th and 15th Amendments<\/strong> became the legal basis for the civil rights movement of the twentieth century.<\/p>\n<h2>Beyond the South (1865–1877)<\/h2>\n<ul><li><strong>Diplomacy:<\/strong> Secretary of State <strong>William Seward<\/strong> bought <strong>Alaska<\/strong> from Russia in <strong>1867<\/strong> for $7.2 million (mocked as \"<strong>Seward's Folly<\/strong>\"). Britain agreed in the <strong>Treaty of Washington (1871)<\/strong> to arbitrate the <strong>Alabama claims<\/strong> for damage by British-built Confederate raiders, and later paid $15.5 million.<\/li><li><strong>The West:<\/strong> the <strong>transcontinental railroad<\/strong> was completed at <strong>Promontory Point, Utah (1869)<\/strong>, built largely by <strong>Chinese<\/strong> immigrants (Central Pacific) and <strong>Irish<\/strong> workers (Union Pacific). Conflict with Plains nations intensified: the <strong>Sand Creek Massacre (1864)<\/strong> of Cheyenne and Arapaho in Colorado, the <strong>Fort Laramie Treaty (1868)<\/strong> guaranteeing the Black Hills to the Lakota, and — after gold was found there — the Lakota and Cheyenne victory over <strong>George Custer<\/strong> at the <strong>Little Bighorn (1876)<\/strong>.<\/li><\/ul>","words":2152,"minutes":14,"must":["<strong>Ten Percent Plan<\/strong> (Lincoln, lenient) vs. <strong>Wade–Davis Bill<\/strong> (Congress, majority oath; pocket-vetoed).","<strong>Freedmen's Bureau (1865):<\/strong> food, labor contracts, and especially <strong>schools<\/strong>; no land redistribution (\"forty acres and a mule\" denied).","<strong>Johnson's plan<\/strong> → ex-Confederates elected → <strong>Black Codes<\/strong> (labor contracts, vagrancy laws).","<strong>13th<\/strong> (abolition, 1865) · <strong>14th<\/strong> (citizenship, equal protection, due process, 1868) · <strong>15th<\/strong> (vote not denied by race, 1870).","<strong>Civil Rights Act of 1866<\/strong> passed over Johnson's veto.","<strong>Military Reconstruction Act (1867):<\/strong> five military districts; ratify 14th; Black male suffrage.","<strong>Johnson impeached (1868)<\/strong> for violating the <strong>Tenure of Office Act<\/strong> (firing Stanton); acquitted by one vote.","<strong>Hiram Revels<\/strong> = first Black US senator; <strong>carpetbaggers<\/strong>, <strong>scalawags<\/strong>.","<strong>Sharecropping<\/strong> + <strong>crop-lien system<\/strong> = cycle of debt.","<strong>KKK<\/strong> violence → <strong>Enforcement/KKK Acts (1870–71)<\/strong>.","End of Reconstruction: Grant scandals, <strong>Panic of 1873<\/strong>, northern fatigue, court rulings (<strong>Slaughterhouse<\/strong>, <strong>Cruikshank<\/strong>), <strong>Compromise of 1877<\/strong> (Hayes president; troops withdrawn).","<strong>Alaska purchase (1867)<\/strong> = \"Seward's Folly.\""],"timeline":[{"y":"1863","e":"Lincoln's Ten Percent Plan","th":"P","key":false},{"y":"1864","e":"Wade–Davis Bill pocket-vetoed; Sand Creek Massacre","th":"P","key":false},{"y":"1865","e":"Freedmen's Bureau created; Lincoln assassinated; 13th Amendment ratified","th":"P","key":true},{"y":"1865–1866","e":"Black Codes passed in southern states","th":"S","key":false},{"y":"1866","e":"Civil Rights Act passed over Johnson's veto; KKK founded","th":"P","key":true},{"y":"1867","e":"Military Reconstruction Act; Tenure of Office Act; Alaska purchased","th":"P","key":true},{"y":"1868","e":"Johnson impeached and acquitted; 14th Amendment ratified; Grant elected","th":"P","key":true},{"y":"1869","e":"Transcontinental railroad completed; women's suffrage movement splits","th":"E","key":false},{"y":"1870","e":"15th Amendment ratified; Hiram Revels enters the Senate","th":"P","key":true},{"y":"1870–1871","e":"Enforcement Acts (Ku Klux Klan Act)","th":"P","key":false},{"y":"1872","e":"Amnesty Act; Liberal Republican revolt; Crédit Mobilier scandal exposed","th":"P","key":false},{"y":"1873","e":"Panic of 1873; Slaughterhouse Cases; Colfax Massacre","th":"E","key":true},{"y":"1875","e":"Civil Rights Act of 1875; Mississippi Plan","th":"P","key":false},{"y":"1876","e":"Disputed Hayes–Tilden election; Battle of the Little Bighorn","th":"P","key":false},{"y":"1877","e":"Compromise of 1877 ends Reconstruction","th":"P","key":true}],"cards":[{"id":"c12-1","u":12,"f":"Ten Percent Plan (1863)","b":"Lincoln's lenient plan: a state could rejoin once 10% of 1860 voters swore loyalty and accepted emancipation."},{"id":"c12-2","u":12,"f":"Wade–Davis Bill (1864)","b":"Radical plan requiring a majority loyalty oath; Lincoln pocket-vetoed it."},{"id":"c12-3","u":12,"f":"Freedmen's Bureau (1865)","b":"Federal agency aiding freed people with food, labor contracts, and schools; failed to redistribute land."},{"id":"c12-4","u":12,"f":"\"Forty acres and a mule\"","b":"Freedpeople's hope for land, from Sherman's Field Order No. 15; reversed by Johnson."},{"id":"c12-5","u":12,"f":"Black Codes","b":"Southern laws (1865–66) restricting freedpeople — labor contracts, vagrancy arrests, limits on rights."},{"id":"c12-6","u":12,"f":"Civil Rights Act of 1866","b":"Declared Black Americans citizens with equal legal rights; passed over Johnson's veto."},{"id":"c12-7","u":12,"f":"13th Amendment (1865)","b":"Abolished slavery and involuntary servitude except as punishment for crime."},{"id":"c12-8","u":12,"f":"14th Amendment (1868)","b":"Birthright citizenship; no state may deny due process or equal protection; overturned Dred Scott."},{"id":"c12-9","u":12,"f":"15th Amendment (1870)","b":"Voting rights cannot be denied based on race, color, or previous condition of servitude."},{"id":"c12-10","u":12,"f":"Radical Republicans","b":"Thaddeus Stevens, Charles Sumner; sought to protect freedpeople's rights and remake the South."},{"id":"c12-11","u":12,"f":"Military Reconstruction Act (1867)","b":"Put the South under five military districts; required Black male suffrage and ratification of the 14th Amendment."},{"id":"c12-12","u":12,"f":"Tenure of Office Act (1867)","b":"Barred the president from removing officials without Senate consent; Johnson's violation led to impeachment."},{"id":"c12-13","u":12,"f":"Johnson's impeachment (1868)","b":"House impeached Johnson for firing Stanton; Senate acquitted by one vote."},{"id":"c12-14","u":12,"f":"Carpetbaggers","b":"Derogatory term for northerners who moved south during Reconstruction."},{"id":"c12-15","u":12,"f":"Scalawags","b":"Derogatory term for white southerners who supported the Republican Party."},{"id":"c12-16","u":12,"f":"Hiram Revels","b":"Mississippi; first African American US senator (1870)."},{"id":"c12-17","u":12,"f":"Sharecropping","b":"Farming land for a share of the crop as rent; with the crop-lien system it created a cycle of debt."},{"id":"c12-18","u":12,"f":"Crop-lien system","b":"Merchants supplied goods on credit secured by the future crop, trapping farmers in debt."},{"id":"c12-19","u":12,"f":"Ku Klux Klan","b":"White supremacist terrorist group (1866) attacking Black voters and Republicans; targeted by the 1871 Ku Klux Klan Act."},{"id":"c12-20","u":12,"f":"Redeemers","b":"Southern Democrats who regained control of state governments and ended Reconstruction policies."},{"id":"c12-21","u":12,"f":"U.S. v. Cruikshank (1876)","b":"Held the 14th Amendment applies to state, not private, action; weakened federal protection of Black rights."},{"id":"c12-22","u":12,"f":"Compromise of 1877","b":"Democrats accepted Hayes as president; federal troops withdrawn from the South; Reconstruction ended."},{"id":"c12-23","u":12,"f":"Seward's Folly (1867)","b":"Secretary of State Seward's purchase of Alaska from Russia for $7.2 million."}],"quiz":["q12-1","q12-2","q12-3","q12-4","q12-5","q12-6","q12-7","q12-8","q12-9","q12-10","q12-11","q12-12","q12-13"]}],"Q":{"q1-1":{"id":"q1-1","u":1,"t":"S","d":1,"q":"Which of the following best explains the dramatic decline of Native American populations after 1492?","o":["Large-scale warfare among Native nations over European trade goods","Mass emigration of Native peoples to Asia across the Bering Strait","A deliberate Spanish policy of extermination ordered by the Treaty of Tordesillas","Epidemic diseases such as smallpox to which Native peoples had no immunity","Famine caused by the introduction of maize from Europe"],"e":["Intertribal war did occur, but it was not the main cause of the population collapse.","There was no such reverse migration; the Bering land bridge migration happened thousands of years earlier.","The Treaty of Tordesillas divided territory between Spain and Portugal; it said nothing about extermination.","Disease killed far more Native people than warfare or enslavement; it often spread ahead of the Europeans themselves.","Maize was native to the Americas and went the other way, to Europe."],"a":3},"q1-2":{"id":"q1-2","u":1,"t":"C","d":2,"q":"The Spanish friar Bartolomé de Las Casas is best known for","o":["condemning the brutal treatment of Native peoples under Spanish rule","leading the conquest of the Inca Empire","negotiating the Treaty of Tordesillas with Portugal","founding the first Spanish mission in New Mexico","introducing the printing press to the Americas"],"e":["Las Casas wrote passionately against the abuses of the encomienda system and conquest.","That was Francisco Pizarro.","The treaty was negotiated by the Spanish and Portuguese crowns with papal backing, not by Las Casas.","Missions in New Mexico followed Oñate's 1598 expedition; Las Casas worked in the Caribbean and Mexico.","Las Casas is known as a critic and writer, not for printing."],"a":0},"q1-3":{"id":"q1-3","u":1,"t":"D","d":1,"q":"The Treaty of Tordesillas (1494) is significant because it","o":["gave England the right to colonize North America","ended the Spanish Armada's war with England","established peace between France and the Iroquois","divided newly encountered lands between Spain and Portugal","ended the Reconquista in Spain"],"e":["England was not a party and ignored the treaty.","The Armada sailed in 1588, almost a century later.","That is unrelated; the treaty predates French colonization.","The line gave Spain most of the Americas and Portugal Brazil and the route to Asia around Africa.","The Reconquista ended with the fall of Granada in January 1492."],"a":3},"q1-4":{"id":"q1-4","u":1,"t":"S","d":2,"q":"Compared with English colonizers, French colonizers in North America generally","o":["brought far larger numbers of farming families","relied on trade and alliances with Native peoples because they had few settlers","avoided all contact with Native religion and culture","settled primarily in the Caribbean rather than the mainland","established large plantations worked by enslaved Native people"],"e":["The opposite: New France stayed thinly populated, while English colonies filled with families.","New France's fur trade economy depended on Native partners, so the French had fewer land conflicts.","French Jesuits lived among Native peoples precisely to convert them.","New France was centered on the St. Lawrence River and Great Lakes.","That better describes Spanish encomienda labor, not New France."],"a":1},"q1-5":{"id":"q1-5","u":1,"t":"P","d":2,"q":"Which of the following was a major reason England began to colonize North America in the late 1500s and early 1600s?","o":["England's population was shrinking, leaving labor shortages at home","The Pope granted England exclusive rights to North America","The defeat of the Spanish Armada reduced the threat of Spanish naval power","England had already conquered the Aztec Empire and sought more gold","The Treaty of Tordesillas assigned North America to England"],"e":["England's population was growing; colonization advocates talked of \"surplus\" people.","England had broken with Rome; the papacy backed Spain and Portugal.","After 1588 England could challenge Spain at sea and plant colonies more safely.","The Aztecs were conquered by Spain under Cortés.","The treaty divided lands only between Spain and Portugal."],"a":2},"q1-6":{"id":"q1-6","u":1,"t":"E","d":2,"q":"The encomienda system in Spanish America","o":["was a French system of fur-trade partnerships","required colonists to pay wages to enslaved Africans","allowed Native peoples to vote for colonial governors","distributed land equally among Native families","gave colonists the right to demand labor and tribute from Native people"],"e":["Encomienda was Spanish; the French relied on trade alliances.","Enslaved Africans were not paid; encomienda concerned Native labor.","Spanish colonies had no elected governors for anyone.","It was a labor grant to Spaniards, not land reform for Native people.","In return colonists were supposed to protect and Christianize them, but abuse was widespread."],"a":4},"q1-7":{"id":"q1-7","u":1,"t":"D","d":3,"q":"Which of the following lists events in the correct chronological order?","o":["Defeat of the Spanish Armada, Columbus's first voyage, Pueblo Revolt, Cortés's conquest of the Aztecs","Columbus's first voyage, Cortés's conquest of the Aztecs, defeat of the Spanish Armada, Pueblo Revolt","Pueblo Revolt, defeat of the Spanish Armada, Columbus's first voyage, Cortés's conquest of the Aztecs","Cortés's conquest of the Aztecs, Columbus's first voyage, Pueblo Revolt, defeat of the Spanish Armada","Columbus's first voyage, Pueblo Revolt, Cortés's conquest of the Aztecs, defeat of the Spanish Armada"],"e":["The Armada (1588) came long after Columbus (1492).","1492, 1519–1521, 1588, 1680.","This reverses most of the actual order.","Cortés could not conquer before Columbus reached the Americas.","The Pueblo Revolt (1680) was the latest of the four."],"a":1},"q1-8":{"id":"q1-8","u":1,"t":"S","d":2,"q":"Which Native American society is correctly matched with a characteristic feature?","o":["Pacific Northwest peoples — large-scale maize plantations","Aztecs — small bands of hunter-gatherers in the Great Basin","Mississippian culture — stone cities high in the Andes Mountains","Pueblo peoples — nomadic buffalo hunting on horseback","Iroquois Confederacy — a political alliance in which clan mothers helped choose leaders"],"e":["Abundant salmon let them live in villages without farming.","The Aztecs ruled a large empire from Tenochtitlán in central Mexico.","That describes the Inca; Mississippians built earthen mound cities like Cahokia.","Pueblos were settled farmers in the Southwest; horses came later via the Spanish.","The Haudenosaunee league of five nations gave women real political influence."],"a":4},"q1-9":{"id":"q1-9","u":1,"t":"P","d":3,"q":"The Pueblo Revolt of 1680 is significant primarily because it","o":["temporarily expelled Spanish colonizers and led Spain to tolerate more Pueblo customs after it returned","permanently ended Spanish presence in North America","marked the first contact between Europeans and Native Americans in the Southwest","was a revolt by English settlers against the Spanish crown","led directly to the founding of St. Augustine"],"e":["It was the most successful Native revolt against colonization; Spain later eased religious suppression.","Spain reconquered New Mexico in the 1690s and held Florida and other lands into the 1800s.","Coronado entered the region in 1540, and Oñate colonized it in 1598.","It was a Native uprising led by Popé.","St. Augustine was founded in 1565, more than a century earlier."],"a":0},"q1-10":{"id":"q1-10","u":1,"t":"C","d":1,"q":"Which development in fifteenth-century Europe most directly helped spread knowledge of new lands and encouraged further exploration?","o":["The Protestant Reformation of 1517","The encomienda system","The printing press","The enclosure movement","The Great Law of Peace"],"e":["Important to later rivalries, but it came after Columbus and did not spread geographic knowledge.","That was a Spanish colonial labor system in the Americas.","Printed maps and travel accounts circulated widely and quickly.","Enclosure pushed English farmers off land; it did not spread knowledge.","That was the founding constitution of the Iroquois Confederacy."],"a":2},"b1-4":{"id":"b1-4","u":1,"t":"C","d":1,"q":"European motives for exploration in the fifteenth and sixteenth centuries are often summarized as","o":["\"Liberty, equality, fraternity\"","\"God, gold, and glory\"","\"Life, liberty, and property\"","\"Free soil, free labor, free men\"","\"No taxation without representation\""],"e":["That was the slogan of the French Revolution (1789).","Religion, wealth, and prestige drove European expansion.","That phrase is associated with John Locke's natural rights.","That was a Free Soil and Republican slogan of the 1840s–1850s.","That was a colonial protest slogan of the 1760s."],"a":1},"b1-10":{"id":"b1-10","u":1,"t":"C","d":2,"q":"The printing press, the compass, and the caravel all contributed to European exploration by","o":["allowing Europeans to reach Asia overland more quickly","making the encomienda system unnecessary","making long-distance navigation possible and spreading knowledge of new lands","preventing the spread of disease to the Americas","ending the Protestant Reformation"],"e":["The caravel and compass were for sea travel.","Encomienda was a labor system unrelated to these tools.","These tools of the Renaissance era enabled and encouraged voyages.","They did nothing to stop disease.","These technologies are unrelated to ending the Reformation, which continued."],"a":2},"b1-3":{"id":"b1-3","u":1,"t":"D","d":1,"q":"Christopher Columbus's first voyage in 1492 was sponsored by","o":["the Pope in Rome","the Dutch West India Company","Prince Henry the Navigator of Portugal","King Henry VIII of England","the Spanish monarchs Ferdinand and Isabella"],"e":["The papacy later endorsed Spanish and Portuguese claims but did not sponsor Columbus.","That company was founded in 1621.","Prince Henry died in 1460 and sponsored voyages along Africa.","Henry VIII ruled England from 1509 and sponsored no such voyage.","Spain backed Columbus as it completed the Reconquista."],"a":4},"b1-1":{"id":"b1-1","u":1,"t":"E","d":1,"q":"Which of the following crops was carried from the Americas to Europe as part of the Columbian Exchange?","o":["Rice","Coffee","Wheat","Potatoes","Sugarcane"],"e":["Rice came to the Americas from Africa and Asia.","Coffee originated in Africa and was later planted in the Americas.","Wheat went from Europe to the Americas.","Potatoes, maize, and tomatoes were American crops that spread to Europe, Africa, and Asia.","Sugarcane was brought to the Americas from the Old World."],"a":3},"b1-6":{"id":"b1-6","u":1,"t":"E","d":2,"q":"Spain became the richest power in sixteenth-century Europe largely because of","o":["tobacco exports from Virginia","silver from mines in the Americas such as Potosí","taxes collected from English colonies","control of the spice trade through the Cape of Good Hope","profits from the North American fur trade"],"e":["Virginia was an English colony that did not grow tobacco for export until the 1610s.","American silver flowed into Spain's treasury for over a century.","Spain did not tax English colonies.","Portugal dominated that route.","The fur trade was central to New France, not Spain."],"a":1},"b1-8":{"id":"b1-8","u":1,"t":"P","d":2,"q":"St. Augustine, founded in 1565, is significant as","o":["the capital of New Netherland","the oldest continuously occupied European-founded city in the present-day United States","a French Jesuit mission in Canada","the first English colony in North America","the site of the Pueblo Revolt"],"e":["New Netherland's capital was New Amsterdam.","Spain founded it in Florida decades before Jamestown.","St. Augustine is a Spanish city in Florida.","England's first attempt was Roanoke (1585).","The Pueblo Revolt occurred in New Mexico in 1680."],"a":1},"b1-7":{"id":"b1-7","u":1,"t":"D","d":2,"q":"Which of the following best explains why French colonists generally had less conflict with Native peoples than English colonists did?","o":["The French fur trade depended on Native partners rather than on taking large amounts of land for farms","France had signed the Treaty of Tordesillas with Native nations","French colonists outnumbered Native peoples in Canada","The French refused to trade with Native peoples","France banned Christian missionaries from its colonies"],"e":["New France had few settlers and relied on alliances with peoples like the Huron.","The treaty was between Spain and Portugal.","New France remained thinly populated.","Trade was the foundation of New France.","Jesuit missionaries were active throughout New France."],"a":0},"b1-13":{"id":"b1-13","u":1,"t":"C","d":3,"q":"Bartolomé de Las Casas's writings about the Spanish conquest are most useful to historians as evidence of","o":["Native support for the encomienda system","English plans to colonize Roanoke","the founding of the Iroquois Confederacy","debates within Spain over the treatment of Native peoples","the economic success of the French fur trade"],"e":["He documented Native suffering under encomienda.","Las Casas was Spanish; Roanoke was an English project.","Las Casas wrote about Spanish America, not the Iroquois.","Las Casas criticized the cruelty of conquest and encomienda from within the Spanish Church.","He did not write about New France."],"a":3},"b1-5":{"id":"b1-5","u":1,"t":"S","d":1,"q":"Which disease caused the most devastating epidemics among Native Americans after contact with Europeans?","o":["Tuberculosis","Malaria","Smallpox","Polio","Yellow fever"],"e":["Tuberculosis was present but was not the leading cause of the population collapse.","Malaria affected colonists in the Chesapeake but was not the main killer of Native peoples after contact.","Native peoples had no immunity to smallpox, which killed huge numbers.","Polio was not a major factor in contact-era epidemics.","Yellow fever struck later, mostly in tropical port cities."],"a":2},"b1-2":{"id":"b1-2","u":1,"t":"S","d":1,"q":"The Iroquois Confederacy is best described as","o":["a French trading company in Quebec","a Spanish colonial government in New Mexico","a confederacy of Pacific Northwest fishing villages","an alliance of Northeastern Native nations united under the Great Law of Peace","a group of Aztec city-states in central Mexico"],"e":["The Iroquois were Native nations, often enemies of the French and their Huron allies.","That was the Spanish colony of Nuevo México.","The Iroquois lived in present-day New York.","The Mohawk, Oneida, Onondaga, Cayuga, and Seneca formed the league.","The Aztecs ruled from Tenochtitlán; the Iroquois were in the Northeast."],"a":3},"b1-9":{"id":"b1-9","u":1,"t":"S","d":2,"q":"Spanish colonial society in the Americas was characterized by","o":["the absence of any intermarriage between Spaniards and Native people","equality among all colonists regardless of birthplace","a reliance on fur trading rather than mining and agriculture","elected colonial assemblies modeled on Parliament","a rigid social hierarchy with Spanish-born peninsulares at the top"],"e":["Intermarriage was common, producing a large mestizo population.","Birthplace and ancestry determined status.","Spanish wealth came from mining and agriculture.","Spanish colonies were ruled by royal officials.","Creoles, mestizos, Native people, and enslaved Africans ranked below them."],"a":4},"b1-11":{"id":"b1-11","u":1,"t":"D","d":2,"q":"The defeat of the Spanish Armada in 1588 contributed to English colonization because it","o":["weakened Spain's naval power and gave England more freedom to plant colonies","forced Spain to give Florida to England","immediately led to the founding of Plymouth","ended the Protestant Reformation in England","gave England control of Mexico"],"e":["England could now challenge Spain in the Atlantic.","Spain kept Florida until 1763.","Plymouth was founded in 1620, over thirty years later.","England remained Protestant.","England never controlled Mexico."],"a":0},"b1-12":{"id":"b1-12","u":1,"t":"E","d":3,"q":"Which of the following best explains why joint-stock companies were important to early English colonization?","o":["They were controlled directly by the Spanish crown","They were religious organizations that banned profit-seeking","They prohibited colonists from trading with England","They guaranteed colonists free land in exchange for military service","They allowed many investors to pool money and share the risks of costly ventures"],"e":["They were English private companies.","Joint-stock companies existed to make profits.","They were created to profit from trade with England.","That was not their function; the headright system later offered land.","The Virginia Company used this model to fund Jamestown."],"a":4},"b1-14":{"id":"b1-14","u":1,"t":"S","d":3,"q":"Historians argue that the Pueblo Revolt (1680) shows that Native peoples","o":["had no organized political leadership","welcomed Spanish missions without resistance","were allied with the English against Spain in New Mexico","could unite across communities to resist European religious and labor demands","quickly abandoned their traditional religion"],"e":["Popé organized a coordinated revolt across many villages.","The revolt targeted missions and priests.","There were no English in New Mexico.","Popé united Pueblo villages to expel the Spanish for about twelve years.","Suppression of Pueblo religion was a major cause of the revolt."],"a":3},"q2-1":{"id":"q2-1","u":2,"t":"E","d":1,"q":"Which crop became the economic foundation of early Virginia?","o":["Rice","Wheat","Sugar","Tobacco","Cotton"],"e":["Rice became important in South Carolina, not Virginia.","Wheat was the main export of the Middle colonies.","Sugar was the crop of the Caribbean islands such as Barbados.","John Rolfe's tobacco became Virginia's cash crop in the 1610s and drove demand for land and labor.","Cotton became dominant in the South only after the cotton gin (1793)."],"a":3},"q2-2":{"id":"q2-2","u":2,"t":"P","d":2,"q":"The Mayflower Compact is significant because it","o":["created the first elected legislature in English America","united the New England colonies against Native attacks","granted land to the Pilgrims from the Virginia Company","guaranteed religious freedom for all Christians in Plymouth","established a precedent for self-government based on the consent of the settlers"],"e":["That was Virginia's House of Burgesses (1619).","That was the New England Confederation (1643).","It was a political agreement among settlers, not a land grant.","That describes Maryland's Act of Toleration (1649); the Compact did not address religious freedom.","The signers agreed to form a \"civil body politic\" and obey laws for the general good."],"a":4},"q2-3":{"id":"q2-3","u":2,"t":"S","d":2,"q":"Which of the following best describes a difference between the Chesapeake and New England colonies in the 1600s?","o":["New England had a higher proportion of indentured servants","The Chesapeake had more towns and town meetings than New England","New England settlers more often migrated as families and lived longer than Chesapeake settlers","Chesapeake colonists were mostly religious dissenters seeking to purify the Church of England","New England relied more heavily on tobacco exports"],"e":["Indentured servants were concentrated in the Chesapeake.","The opposite: New England was organized around towns; the Chesapeake had scattered plantations.","Healthier climates and family migration gave New England balanced sex ratios and longer lives.","That describes the Puritans of New England; the Chesapeake was founded mainly for profit.","Tobacco was the Chesapeake staple; New England relied on fishing, lumber, and trade."],"a":2},"q2-4":{"id":"q2-4","u":2,"t":"S","d":3,"q":"A major long-term consequence of Bacon's Rebellion was that","o":["Governor Berkeley adopted a policy of aggressive war against all Native peoples","Virginia planters increasingly replaced indentured servants with enslaved Africans","tobacco cultivation was abandoned in favor of wheat","Virginia became a royal colony for the first time","the House of Burgesses was abolished"],"e":["Berkeley had resisted frontier war; that was one cause of the rebellion.","Planters saw landless freedmen as a threat; enslaved people could not become free and claim land.","Tobacco remained Virginia's main crop for another century.","Virginia became a royal colony in 1624, a half-century earlier.","The Burgesses continued to meet."],"a":1},"q2-5":{"id":"q2-5","u":2,"t":"C","d":2,"q":"Roger Williams and Anne Hutchinson were similar in that both","o":["founded colonies as refuges for English Catholics","led armed rebellions against the royal governor","were Quaker missionaries in Pennsylvania","supported strict union of church and state","were banished from Massachusetts Bay for challenging Puritan authorities"],"e":["Maryland was the Catholic refuge, founded by Lord Baltimore.","Neither led an armed rebellion; Bacon did, in Virginia.","Pennsylvania was founded in 1681, decades later; neither was a Quaker.","Williams argued for separation of church and state.","Both questioned the religious and political order and were expelled in the 1630s."],"a":4},"q2-6":{"id":"q2-6","u":2,"t":"P","d":2,"q":"Pennsylvania differed from Massachusetts Bay in that Pennsylvania","o":["offered religious toleration and generally purchased land from Native peoples","restricted voting to members of a single established church","had no representative assembly","was founded by Separatists who rejected the Church of England","relied on rice grown by enslaved majority labor"],"e":["Penn's Quaker \"holy experiment\" welcomed many faiths and dealt fairly with the Lenape.","That describes Puritan Massachusetts, where voting was tied to church membership.","Pennsylvania had an elected assembly.","That describes the Pilgrims of Plymouth.","That describes South Carolina."],"a":0},"q2-7":{"id":"q2-7","u":2,"t":"S","d":2,"q":"King Philip's War (1675–1676) resulted in","o":["the destruction of Native power in southern New England","a lasting alliance between Puritans and the Wampanoag","French control of New England's fur trade","the expulsion of the English from Massachusetts","the abolition of slavery in Massachusetts"],"e":["Despite heavy colonial losses, Metacom's forces were defeated and survivors were killed, enslaved, or displaced.","The war destroyed the earlier alliance with the Wampanoag.","The French did not gain New England.","Colonists suffered badly but won the war.","Many defeated Native people were actually sold into slavery."],"a":0},"q2-8":{"id":"q2-8","u":2,"t":"C","d":3,"q":"The Half-Way Covenant of 1662 is best understood as evidence of","o":["Puritan acceptance of separation of church and state","declining religious fervor among the children and grandchildren of the first Puritans","a peace treaty ending the Pequot War","King Charles II's effort to impose the Church of England on Massachusetts","the growing power of Quakers in New England"],"e":["Church and state remained closely linked in Massachusetts.","Fewer people reported conversion experiences, so churches relaxed baptism rules to keep families in the church.","The Covenant was a church membership rule, not a treaty.","The Covenant was adopted by Puritan ministers themselves.","Quakers were persecuted in Massachusetts; the Covenant was an internal Puritan reform."],"a":1},"q2-9":{"id":"q2-9","u":2,"t":"P","d":3,"q":"Read the excerpt below. The author of this statement most likely intended to<blockquote>\"We must consider that we shall be as a city upon a hill. The eyes of all people are upon us.\"<\/blockquote>","o":["encourage toleration of Quakers and Catholics","defend the separation of church and state","urge Massachusetts Bay colonists to build a model Christian community","call for colonial independence from England","justify Virginia's search for gold and profit"],"e":["Puritan Massachusetts did not tolerate dissenting faiths.","That was Roger Williams's position, not Winthrop's.","John Winthrop (1630) wanted the Puritan colony to be an example to the world.","Independence was not on the table in 1630.","Winthrop spoke of religious mission, not profit."],"a":2},"q2-10":{"id":"q2-10","u":2,"t":"D","d":3,"q":"The collapse of the Dominion of New England in 1689 was most directly connected to","o":["the Salem witch trials","the English conquest of New Netherland","the outbreak of the French and Indian War","the Glorious Revolution that overthrew James II in England","the end of King Philip's War"],"e":["The trials took place in 1692, after the Dominion had already collapsed.","That occurred in 1664, before the Dominion was created.","That war began in 1754.","When James II fell, Boston colonists arrested Governor Andros and the Dominion ended.","King Philip's War ended in 1676, a decade before the Dominion was formed."],"a":3},"b2-4":{"id":"b2-4","u":2,"t":"E","d":1,"q":"The economy of colonial New England in the 1600s depended heavily on","o":["large tobacco plantations","sugar plantations","fishing, lumber, shipbuilding, and trade","rice grown by enslaved Africans","silver mining"],"e":["Tobacco was the Chesapeake staple.","Sugar was grown in the Caribbean.","Rocky soil and a short growing season limited large-scale farming.","Rice was grown in the Carolina lowcountry.","There were no silver mines in New England."],"a":2},"b2-9":{"id":"b2-9","u":2,"t":"E","d":2,"q":"Under Virginia's headright system, land was granted to","o":["each indentured servant upon arrival","Native Americans who converted to Christianity","anyone who paid for a person's passage to the colony","only members of the Puritan church","soldiers who fought in the French and Indian War"],"e":["Servants did not receive headrights on arrival; whoever paid their passage did.","The system rewarded those who brought settlers.","Planters who imported servants accumulated large estates.","Headrights were a Virginia land policy, not a religious test.","The headright system was a 1600s policy."],"a":2},"b2-8":{"id":"b2-8","u":2,"t":"S","d":1,"q":"Which group founded Pennsylvania as a \"holy experiment\"?","o":["Quakers","Puritans","Pilgrims","Catholics","Anglican planters from Barbados"],"e":["William Penn, a Quaker, promised toleration and fair dealings with Native peoples.","Puritans founded Massachusetts Bay.","Pilgrims founded Plymouth.","Catholics found refuge in Maryland.","They helped settle Carolina."],"a":0},"b2-3":{"id":"b2-3","u":2,"t":"C","d":1,"q":"The Puritans who founded Massachusetts Bay in 1630 wanted to","o":["profit from growing tobacco","establish a refuge for English Catholics","purify the Church of England and build a model Christian community","create a colony with complete religious toleration","separate entirely from the Church of England"],"e":["Profit from tobacco drove Virginia, not Massachusetts.","Maryland was founded as a Catholic refuge.","Winthrop called it \"a city upon a hill.\"","Puritans expelled dissenters.","That was the Separatist (Pilgrim) position."],"a":2},"b2-6":{"id":"b2-6","u":2,"t":"P","d":2,"q":"Maryland's Act of Toleration (1649) granted religious freedom to","o":["members of the Church of England only","Puritans only","Quakers only","all Christians","all people regardless of religion"],"e":["The law was meant to protect Catholics as well.","Maryland was founded as a Catholic refuge.","The Act covered all Christians.","It protected Catholics and Protestants but not non-Christians.","Non-Christians, such as Jews, were not protected."],"a":3},"b2-10":{"id":"b2-10","u":2,"t":"D","d":2,"q":"In 1664, England gained control of New Netherland by","o":["winning it in the French and Indian War","signing the Treaty of Tordesillas","negotiating with the Iroquois Confederacy","seizing it from the Dutch and renaming it New York","purchasing it from Spain"],"e":["That war took place a century later.","That treaty (1494) concerned Spain and Portugal.","The English took it from the Dutch by force.","The colony was granted to the Duke of York.","New Netherland was Dutch, not Spanish."],"a":3},"b2-12":{"id":"b2-12","u":2,"t":"C","d":2,"q":"The Salem witch trials of 1692 are often interpreted by historians as reflecting","o":["Quaker control of the Massachusetts government","the influence of the Great Awakening","the triumph of Enlightenment reason over superstition","social tensions, fear, and anxiety in late seventeenth-century Massachusetts","the arrival of Catholic missionaries in New England"],"e":["Puritans controlled Massachusetts.","The Great Awakening came decades later, in the 1730s–1740s.","The trials reflected the opposite.","Conflicts within the community and fear of war contributed to the accusations.","The trials did not involve Catholic missionaries."],"a":3},"b2-14":{"id":"b2-14","u":2,"t":"P","d":3,"q":"The collapse of the Dominion of New England after the Glorious Revolution is significant because it","o":["led directly to the Declaration of Independence","created the first union of all thirteen colonies","ended the practice of slavery in New England","gave Parliament the right to tax the colonies directly","showed colonists' willingness to resist what they viewed as arbitrary royal power"],"e":["Independence came almost ninety years later.","The Dominion included only the northern colonies, and Georgia did not yet exist.","Slavery remained legal in New England.","That issue arose in the 1760s.","Colonists ousted Governor Andros, restoring their assemblies."],"a":4},"b2-16":{"id":"b2-16","u":2,"t":"C","d":3,"q":"The Half-Way Covenant and the decline in conversion experiences among second-generation Puritans most directly reflect","o":["the success of the Great Awakening","the influence of the Enlightenment on Massachusetts ministers","the difficulty of sustaining the founders' religious intensity across generations","Puritan acceptance of Quaker beliefs","a royal order to merge with the Church of England"],"e":["The Great Awakening came in the 1730s–1740s.","The covenant (1662) predates widespread Enlightenment influence.","Churches eased membership rules to keep families involved.","Quakers were persecuted in Massachusetts.","The Half-Way Covenant was a Puritan decision."],"a":2},"b2-1":{"id":"b2-1","u":2,"t":"P","d":1,"q":"Virginia's House of Burgesses, first meeting in 1619, was significant as","o":["the first written constitution in America","the court that tried Anne Hutchinson","an assembly of Native American leaders","the governing body of the Massachusetts Bay Colony","the first elected representative assembly in English America"],"e":["That honor usually goes to Connecticut's Fundamental Orders (1639).","Hutchinson was tried in Massachusetts.","The Burgesses were elected English colonists.","Massachusetts had its own General Court.","It became a model of colonial self-government."],"a":4},"b2-2":{"id":"b2-2","u":2,"t":"S","d":1,"q":"Most early laborers in the Chesapeake colonies before about 1680 were","o":["indentured servants from England","enslaved Native Americans","enslaved Africans brought directly from Africa","Puritan families seeking religious freedom","free wage workers from Germany"],"e":["Poor young Englishmen worked several years in exchange for passage.","Some Native people were enslaved, but servants were the main labor force.","African slavery grew dominant only after about 1680.","Puritans settled in New England.","German immigration came later and mostly to Pennsylvania."],"a":0},"b2-7":{"id":"b2-7","u":2,"t":"C","d":2,"q":"Anne Hutchinson was banished from Massachusetts Bay primarily because she","o":["founded Pennsylvania as a Quaker colony","refused to pay taxes on tea","converted to Catholicism","challenged the authority of Puritan ministers by claiming direct revelation from God","led an armed revolt against the governor"],"e":["William Penn founded Pennsylvania in 1681.","The tea protests came in the 1770s.","She remained a Protestant.","Her teachings, called antinomianism, threatened both religious and gender order.","She led religious meetings, not a rebellion."],"a":3},"b2-5":{"id":"b2-5","u":2,"t":"S","d":2,"q":"Which of the following was a cause of Bacon's Rebellion (1676)?","o":["A royal ban on tobacco cultivation","Landless former servants' anger at the governor's refusal to attack Native peoples on the frontier","The arrival of the Spanish Armada in Virginia","Quaker opposition to slavery","The Salem witch trials"],"e":["No such ban existed.","Frontier settlers wanted Native land; Berkeley protected his fur-trade interests.","The Armada sailed in 1588 and never reached Virginia.","Quaker antislavery activity came later and was centered in Pennsylvania.","Those took place in Massachusetts in 1692."],"a":1},"b2-11":{"id":"b2-11","u":2,"t":"S","d":2,"q":"The Middle colonies differed from New England and the Chesapeake in that they were","o":["founded mainly as refuges for Catholics","dominated by a single established church","more ethnically and religiously diverse","economically dependent on tobacco","populated mostly by enslaved Africans"],"e":["Maryland was the Catholic refuge, and it is not usually classed as a Middle colony.","Pennsylvania and New York were known for toleration.","New York and Pennsylvania drew Dutch, English, German, Scots-Irish, Quakers, Jews, and others.","Tobacco dominated the Chesapeake; the Middle colonies grew grain.","South Carolina, not the Middle colonies, had an enslaved majority."],"a":2},"b2-15":{"id":"b2-15","u":2,"t":"S","d":3,"q":"Which of the following best explains the shift from indentured servitude to African slavery in the Chesapeake after 1680?","o":["Fewer English servants came as conditions in England improved, and planters feared rebellious landless freedmen","Native Americans refused to trade with English colonists","Tobacco cultivation required fewer workers after 1680","Slavery was cheaper because the Royal African Company was abolished","The Mayflower Compact banned indentured servitude"],"e":["Bacon's Rebellion and a growing supply of enslaved Africans pushed the change.","Trade relations did not determine the labor shift.","Tobacco remained labor-intensive.","The Royal African Company increased the supply of enslaved Africans.","The Compact was a Plymouth governing agreement."],"a":0},"b2-13":{"id":"b2-13","u":2,"t":"E","d":3,"q":"South Carolina became a majority-enslaved colony in the early 1700s largely because","o":["the colony banned indentured servitude in 1663","Quaker leaders encouraged slavery","planters from Barbados brought the West Indian slave system and later relied on enslaved Africans' skill in growing rice","enslaved people were needed for silver mining","the Navigation Acts required slavery in all southern colonies"],"e":["No such ban existed.","Quakers became the first organized opponents of slavery.","Rice cultivation demanded large numbers of laborers.","There was no silver mining in South Carolina.","The Navigation Acts regulated trade, not labor."],"a":2},"q3-1":{"id":"q3-1","u":3,"t":"E","d":1,"q":"Under the theory of mercantilism, the primary purpose of colonies was to","o":["provide religious refuge for persecuted groups","trade freely with all nations to maximize profits","supply raw materials and buy manufactured goods from the mother country","develop independent manufacturing to compete with the mother country","serve as penal colonies for convicted criminals"],"e":["Some colonies did, but that was not the economic purpose under mercantilism.","Free trade is the opposite of mercantilism; that idea came from Adam Smith.","Mercantilism aimed to enrich the home country through a favorable balance of trade.","Mercantilism discouraged colonial manufacturing that competed with home industries.","Some convicts were sent, but this was not the theory's goal."],"a":2},"q3-2":{"id":"q3-2","u":3,"t":"P","d":2,"q":"The policy of \"salutary neglect\" contributed to the American Revolution primarily because it","o":["encouraged the colonies to form a military alliance with France","imposed heavy taxes on the colonies during the early 1700s","required colonists to quarter British soldiers","allowed colonists to grow accustomed to self-government through their own assemblies","banned colonial assemblies from meeting"],"e":["The colonies fought against France.","Salutary neglect meant loose enforcement and few new taxes.","The Quartering Act came in 1765, after salutary neglect ended.","When Britain tightened control after 1763, colonists saw it as a violation of established practice.","Assemblies grew stronger during this period."],"a":3},"q3-3":{"id":"q3-3","u":3,"t":"C","d":1,"q":"Jonathan Edwards and George Whitefield are most closely associated with","o":["the Enlightenment","the Salem witch trials","the Albany Plan of Union","the founding of Pennsylvania","the Great Awakening"],"e":["The Enlightenment was associated with figures like Locke and Franklin and stressed reason.","Those occurred in 1692, before both men's careers.","That was Benjamin Franklin's plan.","Pennsylvania was founded by William Penn in 1681.","Both were leading revival preachers of the 1730s–1740s."],"a":4},"q3-4":{"id":"q3-4","u":3,"t":"C","d":2,"q":"Which of the following was a significant effect of the Great Awakening?","o":["It caused most colonists to adopt deism","It divided congregations and encouraged colonists to challenge established religious authority","It led directly to the passage of the Navigation Acts","It ended slavery in the northern colonies","It strengthened the authority of the Church of England in all colonies"],"e":["Deism was an Enlightenment belief held by a small elite; the Awakening moved people toward emotional Christianity.","New Light vs. Old Light splits and new denominations taught people to question authority.","The Navigation Acts began in 1651, long before the Awakening.","Slavery remained legal in all colonies at this time.","The revivals weakened established churches, including the Anglican Church."],"a":1},"q3-5":{"id":"q3-5","u":3,"t":"C","d":2,"q":"The ideas of John Locke most directly influenced colonists' belief that","o":["emotional conversion is necessary for salvation","colonies should exist to enrich the mother country","a strong central government should control the economy","government derives its power from the consent of the governed","kings rule by divine right"],"e":["That was the message of Great Awakening preachers.","That is mercantilism.","Locke focused on natural rights and limited government.","Locke argued that people form governments to protect natural rights and may replace governments that violate them.","Locke wrote against divine-right monarchy."],"a":3},"q3-6":{"id":"q3-6","u":3,"t":"S","d":2,"q":"The Stono Rebellion of 1739 led South Carolina to","o":["adopt a stricter slave code restricting enslaved people's movement and assembly","declare war on Spanish Florida","grant freedom to enslaved people who converted to Christianity","shift its economy from rice to tobacco","abolish the slave trade"],"e":["Authorities responded to the revolt with tighter controls.","The legislature tightened laws; it did not declare war.","Baptism did not bring freedom; laws said so explicitly.","Rice and indigo remained South Carolina's staples.","South Carolina continued importing enslaved Africans for decades."],"a":0},"q3-7":{"id":"q3-7","u":3,"t":"P","d":2,"q":"Georgia, founded in 1732, was originally intended to","o":["serve as a buffer against Spanish Florida and offer a new start for poor English settlers","serve as the capital of the Dominion of New England","protect French fur traders in the Ohio Valley","provide a refuge for English Catholics","be a center of large-scale rice plantations worked by enslaved people from the start"],"e":["Oglethorpe's colony banned slavery and large estates at first.","The Dominion was in the North and had collapsed in 1689.","Georgia was a British colony on the southern frontier.","That was Maryland.","Georgia originally banned slavery; it was legalized only in 1751."],"a":0},"q3-8":{"id":"q3-8","u":3,"t":"D","d":2,"q":"The Albany Plan of Union (1754) is significant because it","o":["ended the French and Indian War","created the first written constitution in America","was an early proposal for colonial cooperation, even though the colonies rejected it","was approved by Parliament and every colonial assembly","formally united the colonies against Britain"],"e":["The war ended with the Treaty of Paris in 1763.","That honor usually goes to the Fundamental Orders of Connecticut (1639).","Franklin's plan for a joint council failed because assemblies guarded their taxing power.","Both colonial assemblies and the Crown declined to adopt it.","It was meant to coordinate defense against France, not resist Britain, and was never adopted."],"a":2},"q3-9":{"id":"q3-9","u":3,"t":"D","d":2,"q":"As a result of the Treaty of Paris of 1763,","o":["France gained Florida from Spain","the United States gained independence","Britain ceded Canada to Spain","Native peoples received guaranteed title to the Ohio Valley","France lost nearly all of its North American territory"],"e":["Britain, not France, gained Florida.","That was the Treaty of Paris of 1783.","Britain gained Canada.","The treaty did not protect Native land claims; Native peoples were not party to it.","Britain took Canada and land east of the Mississippi; Spain took Louisiana."],"a":4},"q3-10":{"id":"q3-10","u":3,"t":"E","d":3,"q":"Read the table below on colonial exports (illustrative figures, about 1770). Which conclusion is best supported by the table?<table><tr><th>Region<\/th><th>Leading exports<\/th><\/tr><tr><td>New England<\/td><td>Fish, lumber, ships, rum<\/td><\/tr><tr><td>Middle colonies<\/td><td>Wheat, flour, livestock<\/td><\/tr><tr><td>Chesapeake<\/td><td>Tobacco<\/td><\/tr><tr><td>Lower South<\/td><td>Rice, indigo<\/td><\/tr><\/table>","o":["New England's economy depended mainly on staple crops grown by enslaved labor","Each colonial region's economy was shaped by its environment and labor system","All regions exported the same goods to Britain","The colonies had already industrialized by 1770","Tobacco was grown chiefly in the Middle colonies"],"e":["New England relied on fishing, lumber, shipbuilding, and trade.","Plantation staples dominated the South, grain the Middle colonies, and maritime trades New England.","The table shows clear regional differences.","Exports were mostly raw materials and agricultural products.","The table lists tobacco under the Chesapeake."],"a":1},"q3-11":{"id":"q3-11","u":3,"t":"P","d":3,"q":"The acquittal of John Peter Zenger in 1735 was significant because it","o":["helped establish that printing truthful criticism of officials should not be punished as libel","ended the practice s of Parliament."],"a":1},"b3-7":{"id":"b3-7","u":3,"t":"E","d":2,"q":"The \"triangular trade\" connected","o":["Virginia, Maryland, and North Carolina","New England, West Africa, and the West Indies","Spain, Portugal, and Brazil","Canada, Louisiana, and France","China, India, and Britain"],"e":["That is a single region, not an Atlantic trade network.","For example, rum, enslaved Africans, and sugar and molasses moved among these regions.","That describes Iberian trade, not the British colonial pattern.","That was part of the French empire.","That describes Asian trade routes."],"a":1},"b3-17":{"id":"b3-17","u":3,"t":"P","d":3,"q":"A historian studying the Zenger trial (1735) would most likely use it as evidence of","o":["the growth of colonial ideas about freedom of the press and resistance to royal officials","colonial support for virtual representation","the strength of the Albany Plan","the beginning of the Great Awakening","British enforcement of the Navigation Acts"],"e":["The jury acquitted Zenger because his criticisms of the governor were true.","Virtual representation was a British argument of the 1760s.","The Albany Plan came in 1754.","The trial concerned libel and the press.","The trial was not about trade."],"a":0},"q4-1":{"id":"q4-1","u":4,"t":"P","d":1,"q":"Colonists objected to the Stamp Act of 1765 primarily because it","o":["was a direct tax levied by a Parliament in which they had no elected representatives","closed the port of Boston","banned settlement west of the Appalachians","was the first tax ever placed on colonial trade","forced colonists to house British soldiers"],"e":["\"No taxation without representation\" was the core objection.","That was one of the Coercive Acts (1774).","That was the Proclamation of 1763.","Trade duties under the Navigation Acts had existed for a century.","That was the Quartering Act."],"a":0},"q4-2":{"id":"q4-2","u":4,"t":"P","d":2,"q":"The British argument that Parliament represented all British subjects, inclu dia Company.","It was passed by Parliament.","It did no such thing; it made company tea cheaper."],"a":0},"q4-5":{"id":"q4-5","u":4,"t":"P","d":2,"q":"Parliament passed the Coercive (Intolerable) Acts in direct response to the","o":["Stamp Act Congress","publication of Common Sense","Boston Massacre","Boston Tea Party","Battle of Saratoga"],"e":["The Stamp Act Congress met in 1765.","Common Sense appeared in 1776.","The Massacre was in 1770; the Coercive Acts were in 1774.","The Acts punished Massachusetts for destroying the East India Company's tea.","Saratoga was in 1777, during the war."],"a":3},"q4-6":{"id":"q4-6","u":4,"t":"C","d":2,"q":"Thomas Paine's Common Sense (1776) was influential primarily because it","o":["argued that Parliament could regulate trade but not levy revenue taxes","attacked monarchy and argued for independence in language ordinary colonists could understand","defended the British soldiers involved in the Boston Massacre","proposed a plan for colonial union against France","was the official declaration of war adopted by Congress"],"e":["That was John Dickinson's argument in Letters from a Farmer in Pennsylvania.","It sold widely and shifted public opinion toward independence.","John Adams defended the soldiers in court.","That was the Albany Plan (1754).","It was a private pamphlet, not a congressional document."],"a":1},"q4-7":{"id":"q4-7","u":4,"t":"C","d":2,"q":"Read the excerpt below. The ideas in this passage most directly reflect the influence of<blockquote>\"...that to secure these rights, Governments are instituted among Men, deriving their just powers from the consent of the governed...\"<\/blockquote>","o":["Adam Smith","King George III","John Winthrop","Jonathan Edwards","John Locke"],"e":["Smith wrote about free markets, not consent of the governed.","The Declaration was written against George III.","Winthrop described a Puritan religious commonwealth, not natural-rights government.","Edwards was a revival preacher focused on sin and salvation.","Locke argued that legitimate government rests on consent and exists to protect natural rights."],"a":4},"q4-8":{"id":"q4-8","u":4,"t":"D","d":1,"q":"The American victory at Saratoga (1777) was a turning point in the Revolutionary War because it","o":["ended the war and forced Britain to recognize independence","caused the Loyalists to join the Patriot side","led to Spain declaring war on the United States","persuaded France to form a military alliance with the United States","gave the Americans control of Canada"],"e":["The war continued until Yorktown (1781) and the Treaty of Paris (1783).","Loyalists remained loyal.","Spain later fought against Britain, not the United States.","The French alliance of 1778 brought money, troops, and naval power.","American attempts on Canada failed."],"a":3},"q4-9":{"id":"q4-9","u":4,"t":"D","d":2,"q":"Which of the following contributed most directly to the British surrender at Yorktown in 1781?","o":["Native American allies of the British refused to fight","A large Loyalist army switched sides to support Washington","The Spanish captured London","The Second Continental Congress personally negotiated Cornwallis's surrender","A French fleet blocked British escape by sea while American and French troops besieged the town"],"e":["Yorktown was decided by the siege and French navy.","No such defection occurred.","Spain never captured London.","Cornwallis surrendered to Washington and French commanders on the field.","Cooperation with France trapped Cornwallis."],"a":4},"q4-10":{"id":"q4-10","u":4,"t":"S","d":2,"q":"During the Revolution, Lord Dunmore's Proclamation (1775) offered freedom to","o":["Native Americans who moved west of the Appalachians","enslaved people who escaped to fight for the British","all enslaved people in the northern colonies","Loyalists who joined the Continental Army","indentured servants who paid their debts"],"e":["It concerned enslaved people, not Native land.","Thousands of enslaved people
