/* ---------- question engine ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const isTest=k=>k==='exam'||k==='diag';
function startRun(o){
  RUN={kind:o.kind,key:o.key,ids:o.ids,i:0,ans:{},marked:{},start:Date.now(),end:o.minutes?Date.now()+o.minutes*6e4:null,title:o.title,host:null};
  if(isTest(o.kind)){S.run=Object.assign({},RUN); delete S.run.host; save();}
  RUN.host=o.host||$('#view'); renderRun();
}
function resumeRun(host){RUN=Object.assign({},S.run,{host}); renderRun();}
function persistRun(){ if(RUN&&isTest(RUN.kind)){const c=Object.assign({},RUN); delete c.host; S.run=c; save();} }
function qHTML(q){return `<div class="qtext">${q.q}</div>`}
function renderRun(){
  const R=RUN, host=R.host, id=R.ids[R.i], q=Q[id], test=isTest(R.kind), ans=R.ans[id], answered=ans!=null;
  if(R.end&&Date.now()>=R.end) return finishRun(true);
  let opts='';
  q.o.forEach((o,k)=>{
    let cls='opt';
    if(test){ if(ans===k) cls+=' sel'; }
    else if(answered){ if(k===q.a) cls+=' right'; else if(k===ans) cls+=' wrong'; }
    const why=(!test&&answered)?`<div class="why"><b>${k===q.a?'Why it’s right: ':'Why not: '}</b>${q.e[k]}</div>`:'';
    opts+=`<button class="${cls}" data-k="${k}" ${(!test&&answered)?'disabled':''}><span class="k">${LETTERS[k]}</span><span>${o}</span>${why}</button>`;
  });
  const u=U[q.u-1];
  const fb=(!test&&answered)?`<div class="fb ${ans===q.a?'good':'bad'}">${ans===q.a?'Correct.':'Not quite — the answer is '+LETTERS[q.a]+'.'}</div>`:'';
  const nav=test?`<details style="margin-top:14px"><summary class="small muted" style="cursor:pointer">Question navigator (${Object.keys(R.ans).length}/${R.ids.length} answered, ${Object.keys(R.marked).filter(k=>R.marked[k]).length} marked)</summary><div class="navgrid">${R.ids.map((x,i)=>`<button data-go="${i}" class="${R.ans[x]!=null?'a':''} ${R.marked[x]?'m':''} ${i===R.i?'cur':''}">${i+1}</button>`).join('')}</div></details>`:'';
  host.innerHTML=`<div class="card">
   <div class="qhead"><div><b>${esc(R.title)}</b> <span class="muted small">· Question ${R.i+1} of ${R.ids.length}</span></div>
   <div class="row">${R.end?'<span class="timer" id="timer"></span>':''}${test?`<button class="btn sm ${R.marked[id]?'pri':''}" id="markQ">${R.marked[id]?'★ Marked':'☆ Mark'}</button>`:''}</div></div>
   ${R.kind==='exam'?'':`<div class="small muted" style="margin-bottom:4px">Unit ${q.u}: ${esc(u.short)} · ${esc(TH[q.t].short)}</div>`}
   ${qHTML(q)}<div class="opts">${opts}</div>${fb}
   <div class="foot"><div class="row">${test&&R.i>0?'<button class="btn" id="prev">← Prev</button>':''}</div>
   <div class="row">${test?'<button class="btn" id="submit">Submit '+(R.kind==='exam'?'exam':'test')+'</button>':''}
   <button class="btn pri" id="next" ${(!test&&!answered)?'disabled':''}>${R.i===R.ids.length-1?(test?'Review & submit':'Finish'):'Next →'}</button></div></div>
   <div class="tiny muted" style="margin-top:8px"><span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">Enter</span> ${test?'next':'next (after answering)'}${R.kind==='exam'?' · no pausing: the timer keeps running if you leave':''}</div>
   ${nav}</div>`;
  $$('.opt',host).forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $$('[data-go]',host).forEach(b=>b.onclick=()=>{R.i=+b.dataset.go;persistRun();renderRun()});
  const nx=$('#next',host); if(nx) nx.onclick=next;
  const pv=$('#prev',host); if(pv) pv.onclick=()=>{R.i--;persistRun();renderRun()};
  const sb=$('#submit',host); if(sb) sb.onclick=()=>confirmSubmit();
  const mk=$('#markQ',host); if(mk) mk.onclick=()=>{R.marked[id]=!R.marked[id];persistRun();renderRun()};
  if(R.end){tick(); clearInterval(timerInt); timerInt=setInterval(tick,1000);}
}
function tick(){
  const el=$('#timer'); if(!RUN||!RUN.end) return;
  const left=Math.max(0,RUN.end-Date.now());
  if(el){const m=Math.floor(left/6e4),s=Math.floor(left/1e3)%60; el.textContent=`${m}:${String(s).padStart(2,'0')}`; el.classList.toggle('low',left<5*6e4);}
  if(left<=0){clearInterval(timerInt); finishRun(true);}
}
function answer(k){
  const R=RUN, id=R.ids[R.i], q=Q[id];
  if(isTest(R.kind)){R.ans[id]=k; persistRun(); renderRun(); return;}
  if(R.ans[id]!=null) return;
  R.ans[id]=k; recordAnswer(id,k===q.a,R.kind); renderRun();
}
function next(){
  const R=RUN, id=R.ids[R.i];
  if(!isTest(R.kind)&&R.ans[id]==null) return;
  if(R.i<R.ids.length-1){R.i++; persistRun(); renderRun(); window.scrollTo(0,0);}
  else if(isTest(R.kind)) confirmSubmit(); else finishRun();
}
function confirmSubmit(){
  const R=RUN, un=R.ids.length-Object.keys(R.ans).length;
  if(un>0&&!confirm(`${un} question(s) unanswered. There is no guessing penalty on CLEP — answer everything. Submit anyway?`)) return;
  finishRun();
}
function recordAnswer(id,ok,src){
  if(ok){ if(S.mis[id]){delete S.mis[id]; S.misCleared=(S.misCleared||0)+1;} }
  else { const m=S.mis[id]||{n:0}; m.n++; m.t=Date.now(); m.src=src; S.mis[id]=m; }
  save();
}
function tally(ids,ans){
  const r={c:0,t:ids.length,byUnit:{},byTheme:{}};
  for(const id of ids){const q=Q[id], ok=ans[id]===q.a; if(ok) r.c++;
    (r.byUnit[q.u]=r.byUnit[q.u]||[0,0]); r.byUnit[q.u][1]++; if(ok) r.byUnit[q.u][0]++;
    (r.byTheme[q.t]=r.byTheme[q.t]||[0,0]); r.byTheme[q.t][1]++; if(ok) r.byTheme[q.t][0]++;}
  r.score=pct(r.c,r.t); return r;
}
function finishRun(timeUp){
  clearInterval(timerInt); timerInt=null;
  const R=RUN; if(!R) return; const res=tally(R.ids,R.ans);
  if(isTest(R.kind)){
    for(const id of R.ids){ const q=Q[id]; recordAnswer(id,R.ans[id]===q.a,R.kind); }
    const rec={date:Date.now(),score:res.score,c:res.c,t:res.t,byUnit:res.byUnit,byTheme:res.byTheme,ans:R.ans,ids:R.ids,mins:Math.round((Math.min(Date.now(),R.end||Date.now())-R.start)/6e4),timeUp:!!timeUp};
    if(R.kind==='diag') S.diag=rec; else S.exams[R.key]=rec;
    S.run=null;
  } else if(R.kind==='quiz'){
    const old=S.quiz[R.key]; S.quiz[R.key]={best:Math.max(res.score,old?old.best:0),last:res.score,n:(old?old.n:0)+1};
  }
  save(); setNav(location.hash.split('/').slice(0,2).join('/'));
  showResults(R,res,timeUp);
}
function breakdownHTML(res){
  const ub=Object.keys(res.byUnit).map(Number).sort((a,b)=>a-b).map(u=>{const [c,t]=res.byUnit[u],p=pct(c,t);
    return `<tr><td>${u}. ${esc(U[u-1].short)}</td><td>${c}/${t}</td><td style="width:40%"><div class="bar ${p>=75?'good':p>=50?'warn':'bad'}"><i style="width:${p}%"></i></div></td><td>${p}%</td></tr>`}).join('');
  const tb=Object.keys(TH).filter(k=>res.byTheme[k]).map(k=>{const [c,t]=res.byTheme[k],p=pct(c,t);
    return `<tr><td>${esc(TH[k].name)}</td><td>${c}/${t}</td><td style="width:40%"><div class="bar ${p>=75?'good':p>=50?'warn':'bad'}"><i style="width:${p}%"></i></div></td><td>${p}%</td></tr>`}).join('');
  return `<div class="grid g2"><div class="tbl-wrap"><h3>By unit</h3><table>${ub}</table></div><div class="tbl-wrap"><h3>By topic (official categories)</h3><table>${tb}</table></div></div>`;
}
function reviewHTML(ids,ans,onlyWrong){
  return ids.filter(id=>!onlyWrong||ans[id]!==Q[id].a).map((id,i)=>{const q=Q[id],a=ans[id];
    return `<div class="card" style="margin-top:10px"><div class="small muted">Unit ${q.u} · ${esc(TH[q.t].short)} · ${a===q.a?'<span style="color:var(--good)">correct</span>':a==null?'<span style="color:var(--bad)">unanswered</span>':'<span style="color:var(--bad)">missed</span>'}</div>
    ${qHTML(q)}<div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.a?'right':k===a?'wrong':''}"><span class="k">${LETTERS[k]}</span><span>${o}</span><div class="why"><b>${k===q.a?'Why it’s right: ':'Why not: '}</b>${q.e[k]}</div></div>`).join('')}</div></div>`}).join('')||'<p class="muted">Nothing to show.</p>';
}
function showResults(R,res,timeUp){
  const host=R.host||$('#view');
  let extra='';
  if(R.kind==='diag'){
    extra=`<h3 style="margin-top:18px">What to skim vs. study</h3><table>${U.map(u=>{const l=diagLabel(u.n);const r=S.diag.byUnit[u.n]||[0,0];
      return `<tr><td>${u.n}. ${esc(u.title)}</td><td>${r[0]}/${r[1]}</td><td><span class="pill ${l==='skim'?'good':l==='must'?'bad':'warn'}">${l==='skim'?'Skim':l==='must'?'Must study':'Study'}</span></td></tr>`}).join('')}</table>
      <p class="small muted">With only 1–4 diagnostic questions per unit these labels are rough. “Skim” units still get their quiz — if you score ≥ 80% there, move on.</p>`;
  }
  if(R.kind==='exam') extra=`<p>${res.score>=75?'<b style="color:var(--good)">≥ 75% — this exam counts toward “ready to book.”</b>':'<b style="color:var(--warn)">Below the 75% readiness bar.</b> Drill your mistake log, revisit the weakest units below, then try the other exam.'}</p>
   <p class="small muted">CLEP reports a scaled score (20–80; 50 earns credit). The College Board does not publish a percent-to-scale conversion, so the 75% bar is a deliberately conservative target <span class="unver">unverified</span>.</p>`;
  host.innerHTML=`<div class="card"><h2>${esc(R.title)} — results</h2>${timeUp?'<p class="fb bad">Time expired — submitted automatically.</p>':''}
   <div class="row"><div class="stat"><div class="n">${res.score}%</div><div class="l">${res.c} of ${res.t} correct</div></div></div>
   ${extra}${isTest(R.kind)||R.kind==='quiz'?breakdownHTML(res):''}
   <div class="row" style="margin-top:14px" id="rbtns"></div></div>
   <div class="row" style="margin-top:16px"><h2 style="margin:0">Review</h2><label class="small"><input type="checkbox" id="onlyWrong" checked> missed only</label></div><div id="rev"></div>`;
  const rb=$('#rbtns',host);
  const add=(t,f,pri)=>{const b=document.createElement(f.charAt?'a':'button');b.className='btn'+(pri?' pri':'');b.textContent=t;if(f.charAt)b.href=f;else b.onclick=f;rb.appendChild(b)};
  if(R.kind==='quiz'){add('Retake quiz',()=>startRun({kind:'quiz',key:R.key,ids:shuffle([...U[R.key-1].quiz]),title:R.title,host}));add('Flashcards','#unit/'+R.key+'/cards');if(R.key<U.length)add(`Next: Unit ${R.key+1} →`,'#unit/'+(R.key+1),true);}
  else if(R.kind==='drill'){add('Back to mistake log',()=>route(),true);}
  else add('Dashboard','#home',true);
  const draw=()=>{$('#rev',host).innerHTML=reviewHTML(R.ids,R.ans,$('#onlyWrong',host).checked)};
  $('#onlyWrong',host).onchange=draw; draw();
  RUN=null;
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey) return;
  if(RUN&&document.body.contains(RUN.host)){
    if(/^[1-5]$/.test(e.key)){const k=+e.key-1; if(Q[RUN.ids[RUN.i]].o[k]!=null){e.preventDefault();answer(k);}}
    else if(e.key==='Enter'){e.preventDefault();next();}
    else if(isTest(RUN.kind)&&e.key==='ArrowLeft'&&RUN.i>0){RUN.i--;persistRun();renderRun();}
    else if(isTest(RUN.kind)&&e.key==='ArrowRight'&&RUN.i<RUN.ids.length-1){RUN.i++;persistRun();renderRun();}
    return;
  }
  if(CARD&&document.body.contains(CARD.host)){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
    else if(CARD.flipped&&(e.key==='1'||e.key==='2')){e.preventDefault();gradeCard(e.key==='2');}
  }
});

/* ---------- diagnostic & exams ---------- */
function viewDiag(v){
  if(S.run&&S.run.kind==='diag') return resumeRun(v);
  if(S.run&&S.run.kind==='exam'){v.innerHTML=`<div class="card"><p>Practice exam ${S.run.key===1?'A':'B'} is in progress (timer running).</p><a class="btn pri" href="#exam/${S.run.key}">Resume exam</a></div>`;return;}
  const d=S.diag;
  v.innerHTML=`<h1>Diagnostic test</h1><div class="card"><p><b>${DATA.diag.length} questions</b> drawn from every unit in proportion to the official weights. No feedback until the end; untimed (aim for ~25 minutes). Afterward you get a score per unit and a <b>skim / study / must study</b> label that the dashboard and study plan use.</p>
  <p class="small muted">Take it cold — guessing is fine and expected. These questions never reappear in unit quizzes or practice exams.</p>
  ${d?`<p>Last result: <b>${d.score}%</b> on ${new Date(d.date).toLocaleDateString()}.</p>`:''}
  <div class="row"><button class="btn pri" id="go">${d?'Retake diagnostic':'Start diagnostic'}</button>${d?'<button class="btn" id="see">See last results</button>':''}</div></div>`;
  $('#go').onclick=()=>startRun({kind:'diag',key:0,ids:[...DATA.diag],title:'Diagnostic test',host:v});
  if(d) $('#see').onclick=()=>showResults({kind:'diag',ids:d.ids,ans:d.ans,title:'Diagnostic test',host:v},tally(d.ids,d.ans));
}
function viewExam(v,k){
  const name=k===1?'A':'B';
  if(S.run){
    if(S.run.kind==='exam'&&S.run.key===k) return resumeRun(v);
    v.innerHTML=`<div class="card"><p>You have a ${S.run.kind==='exam'?'practice exam '+(S.run.key===1?'A':'B'):'diagnostic'} in progress. Finish it first.</p><a class="btn pri" href="${S.run.kind==='exam'?'#exam/'+S.run.key:'#diag'}">Resume</a></div>`; return;
  }
  const ex=S.exams[k], ids=DATA.exams[k-1];
  v.innerHTML=`<h1>Practice exam ${name}</h1><div class="card">
  <p><b>${ids.length} questions · ${DATA.meta.format.minutes} minutes · no pausing.</b> Mirrors the real format: questions are spread across units by the official weights, no feedback until you submit, and you can mark questions and jump back. The clock runs on real time — closing the tab does <i>not</i> stop it.</p>
  <p class="small muted">Pace: about 45 seconds per question. Answer everything — there is no guessing penalty. None of these questions appear in unit quizzes, the diagnostic, or the other exam.</p>
  ${ex?`<p>Last result: <b>${ex.score}%</b> (${ex.c}/${ex.t}) on ${new Date(ex.date).toLocaleDateString()}, ${ex.mins} min used.</p>`:''}
  <div class="row"><button class="btn pri" id="go">${ex?'Retake':'Start'} exam ${name}</button>${ex?'<button class="btn" id="see">See last results</button>':''}</div></div>`;
  $('#go').onclick=()=>{ if(confirm(`Start Practice exam ${name}? The ${DATA.meta.format.minutes}-minute timer cannot be paused.`)) startRun({kind:'exam',key:k,ids:shuffle([...ids]),title:'Practice exam '+name,minutes:DATA.meta.format.minutes,host:v}); };
  if(ex) $('#see').onclick=()=>showResults({kind:'exam',key:k,ids:ex.ids,ans:ex.ans,title:'Practice exam '+name,host:v},tally(ex.ids,ex.ans));
}

/* ---------- mistakes ---------- */
function viewMistakes(v){
  const ids=Object.keys(S.mis).filter(id=>Q[id]).sort((a,b)=>S.mis[b].n-S.mis[a].n);
  const byU={}; ids.forEach(id=>{const u=Q[id].u;byU[u]=(byU[u]||0)+1});
  v.innerHTML=`<h1>Mistake log</h1><div class="card"><p>Every question you miss anywhere lands here. Answer it correctly in a drill and it leaves the queue. ${S.misCleared?`<b>${S.misCleared}</b> cleared so far.`:''}</p>
  ${ids.length?`<div class="row" style="margin-bottom:10px">${Object.keys(byU).sort((a,b)=>a-b).map(u=>`<span class="pill">Unit ${u}: ${byU[u]}</span>`).join('')}</div>
  <div class="row"><button class="btn pri" id="drill">Drill all ${ids.length}</button><select id="du"><option value="0">…or one unit</option>${Object.keys(byU).sort((a,b)=>a-b).map(u=>`<option value="${u}">Unit ${u} (${byU[u]})</option>`).join('')}</select></div>`:'<p class="muted">Empty — nice. Take a quiz or exam to fill it.</p>'}</div><div id="ml"></div>`;
  if(!ids.length) return;
  const go=list=>startRun({kind:'drill',key:0,ids:shuffle(list).slice(0,40),title:'Mistake drill',host:v});
  $('#drill').onclick=()=>go([...ids]);
  $('#du').onchange=e=>{const u=+e.target.value; if(u) go(ids.filter(id=>Q[id].u===u));};
  $('#ml').innerHTML=`<h2 style="margin-top:18px">Queue</h2>`+ids.map(id=>{const q=Q[id];return `<div class="card small" style="margin-top:8px"><div class="muted tiny">Unit ${q.u} · missed ${S.mis[id].n}× · ${esc(TH[q.t].short)}</div>${q.q.replace(/<blockquote[\s\S]*?<\/blockquote>|<table[\s\S]*?<\/table>/g,'[…]').slice(0,260)}</div>`}).join('');
}

/* ---------- flashcards (Leitner) ---------- */
const IV=[0,0,1,3,7,14]; // days until due, by box 1..5
let CARD=null;
function dueCards(cards){const t=TODAY(); return cards.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t)}
function newCards(cards){return cards.filter(c=>!S.cards[c.id])}
function missedCards(cards){return cards.filter(c=>{const s=S.cards[c.id];return s&&(s.last===0||(s.m>0&&s.b<=2))})}
function viewCards(host,n){
  const cards=n?unitCards(n):allCards(), cs=cardStats(cards);
  const box=[1,2,3,4,5].map(b=>cards.filter(c=>S.cards[c.id]&&S.cards[c.id].b===b).length);
  const due=dueCards(cards).length, nw=newCards(cards).length, ms=missedCards(cards).length;
  host.innerHTML=`${n?'':'<h1>Flashcards</h1>'}<div class="card"><p class="small" style="margin-top:0">Leitner boxes: a miss sends a card back to box 1 (it returns this session and tomorrow); each hit moves it up a box and spaces it out (box 2 → 1 day, 3 → 3 days, 4 → 7, 5 → 14).</p>
  <div class="boxes"><div><b>${nw}</b>new</div>${box.map((x,i)=>`<div><b>${x}</b>box ${i+1}</div>`).join('')}</div>
  ${n?'':`<div class="row" style="margin-top:12px"><label class="f">Unit<select id="cu"><option value="0">All units</option>${U.map(u=>`<option value="${u.n}">${u.n}. ${esc(u.short)} (${u.cards.length})</option>`).join('')}</select></label></div>`}
  <div class="row" style="margin-top:12px"><button class="btn pri" data-m="due">Review due + new (${due} due, ${Math.min(nw,20)} new)</button><button class="btn" data-m="miss" ${ms?'':'disabled'}>Review missed only (${ms})</button><button class="btn" data-m="all">Cram all ${cards.length}</button></div></div><div id="fc" style="margin-top:14px"></div>`;
  if(!n) $('#cu').onchange=e=>{const u=+e.target.value; viewCards(host,0); if(u){ $('#cu').value=u; startCards(unitCards(u),'due',$('#fc'),host); }};
  $$('[data-m]',host).forEach(b=>b.onclick=()=>{const u=n||(+($('#cu')||{}).value||0); startCards(u?unitCards(u):cards,b.dataset.m,$('#fc'),host)});
}
function startCards(cards,mode,el,outer){
  let list = mode==='due'?[...shuffle(dueCards(cards)),...shuffle(newCards(cards)).slice(0,20)] : mode==='miss'?shuffle(missedCards(cards)):shuffle([...cards]);
  if(!list.length){el.innerHTML='<div class="card muted">Nothing due right now. Come back tomorrow, or cram.</div>';return;}
  CARD={list,i:0,flipped:false,host:el,ok:0,miss:0,requeued:{}}; drawCard();
}
function drawCard(){
  const C=CARD; if(C.i>=C.list.length){C.host.innerHTML=`<div class="card"><h3>Session done</h3><p>${C.ok} known · ${C.miss} missed. Missed cards come back first next time.</p></div>`; CARD=null; return;}
  const c=C.list[C.i], s=S.cards[c.id];
  C.host.innerHTML=`<div class="small muted" style="margin-bottom:6px">Card ${C.i+1} of ${C.list.length} · ${s?'box '+s.b:'new'} · Unit ${c.u}</div>
  <div class="card fc" id="fcard"><div class="front">${c.f}</div>${C.flipped?`<div class="back">${c.b}</div>`:'<div class="small muted" style="margin-top:14px">tap or <span class="kbd">Space</span> to flip</div>'}</div>
  ${C.flipped?`<div class="row" style="margin-top:10px;justify-content:center"><button class="btn" id="g1">✗ Missed <span class="kbd">1</span></button><button class="btn pri" id="g2">✓ Knew it <span class="kbd">2</span></button></div>`:''}`;
  $('#fcard').onclick=flipCard;
  if(C.flipped){$('#g1').onclick=()=>gradeCard(false);$('#g2').onclick=()=>gradeCard(true);}
}
function flipCard(){if(!CARD)return;CARD.flipped=!CARD.flipped;drawCard()}
function gradeCard(ok){
  const C=CARD, c=C.list[C.i], s=S.cards[c.id]||{b:0,m:0};
  if(ok){s.b=Math.min(5,Math.max(s.b,1)+1);C.ok++} else {s.b=1;s.m=(s.m||0)+1;C.miss++; if(!C.requeued[c.id]){C.requeued[c.id]=1;C.list.push(c);}}
  s.last=ok?1:0; s.due=TODAY()+IV[s.b]; S.cards[c.id]=s; save();
  C.i++; C.flipped=false; drawCard();
}

/* ---------- cheat sheet ---------- */
function viewCheat(v){
  v.innerHTML=`<div class="row noprint" style="justify-content:space-between;margin-bottom:12px"><h1 style="margin:0">Cheat sheet</h1>
  <div class="row"><label class="small"><input type="checkbox" id="recall"> Recall mode (hide dates & answers — tap to reveal)</label><button class="btn pri" onclick="print()">Print one page</button></div></div>
  <div class="card cheat" id="cs">${DATA.cheat}</div>`;
  $('#recall').onchange=e=>$('#cs').classList.toggle('recall',e.target.checked);
  $('#cs').addEventListener('click',e=>{const h=e.target.closest('.hidev');if(h)h.classList.toggle('show')});
}

/* ---------- study plan ---------- */
function planTasks(){
  const H=DATA.meta.hours, t=[];
  if(!S.diag) t.push({l:'Diagnostic test (30 Q)',h:H.diag,href:'#diag'});
  U.forEach((u,i)=>{
    const f=diagFactor(u.n), base=unitHours(u.n)*f, cs=cardStats(u.cards), lab=diagLabel(u.n);
    const tag=lab==='skim'?' (skim)':'';
    if(!S.read[u.n]) t.push({l:`Unit ${u.n} lesson${tag}: ${u.short}`,h:base*.45,href:'#unit/'+u.n});
    if(!S.quiz[u.n]) t.push({l:`Unit ${u.n} quiz + review explanations`,h:base*.3,href:'#unit/'+u.n+'/quiz'});
    if(cs.learned<cs.total) t.push({l:`Unit ${u.n} flashcards`,h:base*.25*(1-cs.learned/Math.max(1,cs.total)),href:'#unit/'+u.n+'/cards'});
    if((i+1)%4===0) t.push({l:'Cumulative review: due flashcards + mistake log',h:.5,href:'#mistakes'});
  });
  t.push({l:'Mistake-log drill + redraw the cheat sheet from memory',h:H.final,href:'#cheat'});
  return t.filter(x=>x.h>0.04);
}
function makePlan(hpd,examDay){
  const today=TODAY(), days=[];
  const nDays=examDay-today; if(nDays<1) return {err:'Pick an exam date after today.'};
  const tasks=planTasks().map(x=>Object.assign({},x));
  const H=DATA.meta.hours;
  const examSlots = nDays>=3 ? [examDay-2,examDay-1] : nDays===2 ? [examDay-2,examDay-1] : [examDay-1,examDay-1];
  const lastStudy = Math.min(...examSlots); // content days: today .. lastStudy-1 (or same day if squeezed)
  const contentDays=Math.max(1,lastStudy-today);
  const need=tasks.reduce((a,b)=>a+b.h,0), cap=contentDays*hpd;
  for(let d=today; d<=examDay; d++) days.push({d,items:[]});
  const at=d=>days[d-today];
  let di=today, room=hpd;
  for(const tk of tasks){
    let h=tk.h, part=0;
    while(h>0.04){
      if(di>=lastStudy && lastStudy>today){ at(lastStudy-1).items.push({l:tk.l+(part?' (cont.)':''),h,href:tk.href,over:true}); h=0; break; }
      const take=Math.min(h,room);
      if(take>0.04){at(di).items.push({l:tk.l+(part?' (cont.)':''),h:take,href:tk.href}); h-=take; room-=take; part++;}
      if(room<=0.04){di++; room=hpd;}
      if(lastStudy===today&&di>today){at(today).items.push({l:tk.l,h,href:tk.href,over:true});h=0;}
    }
  }
  for(let d=di+(room<hpd?1:0); d<lastStudy; d++) if(!at(d).items.length) at(d).items.push({l:'Review: retake your 2 weakest unit quizzes, due flashcards, mistake log',h:Math.min(hpd,1.5),href:'#mistakes'});
  const ex=(k,d)=>{ if(!S.exams[k]) at(d).items.push({l:`Practice exam ${k===1?'A':'B'} (90 min, timed) + review every miss`,h:H.exam,href:'#exam/'+k}); else at(d).items.push({l:`Practice exam ${k===1?'A':'B'} done (${S.exams[k].score}%) — retake weakest units' quizzes`,h:1,href:'#mistakes'}); };
  ex(1,examSlots[0]); ex(2,examSlots[1]);
  at(examDay).items.push({l:'EXAM DAY — 20-minute cheat-sheet skim, then go. No new material.',h:.3,href:'#cheat'});
  return {days:days.filter(x=>x.items.length),need,cap,contentDays,warn: need>cap?`This plan needs about ${need.toFixed(1)} h of content before the practice exams but you have ${cap.toFixed(1)} h. Increase to ~${Math.ceil(10*need/contentDays)/10} h/day or move the date.`:''};
}
function planHTML(p){
  if(p.err) return `<p class="fb bad">${esc(p.err)}</p>`;
  const t=TODAY();
  return `${p.warn?`<div class="banner">${esc(p.warn)}</div>`:`<p class="small muted">Content left: ${p.need.toFixed(1)} h across ${p.contentDays} study day(s), then the two practice exams.</p>`}
  ${p.days.map(x=>`<div class="plan-day ${x.d===t?'today':''}"><div><b>${fmtDay(x.d)}</b>${x.d===t?'<div class="tiny">today</div>':''}<div class="tiny muted">${x.items.reduce((a,b)=>a+b.h,0).toFixed(1)} h</div></div>
   <ul>${x.items.map(i=>`<li><a href="${i.href}">${esc(i.l)}</a> <span class="muted small">· ${Math.round(i.h*60)} min${i.over?' · over budget':''}</span></li>`).join('')}</ul></div>`).join('')}`;
}
function planToday(){
  if(!S.plan) return '';
  const p=makePlan(S.plan.hpd,S.plan.day); if(p.err) return '';
  const d=p.days.find(x=>x.d===TODAY()); if(!d) return '';
  return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Today’s plan</h2><a class="small" href="#plan">full schedule</a></div>
  <ul style="margin:8px 0 0;padding-left:1.1em">${d.items.map(i=>`<li><a href="${i.href}">${esc(i.l)}</a> <span class="muted small">· ${Math.round(i.h*60)} min</span></li>`).join('')}</ul></div>`;
}
function viewPlan(v){
  const p=S.plan, def=new Date(Date.now()+21*864e5).toISOString().slice(0,10);
  const dstr=p?new Date(p.day*864e5).toISOString().slice(0,10):def;
  v.innerHTML=`<h1>Study plan</h1><div class="card"><p class="small" style="margin-top:0">Builds a day-by-day schedule from what you have <i>not</i> finished yet, weighted by the exam outline and your diagnostic (skim units get ~55% of the time, must-study units ~115%). Practice exams land 2 days and 1 day before the exam. Regenerate any time — it adapts to your progress.</p>
  <div class="row"><label class="f">Hours per day<input type="number" id="hpd" min="0.5" max="12" step="0.5" value="${p?p.hpd:1.5}"></label>
  <label class="f">Exam date<input type="date" id="edate" value="${dstr}"></label><button class="btn pri" id="mk" style="align-self:flex-end">Generate plan</button></div>
  <p class="small muted">Total budget for a beginner: ≈ ${DATA.meta.hours.total} h. Currently left: ≈ ${hoursLeft().toFixed(1)} h.</p></div><div class="card" id="pl" style="margin-top:14px"></div>`;
  const show=()=>{ if(!S.plan){$('#pl').innerHTML='<p class="muted">Enter your hours and date, then generate.</p>';return;} $('#pl').innerHTML=planHTML(makePlan(S.plan.hpd,S.plan.day)); };
  $('#mk').onclick=()=>{const h=+$('#hpd').value, ds=$('#edate').value; if(!(h>0)||!ds){alert('Enter hours per day and a date.');return;}
    const [y,m,d]=ds.split('-').map(Number); S.plan={hpd:h,day:dayNum(new Date(y,m-1,d))}; save(); show();};
  show();
}

/* ---------- about / data ---------- */
function viewAbout(v){
  const M=DATA.meta, st=s=>s==='verified-via-search'?'<span class="pill acc" title="Confirmed from search-indexed text of the official page">verified (search)</span>':'<span class="unver">unverified</span>';
  const counts=U.map(u=>{const all=Object.values(Q).filter(q=>q.u===u.n).length;return `<tr><td>${u.n}. ${esc(u.short)}</td><td>${u.weight}%</td><td>1 (${u.minutes} min)</td><td>${u.quiz.length}</td><td>${all}</td><td>${pct(all,Object.keys(Q).length)}%</td><td>${u.cards.length}</td><td>${pct(u.cards.length,allCards().length)}%</td></tr>`}).join('');
  const thc=Object.keys(TH).map(k=>{const n=Object.values(Q).filter(q=>q.t===k).length;return `<tr><td>${esc(TH[k].name)}</td><td>${TH[k].weight}% ${st(TH[k].status)}</td><td>${n}</td><td>${pct(n,Object.keys(Q).length)}%</td></tr>`}).join('');
  v.innerHTML=`<h1>About & data</h1>
  <div class="card"><h2>Exam facts</h2><table>
   <tr><td>Exam</td><td>${esc(M.exam)}</td></tr>
   <tr><td>Questions</td><td>~${M.format.questions} (includes some unscored pretest questions) ${st(M.format.qStatus)}</td></tr>
   <tr><td>Time</td><td>${M.format.minutes} minutes ${st(M.format.tStatus)}</td></tr>
   <tr><td>Format</td><td>Multiple choice; this guide uses 5 options per question ${st('unverified')}</td></tr>
   <tr><td>Passing</td><td>Scaled score 50 (20–80 scale) for 3 semester hours (ACE recommendation); your college sets its own policy ${st(M.format.sStatus)}</td></tr>
   <tr><td>Chronology</td><td>${M.chronological.map(c=>`${c.period}: ${c.weight}%`).join(' · ')} ${st('verified-via-search')}</td></tr></table>
   <p class="small muted">${esc(M.note)}</p>
   <p class="small">Sources: ${M.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' · ')}</p></div>
  <div class="card" style="margin-top:14px"><h2>Official topical weights vs. this guide’s question bank</h2><div class="tbl-wrap"><table><tr><th>Category</th><th>Official</th><th>Questions</th><th>Share</th></tr>${thc}</table></div></div>
  <div class="card" style="margin-top:14px"><h2>Content budget by unit</h2><div class="tbl-wrap"><table><tr><th>Unit</th><th>Weight</th><th>Lesson</th><th>Quiz Q</th><th>All Q</th><th>Q share</th><th>Cards</th><th>Card share</th></tr>${counts}</table></div>
   <p class="small muted">Totals: ${Object.keys(Q).length} original questions (quiz ${U.reduce((a,u)=>a+u.quiz.length,0)} · diagnostic ${DATA.diag.length} · exam A ${DATA.exams[0].length} · exam B ${DATA.exams[1].length}, no overlap), ${allCards().length} flashcards. Questions are original, written for this guide.</p></div>
  <div class="card" style="margin-top:14px"><h2>Your data</h2><p class="small">Progress is saved in this browser (localStorage)${storageOK?'':' — <b>currently blocked</b>'}. Export a JSON backup to move between devices.</p>
   <div class="row"><button class="btn pri" id="exp">Export progress (.json)</button><label class="btn">Import progress<input type="file" id="imp" accept="application/json,.json" class="hide"></label><button class="btn" id="rst">Reset everything</button></div></div>`;
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify({app:KEY,exported:new Date().toISOString(),state:S},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='clep-ush1-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);};
  $('#imp').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{const o=JSON.parse(r.result); const st=o.state||o; if(typeof st!=='object'||!('read' in st)) throw new Error('Not a progress file'); S=Object.assign(defState(),st); save(); applyTheme(); alert('Progress imported.'); location.hash='#home'; route();}catch(err){alert('Could not import: '+err.message)}}; r.readAsText(f);};
  $('#rst').onclick=()=>{if(confirm('Erase all progress? Export first if unsure.')){S=defState();save();applyTheme();route();}};
}

route();
</script>
