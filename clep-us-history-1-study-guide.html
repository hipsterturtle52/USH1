,"d":2,"q":"Which of the following was a major reason the Americans won the Revolutionary War?","o":["Strong support from nearly all Native nations","Britain's lack of a navy","The unanimous support of all colonists","A larger and better-trained army than Britain's","Assistance from France, including troops, money, and naval power"],"e":["Most Native nations sided with Britain.","Britain had the world's strongest navy.","About a fifth of colonists were Loyalists.","The Continental Army was smaller and less trained.","The French alliance after 1778 was decisive at Yorktown."],"a":4},"b4-15":{"id":"b4-15","u":4,"t":"C","d":2,"q":"In Letters from a Farmer in Pennsylvania, John Dickinson argued that","o":["the colonies should immediately declare independence","all men are created equal and have unalienable rights","Parliament could regulate trade but had no right to tax the colonies to raise revenue","monarchy was an absurd form of government","slavery should be abolished in Pennsylvania"],"e":["Dickinson favored reconciliation in the 1760s.","That phrase is from the Declaration of Independence.","His argument targeted the Townshend Acts.","That was Paine's argument in Common Sense.","His letters concerned British taxation."],"a":2},"b4-18":{"id":"b4-18","u":4,"t":"P","d":3,"q":"The First Continental Congress (1774) differed from the Second Continental Congress (1775–1781) in that the First Continental Congress","o":["was attended by all thirteen colonies, while the Second was not","wrote the Constitution, while the Second wrote the Articles","appointed George Washington commander, while the Second did not","sought to restore colonial rights within the British Empire, while the Second managed a war and eventually declared independence","declared independence, while the Second sought reconciliation"],"e":["Georgia missed the First Congress; all thirteen took part in the Second.","The Constitution was written in 1787 by a separate convention.","The Second Congress appointed Washington in 1775.","The First organized boycotts; the Second created the army and the Declaration.","The order is reversed."],"a":3},"b4-19":{"id":"b4-19","u":4,"t":"S","d":3,"q":"Pennsylvania's 1780 gradual emancipation law illustrates which of the following?","o":["Revolutionary ideals of liberty prompted some states to begin ending slavery","Britain forced Pennsylvania to end slavery","Slavery had already ended in all northern states by 1780","Southern states led the movement to end slavery","The Declaration of Independence immediately abolished slavery everywhere"],"e":["Northern states gradually abolished slavery after the Revolution.","Pennsylvania acted on its own.","Pennsylvania's law was the first gradual emancipation law.","Northern states led emancipation efforts.","Slavery continued in many states for decades."],"a":0},"b4-5":{"id":"b4-5","u":4,"t":"D","d":1,"q":"The first battles of the American Revolution took place in 1775 at","o":["Fort Sumter","Saratoga","Lexington and Concord","Trenton","Yorktown"],"e":["Fort Sumter began the Civil War in 1861.","Saratoga was fought in 1777.","British troops marched to seize colonial weapons stored at Concord.","Trenton was fought in December 1776.","Yorktown (1781) was the last major battle."],"a":2},"b4-14":{"id":"b4-14","u":4,"t":"S","d":1,"q":"Which of the following groups of Native Americans was divided over which side to support during the Revolution?","o":["The Pueblo","The Iroquois Confederacy","The Inca","The Lakota","The Aztecs"],"e":["The Pueblo lived in Spanish New Mexico, far from the fighting.","Most Iroquois nations sided with Britain, but the Oneida and Tuscarora supported the Patriots.","The Inca lived in South America.","The Lakota lived far west on the Great Plains.","The Aztec Empire had fallen in the 1520s."],"a":1},"b4-6":{"id":"b4-6","u":4,"t":"S","d":2,"q":"Which of the following groups was most likely to be Loyalist during the American Revolution?","o":["Readers of Common Sense who supported its arguments","Signers of the Declaration of Independence","Delegates to the Stamp Act Congress","Members of the Sons of Liberty","Royal officials and Anglican clergy"],"e":["Paine's supporters favored independence.","They were Patriot leaders.","They protested British taxation.","They were Patriots.","Their positions depended on the Crown and the Church of England."],"a":4},"b4-9":{"id":"b4-9","u":4,"t":"C","d":2,"q":"The Declaration of Independence directed its list of grievances primarily against","o":["the colonial assemblies","Parliament","France","King George III","the Continental Congress"],"e":["The assemblies were seen as legitimate.","The Declaration avoids naming Parliament directly.","France was a potential ally.","By 1776 colonists denied Parliament any authority over them, so they blamed the king.","The Congress issued the Declaration."],"a":3},"b4-11":{"id":"b4-11","u":4,"t":"S","d":2,"q":"What did Abigail Adams mean when she urged her husband to \"remember the ladies\"?","o":["She was asking Congress to honor female soldiers","She urged a boycott of British tea led by women","She wanted women excluded from public life","She was supporting the Loyalist cause","She hoped the new government would grant women more rights and protections"],"e":["Her letter concerned laws affecting women generally.","That is not the context of the quotation.","She asked for more consideration for women.","She was a committed Patriot.","Women did not gain political rights, but the request reflects revolutionary ideals."],"a":4},"b4-8":{"id":"b4-8","u":4,"t":"E","d":2,"q":"The Townshend Acts (1767) differed from the Stamp Act in that they","o":["were repealed before they took effect","taxed imported goods such as glass, paper, paint, and tea rather than documents used within the colonies","applied only to the southern colonies","were approved by the colonial assemblies","taxed only sugar and molasses"],"e":["Most were repealed in 1770, after taking effect.","Townshend hoped colonists would accept \"external\" duties.","They applied to all colonies.","Colonists protested them.","Those were covered by the Sugar Act (1764)."],"a":1},"b4-13":{"id":"b4-13","u":4,"t":"D","d":2,"q":"Which of the following lists Revolutionary War events in the correct order?","o":["Saratoga, Lexington and Concord, Yorktown, Declaration of Independence","Lexington and Concord, Saratoga, Declaration of Independence, Yorktown","Declaration of Independence, Yorktown, Saratoga, Lexington and Concord","Yorktown, Saratoga, Declaration of Independence, Lexington and Concord","Lexington and Concord, Declaration of Independence, Saratoga, Yorktown"],"e":["Saratoga (1777) came after Lexington (1775) and the Declaration (1776).","The Declaration (1776) came before Saratoga (1777).","This order is reversed.","This is the reverse of the correct order.","1775, 1776, 1777, 1781."],"a":4},"b4-17":{"id":"b4-17","u":4,"t":"D","d":3,"q":"In the Treaty of Paris (1783), Britain agreed to","o":["pay reparations to the United States for war damages","recognize US independence with a western boundary at the Mississippi River","allow the United States to keep its alliance with France permanently","grant the Louisiana Territory to the United States","give Canada to the United States"],"e":["No such payments were made.","Florida returned to Spain, and Native allies of Britain were ignored.","The treaty did not address the Franco-American alliance in that way.","Louisiana belonged to Spain and was purchased from France in 1803.","Britain kept Canada."],"a":1},"b4-20":{"id":"b4-20","u":4,"t":"C","d":3,"q":"Thomas Paine's Common Sense and the Declaration of Independence were similar in that both","o":["defended the authority of Parliament over the colonies","were written before the Stamp Act","appealed to ordinary colonists and used natural-rights reasoning to justify breaking with Britain","were written by Thomas Jefferson","called for the abolition of slavery"],"e":["Both rejected British authority.","Both appeared in 1776.","Both aimed to rally public support for independence.","Paine wrote Common Sense.","Jefferson's antislavery passage was cut, and Common Sense focused on monarchy."],"a":2},"q5-1":{"id":"q5-1","u":5,"t":"P","d":1,"q":"Which of the following was a major weakness of the Articles of Confederation?","o":["Large states dominated the national legislature","The president had too much power over Congress","National courts overruled state laws too often","Congress could easily amend the Articles with a simple majority","Congress had no power to levy taxes"],"e":["Each state had one vote regardless of size.","There was no president or separate executive under the Articles.","There were no national courts.","Amendments required the approval of all thirteen states.","Congress could only request money from the states, which often refused."],"a":4},"q5-2":{"id":"q5-2","u":5,"t":"P","d":2,"q":"The Northwest Ordinance of 1787 is considered the most important achievement of the Confederation government because it","o":["established a process for territories to become states equal to the original states","created the Electoral College","allowed slavery to expand north of the Ohio River","ended the Barbary pirates' attacks on American shipping","gave the national government the power to tax"],"e":["It also banned slavery in the Northwest Territory and protected civil liberties.","The Electoral College was created by the Constitution.","It banned slavery in the Northwest Territory.","The Barbary problem continued until the early 1800s.","The Articles never gained a taxing power."],"a":0},"q5-3":{"id":"q5-3","u":5,"t":"S","d":2,"q":"Shays' Rebellion (1786–1787) was significant because it","o":["was the first battle of the American Revolution","forced Britain to give up its forts in the Northwest","was supported by Massachusetts merchants and creditors","convinced many leaders that a stronger national government was needed","led to the immediate abolition of debtor prisons"],"e":["The Revolution began at Lexington and Concord in 1775.","Britain kept the forts until after Jay's Treaty (1794).","Merchants funded the militia that suppressed it.","The Confederation could not respond, adding urgency to the Philadelphia Convention.","It did not have that result."],"a":3},"q5-4":{"id":"q5-4","u":5,"t":"P","d":2,"q":"The Great (Connecticut) Compromise resolved a dispute over","o":["whether Congress could tax exports","representation of large and small states in Congress","whether to include a bill of rights","how the president would be chosen","whether to count enslaved people for representation"],"e":["That was settled separately: Congress could not tax exports.","It created a House based on population and a Senate with equal representation.","The Bill of Rights was added after ratification.","That was resolved through the Electoral College.","That was resolved by the Three-Fifths Compromise."],"a":1},"q5-5":{"id":"q5-5","u":5,"t":"P","d":1,"q":"Which group opposed ratification of the Constitution largely because it lacked a bill of rights?","o":["Federalists","Anti-Federalists","Whigs","Sons of Liberty","Loyalists"],"e":["Federalists supported ratification as written, later agreeing to add amendments.","Leaders like Patrick Henry and George Mason feared a strong government without protections for individual liberties.","The Whig Party formed in the 1830s.","That was a pre-Revolutionary protest group.","Loyalists had supported Britain during the Revolution."],"a":1},"q5-6":{"id":"q5-6","u":5,"t":"C","d":2,"q":"In Federalist No. 10, James Madison argued that","o":["the national government should be abolished in favor of state sovereignty","the president should serve for life","only a small republic could preserve liberty","the states should be allowed to secede at will","a large republic would make it difficult for any single faction to dominate"],"e":["Madison argued for a stronger national government.","Madison made no such argument.","That was a common Anti-Federalist argument; Madison argued the opposite.","Federalist No. 10 is about controlling factions.","Many competing interests would check one another."],"a":4},"q5-7":{"id":"q5-7","u":5,"t":"S","d":3,"q":"The Three-Fifths Compromise had which of the following effects?","o":["It increased the representation of southern states in the House of Representatives","It applied only to the Senate","It abolished the international slave trade in 1787","It reduced southern power in the Electoral College","It gave enslaved people three-fifths of a vote in elections"],"e":["Counting part of the enslaved population gave slaveholding states more seats and electoral votes.","It affected the House (and direct taxes), not the Senate.","The Constitution barred Congress from ending the trade before 1808.","Because electors are based on representation, it increased southern power.","Enslaved people could not vote at all; the clause counted population for apportionment."],"a":0},"q5-8":{"id":"q5-8","u":5,"t":"E","d":2,"q":"Under the Articles of Confederation, which of the following was a major economic problem?","o":["Federal tariffs protected manufacturing too heavily","Congress's high federal income tax burdened farmers","States imposed tariffs on each other's goods and Congress could not regulate commerce","Too much gold flowed into the country from Spain","The national bank charged interest rates that were too high"],"e":["The Confederation could not levy tariffs.","Congress had no taxing power.","The lack of a national commerce power produced trade disputes.","The problem was scarce hard money, not too much gold.","There was no national bank under the Articles (Hamilton's came in 1791)."],"a":2},"q5-9":{"id":"q5-9","u":5,"t":"P","d":3,"q":"Which of the following was a concession made to southern delegates at the Constitutional Convention?","o":["Congress was given power to abolish slavery in 1800","The New Jersey Plan was adopted without change","Congress was prohibited from taxing exports","The Senate was based on population","The president had to be from a southern state"],"e":["No such power was granted.","The final plan was a compromise; the New Jersey Plan was a small-state plan, not a southern one.","Southern states depended on exporting tobacco, rice, and indigo.","The Senate gives each state two members.","No such rule exists."],"a":2},"q5-10":{"id":"q5-10","u":5,"t":"D","d":3,"q":"Which of the following foreign policy problems faced the United States under the Articles of Confederation?","o":["France invaded the Northwest Territory","Mexico seized Texas from the United States","Britain demanded the return of the thirteen colonies by treaty","Spain closed the lower Mississippi River and New Orleans to American trade","Russia blockaded American ports"],"e":["France was an ally and made no such invasion.","Texas was Spanish territory, and Mexico was not yet independent.","Britain had recognized independence in 1783, though it kept frontier forts.","Western farmers depended on the river to ship crops; Congress could do little.","Russia posed no such threat."],"a":3},"b5-5":{"id":"b5-5","u":5,"t":"C","d":1,"q":"The Federalist Papers were written to","o":["justify the Declaration of Independence","oppose the Constitution's lack of a bill of rights","persuade New Yorkers and others to ratify the Constitution","propose the Articles of Confederation","criticize the Federalist Party of the 1790s"],"e":["The Declaration was written in 1776.","That was the Anti-Federalist argument.","Hamilton, Madison, and Jay published 85 essays.","The essays argued for replacing the Articles.","The essays predate the party."],"a":2},"b5-3":{"id":"b5-3","u":5,"t":"E","d":1,"q":"The Land Ordinance of 1785 provided for","o":["the creation of a national bank to sell land","the immediate admission of Ohio as a state","surveying western lands into townships and reserving land to support public schools","the purchase of Louisiana from France","free land for all Revolutionary War veterans in Kentucky"],"e":["There was no national bank under the Articles.","Ohio became a state in 1803.","Each 36-section township set aside one section for schools.","That occurred in 1803.","The ordinance governed the Northwest Territory."],"a":2},"b5-2":{"id":"b5-2","u":5,"t":"P","d":1,"q":"Who is often called the \"Father of the Constitution\"?","o":["Patrick Henry","James Madison","Thomas Jefferson","George Washington","John Adams"],"e":["Henry opposed the Constitution as an Anti-Federalist.","Madison drafted the Virginia Plan and kept detailed notes of the Convention.","Jefferson was in France as US minister during the Convention.","Washington presided over the Convention but did not draft its plan.","Adams was in Britain as US minister in 1787."],"a":1},"b5-6":{"id":"b5-6","u":5,"t":"D","d":1,"q":"Which of the following was a foreign policy problem under the Articles of Confederation?","o":["Mexico claimed the Ohio River Valley","Russia controlled the Mississippi River","Britain refused to evacuate its forts in the Northwest","France threatened to invade New York","Canada joined the United States"],"e":["Mexico did not yet exist as an independent nation.","Spain controlled the lower Mississippi.","Congress lacked the power to force British compliance.","France was an ally.","Canada remained British."],"a":2},"b5-8":{"id":"b5-8","u":5,"t":"S","d":2,"q":"The Constitutional Convention dealt with the international slave trade by","o":["leaving the decision to the president","forbidding Congress from banning it before 1808","giving each state a vote on it every ten years","allowing it to continue permanently","banning it immediately in 1787"],"e":["Congress, not the president, had the power after 1808.","Congress banned the trade as soon as the date arrived.","There was no such provision.","Congress could ban it after 1808.","The Constitution delayed any ban for twenty years."],"a":1},"b5-9":{"id":"b5-9","u":5,"t":"E","d":2,"q":"The national government's inability to regulate commerce under the Articles led to","o":["trade disputes among states that imposed tariffs on one another's goods","the creation of a national bank in 1785","the immediate end of the Revolutionary War debt","the adoption of free trade with Britain","a surplus in the national treasury"],"e":["The Annapolis Convention was called to address trade problems.","The first national bank was chartered in 1791.","The debt remained unpaid.","Britain restricted American trade with its West Indies.","Congress was chronically short of money."],"a":0},"b5-13":{"id":"b5-13","u":5,"t":"S","d":3,"q":"Historians often see Shays' Rebellion as a turning point because it","o":["encouraged Anti-Federalists to support a stronger central government","proved that the Articles could successfully put down rebellions","led directly to the abolition of debt imprisonment nationwide","caused Britain to declare war on the United States again","convinced influential leaders that the government needed to be strengthened to protect order and property"],"e":["Anti-Federalists remained wary of central power.","The national government could not respond; a state militia did.","That was not an outcome.","Britain did not intervene.","It added urgency to calls for the Philadelphia Convention."],"a":4},"b5-1":{"id":"b5-1","u":5,"t":"P","d":1,"q":"Under the Articles of Confederation, each state had","o":["two senators and a number of representatives based on population","representation in Congress based on population","no representation in the national government","one vote in Congress regardless of its population","a veto over decisions of the president"],"e":["That is the system created by the Constitution.","That was the Virginia Plan's proposal.","Each state sent a delegation to Congress.","Small and large states had equal power.","There was no president under the Articles."],"a":3},"b5-4":{"id":"b5-4","u":5,"t":"S","d":1,"q":"The farmers who took part in Shays' Rebellion were protesting","o":["the federal whiskey tax","the abolition of slavery in Massachusetts","the ratification of the Bill of Rights","the British closing of Boston Harbor","high taxes, debts, and the foreclosure of their farms"],"e":["That caused the Whiskey Rebellion of 1794.","Shays' Rebellion concerned debt and taxes.","The rebellion occurred before the Constitution existed.","That was a Coercive Act of 1774.","They closed courts to stop foreclosures in western Massachusetts."],"a":4},"b5-7":{"id":"b5-7","u":5,"t":"P","d":2,"q":"Which of the following best describes the principle of federalism in the Constitution?","o":["Each branch can limit the power of the others","The Supreme Court can strike down laws","Power is divided between the national government and the state governments","Power is divided among the legislative, executive, and judicial branches","Power comes from the people"],"e":["That is checks and balances.","That is judicial review, established in 1803.","The supremacy clause makes federal law supreme when they conflict.","That is separation of powers.","That is popular sovereignty."],"a":2},"b5-11":{"id":"b5-11","u":5,"t":"D","d":2,"q":"Spain's closing of the lower Mississippi River to American trade in the 1780s especially angered","o":["Native nations in New England","western farmers who shipped crops downriver to New Orleans","Virginia tobacco planters who exported through Norfolk","British merchants in Canada","New England fishermen"],"e":["The issue concerned western American settlers.","The issue was resolved by Pinckney's Treaty (1795).","They used Atlantic ports.","The Mississippi closure affected Americans.","Their concern was Atlantic fishing rights."],"a":1},"b5-10":{"id":"b5-10","u":5,"t":"C","d":2,"q":"Anti-Federalists argued that the proposed Constitution","o":["would restore the monarchy of George III","would weaken the presidency too much","should be adopted without any amendments","created a government that was too weak to tax","gave too much power to the national government and lacked protections for individual liberties"],"e":["They feared tyranny but not a literal return of George III.","They feared the president could become a king.","Anti-Federalists demanded a bill of rights.","The Constitution gave Congress the power to tax; that criticism applied to the Articles.","Patrick Henry and George Mason led the opposition."],"a":4},"b5-12":{"id":"b5-12","u":5,"t":"P","d":3,"q":"Which of the following was a weakness of the Articles of Confederation that the Constitution corrected?","o":["The lack of an executive branch to enforce national laws","A national legislature with too many houses","The absence of state governments","Excessively high national taxes","A Supreme Court that overruled state courts too often"],"e":["The Constitution created the presidency.","The Articles had a one-house Congress; the Constitution created two houses.","States existed under both systems.","Congress could not tax at all under the Articles.","There was no national court under the Articles."],"a":0},"q6-1":{"id":"q6-1","u":6,"t":"P","d":1,"q":"The Supreme Court's decision in Marbury v. Madison (1803) established the principle of","o":["separate electoral votes for president and vice president","nullification","implied powers for the national bank","judicial review","federal control of interstate commerce"],"e":["That was the 12th Amendment.","Nullification was a states' rights theory from the Virginia and Kentucky Resolutions, not a Court ruling.","That was affirmed in McCulloch v. Maryland (1819).","The Court claimed the power to declare acts of Congress unconstitutional.","That was Gibbons v. Ogden (1824)."],"a":3},"q6-2":{"id":"q6-2","u":6,"t":"P","d":2,"q":"Hamilton's argument that Congress could charter a national bank rested on","o":["a loose interpretation of the Constitution's \"necessary and proper\" clause","the Articles of Confederation's banking provisions","a Supreme Court ruling in Marbury v. Madison","the Virginia and Kentucky Resolutions","the Tenth Amendment's reservation of powers to the states"],"e":["Hamilton argued Congress had implied powers to carry out its listed powers.","The Articles had no such provisions and had been replaced.","Marbury came twelve years after the Bank was chartered.","Those came in 1798 and opposed federal overreach.","Jefferson, not Hamilton, relied on the Tenth Amendment to oppose the Bank."],"a":0},"q6-3":{"id":"q6-3","u":6,"t":"P","d":2,"q":"Which of the following positions was most closely associated with the Democratic-Republicans of the 1790s?","o":["Political strength centered in New England merchant communities","Support for the Alien and Sedition Acts","Strict construction of the Constitution and support for an agrarian economy","A pro-British foreign policy","Support for a national bank and protective tariffs"],"e":["That was the Federalist base.","Federalists passed the Acts; Democratic-Republicans opposed them.","Jefferson and Madison favored limited government and independent farmers.","Federalists favored Britain; Democratic-Republicans sympathized with France.","Those were Hamilton's Federalist policies."],"a":2},"q6-4":{"id":"q6-4","u":6,"t":"S","d":2,"q":"The government's response to the Whiskey Rebellion (1794) demonstrated that","o":["farmers could nullify federal taxes they considered unjust","western farmers strongly supported the Federalist Party","the Bill of Rights protected the right of armed rebellion","the new federal government could enforce its laws, unlike the government under the Articles","Hamilton opposed taxing whiskey"],"e":["The rebellion collapsed; the tax stayed until Jefferson repealed it.","The rebellion reflected western hostility to Federalist policies.","The Bill of Rights contains no such protection.","Washington led militia to suppress the uprising quickly.","Hamilton designed the excise tax."],"a":3},"q6-5":{"id":"q6-5","u":6,"t":"D","d":2,"q":"Jay's Treaty (1794) was unpopular with many Americans primarily because it","o":["declared war on France","failed to stop British impressment and seizure of American ships","gave Spain control of the Mississippi River","transferred Canada to the United States","forced the United States to return the Louisiana Territory"],"e":["The treaty was with Britain and declared no war.","Britain agreed to leave its northwestern forts but gave little else.","Pinckney's Treaty with Spain actually opened the Mississippi to Americans.","Britain kept Canada; the treaty's concession was evacuating forts on US soil.","The US did not acquire Louisiana until 1803."],"a":1},"q6-6":{"id":"q6-6","u":6,"t":"C","d":2,"q":"In his Farewell Address, George Washington warned Americans against","o":["ratifying the Bill of Rights","establishing a national bank","permanent alliances with foreign nations and the dangers of political parties","trade with Britain","purchasing western land from France"],"e":["The Bill of Rights was ratified in 1791 with Washington's support.","Washington had signed the Bank bill.","This advice guided US foreign policy for more than a century.","Washington favored commerce and signed Jay's Treaty with Britain.","Louisiana was purchased in 1803, years later."],"a":2},"q6-7":{"id":"q6-7","u":6,"t":"P","d":2,"q":"The Virginia and Kentucky Resolutions (1798) argued that","o":["the national government should assume state debts","states had the right to judge whether federal laws were constitutional","the Supreme Court alone could interpret the Constitution","immigrants should wait fourteen years to become citizens","the United States should declare war on France"],"e":["That was Hamilton's assumption plan.","Jefferson and Madison responded to the Alien and Sedition Acts with this compact theory.","That is closer to Marshall's view in Marbury.","That was the Alien (Naturalization) Act they opposed.","They were written by pro-French Republicans opposing Federalist war measures."],"a":1},"q6-8":{"id":"q6-8","u":6,"t":"P","d":2,"q":"Jefferson called the election of 1800 a \"revolution\" because","o":["it abolished the Electoral College","power passed peacefully from one political party to its opponents","it was decided by a military coup","Jefferson won every state in the Union","it was the first election in which women could vote"],"e":["The 12th Amendment modified, but did not abolish, the Electoral College.","Federalists handed power to Democratic-Republicans without violence.","There was no coup.","The election was close and ended in an Electoral College tie decided by the House.","Women could not vote in national elections."],"a":1},"q6-9":{"id":"q6-9","u":6,"t":"D","d":2,"q":"Napoleon agreed to sell the Louisiana Territory to the United States in 1803 largely because","o":["the United States had defeated France in the Quasi-War","Lewis and Clark had already claimed the territory","France's defeat in Haiti and the need for money for war in Europe made the territory less valuable to him","the Treaty of Ghent required France to give up American lands","Spain refused to let France govern it"],"e":["The Quasi-War ended in negotiations, not a decisive defeat.","Their expedition began after the purchase.","The Haitian Revolution destroyed his plans for an American empire.","The Treaty of Ghent ended the War of 1812 with Britain.","Spain had already transferred Louisiana back to France."],"a":2},"q6-10":{"id":"q6-10","u":6,"t":"C","d":3,"q":"The Louisiana Purchase posed a dilemma for Thomas Jefferson because","o":["the Constitution did not explicitly authorize the federal government to acquire territory","the purchase was opposed by the War Hawks","the Supreme Court had ruled such purchases illegal","it required the United States to go to war with Britain","he opposed westward expansion"],"e":["As a strict constructionist, he had to stretch his principles, relying on the treaty power.","The War Hawks emerged later and favored expan 12."],"a":3},"q6-14":{"id":"q6-14","u":6,"t":"S","d":3,"q":"Eli Whitney's cotton gin (1793) had which of the following unintended consequences?","o":["It led Congress to ban slavery in the Louisiana Territory","It ended the need for enslaved labor in the South","It caused the North to adopt plantation agriculture","It shifted the South toward manufacturing textiles","It made cotton profitable across the Deep South and strengthened slavery"],"e":["Slavery expanded into the Louisiana Territory.","It increased demand for enslaved people to plant and pick more cotton.","Northern economies moved toward commerce and manufacturing.","Most textile manufacturing developed in the North and Britain.","Demand for enslaved labor rose as cotton spread westward."],"a":4},"b6-5":{"id":"b6-5","u":6,"t":"D","d":1,"q":"Washington's Proclamation of Neutrality (1793) declared that the United States would","o":["remain neutral in the war between France and Britain","stop all foreign trade","join Britain against revolutionary France","join France in its war against Britain","annex Canada"],"e":["Washington believed the young nation could not risk war.","That was Jefferson's Embargo Act of 1807.","The US stayed neutral.","Washington refused despite the 1778 alliance.","The proclamation concerned neutrality in Europe's war."],"a":0},"b6-8":{"id":"b6-8","u":6,"t":"C","d":1,"q":"Lewis and Clark's expedition (1804–1806) was sent to","o":["explore the Louisiana Purchase and the route to the Pacific","survey the Northwest Territory into townships","negotiate the purchase of Florida","fight the Barbary pirates","remove the Cherokee to Oklahoma"],"e":["Sacagawea helped guide part of the journey.","That was done under the Land Ordinance of 1785.","Florida was acquired in 1819.","That was a naval war in the Mediterranean.","Indian Removal came in the 1830s."],"a":0},"b6-10":{"id":"b6-10","u":6,"t":"S","d":1,"q":"The idea of \"Republican Motherhood\" in the early republic held that women","o":["serve ion.","Jackson was a Democrat.","The Know-Nothings opposed Irish Catholic political influence.","Labor reform was not its defining goal."],"a":1},"q9-12":{"id":"q9-12","u":9,"t":"P","d":3,"q":"The congressional \"gag rule\" (1836–1844) was designed to","o":["prevent antislavery petitions from being discussed in the House of Representatives","block discussion of protective tariffs","prevent southern states from discussing secession","stop newspapers from criticizing the president","limit debate on the Indian Removal Act"],"e":["John Quincy Adams fought it as a violation of the right to petition.","It concerned slavery, not tariffs.","It was supported by southerners.","That resembles the Sedition Act of 1798.","It applied to antislavery petitions."],"a":0},"q9-13":{"id":"q9-13","u":9,"t":"C","d":3,"q":"Read the excerpt below. This passage, from the Declaration of Sentiments (1848), reflects which strategy of early women's rights advocates?<blockquote>\"We hold these truths to be self-evident: that all men and women are created equal...\"<\/blockquote>","o":["Seeking a constitutional amendment banning alcohol","Arguing that women's place was in the separate domestic sphere","Appealing to the Supreme Court's ruling in Dred Scott","Using the language of the nation's founding ideals to demand equal rights","Rejecting the Declaration of Independence as a proslavery document"],"e":["Temperance was a separate reform.","The passage challenges, rather than supports, that ideal.","Dred Scott was decided in 1857, nine years later.","The document deliberately echoed the Declaration of Independence.","The passage adopts, rather than rejects, its language."],"a":3},"b9-5":{"id":"b9-5","u":9,"t":"C","d":1,"q":"The Hudson River School refers to","o":["the first public high school in New York","a transcendentalist utopian community","a college founded during the Second Great Awakening","a group of painters who celebrated American landscapes","a group of New York abolitionists"],"e":[" .","The compromise concerned territories, not yeoman land."],"a":2},"b9-25":{"id":"b9-25","u":9,"t":"D","d":2,"q":"Most European immigrants of the 1840s and 1850s avoided the South because","o":["Britain prohibited travel to the American South","southern states banned all immigration","the Monroe Doctrine restricted immigration to the South","the South had already industrialized and needed no workers","the South had few factory jobs and its economy depended on enslaved labor"],"e":["There was no such prohibition.","There was no such ban.","The Doctrine concerned European colonization.","The South industrialized little.","Immigrants settled in northern cities and the Midwest."],"a":4},"b9-23":{"id":"b9-23","u":9,"t":"S","d":3,"q":"Read the table below (approximate figures). Which of the following best explains the growth shown in the table?<table><tr><th>Year<\/th><th>Enslaved population of the United States<\/th><\/tr><tr><td>1820<\/td><td>1.5 million<\/td><\/tr><tr><td>1840<\/td><td>2.5 million<\/td><\/tr><tr><td>1860<\/td><td>4.0 million<\/td><\/tr><\/table>","o":["The enslavement of European immigrants","Northern states reintroducing slavery","Natural increase of the enslaved population as cotton production expanded","The repeal of the Northwest Ordinance","Large-scale importation of enslaved Africans after 1820"],"e":["Slavery in the US was based on race.","Northern states had abolished slavery.","The international slave trade had been banned since 1808.","That would not explain national growth, and it was not repealed.","The international trade was illegal after 1808."],"a":2},"b9-27":{"id":"b9-27","u":9,"t":"P","d":3,"q":"The rise of the Know-Nothing Party in the 1850s contributed to the breakdown of the second party system because it","o":["drew voters away from the weakened Whigs at the same moment slavery was dividing them","united northern and southern Democrats","was the party that elected Andrew Jackson","won every presidential election in the 1850s","demanded the immediate abolition of slavery"],"e":["The Whigs collapsed in the mid-1850s.","The Know-Nothings competed with Democrats.","Jackson was elected in 1828 as a Democrat.","Its candidate Fillmore lost in 1856.","Nativism, not abolition, was its main issue."],"a":0},"b9-3":{"id":"b9-3","u":9,"t":"C","d":1,"q":"Which of the following works was written by Herman Melville?","o":["Walden","Uncle Tom's Cabin","Moby-Dick","The Scarlet Letter","Leaves of Grass"],"e":["That was Henry David Thoreau.","That was Harriet Beecher Stowe.","Melville's novel is a classic of the American Renaissance.","That was Nathaniel Hawthorne.","That was Walt Whitman."],"a":2},"b9-7":{"id":"b9-7","u":9,"t":"E","d":1,"q":"By 1860, cotton","o":["had been replaced by tobacco as the South's leading crop","was grown mainly in New England","was no longer exported to Britain","accounted for more than half of all US exports","was grown without enslaved labor"],"e":["Cotton dominated.","Cotton was grown in the South.","Britain was the main buyer.","Southerners boasted that \"Cotton is King.\"","Enslaved labor produced most cotton."],"a":3},"b9-19":{"id":"b9-19","u":9,"t":"P","d":2,"q":"Former president John Quincy Adams, as a congressman, is remembered for","o":["leading the Mormon migration to Utah","founding the Know-Nothing Party","defending slavery as a positive good","writing the Declaration of Sentiments","fighting the gag rule that blocked antislavery petitions in the House"],"e":["That was Brigham Young.","The party was nativist.","That was Calhoun's position.","That was written at Seneca Falls in 1848.","He argued it violated the right of petition."],"a":4},"b9-26":{"id":"b9-26","u":9,"t":"D","d":2,"q":"The potato famine of the 1840s affected US history mainly by","o":["creating a shortage of labor in northern cities","ending immigration from Ireland","leading to war between the US and Britain","causing a famine in the United States","driving large numbers of poor Irish Catholic immigrant y was morally wrong","whether enslaved people should be freed","whether to publish newspapers"],"e":["Douglass came to see the Constitution as an antislavery tool.","Both supported women's participation.","Both believed slavery was a terrible wrong.","Both favored emancipation.","Both published antislavery newspapers."],"a":0},"b9-22":{"id":"b9-22","u":9,"t":"C","d":3,"q":"Romanticism and transcendentalism differed from the Enlightenment in emphasizing","o":["the economic theory of mercantilism","scientific experiments and reason","loyalty to established churches","emotion, intuition, nature, and the individual spirit over pure reason","obedience to government authority"],"e":["These were literary and philosophical movements.","That describes the Enlightenment.","Transcendentalists valued individual spiritual insight over institutions.","They reacted against Enlightenment rationalism.","Thoreau urged resistance to unjust laws."],"a":3},"q10-1":{"id":"q10-1","u":10,"t":"C","d":1,"q":"The term \"manifest destiny\" refers to the belief that","o":["the United States was destined to expand across the North American continent","slavery would eventually die out on its own","the Union could never be dissolved by secession","Native Americans should be granted citizenship","European powers should not colonize the Americas"],"e":["John O'Sullivan coined the phrase in 1845.","That was a hope of some founders, not the meaning of manifest destiny.","That was a Unionist argument, not manifest destiny.","Manifest destiny generally ignored or dismissed Native claims.","That was the Monroe Doctrine."],"a":0},"q10-2":{"id":"q10-2","u":10,"t":"P","d":2,"q":"The Wilmot Proviso (1846) proposed to","o":["allow settlers to decide on slavery by popular vote","ban slavery in all territory acquired from Mexico","extend the Missouri Compromise line to the Pacific","annex Texas as a slave state","end the Mexican–American War immediately"],"e":["That was popular sovereignty.","It passed the Hous  slavery issue for the rest of the decade"],"e":["Kansas entered the Union as a free state in 1861.","Outrage over it led to Bleeding Kansas and the founding of the Republican Party.","It opened territories to slavery by popular vote.","The Republican Party formed to oppose it.","It reignited conflict."],"a":1},"q10-6":{"id":"q10-6","u":10,"t":"P","d":2,"q":"In Dred Scott v. Sandford (1857), the Supreme Court ruled that","o":["free Black Americans were citizens entitled to sue in federal court","popular sovereignty was required in all territories","Congress could not prohibit slavery in the territories","the Fugitive Slave Act was unconstitutional","Dred Scott was free because he had lived in free territory"],"e":["Taney ruled Black Americans were not citizens.","The ruling undermined popular sovereignty as well.","Taney held enslaved people were property protected by the Fifth Amendment.","The ruling did not address the Fugitive Slave Act.","The Court ruled he remained enslaved and could not sue."],"a":2},"q10-7":{"id":"q10-7","u":10,"t":"C","d":2,"q":"Harriet Beecher Stowe's Uncle Tom's Cabin (1852) is significant because it","o":["convinced Congress to pass the Wilmot Proviso","intensified northern opposition to slavery by portraying its human cruelty","led to the passage of the Fugitive Slave Act","was the first published slave narrative","defended slavery as a positive good"],"e":["The Proviso never passed and predates the novel.","The novel's depiction of families torn apart moved millions of readers.","The novel responded to the Act, which came first.","Slave narratives, like Douglass's, preceded it; Stowe's work was a novel.","Southern writers responded with proslavery novels; Stowe opposed slavery."],"a":1},"q10-8":{"id":"q10-8","u":10,"t":"D","d":2,"q":"The Treaty of Guadalupe Hidalgo (1848)","o":["ended the Mexican–American War and gave the US California and the Southwest","purchased southern Arizona for a railroad route","annexed Texas to the United States","recognized the Confederate States of America","divided the Oregon Country at the 49th parallel"],"e":["It also set the Rio Grande as the Texas border.","That was the Gadsden Purchase (1853).","Texas was annexed in 1845.","No nation formally recognized the Confederacy.","That was the Oregon Treaty (1846) with Britain."],"a":0},"q10-9":{"id":"q10-9","u":10,"t":"P","d":2,"q":"The Republican Party, founded in 1854, primarily sought to","o":["prevent the expansion of slavery into the western territories","restrict immigration by Irish Catholics","abolish slavery immediately in all states","support popular sovereignty in Kansas","extend the Missouri Compromise line to the Pacific"],"e":["Most Republicans did not propose abolishing slavery where it already existed.","That was the Know-Nothings' goal.","That was the position of radical abolitionists, not the party's platform.","The party formed in opposition to the Kansas–Nebraska Act.","Republicans opposed slavery's extension."],"a":0},"q10-10":{"id":"q10-10","u":10,"t":"P","d":1,"q":"Abraham Lincoln won the presidential election of 1860 largely because","o":["the Supreme Court decided the election","the Whig Party nominated him","he won a majority of southern electoral votes","the Democratic Party split between northern and southern candidates","he promised to abolish slavery in the southern states"],"e":["The Electoral College decided it.","The Whig Party no longer existed; he was a Republican.","He received no southern electoral votes.","Lincoln carried the North with about 40% of the national popular vote.","He pledged not to interfere with slavery where it existed."],"a":3},"q10-11":{"id":"q10-11","u":10,"t":"P","d":3,"q":"In the Freeport Doctrine (1858), Stephen Douglas argued that","o":["the Union was a compact from which states could secede","Congress must ban slavery in all territories","settlers could keep slavery out of a territory by refusing to pass laws protecting it","the Dred Scott decision should be i n on new colonies","a treaty ending the Mexican–American War","a plan to open trade with Japan","southern-backed interest in acquiring Cuba as potential slave territory","an effort to purchase Alaska from Russia"],"e":["The Manifesto concerned US acquisition of Cuba.","That was the Treaty of Guadalupe Hidalgo.","Commodore Perry's mission to Japan was separate.","The proposal, exposed publicly, angered northerners.","Alaska was purchased in 1867."],"a":3},"b10-22":{"id":"b10-22","u":10,"t":"S","d":3,"q":"Free-soil supporters in the 1840s opposed the spread of slavery into the territories largely because they","o":["wanted western land preserved for free white farmers and workers","wanted to expand slavery into Mexico instead","believed in immediate racial equality for all Black Americans","supported the Fugitive Slave Act","believed slavery was a positive good"],"e":["Many free-soilers did not support racial equality.","They opposed slavery's expansion.","Many free-soilers held racist views.","Free-soilers generally opposed it.","That was the proslavery argument."],"a":0},"b10-28":{"id":"b10-28","u":10,"t":"D","d":3,"q":"Commodore Matthew Perry's expedition to Japan (1853–1854) reflected","o":["the US purchase of Hawaii","a US effort to colonize Japan","the Monroe Doctrine's application to Asia","an alliance with Britain against Russia","American interest in Pacific trade that accompanied continental expansion"],"e":["Hawaii was annexed in 1898.","The goal was opening trade, not colonization.","The Doctrine concerned the Western Hemisphere.","The expedition was a US initiative.","Manifest destiny included hopes for Asian markets via Pacific ports."],"a":4},"b10-4":{"id":"b10-4","u":10,"t":"P","d":1,"q":"Which president led the United States during the Mexican–American War?","o":["James K. Polk","John Tyler","Abraham Lincoln","Zachary Taylor","Andrew Jackson"],"e":["Polk pursued expansion to Texas, Oregon, and California.","Tyler annexed Texas but left office in March ief in \"King Cotton\"","The construction of more railroads in the South than in the North","The collapse of cotton prices in 1857","The end of British demand for cotton"],"e":["The South remained mostly agricultural.","Southerners concluded their cotton gave them power.","The North had far more railroads.","Cotton prices held up relatively well.","British demand remained strong."],"a":1},"b10-14":{"id":"b10-14","u":10,"t":"P","d":2,"q":"Stephen Douglas proposed the Kansas–Nebraska Act partly because he wanted","o":["to end the Mexican–American War","to organize the territory for a northern transcontinental railroad route","to ban slavery north of 36°30′ permanently","to annex Canada","to help Lincoln win the presidency"],"e":["The war ended in 1848.","Southern votes required opening the land to possible slavery.","The Act repealed that ban.","The Act concerned Kansas and Nebraska.","Douglas was Lincoln's rival."],"a":1},"b10-13":{"id":"b10-13","u":10,"t":"S","d":2,"q":"Northern states passed \"personal liberty laws\" in the 1850s to","o":["allow women to own property","ban alcohol","restrict immigration from Ireland","protect the right to bear arms in Kansas","obstruct enforcement of the Fugitive Slave Act"],"e":["Those were married women's property laws.","Those were temperance laws.","Those were nativist proposals.","The laws concerned fugitive slaves.","They protected accused fugitives and free Black residents."],"a":4},"b10-30":{"id":"b10-30","u":10,"t":"E","d":2,"q":"Why did many northern workers and farmers oppose the expansion of slavery into the West?","o":["They believed enslaved people would buy northern goods","They expected slavery to raise wages for white workers","They feared competition from enslaved labor and wanted western land for free farmers","They wanted the West to grow cotton for northern mills","They planned to buy enslaved workers themselves"],"e":["That was not their concern.","They feared it would lower wages.","This free-labor concern dr ntil 1861","They waited until Lincoln called for troops, which forced them to choose between fighting the Deep South or joining it"],"e":["Republicans had little strength in the South.","The Confederacy welcomed them.","They were not occupied.","All four were slave states.","Lincoln's call for 75,000 volunteers pushed them out."],"a":4},"q11-1":{"id":"q11-1","u":11,"t":"P","d":1,"q":"The Emancipation Proclamation (1863) declared freedom for enslaved people","o":["only in Washington, D.C.","in every state, including the border states","in areas still in rebellion against the United States","who had served in the Confederate army","only in the western territories"],"e":["Congress abolished slavery in D.C. by law in 1862.","The border states were exempt; the 13th Amendment ended slavery everywhere.","It exempted the loyal border states and Union-occupied areas.","It applied to enslaved people in rebel areas regardless of service.","Congress banned slavery in the territories in 1862 by separate law."],"a":2},"q11-2":{"id":"q11-2","u":11,"t":"D","d":2,"q":"The Battle of Antietam (1862) was significant because it","o":["was the first battle of the war","gave Lincoln the opportunity to issue the preliminary Emancipation Proclamation","ended the Civil War","led Britain to recognize the Confederacy","gave the Union control of the Mississippi River"],"e":["The first major battle was First Bull Run (1861).","The halt of Lee's invasion was a strategic Union success.","The war continued until 1865.","It made British recognition less likely.","That resulted from Vicksburg (1863)."],"a":1},"q11-3":{"id":"q11-3","u":11,"t":"D","d":1,"q":"The fall of Vicksburg in July 1863 was important to the Union because it","o":["forced Lee to surrender his army","brought Britain into the war on the Union side","gave the Union control of the Mississippi River and split the Confederacy","ended the Union blockade of southern ports","led to the immediate capture of Richmond"],"e":["Lee surrendered at Appomattox in 1865.","Britain remained neutral.","It fulfilled a key goal of the Anaconda Plan.","The blockade continued.","Richmond fell in April 1865."],"a":2},"q11-4":{"id":"q11-4","u":11,"t":"E","d":2,"q":"Which of the following laws was passed by the Union Congress during the Civil War?","o":["The Indian Removal Act","The Specie Circular","The Tariff of Abominations","The Kansas–Nebraska Act","The Homestead Act, offering 160 acres of public land to settlers"],"e":["That passed in 1830.","That was Jackson's 1836 executive order.","That passed in 1828.","That passed in 1854.","Republicans passed it in 1862 after southern opponents left Congress."],"a":4},"q11-5":{"id":"q11-5","u":11,"t":"D","d":2,"q":"The Confederacy's strategy of \"King Cotton diplomacy\" failed primarily because","o":["the Confederacy refused to export any cotton at all during the war","France and Britain had already abolished cotton imports","Britain declared war on the Confederacy in 1862","Britain had stored surplus cotton and found other suppliers, and it relied on northern grain","the Monroe Doctrine prevented Britain from trading with the South"],"e":["Although planters held cotton back early in the war, the failure came from Britain's surplus and alternatives.","They continued to import cotton from other sources.","Britain stayed neutral throughout.","Emancipation also made supporting the Confederacy politically unacceptable in Britain.","The Monroe Doctrine concerned colonization, not trade."],"a":3},"q11-6":{"id":"q11-6","u":11,"t":"S","d":2,"q":"The New York City draft riots of 1863 reflected","o":["women's demands for the right to serve in the army","resentment among working-class immigrants toward the draft and fear of competition from freed Black workers","protests by Copperheads demanding a stronger war effort","southern Confederates' attempt to capture New York","widespread support for the Emancipation Proclamation in New York"],"e":["The riots concerned the draft and racial tensions.","Rioters targeted African Americans and symbols of the draft.","Copperheads opposed the war.","The riots were by northern residents.","Rioters opposed the war's antislavery turn."],"a":1},"q11-7":{"id":"q11-7","u":11,"t":"P","d":2,"q":"Which of the following best describes the purpose of the Anaconda Plan?","o":["Invading the North to win foreign recognition","Destroying civilian property in Georgia","Negotiating peace with the Confederacy in 1861","Blockading southern ports and controlling the Mississippi River to squeeze the Confederacy","Freeing all enslaved people in the border states"],"e":["That was Lee's strategy at Antietam and Gettysburg.","That describes Sherman's March in 1864.","It was a war plan.","Winfield Scott designed it to weaken the South economically.","The Anaconda Plan was a military strategy."],"a":3},"q11-8":{"id":"q11-8","u":11,"t":"S","d":2,"q":"African American soldiers in the Union army","o":["were barred from combat throughout the war","served in segregated units and at first received lower pay than white soldiers","made up a majority of Union troops by 1865","were commanded mostly by Black officers","were enlisted only after the war ended"],"e":["Black regiments, like the 54th Massachusetts, fought in major battles.","Congress equalized pay in 1864.","They made up about 10% of the army.","Most officers were white.","Black enlistment began in earnest in 1863."],"a":1},"q11-9":{"id":"q11-9","u":11,"t":"C","d":2,"q":"In the Gettysburg Address, Lincoln described the purpose of the war as","o":["punishing the South for secession","securing British recognition of the United States","ensuring \"a new birth of freedom\" and preserving government \"of the people, by the people, for the people\"","defending states' rights against federal power","restoring the Union exactly as it was before 1861"],"e":["The speech did not call for punishment.","It made no reference to foreign policy.","He linked the Union cause to equality and democratic government.","It emphasized the nation, not states' rights.","The address looked forward to a \"new birth of freedom.\""],"a":2},"q11-10":{"id":"q11-10","u":11,"t":"P","d":2,"q":"Copperheads during the Civil War were","o":["northern Democrats who opposed the war and favored a negotiated peace","Radical Republicans who demanded immediate emancipation","Confederate spies in Washington","Union soldiers from the border states","southern Unionists who joined the Union army"],"e":["Clement Vallandigham was the best-known Copperhead.","Radicals strongly supported the war.","The term referred to northern Peace Democrats.","The term was a political label.","They were not called Copperheads."],"a":0},"q11-11":{"id":"q11-11","u":11,"t":"E","d":3,"q":"Which of the following was a major economic problem for the Confederacy during the war?","o":["Severe inflation caused by printing large amounts of paper money","Too much industrial capacity and not enough farmland","Excessive income tax revenue","The Homestead Act drew southern farmers west","A surplus of imported European goods"],"e":["Prices rose roughly 9,000% by war's end.","The South had little industry.","The Confederacy struggled to raise taxes.","The Homestead Act was a Union law that applied to Union-controlled public lands.","The blockade made imports scarce."],"a":0},"q11-12":{"id":"q11-12","u":11,"t":"P","d":3,"q":"The 13th Amendment was considered necessary even after the Emancipation Proclamation because","o":["Congress needed to grant citizenship to freed people","the Proclamation freed enslaved people only in the North","the Supreme Court had declared the Proclamation unconstitutional","the Proclamation was a war measure that did not apply to the border states and might not survive peace","the Confederacy refused to sign the Proclamation"],"e":["Citizenship came with the 14th Amendment (1868).","It applied to areas in rebellion, mostly in the South.","The Court never ruled against it.","The amendment permanently <script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(c,t)=>t?Math.round(100*c/t):0;
const U=DATA.units, Q=DATA.Q, TH=DATA.themes;
const KEY='clep-ush1-v1';
const LETTERS='ABCDE';
const dayNum=d=>Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);
const TODAY=()=>dayNum(new Date());
const fmtDay=n=>new Date(n*864e5+new Date(n*864e5).getTimezoneOffset()*6e4).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
let storageOK=true;

/* ---------- state ---------- */
function defState(){return {v:1,theme:null,read:{},quiz:{},diag:null,cards:{},mis:{},misCleared:0,exams:{},run:null,plan:null}}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&typeof o==='object') return Object.assign(defState(),o);}}
  catch(e){storageOK=false}
  return defState();
}
let S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S)); storageOK=true}
  catch(e){storageOK=false}
}

/* ---------- theme ---------- */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute('data-theme',S.theme); else document.documentElement.removeAttribute('data-theme'); }
function toggleTheme(){
  const cur=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  S.theme=cur==='dark'?'light':'dark'; save(); applyTheme();
}
applyTheme();

/* ---------- derived progress ---------- */
const unitCards=u=>U[u-1].cards;
const allCards=()=>U.flatMap(u=>u.cards);
function cardStats(cards){
  let n=0,learned=0,mastered=0;
  for(const c of cards){const s=S.cards[c.id]; if(s){n++; if(s.b>=3)learned++; if(s.b>=4)mastered++;}}
  return {seen:n,learned,mastered,total:cards.length};
}
function unitDone(u){return !!S.read[u] && !!S.quiz[u]}
function unitHours(u){return DATA.meta.hours.unitsTotal*U[u-1].weight/100}
function unitProgress(u){
  const cs=cardStats(unitCards(u));
  return (S.read[u]?0.45:0)+(S.quiz[u]?0.3:0)+0.25*(cs.total?cs.learned/cs.total:0);
}
function hoursLeft(){
  const H=DATA.meta.hours; let h=0;
  if(!S.diag) h+=H.diag;
  for(const u of U) h+=unitHours(u.n)*(1-unitProgress(u.n))*diagFactor(u.n);
  for(const k of [1,2]) if(!S.exams[k]) h+=H.exam;
  h+=H.final*(Object.keys(S.exams).length>=2?0:1);
  return Math.max(0,h);
}
function diagLabel(u){
  if(!S.diag) return null; const r=S.diag.byUnit[u]; if(!r||!r[1]) return null;
  const p=r[0]/r[1]; return p===1?'skim':p>=.5?'study':'must';
}
function diagFactor(u){const l=diagLabel(u); return l==='skim'?.55:l==='must'?1.15:1}
function quizAvg(){const v=Object.values(S.quiz).map(q=>q.best); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function readiness(){
  const done=U.filter(u=>unitDone(u.n)).length/U.length;
  const qa=(quizAvg()||0)/100, e1=S.exams[1]?S.exams[1].score/100:0, e2=S.exams[2]?S.exams[2].score/100:0;
  const score=Math.round(100*(0.3*done+0.2*qa+0.25*e1+0.25*e2));
  const ready=!!(S.exams[1]&&S.exams[2]&&S.exams[1].score>=75&&S.exams[2].score>=75);
  return {score,ready,done,qa,e1,e2};
}

/* ---------- nav ---------- */
function navHTML(route){
  const misN=Object.keys(S.mis).length, due=dueCards(allCards()).length;
  const L=(h,t,b='')=>`<a href="${h}" class="${route===h?'on':''}"><span>${t}</span><span class="badge">${b}</span></a>`;
  let h=L('#home','Dashboard')+L('#diag','Diagnostic test',S.diag?S.diag.score+'%':'start')+'<div class="grp">Units</div>';
  for(const u of U) h+=L('#unit/'+u.n,`${u.n}. ${esc(u.short)}`,unitDone(u.n)?'✓':u.weight+'%');
  h+='<div class="grp">Practice</div>'+L('#cards','Flashcards',due?due+' due':'')+L('#mistakes','Mistake log',misN||'')

/* ---------- question engine ---------- */
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
const isTest=k=>k==='exam'||k==='diag';
function startRun(o){
  RUN={kind:o.kind,key:o.key,ids:o.ids,i:0,ans:{},marked:{},start:Date.now(),end:o.minutes?Date.now()+o.minutes*6e4:null,title:o.title,host:null};
  if(isTest(o.kind)){S.run=Object.assign({},RUN); delete S.run.host; save();}
  RUN.host=o.host||$('#view'); renderRun();
}
function resumeRun(host){RUN=Object.assign({},S.run,{host}); renderRun();}
function persistRun(){ if(RUN&&isTest(RUN.kind)){const c=Object.assign({},RUN); delete c.host; S.run=c; save();} }
function qHTML(q){return `<div class="qtext">${q.q}</div>`}
function renderRun(){
  const R=RUN, host=R.host, id=R.ids[R.i], q=Q[id], test=isTest(R.kind), ans=R.ans[id], answered=ans!=null;
  if(R.end&&Date.now()>=R.end) return finishRun(true);
  let opts='';
  q.o.forEach((o,k)=>{
    let cls='opt';
    if(test){ if(ans===k) cls+=' sel'; }
    else if(answered){ if(k===q.a) cls+=' right'; else if(k===ans) cls+=' wrong'; }
    const why=(!test&&answered)?`<div class="why"><b>${k===q.a?'Why it’s right: ':'Why not: '}</b>${q.e[k]}</div>`:'';
    opts+=`<button class="${cls}" data-k="${k}" ${(!test&&answered)?'disabled':''}><span class="k">${LETTERS[k]}</span><span>${o}</span>${why}</button>`;
  });
  const u=U[q.u-1];
  const fb=(!test&&answered)?`<div class="fb ${ans===q.a?'good':'bad'}">${ans===q.a?'Correct.':'Not quite — the answer is '+LETTERS[q.a]+'.'}</div>`:'';
  const nav=test?`<details style="margin-top:14px"><summary class="small muted" style="cursor:pointer">Question navigator (${Object.keys(R.ans).length}/${R.ids.length} answered, ${Object.keys(R.marked).filter(k=>R.marked[k]).length} marked)</summary><div class="navgrid">${R.ids.map((x,i)=>`<button data-go="${i}" class="${R.ans[x]!=null?'a':''} ${R.marked[x]?'m':''} ${i===R.i?'cur':''}">${i+1}</button>`).join('')}</div></details>`:'';
  host.innerHTML=`<div class="card">
   <div class="qhead"><div><b>${esc(R.title)}</b> <span class="muted small">· Question ${R.i+1} of ${R.ids.length}</span></div>
   <div class="row">${R.end?'<span class="timer" id="timer"></span>':''}${test?`<button class="btn sm ${R.marked[id]?'pri':''}" id="markQ">${R.marked[id]?'★ Marked':'☆ Mark'}</button>`:''}</div></div>
   ${R.kind==='exam'?'':`<div class="small muted" style="margin-bottom:4px">Unit ${q.u}: ${esc(u.short)} · ${esc(TH[q.t].short)}</div>`}
   ${qHTML(q)}<div class="opts">${opts}</div>${fb}
   <div class="foot"><div class="row">${test&&R.i>0?'<button class="btn" id="prev">← Prev</button>':''}</div>
   <div class="row">${test?'<button class="btn" id="submit">Submit '+(R.kind==='exam'?'exam':'test')+'</button>':''}
   <button class="btn pri" id="next" ${(!test&&!answered)?'disabled':''}>${R.i===R.ids.length-1?(test?'Review & submit':'Finish'):'Next →'}</button></div></div>
   <div class="tiny muted" style="margin-top:8px"><span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">Enter</span> ${test?'next':'next (after answering)'}${R.kind==='exam'?' · no pausing: the timer keeps running if you leave':''}</div>
   ${nav}</div>`;
  $$('.opt',host).forEach(b=>b.onclick=()=>answer(+b.dataset.k));
  $$('[data-go]',host).forEach(b=>b.onclick=()=>{R.i=+b.dataset.go;persistRun();renderRun()});
  const nx=$('#next',host); if(nx) nx.onclick=next;
  const pv=$('#prev',host); if(pv) pv.onclick=()=>{R.i--;persistRun();renderRun()};
  const sb=$('#submit',host); if(sb) sb.onclick=()=>confirmSubmit();
  const mk=$('#markQ',host); if(mk) mk.onclick=()=>{R.marked[id]=!R.marked[id];persistRun();renderRun()};
  if(R.end){tick(); clearInterval(timerInt); timerInt=setInterval(tick,1000);}
}
function tick(){
  const el=$('#timer'); if(!RUN||!RUN.end) return;
  const left=Math.max(0,RUN.end-Date.now());
  if(el){const m=Math.floor(left/6e4),s=Math.floor(left/1e3)%60; el.textContent=`${m}:${String(s).padStart(2,'0')}`; el.classList.toggle('low',left<5*6e4);}
  if(left<=0){clearInterval(timerInt); finishRun(true);}
}
function answer(k){
  const R=RUN, id=R.ids[R.i], q=Q[id];
  if(isTest(R.kind)){R.ans[id]=k; persistRun(); renderRun(); return;}
  if(R.ans[id]!=null) return;
  R.ans[id]=k; recordAnswer(id,k===q.a,R.kind); renderRun();
}
function next(){
  const R=RUN, id=R.ids[R.i];
  if(!isTest(R.kind)&&R.ans[id]==null) return;
  if(R.i<R.ids.length-1){R.i++; persistRun(); renderRun(); window.scrollTo(0,0);}
  else if(isTest(R.kind)) confirmSubmit(); else finishRun();
}
function confirmSubmit(){
  const R=RUN, un=R.ids.length-Object.keys(R.ans).length;
  if(un>0&&!confirm(`${un} question(s) unanswered. There is no guessing penalty on CLEP — answer everything. Submit anyway?`)) return;
  finishRun();
}
function recordAnswer(id,ok,src){
  if(ok){ if(S.mis[id]){delete S.mis[id]; S.misCleared=(S.misCleared||0)+1;} }
  else { const m=S.mis[id]||{n:0}; m.n++; m.t=Date.now(); m.src=src; S.mis[id]=m; }
  save();
}
function tally(ids,ans){
  const r={c:0,t:ids.length,byUnit:{},byTheme:{}};
  for(const id of ids){const q=Q[id], ok=ans[id]===q.a; if(ok) r.c++;
    (r.byUnit[q.u]=r.byUnit[q.u]||[0,0]); r.byUnit[q.u][1]++; if(ok) r.byUnit[q.u][0]++;
    (r.byTheme[q.t]=r.byTheme[q.t]||[0,0]); r.byTheme[q.t][1]++; if(ok) r.byTheme[q.t][0]++;}
  r.score=pct(r.c,r.t); return r;
}
function finishRun(timeUp){
  clearInterval(timerInt); timerInt=null;
  const R=RUN; if(!R) return; const res=tally(R.ids,R.ans);
  if(isTest(R.kind)){
    for(const id of R.ids){ const q=Q[id]; recordAnswer(id,R.ans[id]===q.a,R.kind); }
    const rec={date:Date.now(),score:res.score,c:res.c,t:res.t,byUnit:res.byUnit,byTheme:res.byTheme,ans:R.ans,ids:R.ids,mins:Math.round((Math.min(Date.now(),R.end||Date.now())-R.start)/6e4),timeUp:!!timeUp};
    if(R.kind==='diag') S.diag=rec; else S.exams[R.key]=rec;
    S.run=null;
  } else if(R.kind==='quiz'){
    const old=S.quiz[R.key]; S.quiz[R.key]={best:Math.max(res.score,old?old.best:0),last:res.score,n:(old?old.n:0)+1};
  }
  save(); setNav(location.hash.split('/').slice(0,2).join('/'));
  showResults(R,res,timeUp);
}
function breakdownHTML(res){
  const ub=Object.keys(res.byUnit).map(Number).sort((a,b)=>a-b).map(u=>{const [c,t]=res.byUnit[u],p=pct(c,t);
    return `<tr><td>${u}. ${esc(U[u-1].short)}</td><td>${c}/${t}</td><td style="width:40%"><div class="bar ${p>=75?'good':p>=50?'warn':'bad'}"><i style="width:${p}%"></i></div></td><td>${p}%</td></tr>`}).join('');
  const tb=Object.keys(TH).filter(k=>res.byTheme[k]).map(k=>{const [c,t]=res.byTheme[k],p=pct(c,t);
    return `<tr><td>${esc(TH[k].name)}</td><td>${c}/${t}</td><td style="width:40%"><div class="bar ${p>=75?'good':p>=50?'warn':'bad'}"><i style="width:${p}%"></i></div></td><td>${p}%</td></tr>`}).join('');
  return `<div class="grid g2"><div class="tbl-wrap"><h3>By unit</h3><table>${ub}</table></div><div class="tbl-wrap"><h3>By topic (official categories)</h3><table>${tb}</table></div></div>`;
}
function reviewHTML(ids,ans,onlyWrong){
  return ids.filter(id=>!onlyWrong||ans[id]!==Q[id].a).map((id,i)=>{const q=Q[id],a=ans[id];
    return `<div class="card" style="margin-top:10px"><div class="small muted">Unit ${q.u} · ${esc(TH[q.t].short)} · ${a===q.a?'<span style="color:var(--good)">correct</span>':a==null?'<span style="color:var(--bad)">unanswered</span>':'<span style="color:var(--bad)">missed</span>'}</div>
    ${qHTML(q)}<div class="opts">${q.o.map((o,k)=>`<div class="opt ${k===q.a?'right':k===a?'wrong':''}"><span class="k">${LETTERS[k]}</span><span>${o}</span><div class="why"><b>${k===q.a?'Why it’s right: ':'Why not: '}</b>${q.e[k]}</div></div>`).join('')}</div></div>`}).join('')||'<p class="muted">Nothing to show.</p>';
}
function showResults(R,res,timeUp){
  const host=R.host||$('#view');
  let extra='';
  if(R.kind==='diag'){
    extra=`<h3 style="margin-top:18px">What to skim vs. study</h3><table>${U.map(u=>{const l=diagLabel(u.n);const r=S.diag.byUnit[u.n]||[0,0];
      return `<tr><td>${u.n}. ${esc(u.title)}</td><td>${r[0]}/${r[1]}</td><td><span class="pill ${l==='skim'?'good':l==='must'?'bad':'warn'}">${l==='skim'?'Skim':l==='must'?'Must study':'Study'}</span></td></tr>`}).join('')}</table>
      <p class="small muted">With only 1–4 diagnostic questions per unit these labels are rough. “Skim” units still get their quiz — if you score ≥ 80% there, move on.</p>`;
  }
  if(R.kind==='exam') extra=`<p>${res.score>=75?'<b style="color:var(--good)">≥ 75% — this exam counts toward “ready to book.”</b>':'<b style="color:var(--warn)">Below the 75% readiness bar.</b> Drill your mistake log, revisit the weakest units below, then try the other exam.'}</p>
   <p class="small muted">CLEP reports a scaled score (20–80; 50 earns credit). The College Board does not publish a percent-to-scale conversion, so the 75% bar is a deliberately conservative target <span class="unver">unverified</span>.</p>`;
  host.innerHTML=`<div class="card"><h2>${esc(R.title)} — results</h2>${timeUp?'<p class="fb bad">Time expired — submitted automatically.</p>':''}
   <div class="row"><div class="stat"><div class="n">${res.score}%</div><div class="l">${res.c} of ${res.t} correct</div></div></div>
   ${extra}${isTest(R.kind)||R.kind==='quiz'?breakdownHTML(res):''}
   <div class="row" style="margin-top:14px" id="rbtns"></div></div>
   <div class="row" style="margin-top:16px"><h2 style="margin:0">Review</h2><label class="small"><input type="checkbox" id="onlyWrong" checked> missed only</label></div><div id="rev"></div>`;
  const rb=$('#rbtns',host);
  const add=(t,f,pri)=>{const b=document.createElement(f.charAt?'a':'button');b.className='btn'+(pri?' pri':'');b.textContent=t;if(f.charAt)b.href=f;else b.onclick=f;rb.appendChild(b)};
  if(R.kind==='quiz'){add('Retake quiz',()=>startRun({kind:'quiz',key:R.key,ids:shuffle([...U[R.key-1].quiz]),title:R.title,host}));add('Flashcards','#unit/'+R.key+'/cards');if(R.key<U.length)add(`Next: Unit ${R.key+1} →`,'#unit/'+(R.key+1),true);}
  else if(R.kind==='drill'){add('Back to mistake log',()=>route(),true);}
  else add('Dashboard','#home',true);
  const draw=()=>{$('#rev',host).innerHTML=reviewHTML(R.ids,R.ans,$('#onlyWrong',host).checked)};
  $('#onlyWrong',host).onchange=draw; draw();
  RUN=null;
}
document.addEventListener('keydown',e=>{
  if(e.target.matches('input,textarea,select')||e.ctrlKey||e.metaKey||e.altKey) return;
  if(RUN&&document.body.contains(RUN.host)){
    if(/^[1-5]$/.test(e.key)){const k=+e.key-1; if(Q[RUN.ids[RUN.i]].o[k]!=null){e.preventDefault();answer(k);}}
    else if(e.key==='Enter'){e.preventDefault();next();}
    else if(isTest(RUN.kind)&&e.key==='ArrowLeft'&&RUN.i>0){RUN.i--;persistRun();renderRun();}
    else if(isTest(RUN.kind)&&e.key==='ArrowRight'&&RUN.i<RUN.ids.length-1){RUN.i++;persistRun();renderRun();}
    return;
  }
  if(CARD&&document.body.contains(CARD.host)){
    if(e.key===' '||e.key==='Enter'){e.preventDefault();flipCard();}
    else if(CARD.flipped&&(e.key==='1'||e.key==='2')){e.preventDefault();gradeCard(e.key==='2');}
  }
});

  if(S.run&&S.run.kind==='diag') return resumeRun(v);
  if(S.run&&S.run.kind==='exam'){v.innerHTML=`<div class="card"><p>Practice exam ${S.run.key===1?'A':'B'} is in progress (timer running).</p><a class="btn pri" href="#exam/${S.run.key}">Resume exam</a></div>`;return;}
  const d=S.diag;
  v.innerHTML=`<h1>Diagnostic test</h1><div class="card"><p><b>${DATA.diag.length} questions</b> drawn from every unit in proportion to the official weights. No feedback until the end; untimed (aim for ~25 minutes). Afterward you get a score per unit and a <b>skim / study / must study</b> label that the dashboard and study plan use.</p>
  <p class="small muted">Take it cold — guessing is fine and expected. These questions never reappear in unit quizzes or practice exams.</p>
  ${d?`<p>Last result: <b>${d.score}%</b> on ${new Date(d.date).toLocaleDateString()}.</p>`:''}
  <div class="row"><button class="btn pri" id="go">${d?'Retake diagnostic':'Start diagnostic'}</button>${d?'<button class="btn" id="see">See last results</button>':''}</div></div>`;
  $('#go').onclick=()=>startRun({kind:'diag',key:0,ids:[...DATA.diag],title:'Diagnostic test',host:v});
  if(d) $('#see').onclick=()=>showResults({kind:'diag',ids:d.ids,ans:d.ans,title:'Diagnostic test',host:v},tally(d.ids,d.ans));
}
function viewExam(v,k){

  if(S.run){
    if(S.run.kind==='exam'&&S.run.key===k) return resumeRun(v);
    v.innerHTML=`<div class="card"><p>You have a ${S.run.kind==='exam'?'practice exam '+(S.run.key===1?'A':'B'):'diagnostic'} in progress. Finish it first.</p><a class="btn pri" href="${S.run.kind==='exam'?'#exam/'+S.run.key:'#diag'}">Resume</a></div>`; return;
  }
  const ex=S.exams[k], ids=DATA.exams[k-1];

  <p><b>${ids.length} questions · ${DATA.meta.format.minutes} minutes · no pausing.</b> Mirrors the real format: questions are spread across units by the official weights, no feedback until you submit, and you can mark questions and jump back. The clock runs on real time — closing the tab does <i>not</i> stop it.</p>
  <p class="small muted">Pace: about 45 seconds per question. Answer everything — there is no guessing penalty. None of these questions appear in unit quizzes, the diagnostic, or the other exam.</p>
  ${ex?`<p>Last result: <b>${ex.score}%</b> (${ex.c}/${ex.t}) on ${new Date(ex.date).toLocaleDateString()}, ${ex.mins} min used.</p>`:''}
  <div class="row"><button class="btn pri" id="go">${ex?'Retake':'Start'} exam ${name}</button>${ex?'<button class="btn" id="see">See last results</button>':''}</div></div>`;

  if(ex) $('#see').onclick=()=>showResults({kind:'exam',key:k,ids:ex.ids,ans:ex.ans,title:'Practice exam '+name,host:v},tally(ex.ids,ex.ans));

/* ---------- mistakes ---------- */
function viewMistakes(v){
  const ids=Object.keys(S.mis).filter(id=>Q[id]).sort((a,b)=>S.mis[b].n-S.mis[a].n);
  const byU={}; ids.forEach(id=>{const u=Q[id].u;byU[u]=(byU[u]||0)+1});
  v.innerHTML=`<h1>Mistake log</h1><div class="card"><p>Every question you miss anywhere lands here. Answer it correctly in a drill and it leaves the queue. ${S.misCleared?`<b>${S.misCleared}</b> cleared so far.`:''}</p>
  ${ids.length?`<div class="row" style="margin-bottom:10px">${Object.keys(byU).sort((a,b)=>a-b).map(u=>`<span class="pill">Unit ${u}: ${byU[u]}</span>`).join('')}</div>
  <div class="row"><button class="btn pri" id="drill">Drill all ${ids.length}</button><select id="du"><option value="0">…or one unit</option>${Object.keys(byU).sort((a,b)=>a-b).map(u=>`<option value="${u}">Unit ${u} (${byU[u]})</option>`).join('')}</select></div>`:'<p class="muted">Empty — nice. Take a quiz or exam to fill it.</p>'}</div><div id="ml"></div>`;
  if(!ids.length) return;
  const go=list=>startRun({kind:'drill',key:0,ids:shuffle(list).slice(0,40),title:'Mistake drill',host:v});

}

/* ---------- flashcards (Leitner) ---------- */
const IV=[0,0,1,3,7,14]; // days until due, by box 1..5
let CARD=null;
function dueCards(cards){const t=TODAY(); return cards.filter(c=>S.cards[c.id]&&S.cards[c.id].due<=t)}
function newCards(cards){return cards.filter(c=>!S.cards[c.id])}
function missedCards(cards){return cards.filter(c=>{const s=S.cards[c.id];return s&&(s.last===0||(s.m>0&&s.b<=2))})}
function viewCards(host,n){
  const cards=n?unitCards(n):allCards(), cs=cardStats(cards);
  const box=[1,2,3,4,5].map(b=>cards.filter(c=>S.cards[c.id]&&S.cards[c.id].b===b).length);
  const due=dueCards(cards).length, nw=newCards(cards).length, ms=missedCards(cards).length;
  host.innerHTML=`${n?'':'<h1>Flashcards</h1>'}<div class="card"><p class="small" style="margin-top:0">Leitner boxes: a miss sends a card back to box 1 (it returns this session and tomorrow); each hit moves it up a box and spaces it out (box 2 → 1 day, 3 → 3 days, 4 → 7, 5 → 14).</p>
  <div class="boxes"><div><b>${nw}</b>new</div>${box.map((x,i)=>`<div><b>${x}</b>box ${i+1}</div>`).join('')}</div>
  ${n?'':`<div class="row" style="margin-top:12px"><label class="f">Unit<select id="cu"><option value="0">All units</option>${U.map(u=>`<option value="${u.n}">${u.n}. ${esc(u.short)} (${u.cards.length})</option>`).join('')}</select></label></div>`}
  <div class="row" style="margin-top:12px"><button class="btn pri" data-m="due">Review due + new (${due} due, ${Math.min(nw,20)} new)</button><button class="btn" data-m="miss" ${ms?'':'disabled'}>Review missed only (${ms})</button><button class="btn" data-m="all">Cram all ${cards.length}</button></div></div><div id="fc" style="margin-top:14px"></div>`;
  if(!n) $('#cu').onchange=e=>{const u=+e.target.value; viewCards(host,0); if(u){ $('#cu').value=u; startCards(unitCards(u),'due',$('#fc'),host); }};
  $$('[data-m]',host).forEach(b=>b.onclick=()=>{const u=n||(+($('#cu')||{}).value||0); startCards(u?unitCards(u):cards,b.dataset.m,$('#fc'),host)});
}
function startCards(cards,mode,el,outer){
  let list = mode==='due'?[...shuffle(dueCards(cards)),...shuffle(newCards(cards)).slice(0,20)] : mode==='miss'?shuffle(missedCards(cards)):shuffle([...cards]);
  if(!list.length){el.innerHTML='<div class="card muted">Nothing due right now. Come back tomorrow, or cram.</div>';return;}
  CARD={list,i:0,flipped:false,host:el,ok:0,miss:0,requeued:{}}; drawCard();
}
function drawCard(){
  const C=CARD; if(C.i>=C.list.length){C.host.innerHTML=`<div class="card"><h3>Session done</h3><p>${C.ok} known · ${C.miss} missed. Missed cards come back first next time.</p></div>`; CARD=null; return;}
  const c=C.list[C.i], s=S.cards[c.id];
  C.host.innerHTML=`<div class="small muted" style="margin-bottom:6px">Card ${C.i+1} of ${C.list.length} · ${s?'box '+s.b:'new'} · Unit ${c.u}</div>
  <div class="card fc" id="fcard"><div class="front">${c.f}</div>${C.flipped?`<div class="back">${c.b}</div>`:'<div class="small muted" style="margin-top:14px">tap or <span class="kbd">Space</span> to flip</div>'}</div>
  ${C.flipped?`<div class="row" style="margin-top:10px;justify-content:center"><button class="btn" id="g1">✗ Missed <span class="kbd">1</span></button><button class="btn pri" id="g2">✓ Knew it <span class="kbd">2</span></button></div>`:''}`;
  $('#fcard').onclick=flipCard;
  if(C.flipped){$('#g1').onclick=()=>gradeCard(false);$('#g2').onclick=()=>gradeCard(true);}
}
function flipCard(){if(!CARD)return;CARD.flipped=!CARD.flipped;drawCard()}
function gradeCard(ok){
  const C=CARD, c=C.list[C.i], s=S.cards[c.id]||{b:0,m:0};
  if(ok){s.b=Math.min(5,Math.max(s.b,1)+1);C.ok++} else {s.b=1;s.m=(s.m||0)+1;C.miss++; if(!C.requeued[c.id]){C.requeued[c.id]=1;C.list.push(c);}}
  s.last=ok?1:0; s.due=TODAY()+IV[s.b]; S.cards[c.id]=s; save();
  C.i++; C.flipped=false; drawCard();
}

/* ---------- cheat sheet ---------- */
function viewCheat(v){
