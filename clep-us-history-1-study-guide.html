g> (British view) vs. <strong>actual representation<\/strong> (colonial view).","<strong>Townshend Acts (1767)<\/strong> duties on imports → <strong>Boston Massacre (1770)<\/strong>; all repealed but the <strong>tea<\/strong> tax.","<strong>Tea Act (1773)<\/strong> → <strong>Boston Tea Party<\/strong> → <strong>Coercive/Intolerable Acts (1774)<\/strong> → <strong>First Continental Congress<\/strong>.","<strong>Lexington and Concord (April 1775)<\/strong> start the war; <strong>Olive Branch Petition<\/strong> = last attempt at reconciliation.","<strong>Common Sense (Jan. 1776)<\/strong>, Thomas Paine: attacked monarchy, pushed independence.","<strong>Declaration of Independence:<\/strong> Jefferson, Locke's natural rights, grievances against <strong>George III<\/strong>.","<strong>Saratoga (1777)<\/strong> = turning point → <strong>French alliance (1778)<\/strong>. <strong>Yorktown (1781)<\/strong> = Cornwallis surrenders.","<strong>Treaty of Paris (1783):<\/strong> independence; western border at the <strong>Mississippi<\/strong>."],"timeline":[{"y":"1763","e":"Pontiac's Rebellion; Proclamation of 1763","th":"P","key":true},{"y":"1764","e":"Sugar Act and Currency Act","th":"E","key":false},{"y":"1765","e":"Stamp Act; Stamp Act Congress; Quartering Act","th":"P","key":true},{"y":"1766","e":"Stamp Act repealed; Declaratory Act","th":"P","key":false},{"y":"1767","e":"Townshend Acts","th":"E","key":false},{"y":"1770","e":"Boston Massacre","th":"S","key":true},{"y":"1772","e":"Committees of correspondence formed","th":"P","key":false},{"y":"1773","e":"Tea Act; Boston Tea Party","th":"E","key":true},{"y":"1774","e":"Coercive (Intolerable) Acts; First Continental Congress","th":"P","key":true},{"y":"1775","e":"Lexington and Concord; Second Continental Congress; Olive Branch Petition","th":"D","key":true},{"y":"1776","e":"Paine's Common Sense (January)","th":"C","key":false},{"y":"1776","e":"Declaration of Independence (July 4)","th":"P","key":true},{"y":"1777","e":"Battle of Saratoga — turning point","th":"D","key":true},{"y":"1778","e":"Franco-American alliance","th":"D","key":false},{"y":"1780","e":"Pennsylvania passes gradual emancipation","th":"S","key":false},{"y":"1781","e":"Cornwallis surrenders at Yorktown","th":"D","key":true},{"y":"1783","e":"Treaty of Paris recognizes independence","th":"D","key":true}],"cards":[{"id":"c4-1","u":4,"f":"Proclamation of 1763","b":"British order forbidding colonial settlement west of the Appalachian Mountains, issued after Pontiac's Rebellion."},{"id":"c4-2","u":4,"f":"Pontiac's Rebellion (1763)","b":"Ottawa-led Native uprising against British forts and settlers in the Ohio Valley and Great Lakes region."},{"id":"c4-3","u":4,"f":"Sugar Act (1764)","b":"Lowered the molasses duty but strictly enforced it; smugglers tried in vice-admiralty courts without juries."},{"id":"c4-4","u":4,"f":"Stamp Act (1765)","b":"First direct tax on colonists (printed papers); sparked the Stamp Act Congress and boycotts; repealed 1766."},{"id":"c4-5","u":4,"f":"Virtual representation","b":"British claim that Parliament represented all British subjects, including colonists who elected no members."},{"id":"c4-6","u":4,"f":"Declaratory Act (1766)","b":"Passed with Stamp Act repeal; asserted Parliament's authority over the colonies \"in all cases whatsoever.\""},{"id":"c4-7","u":4,"f":"Townshend Acts (1767)","b":"Import duties on glass, lead, paint, paper, and tea; revenue paid royal officials; repealed in 1770 except tea."},{"id":"c4-8","u":4,"f":"Boston Massacre (1770)","b":"British soldiers killed five colonists including Crispus Attucks; John Adams defended the soldiers."},{"id":"c4-9","u":4,"f":"Committees of correspondence","b":"Networks (Samuel Adams, 1772) that spread news and coordinated resistance across towns and colonies."},{"id":"c4-10","u":4,"f":"Coercive (Intolerable) Acts (1774)","b":"Punished Boston for the Tea Party — closed the port, limited Massachusetts self-government."},{"id":"c4-11","u":4,"f":"First Continental Congress (1774)","b":"Delegates from 12 colonies; endorsed boycotts via the Continental Association; sought rights, not independence."},{"id":"c4-12","u":4,"f":"Olive Branch Petition (1775)","b":"Second Continental Congress's final appeal to George III for reconciliation; he rejected it."},{"id":"c4-13","u":4,"f":"Common Sense (1776)","b":"Thomas Paine's pamphlet attacking monarchy and urging independence in plain language."},{"id":"c4-14","u":4,"f":"Declaration of Independence","b":"July 4, 1776; Jefferson; natural rights and consent of the governed; grievances against George III."},{"id":"c4-15","u":4,"f":"Saratoga (1777)","b":"American victory that convinced France to ally with the United States — the war's turning point."},{"id":"c4-16","u":4,"f":"Yorktown (1781)","b":"Cornwallis surrenders to American and French forces aided by the French navy; ends major fighting."},{"id":"c4-17","u":4,"f":"Treaty of Paris (1783)","b":"Britain recognizes US independence with boundaries to the Mississippi River."},{"id":"c4-18","u":4,"f":"Loyalists","b":"Colonists (about one-fifth) who remained loyal to Britain; many emigrated to Canada or Britain."}],"quiz":["q4-1","q4-2","q4-3","q4-4","q4-5","q4-6","q4-7","q4-8","q4-9","q4-10","q4-11","q4-12"]},{"n":5,"title":"Confederation & Constitution","short":"Constitution","years":"1781–1789","weight":5,"lesson":"<h2>Why this unit matters<\/h2>\n<p>Having rejected a powerful king and Parliament, Americans first built a <strong>deliberately weak<\/strong> national government — the <strong>Articles of Confederation<\/strong>. Its failures led to the <strong>Constitution of 1787<\/strong>. The exam tests the <strong>weaknesses of the Articles<\/strong>, its one big success (the <strong>Northwest Ordinance<\/strong>), <strong>Shays' Rebellion<\/strong>, the <strong>compromises<\/strong> of the Constitutional Convention, and the <strong>Federalist vs. Anti-Federalist<\/strong> debate. Think of it as a story: <em>fear of tyranny → too-weak government → crisis → stronger but limited government<\/em>.<\/p>\n<h2>State constitutions first<\/h2>\n<p>After 1776, each state wrote a <strong>written constitution<\/strong> — a new idea, since Britain's constitution was unwritten. Most included a <strong>bill of rights<\/strong>, made the <strong>legislature<\/strong> the strongest branch, and kept <strong>governors weak<\/strong>, reflecting distrust of executive power after George III. Massachusetts (1780) pioneered having a special <strong>convention<\/strong> write the constitution and the people ratify it — the model later used for the federal Constitution.<\/p>\n<h2>The Articles of Confederation (ratified 1781)<\/h2>\n<p>Drafted in 1777, the <strong>Articles of Confederation<\/strong> created a \"<strong>firm league of friendship<\/strong>\" among sovereign states. Ratification was delayed until <strong>1781<\/strong> because <strong>Maryland<\/strong> refused to sign until states with western land claims (like Virginia) gave those lands to the national government.<\/p>\n<p>How it worked:<\/p>\n<ul><li>A <strong>one-house (unicameral) Congress<\/strong>; each state had <strong>one vote<\/strong>, regardless of population.<\/li><li><strong>No executive<\/strong> (no president) and <strong>no national courts<\/strong>.<\/li><li>Major laws needed <strong>9 of 13<\/strong> states; amendments needed <strong>all 13<\/strong> (unanimity).<\/li><li>Congress could make war and treaties, borrow money, and run a postal system.<\/li><li>But Congress <strong>could not tax<\/strong> (it could only request money from the states), <strong>could not regulate interstate or foreign commerce<\/strong>, and <strong>could not force states<\/strong> to obey.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Fear of centralized tyranny after the Revolution<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Articles create a weak league of sovereign states<\/div><span>→<\/span><div><b>Consequence<\/b>National government cannot tax, pay debts, regulate trade, or enforce its laws<\/div><\/div>\n<h2>The great success: western lands<\/h2>\n<p>Congress handled the western lands well — its most lasting achievement.<\/p>\n<ul><li><strong>Land Ordinance of 1785:<\/strong> surveyed the Northwest Territory into <strong>townships<\/strong> six miles square, each divided into 36 sections; one section in each township was reserved to support <strong>public schools<\/strong>. Land sales were meant to pay the national debt.<\/li><li><strong>Northwest Ordinance of 1787:<\/strong> created a government for the territory north of the Ohio River and set a path to <strong>statehood on equal footing<\/strong> with the original states (when a territory reached 60,000 free inhabitants). It <strong>banned slavery<\/strong> in the Northwest Territory, protected religious freedom and trial by jury, and encouraged education.<\/li><\/ul>\n<div class=\"tip\"><b>Exam tip:<\/b> The Northwest Ordinance is a classic test item: <em>equal statehood<\/em> + <em>ban on slavery north of the Ohio River<\/em> + <em>the Articles' greatest achievement<\/em>.<\/div>\n<h2>Troubles of the 1780s<\/h2>\n<ul><li><strong>Money and debt:<\/strong> Congress could not pay soldiers or foreign loans; states printed paper money that lost value.<\/li><li><strong>Trade:<\/strong> states taxed one another's goods; Britain closed its West Indies ports to American ships.<\/li><li><strong>Foreign weakness:<\/strong> Britain kept <strong>forts in the Northwest<\/strong> despite the peace treaty; <strong>Spain closed the Mississippi River<\/strong> and New Orleans to American trade; <strong>Barbary pirates<\/strong> of North Africa seized American ships.<\/li><\/ul>\n<p>The crisis that shocked leaders was <strong>Shays' Rebellion (1786–1787)<\/strong>. In western Massachusetts, farmers — many Revolutionary veterans — faced high state taxes, debts, and the <strong>foreclosure<\/strong> of their farms. Led by <strong>Daniel Shays<\/strong>, they closed courts to stop foreclosures and marched on the federal arsenal at Springfield. The national government <strong>could not respond<\/strong>; Massachusetts merchants funded a state militia that crushed the rebellion.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Debt, high state taxes, and farm foreclosures<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Shays' Rebellion (1786–1787)<\/div><span>→<\/span><div><b>Consequence<\/b>Leaders fear disorder and call for a stronger national government at the Philadelphia Convention<\/div><\/div>\n<p>A meeting on trade at the <strong>Annapolis Convention (1786)<\/strong> drew only five states, but <strong>Alexander Hamilton<\/strong> and <strong>James Madison<\/strong> used it to call for a broader convention in Philadelphia in 1787.<\/p>\n<h2>The Constitutional Convention (1787)<\/h2>\n<p>Fifty-five delegates met in Philadelphia from May to September 1787, with <strong>George Washington<\/strong> presiding. <strong>James Madison<\/strong> did so much of the planning that he is called the \"<strong>Father of the Constitution<\/strong>.\" They quickly decided to replace the Articles rather than revise them, and worked in secret.<\/p>\n<p>The key debates ended in compromises:<\/p>\n<ul><li><strong>Representation:<\/strong> The <strong>Virginia Plan<\/strong> (Madison; favored large states) proposed a two-house legislature with representation by <strong>population<\/strong>. The <strong>New Jersey Plan<\/strong> (favored small states) kept one house with <strong>equal<\/strong> votes per state. The <strong>Great (Connecticut) Compromise<\/strong>, proposed by <strong>Roger Sherman<\/strong>, created a <strong>House of Representatives<\/strong> based on population and a <strong>Senate<\/strong> with <strong>two senators per state<\/strong>.<\/li><li><strong>Slavery and representation:<\/strong> The <strong>Three-Fifths Compromise<\/strong> counted three-fifths of the enslaved population for both representation and direct taxes — boosting southern power in the House and Electoral College.<\/li><li><strong>Slave trade:<\/strong> Congress could not ban the <strong>international slave trade before 1808<\/strong> (it did so in 1808). A <strong>fugitive slave clause<\/strong> required the return of escaped enslaved people. The word \"slavery\" never appears.<\/li><li><strong>Commerce:<\/strong> Congress could regulate interstate and foreign trade, but could <strong>not tax exports<\/strong> (a concession to southern exporters).<\/li><li><strong>Choosing a president:<\/strong> the <strong>Electoral College<\/strong>, a compromise between election by Congress and by direct popular vote.<\/li><\/ul>\n<h2>Principles of the Constitution<\/h2>\n<ul><li><strong>Popular sovereignty:<\/strong> power comes from the people (\"We the People\").<\/li><li><strong>Federalism:<\/strong> power divided between national and state governments; the <strong>supremacy clause<\/strong> makes the Constitution and federal laws the \"supreme law of the land.\"<\/li><li><strong>Separation of powers<\/strong> among legislative, executive, and judicial branches, with <strong>checks and balances<\/strong> (veto, veto override, Senate confirmation, impeachment).<\/li><li><strong>Limited government<\/strong> and an <strong>amendment process<\/strong> (two-thirds of Congress, three-fourths of states).<\/li><li>Congress gained the powers the Articles lacked: to <strong>tax<\/strong>, <strong>regulate commerce<\/strong>, and make laws \"<strong>necessary and proper<\/strong>\" for its powers.<\/li><\/ul>\n<h2>Ratification: Federalists vs. Anti-Federalists<\/h2>\n<p>The Constitution required approval by <strong>9 of 13<\/strong> state conventions. A fierce debate followed.<\/p>\n<ul><li><strong>Federalists<\/strong> supported the Constitution. Hamilton, Madison, and John Jay wrote <strong>The Federalist Papers<\/strong> (85 essays) to win over New York. In <strong>Federalist No. 10<\/strong>, Madison argued that a <strong>large republic<\/strong> would control <strong>factions<\/strong> because so many interests would check each other. Federalists tended to be merchants, urban dwellers, and the well-educated.<\/li><li><strong>Anti-Federalists<\/strong> — including <strong>Patrick Henry<\/strong> and <strong>George Mason<\/strong> — feared the strong central government would crush the states and individual liberty, that a president might become a king, and above all that the Constitution lacked a <strong>bill of rights<\/strong>. They were often small farmers and backcountry people.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Anti-Federalist fear that the Constitution lacked protection for individual liberties<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Federalists promise to add amendments<\/div><span>→<\/span><div><b>Consequence<\/b>Bill of Rights (ratified 1791)<\/div><\/div>\n<p><strong>New Hampshire<\/strong> became the ninth state in June <strong>1788<\/strong>, putting the Constitution into effect, but the large states of <strong>Virginia<\/strong> and <strong>New York<\/strong> ratified only narrowly after Federalists promised a bill of rights. North Carolina and Rhode Island joined after the new government began. <strong>George Washington<\/strong> was inaugurated in <strong>1789<\/strong>, and Madison drafted the <strong>Bill of Rights<\/strong> — the first ten amendments, ratified in <strong>1791<\/strong> (covered in Unit 6).<\/p>","words":1332,"minutes":9,"must":["<strong>Articles of Confederation (1781):<\/strong> one-house Congress, one vote per state, <strong>no power to tax or regulate commerce<\/strong>, no executive or courts, amendments need unanimity.","<strong>Northwest Ordinance (1787):<\/strong> path to statehood on equal footing; <strong>banned slavery<\/strong> north of the Ohio River — the Articles' biggest success.","<strong>Land Ordinance of 1785:<\/strong> townships surveyed; a section reserved for schools.","<strong>Shays' Rebellion (1786–87):<\/strong> indebted Massachusetts farmers revolt → proves the Articles too weak.","<strong>Great (Connecticut) Compromise:<\/strong> House by population + Senate equal (Roger Sherman).","<strong>Three-Fifths Compromise:<\/strong> three-fifths of enslaved people counted for representation and taxation.","Slave trade could not be banned <strong>before 1808<\/strong>; Congress could not tax exports.","<strong>Federalists<\/strong> (Hamilton, Madison, Jay; <em>The Federalist Papers<\/em>, No. 10 on factions) vs. <strong>Anti-Federalists<\/strong> (Patrick Henry, George Mason; wanted a bill of rights).","<strong>Madison<\/strong> = \"Father of the Constitution\"; ratified 1788 (9 states); Bill of Rights 1791."],"timeline":[{"y":"1777","e":"Articles of Confederation drafted","th":"P","key":false},{"y":"1780","e":"Massachusetts constitution ratified by the people","th":"P","key":false},{"y":"1781","e":"Articles of Confederation ratified","th":"P","key":true},{"y":"1785","e":"Land Ordinance surveys the Northwest","th":"E","key":false},{"y":"1786","e":"Annapolis Convention","th":"P","key":false},{"y":"1786–1787","e":"Shays' Rebellion in Massachusetts","th":"S","key":true},{"y":"1787","e":"Constitutional Convention in Philadelphia","th":"P","key":true},{"y":"1787","e":"Northwest Ordinance","th":"P","key":true},{"y":"1787–1788","e":"The Federalist Papers published","th":"C","key":false},{"y":"1788","e":"Constitution ratified (New Hampshire is the ninth state)","th":"P","key":true},{"y":"1789","e":"Washington inaugurated","th":"P","key":true},{"y":"1791","e":"Bill of Rights ratified","th":"P","key":false}],"cards":[{"id":"c5-1","u":5,"f":"Articles of Confederation","b":"First US national government (1781–1789): unicameral Congress, one vote per state, no power to tax or regulate trade, no executive."},{"id":"c5-2","u":5,"f":"Northwest Ordinance (1787)","b":"Organized the Northwest Territory, set a path to equal statehood, and banned slavery north of the Ohio River."},{"id":"c5-3","u":5,"f":"Land Ordinance of 1785","b":"Surveyed western land into 6-mile-square townships of 36 sections, reserving one section for public schools."},{"id":"c5-4","u":5,"f":"Shays' Rebellion (1786–87)","b":"Revolt of indebted Massachusetts farmers against foreclosures and taxes; exposed the Articles' weakness."},{"id":"c5-5","u":5,"f":"Virginia Plan","b":"Madison's plan for a strong national government with a two-house legislature based on population (favored large states)."},{"id":"c5-6","u":5,"f":"New Jersey Plan","b":"Plan for a one-house legislature with equal votes per state (favored small states)."},{"id":"c5-7","u":5,"f":"Great (Connecticut) Compromise","b":"House of Representatives by population, Senate with two members per state; proposed by Roger Sherman."},{"id":"c5-8","u":5,"f":"Three-Fifths Compromise","b":"Counted three-fifths of enslaved people toward a state's representation and direct taxes."},{"id":"c5-9","u":5,"f":"Federalism","b":"Division of power between national and state governments."},{"id":"c5-10","u":5,"f":"Checks and balances","b":"Each branch can limit the others (veto, override, confirmation, impeachment, judicial review)."},{"id":"c5-11","u":5,"f":"Federalists","b":"Supporters of the Constitution — Hamilton, Madison, Jay; wrote The Federalist Papers."},{"id":"c5-12","u":5,"f":"Federalist No. 10","b":"Madison's essay arguing a large republic controls the dangers of faction."},{"id":"c5-13","u":5,"f":"Anti-Federalists","b":"Opponents of the Constitution (Patrick Henry, George Mason); feared central power and demanded a bill of rights."}],"quiz":["q5-1","q5-2","q5-3","q5-4","q5-5","q5-6","q5-7","q5-8","q5-9","q5-10"]},{"n":6,"title":"The New Republic","short":"New Republic","years":"1789–1815","weight":11,"lesson":"<h2>Why this unit matters<\/h2>\n<p>This is one of the heaviest units on the exam. In 25 years the new nation created a working government, split into the first <strong>political parties<\/strong>, doubled its size with the <strong>Louisiana Purchase<\/strong>, established <strong>judicial review<\/strong>, and fought Britain in the <strong>War of 1812<\/strong>. The organizing theme: <strong>Hamilton vs. Jefferson<\/strong> — two visions of America that shaped every debate. Learn each president's major events and how the parties lined up.<\/p>\n<h2>Washington sets precedents (1789–1797)<\/h2>\n<p><strong>George Washington<\/strong> knew everything he did would become a model. He created a <strong>cabinet<\/strong> of advisers: <strong>Thomas Jefferson<\/strong> (State), <strong>Alexander Hamilton<\/strong> (Treasury), <strong>Henry Knox<\/strong> (War), and <strong>Edmund Randolph<\/strong> (Attorney General). He served <strong>two terms<\/strong> and then retired, a precedent that lasted until 1940. The <strong>Judiciary Act of 1789<\/strong> created the federal court system below the Supreme Court.<\/p>\n<p>Congress, led by <strong>James Madison<\/strong>, passed the <strong>Bill of Rights<\/strong>, ratified in <strong>1791<\/strong> to fulfill the Federalists' promise. Highlights: the <strong>1st Amendment<\/strong> (religion, speech, press, assembly, petition), the <strong>2nd<\/strong> (bear arms), the <strong>4th<\/strong> (no unreasonable searches), the <strong>5th<\/strong> (due process, no self-incrimination), and the <strong>10th<\/strong> (powers not given to the national government are <strong>reserved to the states<\/strong> or the people).<\/p>\n<h2>Hamilton's financial plan<\/h2>\n<p><strong>Alexander Hamilton<\/strong> wanted a strong national government tied to the wealthy, with a modern economy of commerce and manufacturing. His program: 1. <strong>Funding at par:<\/strong> pay the national debt in full to current bondholders (many were speculators who had bought bonds cheap). 2. <strong>Assumption:<\/strong> the federal government would take over <strong>state war debts<\/strong>. Southern states, which had largely paid their debts, objected. In the <strong>Compromise of 1790<\/strong>, southerners accepted assumption in exchange for locating the <strong>national capital on the Potomac River<\/strong> (Washington, D.C.). 3. A <strong>Bank of the United States (1791)<\/strong>, chartered for 20 years, to hold federal funds, issue currency, and make loans. 4. <strong>Tariffs<\/strong> and an <strong>excise tax on whiskey<\/strong> to raise revenue. His <em>Report on Manufactures<\/em> proposed protective tariffs to build industry, but Congress largely did not adopt it.<\/p>\n<p>The Bank sparked the first great constitutional debate. <strong>Jefferson<\/strong> argued for <strong>strict construction<\/strong>: the Constitution did not list a power to charter a bank, so Congress could not. <strong>Hamilton<\/strong> argued for <strong>loose construction<\/strong>: the <strong>\"necessary and proper\" (elastic) clause<\/strong> gave Congress <strong>implied powers<\/strong> to carry out its listed powers, like collecting taxes and borrowing money. Washington sided with Hamilton.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Hamilton's plan to build national credit<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Bank of the United States (1791)<\/div><span>→<\/span><div><b>Consequence<\/b>Debate over strict vs. loose construction; rise of opposing political parties<\/div><\/div>\n<h2>The first party system<\/h2>\n<p>Though Washington warned against \"faction,\" two parties formed:<\/p>\n<ul><li><strong>Federalists<\/strong> (Hamilton, John Adams): strong central government, <strong>loose construction<\/strong>, commerce and manufacturing, the Bank, rule by the educated elite, <strong>pro-British<\/strong> in foreign policy. Strongest in <strong>New England<\/strong> and among merchants.<\/li><li><strong>Democratic-Republicans<\/strong> (Jefferson, Madison): limited government, <strong>strict construction<\/strong>, <strong>states' rights<\/strong>, an <strong>agrarian<\/strong> nation of independent farmers, <strong>pro-French<\/strong>. Strongest in the <strong>South and West<\/strong>.<\/li><\/ul>\n<div class=\"tip\"><b>Exam tip:<\/b> Expect a question that matches a belief to the right party — especially <em>strict vs. loose construction<\/em> and <em>pro-French vs. pro-British<\/em>.<\/div>\n<h2>Testing the government at home and abroad<\/h2>\n<p>The <strong>Whiskey Rebellion (1794)<\/strong>: western Pennsylvania farmers, who turned grain into whiskey to transport it, refused to pay Hamilton's excise tax and attacked tax collectors. Washington led about <strong>13,000 militiamen<\/strong> west, and the rebellion collapsed. Unlike Shays' Rebellion under the Articles, the new government had shown it could <strong>enforce federal law<\/strong>.<\/p>\n<p>Abroad, the <strong>French Revolution<\/strong> (1789) and the war between France and Britain (1793) divided Americans. Washington issued the <strong>Proclamation of Neutrality (1793)<\/strong>, keeping the US out despite the 1778 French alliance. The French envoy <strong>Citizen Genêt<\/strong> tried to recruit Americans to attack British and Spanish territory and was recalled.<\/p>\n<ul><li><strong>Jay's Treaty (1794)<\/strong> with Britain: the British agreed to leave their <strong>forts in the Northwest<\/strong>, but did nothing about the seizure of American ships or <strong>impressment<\/strong> (forcing sailors into the Royal Navy). It was very <strong>unpopular<\/strong>, but it avoided war.<\/li><li><strong>Pinckney's Treaty (1795)<\/strong> with Spain: gave Americans free navigation of the <strong>Mississippi River<\/strong> and the <strong>right of deposit<\/strong> at <strong>New Orleans<\/strong>, and settled Florida's border. It was very <strong>popular<\/strong>, especially in the West.<\/li><li>In the Northwest, General <strong>Anthony Wayne<\/strong> defeated a Native confederacy at the <strong>Battle of Fallen Timbers (1794)<\/strong>; in the <strong>Treaty of Greenville (1795)<\/strong>, Native nations ceded most of present-day <strong>Ohio<\/strong>.<\/li><\/ul>\n<p>In his <strong>Farewell Address (1796)<\/strong>, Washington warned against <strong>permanent alliances<\/strong> with foreign nations, against the \"baneful effects\" of <strong>political parties<\/strong>, and against <strong>sectionalism<\/strong>. The advice to avoid entangling alliances guided US foreign policy for over a century.<\/p>\n<h2>John Adams (1797–1801)<\/h2>\n<p>Federalist <strong>John Adams<\/strong> inherited conflict with France, which was seizing American ships. In the <strong>XYZ Affair (1797–1798)<\/strong>, French agents (labeled X, Y, and Z) demanded a <strong>bribe<\/strong> before negotiating with American diplomats. Americans were outraged (\"Millions for defense, but not one cent for tribute!\") and fought an undeclared naval <strong>Quasi-War<\/strong> with France. Adams eventually negotiated peace in the <strong>Convention of 1800<\/strong>, ending the 1778 alliance — a decision that split his own party.<\/p>\n<p>Federalists used the war scare to pass the <strong>Alien and Sedition Acts (1798)<\/strong>:<\/p>\n<ul><li>The <strong>Alien Acts<\/strong> raised the residency requirement for citizenship (from 5 to 14 years) and let the president deport dangerous foreigners — aimed at immigrants, who tended to vote Democratic-Republican.<\/li><li>The <strong>Sedition Act<\/strong> made it a crime to publish \"false, scandalous, and malicious\" writing against the government — used to jail Republican newspaper editors.<\/li><\/ul>\n<p>Jefferson and Madison responded secretly with the <strong>Virginia and Kentucky Resolutions (1798)<\/strong>, arguing the Union was a <strong>compact<\/strong> among states and that states could judge federal laws unconstitutional (Kentucky's later version used the word <strong>nullification<\/strong>). No other states agreed at the time, but the idea of <strong>states' rights<\/strong> and nullification would return in the 1830s and in secession.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>War scare with France and Federalist fear of Republican critics<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Alien and Sedition Acts (1798)<\/div><span>→<\/span><div><b>Consequence<\/b>Virginia and Kentucky Resolutions assert states' rights; Federalists lose popularity<\/div><\/div>\n<h2>The \"Revolution of 1800\"<\/h2>\n<p>In the <strong>election of 1800<\/strong>, Jefferson defeated Adams. Because electors cast two undifferentiated votes, Jefferson and his running mate <strong>Aaron Burr<\/strong> <strong>tied<\/strong>, and the House of Representatives chose Jefferson (with Hamilton's help). The <strong>12th Amendment (1804)<\/strong> fixed this by having electors vote separately for president and vice president. Jefferson called it the \"<strong>Revolution of 1800<\/strong>\" because power passed <strong>peacefully<\/strong> from one party to its rival — a rare event in the world at the time.<\/p>\n<h2>Jefferson in power (1801–1809)<\/h2>\n<p>Jefferson cut the national debt, the army, and the navy, and repealed the whiskey tax — but kept the Bank. Before leaving office, Adams had appointed Federalist \"<strong>midnight judges<\/strong>.\" One appointee, William Marbury, sued when Jefferson's secretary of state James Madison withheld his commission.<\/p>\n<p>In <strong>Marbury v. Madison (1803)<\/strong>, Chief Justice <strong>John Marshall<\/strong> ruled that the law giving the Court power to issue Marbury's commission was itself <strong>unconstitutional<\/strong>. Marbury lost, but the Court won something far bigger: the power of <strong>judicial review<\/strong> — the authority to declare acts of Congress unconstitutional.<\/p>\n<div class=\"tip\"><b>Exam tip:<\/b> Marbury v. Madison = judicial review. It is the single most-tested Supreme Court case of this era.<\/div>\n<p>The <strong>Louisiana Purchase (1803)<\/strong> was Jefferson's greatest achievement. France's <strong>Napoleon<\/strong>, having lost his army in the <strong>Haitian Revolution<\/strong> and needing money for war in Europe, sold the entire Louisiana Territory for about <strong>$15 million<\/strong>, <strong>doubling<\/strong> the nation's size. Jefferson had only wanted New Orleans. As a <strong>strict constructionist<\/strong>, he doubted the Constitution allowed buying land, but he justified it under the <strong>treaty-making power<\/strong> — a sign that practical needs could override his principles. <strong>Lewis and Clark<\/strong> (1804–1806), guided in part by the Shoshone woman <strong>Sacagawea<\/strong>, explored the territory to the Pacific.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Slave revolt in Haiti defeats French troops; Napoleon needs money for war<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Louisiana Purchase (1803)<\/div><span>→<\/span><div><b>Consequence<\/b>US doubles in size; Mississippi and New Orleans secured; Jefferson bends strict construction<\/div><\/div>\n<p>Jefferson also sent the navy against the <strong>Barbary pirates<\/strong> of Tripoli (1801–1805) rather than keep paying tribute.<\/p>\n<h2>Neutral rights and the road to war<\/h2>\n<p>Britain and France were at war again, and both seized American ships. Britain also practiced <strong>impressment<\/strong>, taking thousands of American sailors. In the <strong>Chesapeake affair (1807)<\/strong>, a British warship fired on an American naval vessel and took sailors off it. Instead of war, Jefferson persuaded Congress to pass the <strong>Embargo Act (1807)<\/strong>, banning all American exports. It was a disaster: it hurt American merchants and farmers — especially <strong>New England<\/strong> — far more than Britain or France. It was repealed in 1809 and replaced by the <strong>Non-Intercourse Act<\/strong>, which reopened trade with all nations except Britain and France.<\/p>\n<h2>James Madison and the War of 1812<\/h2>\n<p>Under President <strong>James Madison<\/strong>, pressure for war grew from the <strong>War Hawks<\/strong> — young congressmen from the South and West such as <strong>Henry Clay<\/strong> and <strong>John C. Calhoun<\/strong>. Causes of the war:<\/p>\n<ul><li><strong>Impressment<\/strong> and violations of <strong>neutral rights<\/strong> at sea.<\/li><li>British support for Native resistance in the Northwest. The Shawnee leader <strong>Tecumseh<\/strong> and his brother the Prophet (<strong>Tenskwatawa<\/strong>) built a pan-Indian confederacy to stop American expansion; <strong>William Henry Harrison<\/strong> attacked their town in the <strong>Battle of Tippecanoe (1811)<\/strong>.<\/li><li>Western desire for land, including hopes of conquering <strong>Canada<\/strong>.<\/li><\/ul>\n<p>Congress declared war in <strong>June 1812<\/strong>. American invasions of Canada failed. <strong>Oliver Hazard Perry<\/strong> won control of <strong>Lake Erie (1813)<\/strong>, and Tecumseh was killed at the <strong>Battle of the Thames (1813)<\/strong>, ending his confederacy. In <strong>1814<\/strong> the British <strong>burned Washington, D.C.<\/strong>, but failed to take Baltimore; the defense of <strong>Fort McHenry<\/strong> inspired <strong>Francis Scott Key's<\/strong> \"The Star-Spangled Banner.\"<\/p>\n<p>New England Federalists, who opposed \"Mr. Madison's War,\" met at the <strong>Hartford Convention (1814–1815)<\/strong> and proposed constitutional amendments to limit southern and western power (some discussed secession). The timing was terrible: news arrived of peace and victory, and the Federalists looked <strong>disloyal<\/strong>. The party soon <strong>collapsed<\/strong>.<\/p>\n<p>The <strong>Treaty of Ghent<\/strong> (signed <strong>December 1814<\/strong>) restored prewar conditions (<em>status quo ante bellum<\/em>) — no territory changed hands and impressment was not mentioned. Two weeks later, before news crossed the ocean, <strong>Andrew Jackson<\/strong> crushed the British at the <strong>Battle of New Orleans (January 1815)<\/strong>, making him a national hero.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Impressment, neutral rights, and British aid to Tecumseh<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>War of 1812<\/div><span>→<\/span><div><b>Consequence<\/b>Surge of nationalism, death of the Federalist Party, Native resistance east of the Mississippi broken, and growth of American manufacturing<\/div><\/div>\n<h2>Society in the new republic<\/h2>\n<ul><li><strong>Republican Motherhood:<\/strong> the idea that women served the nation by raising virtuous, educated citizen-sons; it justified better <strong>education for women<\/strong>, though not political rights.<\/li><li><strong>Slavery:<\/strong> <strong>Eli Whitney's cotton gin (1793)<\/strong> made short-staple cotton profitable and revived slavery just as some had hoped it would fade. <strong>Gabriel's Rebellion (1800)<\/strong>, a planned uprising near Richmond, was betrayed and crushed. Congress banned the <strong>international slave trade<\/strong> as of <strong>1808<\/strong>, the earliest date the Constitution allowed.<\/li><li><strong>Culture:<\/strong> a new national identity appeared in schoolbooks, Noah Webster's American spelling, and the celebration of Washington.<\/li><\/ul>","words":2109,"minutes":14,"must":["<strong>Washington's precedents:<\/strong> cabinet, two terms, neutrality; <strong>Farewell Address<\/strong> warns against permanent alliances and parties.","<strong>Hamilton's plan:<\/strong> assumption of state debts, <strong>Bank of the US<\/strong> (loose construction, implied powers via \"necessary and proper\") vs. Jefferson's <strong>strict construction<\/strong>.","<strong>Federalists<\/strong> (Hamilton/Adams; pro-British, commerce, New England) vs. <strong>Democratic-Republicans<\/strong> (Jefferson/Madison; agrarian, states' rights, pro-French).","<strong>Whiskey Rebellion (1794)<\/strong> showed the new government could enforce federal law.","<strong>Jay's Treaty<\/strong> (Britain, unpopular, forts) vs. <strong>Pinckney's Treaty<\/strong> (Spain, popular, Mississippi/New Orleans).","<strong>XYZ Affair<\/strong> → <strong>Alien and Sedition Acts (1798)<\/strong> → <strong>Virginia &amp; Kentucky Resolutions<\/strong> (states' rights, nullification).","<strong>Election of 1800<\/strong> = peaceful transfer of power; tie led to the <strong>12th Amendment<\/strong>.","<strong>Marbury v. Madison (1803)<\/strong> = <strong>judicial review<\/strong> (John Marshall).","<strong>Louisiana Purchase (1803)<\/strong> from Napoleon; doubled the US; strained Jefferson's strict construction.","<strong>Embargo Act (1807)<\/strong> hurt New England; <strong>War of 1812<\/strong> causes: impressment, neutral rights, British aid to <strong>Tecumseh<\/strong>, desire for Canada.","<strong>Hartford Convention<\/strong> killed the Federalists; <strong>Treaty of Ghent<\/strong> = status quo; <strong>Battle of New Orleans<\/strong> made Jackson a hero."],"timeline":[{"y":"1789","e":"Washington inaugurated; Judiciary Act; French Revolution begins","th":"P","key":true},{"y":"1791","e":"Bill of Rights ratified; Bank of the United States chartered","th":"P","key":true},{"y":"1793","e":"Proclamation of Neutrality; Eli Whitney's cotton gin","th":"D","key":false},{"y":"1794","e":"Whiskey Rebellion; Jay's Treaty; Battle of Fallen Timbers","th":"P","key":true},{"y":"1795","e":"Pinckney's Treaty; Treaty of Greenville","th":"D","key":false},{"y":"1796","e":"Washington's Farewell Address","th":"D","key":false},{"y":"1797–1798","e":"XYZ Affair; Quasi-War with France","th":"D","key":false},{"y":"1798","e":"Alien and Sedition Acts; Virginia and Kentucky Resolutions","th":"P","key":true},{"y":"1800","e":"Election of 1800 (\"Revolution of 1800\")","th":"P","key":true},{"y":"1803","e":"Marbury v. Madison; Louisiana Purchase","th":"P","key":true},{"y":"1804–1806","e":"Lewis and Clark expedition","th":"C","key":false},{"y":"1807","e":"Chesapeake affair; Embargo Act","th":"E","key":false},{"y":"1808","e":"International slave trade banned","th":"S","key":false},{"y":"1811","e":"Battle of Tippecanoe","th":"D","key":false},{"y":"1812","e":"War of 1812 begins","th":"D","key":true},{"y":"1814","e":"Washington burned; Hartford Convention; Treaty of Ghent","th":"D","key":false},{"y":"1815","e":"Battle of New Orleans","th":"D","key":true}],"cards":[{"id":"c6-1","u":6,"f":"Cabinet","b":"Washington's group of department heads (Jefferson–State, Hamilton–Treasury, Knox–War, Randolph–Attorney General)."},{"id":"c6-2","u":6,"f":"Bill of Rights (1791)","b":"First ten amendments; promised to Anti-Federalists; drafted by Madison."},{"id":"c6-3","u":6,"f":"10th Amendment","b":"Powers not delegated to the federal government are reserved to the states or the people."},{"id":"c6-4","u":6,"f":"Assumption","b":"Hamilton's plan for the federal government to take over state war debts; traded for a Potomac capital (Compromise of 1790)."},{"id":"c6-5","u":6,"f":"Bank of the United States (1791)","b":"Hamilton's national bank; justified by implied powers; opposed by Jefferson as unconstitutional."},{"id":"c6-6","u":6,"f":"Strict construction","b":"Government may do only what the Constitution explicitly permits (Jefferson)."},{"id":"c6-7","u":6,"f":"Loose construction","b":"The \"necessary and proper\" clause allows implied powers (Hamilton)."},{"id":"c6-8","u":6,"f":"Federalists (party)","b":"Hamilton and Adams; strong central government, commerce, Bank, pro-British; strongest in New England."},{"id":"c6-9","u":6,"f":"Democratic-Republicans","b":"Jefferson and Madison; states' rights, strict construction, farmers, pro-French; strongest in South and West."},{"id":"c6-10","u":6,"f":"Whiskey Rebellion (1794)","b":"Pennsylvania farmers resisted the whiskey excise; Washington's militia suppressed it, proving federal strength."},{"id":"c6-11","u":6,"f":"Jay's Treaty (1794)","b":"Britain agreed to leave northwestern forts; ignored impressment; very unpopular."},{"id":"c6-12","u":6,"f":"Pinckney's Treaty (1795)","b":"Spain granted navigation of the Mississippi and the right of deposit at New Orleans; very popular."},{"id":"c6-13","u":6,"f":"Farewell Address (1796)","b":"Washington warned against permanent foreign alliances, political parties, and sectionalism."},{"id":"c6-14","u":6,"f":"XYZ Affair (1797–98)","b":"French agents demanded bribes from US diplomats; led to the Quasi-War and Federalist war measures."},{"id":"c6-15","u":6,"f":"Alien and Sedition Acts (1798)","b":"Federalist laws targeting immigrants and making criticism of the government a crime."},{"id":"c6-16","u":6,"f":"Virginia and Kentucky Resolutions","b":"Jefferson and Madison argued states could judge federal laws unconstitutional (nullification)."},{"id":"c6-17","u":6,"f":"Revolution of 1800","b":"Jefferson's election: the first peaceful transfer of power between rival parties."},{"id":"c6-18","u":6,"f":"12th Amendment (1804)","b":"Separate electoral votes for president and vice president, after the 1800 Jefferson–Burr tie."},{"id":"c6-19","u":6,"f":"Marbury v. Madison (1803)","b":"John Marshall's Court established judicial review — courts can strike down unconstitutional laws."},{"id":"c6-20","u":6,"f":"Louisiana Purchase (1803)","b":"Bought from Napoleon for about $15 million; doubled US territory; Jefferson stretched strict construction."},{"id":"c6-21","u":6,"f":"Impressment","b":"British practice of forcing sailors, including Americans, into the Royal Navy; a cause of the War of 1812."},{"id":"c6-22","u":6,"f":"Embargo Act (1807)","b":"Jefferson's ban on all American exports; crippled New England's economy; repealed 1809."},{"id":"c6-23","u":6,"f":"Tecumseh","b":"Shawnee leader who built a pan-Indian confederacy against US expansion; killed at the Battle of the Thames (1813)."},{"id":"c6-24","u":6,"f":"War Hawks","b":"Young western and southern congressmen (Clay, Calhoun) who pushed for war with Britain in 1812."},{"id":"c6-25","u":6,"f":"Hartford Convention (1814–15)","b":"New England Federalists' protest against the war; looked disloyal and doomed the party."},{"id":"c6-26","u":6,"f":"Treaty of Ghent (1814)","b":"Ended the War of 1812, restoring prewar conditions."},{"id":"c6-27","u":6,"f":"Republican Motherhood","b":"Ideal that women served the republic by raising virtuous citizens; supported female education."}],"quiz":["q6-1","q6-2","q6-3","q6-4","q6-5","q6-6","q6-7","q6-8","q6-9","q6-10","q6-11","q6-12","q6-13","q6-14"]},{"n":7,"title":"Nationalism & the Market Revolution","short":"Nationalism & Markets","years":"1815–1828","weight":8,"lesson":"<h2>Why this unit matters<\/h2>\n<p>After the War of 1812, Americans felt a surge of <strong>nationalism<\/strong>. Government policies, Supreme Court decisions, and foreign policy all pointed toward a stronger, more unified nation. At the same time, a <strong>market revolution<\/strong> — canals, steamboats, factories, and commercial farming — transformed how Americans worked and lived. But beneath the \"Era of Good Feelings,\" <strong>sectional<\/strong> conflict over slavery surfaced in the <strong>Missouri Crisis<\/strong>. The exam tests the <strong>American System<\/strong>, <strong>Marshall Court cases<\/strong>, the <strong>Monroe Doctrine<\/strong>, the <strong>Missouri Compromise<\/strong>, and the <strong>Erie Canal and Lowell mills<\/strong>.<\/p>\n<h2>The Era of Good Feelings<\/h2>\n<p>With the Federalist Party dead after the Hartford Convention, the Democratic-Republicans governed alone. President <strong>James Monroe<\/strong> (1817–1825) won reelection in 1820 essentially unopposed. A Boston newspaper called this one-party period the \"<strong>Era of Good Feelings<\/strong>.\" The name is a bit misleading: personal and <strong>sectional rivalries<\/strong> remained, and the <strong>Panic of 1819<\/strong> brought real suffering.<\/p>\n<h2>Clay's American System<\/h2>\n<p>The war had exposed weaknesses: poor roads, dependence on British goods, and financial chaos after the first Bank's charter lapsed in 1811. Even Republicans now adopted former Federalist ideas. Speaker of the House <strong>Henry Clay<\/strong> of Kentucky promoted the <strong>American System<\/strong>, a plan to tie the regions together economically: 1. A <strong>protective tariff<\/strong> to shield northern industry from cheaper British goods. The <strong>Tariff of 1816<\/strong> was the first tariff designed mainly for <strong>protection<\/strong> rather than revenue. 2. A <strong>Second Bank of the United States<\/strong> (chartered <strong>1816<\/strong>) to provide a stable national currency and credit. 3. Federally funded <strong>internal improvements<\/strong> — roads and canals — to connect western farms with eastern markets.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>War of 1812 exposes economic weakness; nationalist mood<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Clay's American System (tariff, national bank, internal improvements)<\/div><span>→<\/span><div><b>Consequence<\/b>Economic integration of regions — but disputes over whether the federal government could fund roads and canals<\/div><\/div>\n<p>Tariffs and the Bank passed, but federal funding for internal improvements stalled: President Madison vetoed the <strong>Bonus Bill (1817)<\/strong>, believing it needed a constitutional amendment. Most canals and roads were built by <strong>states and private companies<\/strong> instead. The federally funded <strong>National (Cumberland) Road<\/strong> was the major exception.<\/p>\n<p>The <strong>Panic of 1819<\/strong>, the nation's first major depression, followed a boom in land speculation and easy credit. When the Second Bank tightened credit, banks failed and farmers lost land. Many westerners came to <strong>hate the Bank<\/strong> — feelings Andrew Jackson would exploit.<\/p>\n<h2>The Marshall Court strengthens the nation<\/h2>\n<p>Chief Justice <strong>John Marshall<\/strong> (served 1801–1835) issued rulings that strengthened the <strong>federal government<\/strong> and protected <strong>property and business<\/strong>:<\/p>\n<ul><li><strong>McCulloch v. Maryland (1819):<\/strong> Maryland tried to tax the Second Bank. Marshall ruled that the Bank was constitutional under <strong>implied powers<\/strong> (the necessary and proper clause — Hamilton's loose construction) and that a state could not tax a federal institution because \"<strong>the power to tax involves the power to destroy<\/strong>.\" Federal law is supreme over state law.<\/li><li><strong>Dartmouth College v. Woodward (1819):<\/strong> New Hampshire could not alter Dartmouth's colonial charter, because a charter is a <strong>contract<\/strong> protected by the Constitution — encouraging business investment.<\/li><li><strong>Gibbons v. Ogden (1824):<\/strong> a New York steamboat monopoly was void because only <strong>Congress<\/strong> may regulate <strong>interstate commerce<\/strong>, broadly defined.<\/li><li>Earlier, <strong>Fletcher v. Peck (1810)<\/strong> was the first time the Court struck down a <strong>state<\/strong> law as unconstitutional (also protecting contracts).<\/li><\/ul>\n<div class=\"tip\"><b>Exam tip:<\/b> Pattern to remember: Marshall's Court almost always ruled for <strong>national power over the states<\/strong> and for <strong>contracts and property<\/strong>. If an answer choice says the Marshall Court strengthened states' rights, it is almost certainly wrong.<\/div>\n<h2>Nationalist foreign policy<\/h2>\n<p>Secretary of State <strong>John Quincy Adams<\/strong> was one of the most skillful diplomats in American history.<\/p>\n<ul><li><strong>Rush–Bagot Agreement (1817):<\/strong> the US and Britain demilitarized the <strong>Great Lakes<\/strong>.<\/li><li><strong>Convention of 1818:<\/strong> set the US–Canada border at the <strong>49th parallel<\/strong> from Minnesota to the Rocky Mountains and agreed to <strong>joint occupation of Oregon<\/strong>.<\/li><li><strong>Adams–Onís Treaty (1819):<\/strong> after <strong>Andrew Jackson<\/strong> invaded Spanish <strong>Florida<\/strong> chasing Seminoles (the First Seminole War), Adams persuaded Spain to <strong>cede Florida<\/strong> and define the western border of the Louisiana Purchase. Spain gave up its claim to Oregon.<\/li><\/ul>\n<p>The <strong>Monroe Doctrine (1823)<\/strong>, written largely by Adams, responded to newly independent <strong>Latin American<\/strong> republics and fears that European powers (and Russia in the Pacific Northwest) would intervene. It declared:<\/p>\n<ul><li>The Western Hemisphere was <strong>closed to further European colonization<\/strong>.<\/li><li>The US would <strong>not interfere in European affairs<\/strong> or existing colonies.<\/li><li>European intervention in the Americas would be seen as a threat to the US.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Latin American revolutions; fear of European intervention<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Monroe Doctrine (1823)<\/div><span>→<\/span><div><b>Consequence<\/b>Assertion of US leadership in the hemisphere — though at first enforced mainly by Britain's navy<\/div><\/div>\n<p>At the time the US had little power to enforce the Doctrine; Britain, which wanted open Latin American markets, effectively enforced it with its navy. Britain had proposed a joint statement, but Adams insisted the US act <strong>alone<\/strong>.<\/p>\n<h2>The Missouri Compromise<\/h2>\n<p>In 1819, <strong>Missouri<\/strong> asked to join the Union as a slave state. That would upset the balance of <strong>11 free and 11 slave states<\/strong> in the Senate. New York Congressman <strong>James Tallmadge<\/strong> proposed banning further importation of enslaved people into Missouri and gradually freeing children born there; the House passed it, but the Senate blocked it. Henry Clay brokered the <strong>Missouri Compromise (1820)<\/strong>:<\/p>\n<ul><li><strong>Missouri<\/strong> entered as a <strong>slave state<\/strong>.<\/li><li><strong>Maine<\/strong> (split off from Massachusetts) entered as a <strong>free state<\/strong>, keeping the Senate balanced.<\/li><li>Slavery was <strong>banned in the rest of the Louisiana Purchase north of 36°30′<\/strong> (Missouri's southern border).<\/li><\/ul>\n<p>The aging Thomas Jefferson called the crisis \"<strong>a fire bell in the night<\/strong>,\" warning that the slavery issue could destroy the Union. The compromise held for over 30 years — until the Kansas–Nebraska Act (Unit 10) repealed it.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Missouri's request to enter as a slave state threatens the Senate balance<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Missouri Compromise (1820)<\/div><span>→<\/span><div><b>Consequence<\/b>Temporary sectional peace; 36°30′ line set the rule for slavery in the Louisiana Territory until 1854<\/div><\/div>\n<h2>The market revolution: transportation<\/h2>\n<p>Before 1815, moving goods overland was slow and expensive; most farm families produced mainly for their own use. The <strong>transportation revolution<\/strong> changed that.<\/p>\n<ul><li><strong>Roads:<\/strong> turnpikes and the <strong>National Road<\/strong> (begun 1811) linked the Potomac to the Ohio River.<\/li><li><strong>Steamboats:<\/strong> <strong>Robert Fulton's<\/strong> <em>Clermont<\/em> (1807) proved steam power could carry goods <strong>upstream<\/strong>; steamboats soon dominated the Mississippi and Ohio Rivers.<\/li><li><strong>Canals:<\/strong> New York's <strong>Erie Canal<\/strong>, completed in <strong>1825<\/strong> under Governor <strong>DeWitt Clinton<\/strong>, linked the <strong>Hudson River to the Great Lakes<\/strong>. It slashed shipping costs, opened the Midwest to settlement, and made <strong>New York City<\/strong> the nation's dominant port. A canal-building craze followed.<\/li><li><strong>Railroads:<\/strong> the <strong>Baltimore and Ohio<\/strong> began operating around 1830; by the 1850s railroads surpassed canals and tied the Northeast to the Midwest.<\/li><li><strong>Communication:<\/strong> Samuel <strong>Morse's telegraph<\/strong> (1844) sent messages instantly.<\/li><\/ul>\n<h2>The market revolution: industry and agriculture<\/h2>\n<p><strong>Samuel Slater<\/strong>, a British mechanic who memorized textile machine designs, built America's first successful water-powered <strong>cotton-spinning mill<\/strong> in Rhode Island (1790s) — earning the title \"father of the American factory system.\"<\/p>\n<p>In Massachusetts, <strong>Francis Cabot Lowell<\/strong> and the Boston Associates went further, putting all stages of cloth production under one roof (Waltham, 1814) and building the factory town of <strong>Lowell<\/strong> in the 1820s. The <strong>Lowell system<\/strong> hired young, unmarried <strong>farm women<\/strong> (\"mill girls\"), housed them in supervised <strong>boardinghouses<\/strong>, and paid them cash wages. Many valued the independence, but long hours and wage cuts led to some of the first <strong>strikes<\/strong> by women workers in the 1830s. Later, Irish immigrants replaced them.<\/p>\n<p><strong>Eli Whitney<\/strong> also promoted <strong>interchangeable parts<\/strong> — standardized components that made mass production possible.<\/p>\n<p>Western farmers became commercial producers thanks to new tools: <strong>John Deere's steel plow<\/strong> (1837) broke the tough prairie soil, and <strong>Cyrus McCormick's mechanical reaper<\/strong> (1830s) harvested grain quickly.<\/p>\n<h2>Results of the market revolution<\/h2>\n<ul><li><strong>Regional specialization:<\/strong> the <strong>Northeast<\/strong> focused on manufacturing and commerce; the <strong>South<\/strong> on cotton grown by enslaved people; the <strong>West (Midwest)<\/strong> on grain and livestock. The regions became economically interdependent — and the Northeast and Midwest increasingly bound together by canals and rails, leaving the South apart.<\/li><li>Families shifted from <strong>subsistence<\/strong> to <strong>market<\/strong> production, buying goods they once made.<\/li><li>A <strong>middle class<\/strong> grew, and work moved out of the home. This created the idea of \"<strong>separate spheres<\/strong>\": men in the public world of work, women in the private home (Unit 9).<\/li><li>Workers lost independence as artisans were replaced by <strong>wage labor<\/strong>; boom-and-bust cycles like the Panic of 1819 hit hard.<\/li><\/ul>\n<h2>The election of 1824 and the \"corrupt bargain\"<\/h2>\n<p>By 1824 the one-party era fractured. Four Democratic-Republicans ran: <strong>Andrew Jackson<\/strong>, <strong>John Quincy Adams<\/strong>, <strong>William Crawford<\/strong>, and <strong>Henry Clay<\/strong>. Jackson won the most popular and electoral votes but <strong>not a majority<\/strong>, so the <strong>House of Representatives<\/strong> chose among the top three. Clay, as Speaker, threw his support to Adams, who won — and then named Clay <strong>Secretary of State<\/strong>. Jackson's supporters denounced this \"<strong>corrupt bargain<\/strong>.\"<\/p>\n<p>President <strong>John Quincy Adams<\/strong> (1825–1829) proposed an ambitious nationalist program — roads, canals, a national university, scientific research — but Congress, dominated by Jackson's supporters, blocked most of it. The <strong>Tariff of 1828<\/strong> (the \"<strong>Tariff of Abominations<\/strong>\"), with very high rates, enraged the South and set up the nullification crisis of Unit 8.<\/p>","words":1783,"minutes":12,"must":["<strong>Era of Good Feelings<\/strong> = Monroe's one-party era (Democratic-Republicans), but with hidden sectional tension.","<strong>American System<\/strong> (Henry Clay): protective tariff (<strong>Tariff of 1816<\/strong>), <strong>Second Bank of the US<\/strong> (1816), internal improvements.","<strong>McCulloch v. Maryland (1819):<\/strong> implied powers; states can't tax the federal bank (\"power to tax is power to destroy\").","<strong>Gibbons v. Ogden (1824):<\/strong> Congress controls interstate commerce. <strong>Dartmouth College (1819):<\/strong> charters are protected contracts.","<strong>Monroe Doctrine (1823):<\/strong> no new European colonization in the Americas; US stays out of Europe; written by <strong>John Quincy Adams<\/strong>.","<strong>Adams–Onís Treaty (1819):<\/strong> Spain cedes Florida. <strong>Convention of 1818:<\/strong> 49th parallel; joint occupation of Oregon.","<strong>Missouri Compromise (1820):<\/strong> Missouri slave, Maine free, no slavery north of <strong>36°30′<\/strong> in the Louisiana Purchase.","<strong>Erie Canal (1825):<\/strong> linked the Great Lakes to New York City; cut freight costs; made NYC the top port.","<strong>Lowell system:<\/strong> young farm women in textile mills, boardinghouses, wages; <strong>Samuel Slater<\/strong> = first mill.","<strong>Election of 1824:<\/strong> the House picks J. Q. Adams over Jackson → \"<strong>corrupt bargain<\/strong>\" (Clay as Secretary of State)."],"timeline":[{"y":"1807","e":"Fulton's steamboat Clermont","th":"E","key":false},{"y":"1810","e":"Fletcher v. Peck","th":"P","key":false},{"y":"1811","e":"National Road begun","th":"E","key":false},{"y":"1816","e":"Second Bank of the US chartered; first protective tariff","th":"E","key":true},{"y":"1817","e":"Rush–Bagot Agreement; Madison vetoes the Bonus Bill","th":"D","key":false},{"y":"1818","e":"Convention of 1818 (49th parallel; joint Oregon)","th":"D","key":false},{"y":"1819","e":"McCulloch v. Maryland; Adams–Onís Treaty; Panic of 1819","th":"P","key":true},{"y":"1820","e":"Missouri Compromise","th":"P","key":true},{"y":"1823","e":"Monroe Doctrine","th":"D","key":true},{"y":"1824","e":"Gibbons v. Ogden","th":"P","key":false},{"y":"1824","e":"\"Corrupt bargain\" election; House chooses J. Q. Adams","th":"P","key":true},{"y":"1825","e":"Erie Canal completed","th":"E","key":true},{"y":"1820s","e":"Lowell mills employ \"mill girls\"","th":"S","key":false},{"y":"1828","e":"\"Tariff of Abominations\"","th":"E","key":false}],"cards":[{"id":"c7-1","u":7,"f":"Era of Good Feelings","b":"Period of one-party (Democratic-Republican) rule under Monroe (1817–1825) after the Federalists' collapse."},{"id":"c7-2","u":7,"f":"American System","b":"Henry Clay's plan: protective tariff, national bank, and internal improvements to unify the national economy."},{"id":"c7-3","u":7,"f":"Tariff of 1816","b":"First US tariff designed mainly to protect American industry rather than raise revenue."},{"id":"c7-4","u":7,"f":"Second Bank of the United States (1816)","b":"National bank chartered after the War of 1812; later the target of Jackson's \"Bank War.\""},{"id":"c7-5","u":7,"f":"Panic of 1819","b":"First major US depression, after a speculative land boom and tightened bank credit; fueled western anger at the Bank."},{"id":"c7-6","u":7,"f":"McCulloch v. Maryland (1819)","b":"Upheld the Bank under implied powers; states cannot tax federal institutions."},{"id":"c7-7","u":7,"f":"Gibbons v. Ogden (1824)","b":"Struck down a New York steamboat monopoly; Congress controls interstate commerce."},{"id":"c7-8","u":7,"f":"Dartmouth College v. Woodward (1819)","b":"A corporate charter is a contract states cannot impair; encouraged business."},{"id":"c7-9","u":7,"f":"John Marshall","b":"Chief Justice 1801–1835; rulings strengthened federal power and protected contracts and property."},{"id":"c7-10","u":7,"f":"Adams–Onís Treaty (1819)","b":"Spain ceded Florida to the US and set the western boundary of the Louisiana Purchase."},{"id":"c7-11","u":7,"f":"Monroe Doctrine (1823)","b":"Declared the Americas closed to new European colonization; US would stay out of European affairs."},{"id":"c7-12","u":7,"f":"Missouri Compromise (1820)","b":"Missouri slave, Maine free; banned slavery in Louisiana Territory north of 36°30′."},{"id":"c7-13","u":7,"f":"\"Fire bell in the night\"","b":"Jefferson's description of the Missouri Crisis as a warning that slavery could split the Union."},{"id":"c7-14","u":7,"f":"Erie Canal (1825)","b":"Canal linking the Hudson River and Great Lakes; cut shipping costs and made New York City dominant."},{"id":"c7-15","u":7,"f":"Market revolution","b":"Shift from subsistence/household production to production for sale, driven by transport and industry."},{"id":"c7-16","u":7,"f":"Lowell system","b":"Massachusetts textile mills employing young farm women housed in supervised boardinghouses."},{"id":"c7-17","u":7,"f":"Samuel Slater","b":"British immigrant who built the first successful American water-powered textile mill (Rhode Island, 1790s)."},{"id":"c7-18","u":7,"f":"Interchangeable parts","b":"Standardized identical components (promoted by Eli Whitney) enabling mass production."},{"id":"c7-19","u":7,"f":"\"Corrupt bargain\" (1824)","b":"Jacksonians' charge that Clay helped J. Q. Adams win the House vote in exchange for Secretary of State."}],"quiz":["q7-1","q7-2","q7-3","q7-4","q7-5","q7-6","q7-7","q7-8","q7-9","q7-10","q7-11","q7-12"]},{"n":8,"title":"Jacksonian Democracy","short":"Jacksonian Democracy","years":"1828–1848","weight":8,"lesson":"<h2>Why this unit matters<\/h2>\n<p><strong>Andrew Jackson<\/strong> dominated an age that historians call the era of the \"<strong>common man<\/strong>.\" Politics became more democratic for white men, a new <strong>two-party system<\/strong> (Democrats vs. Whigs) took shape, and Jackson used presidential power aggressively — against the <strong>Bank<\/strong>, against <strong>South Carolina's nullification<\/strong>, and against <strong>Native nations<\/strong> through <strong>Indian Removal<\/strong>. The exam tests both sides of Jacksonian democracy: expanding participation for some, exclusion and removal for others.<\/p>\n<h2>A more democratic politics — for white men<\/h2>\n<p>Between about 1810 and 1840, most states dropped <strong>property requirements<\/strong> for voting, achieving near-universal <strong>white male suffrage<\/strong>. Several other changes made politics more popular:<\/p>\n<ul><li>Presidential electors came to be chosen by <strong>popular vote<\/strong> in nearly every state rather than by legislatures.<\/li><li><strong>National nominating conventions<\/strong> replaced the \"King Caucus\" of congressmen; the small <strong>Anti-Masonic Party<\/strong> held the first one in 1831.<\/li><li>Campaigns used parades, barbecues, slogans, and cheap <strong>penny newspapers<\/strong>; voter turnout rose dramatically.<\/li><\/ul>\n<p>But democracy had limits. Several states that expanded white male voting <strong>took the vote away from free Black men<\/strong> (Pennsylvania in 1838, for example). Women could not vote anywhere, and Native peoples were being expelled.<\/p>\n<div class=\"tip\"><b>Exam tip:<\/b> A frequent exam trap: Jacksonian democracy expanded voting for <strong>white men only<\/strong>. Answers claiming it broadened rights for women, free Black Americans, or Native peoples are wrong.<\/div>\n<h2>The election of 1828 and Jackson's style<\/h2>\n<p>After the \"corrupt bargain\" of 1824, Jackson's supporters built a new party — the <strong>Democrats<\/strong> — organized largely by <strong>Martin Van Buren<\/strong>. The <strong>1828<\/strong> campaign was famously nasty (opponents attacked Jackson's marriage), and Jackson won easily, the first president from the West and not from Virginia or Massachusetts. Crowds mobbed the White House at his inauguration.<\/p>\n<p>Jackson believed ordinary citizens could hold government jobs and that long-serving officials grew corrupt. He defended \"<strong>rotation in office<\/strong>,\" and his supporters' rewarding of loyal party workers with jobs became known as the <strong>spoils system<\/strong> (\"to the victor belong the spoils\"). He relied on informal advisers, his \"<strong>Kitchen Cabinet<\/strong>,\" and used the <strong>veto<\/strong> more than all previous presidents combined — often for political, not just constitutional, reasons.<\/p>\n<h2>Indian Removal<\/h2>\n<p>By the 1820s, the \"<strong>Five Civilized Tribes<\/strong>\" of the Southeast — <strong>Cherokee, Creek, Choctaw, Chickasaw, and Seminole<\/strong> — held land that white settlers and cotton planters wanted. The Cherokee in particular had adopted many white customs: a written language (created by <strong>Sequoyah<\/strong>), a newspaper, a constitution, and farms (some even owned enslaved people). Georgia nevertheless claimed authority over Cherokee land, especially after gold was found there.<\/p>\n<p>Jackson pushed the <strong>Indian Removal Act (1830)<\/strong>, which funded treaties to move eastern Native nations to \"<strong>Indian Territory<\/strong>\" west of the Mississippi (present-day Oklahoma).<\/p>\n<p>The Cherokee fought in court:<\/p>\n<ul><li><strong>Cherokee Nation v. Georgia (1831):<\/strong> the Supreme Court called the Cherokee a \"<strong>domestic dependent nation<\/strong>\" and said it could not hear the case.<\/li><li><strong>Worcester v. Georgia (1832):<\/strong> Chief Justice <strong>Marshall<\/strong> ruled that Georgia's laws had <strong>no force<\/strong> in Cherokee territory; only the federal government could deal with the Cherokee.<\/li><\/ul>\n<p>Jackson <strong>refused to enforce<\/strong> the ruling (he is quoted, possibly apocryphally, as saying \"John Marshall has made his decision; now let him enforce it\"). A small minority signed the <strong>Treaty of New Echota (1835)<\/strong>, which the Cherokee majority rejected. In <strong>1838<\/strong>, under President Van Buren, the army forced about 16,000 Cherokee west on the <strong>Trail of Tears<\/strong>; roughly <strong>4,000<\/strong> died. Other nations were removed too. The <strong>Seminole<\/strong> resisted in Florida in the long <strong>Second Seminole War<\/strong> (1835–1842), led partly by <strong>Osceola<\/strong>; in the Midwest, the Sauk and Fox were defeated in the <strong>Black Hawk War (1832)<\/strong>.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Settler demand for land and cotton; Georgia claims Cherokee territory<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Indian Removal Act (1830), Worcester v. Georgia ignored, Trail of Tears (1838)<\/div><span>→<\/span><div><b>Consequence<\/b>Southeastern nations forced west to Indian Territory; thousands die; cotton kingdom expands<\/div><\/div>\n<h2>The nullification crisis<\/h2>\n<p>The <strong>Tariff of 1828<\/strong> — the \"<strong>Tariff of Abominations<\/strong>\" — had very high rates protecting northern manufacturers. South Carolina, suffering from falling cotton prices and worn-out soil, blamed the tariff, which raised prices of goods southerners bought and risked British retaliation against cotton.<\/p>\n<p>Vice President <strong>John C. Calhoun<\/strong> of South Carolina anonymously wrote the <strong>South Carolina Exposition and Protest (1828)<\/strong>, arguing — like the Virginia and Kentucky Resolutions — that a state could <strong>nullify<\/strong> (declare void within its borders) a federal law it judged unconstitutional.<\/p>\n<p>In the <strong>Webster–Hayne debate (1830)<\/strong> in the Senate, <strong>Daniel Webster<\/strong> of Massachusetts answered South Carolina's Robert Hayne with a defense of national union: \"<strong>Liberty and Union, now and forever, one and inseparable!<\/strong>\" At a dinner, Jackson made his position clear with a toast: \"Our Federal Union — it must be preserved.\" Calhoun replied, \"The Union, next to our liberty, most dear.\"<\/p>\n<p>When Congress passed the <strong>Tariff of 1832<\/strong> with only modest reductions, South Carolina passed an <strong>Ordinance of Nullification<\/strong> declaring the tariffs void and threatening <strong>secession<\/strong> if the federal government used force. Jackson, though a southerner and slaveholder, called nullification treason and got Congress to pass the <strong>Force Bill (1833)<\/strong>, authorizing him to use the military to collect tariffs. At the same time, Henry Clay arranged the <strong>Compromise Tariff of 1833<\/strong>, gradually lowering rates over ten years. South Carolina repealed its nullification of the tariff (and symbolically nullified the Force Bill). Calhoun <strong>resigned<\/strong> the vice presidency to lead the states' rights cause in the Senate.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>High protective tariffs hurt South Carolina's cotton economy<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Nullification crisis (1832–1833)<\/div><span>→<\/span><div><b>Consequence<\/b>Compromise Tariff + Force Bill; Union preserved, but the states' rights / secession argument grew stronger in the South<\/div><\/div>\n<h2>The Bank War<\/h2>\n<p>Jackson distrusted banks, paper money, and concentrated wealth. He saw the <strong>Second Bank of the United States<\/strong>, headed by <strong>Nicholas Biddle<\/strong>, as an unconstitutional \"<strong>monster<\/strong>\" that served eastern elites and foreign investors at the expense of farmers and workers.<\/p>\n<p>The Bank's charter ran until 1836, but in <strong>1832<\/strong> Henry Clay and Biddle pushed an <strong>early recharter<\/strong> bill through Congress to make it an election issue. Jackson <strong>vetoed<\/strong> it, calling the Bank unconstitutional (despite <em>McCulloch<\/em>) and a tool of privilege. Jackson won the <strong>1832 election<\/strong> overwhelmingly over Clay.<\/p>\n<p>Jackson then \"killed\" the Bank by <strong>removing federal deposits<\/strong> and placing them in state banks loyal to the administration — called \"<strong>pet banks<\/strong>.\" His Treasury Secretary <strong>Roger Taney<\/strong> carried out the removal (Jackson had to fire two secretaries who refused); Jackson later made Taney Chief Justice.<\/p>\n<p>The consequences were serious. Pet banks issued paper money freely, fueling <strong>land speculation<\/strong> and inflation. Alarmed, Jackson issued the <strong>Specie Circular (1836)<\/strong>, requiring that federal land be bought with <strong>gold or silver (specie)<\/strong>. Confidence collapsed, and the <strong>Panic of 1837<\/strong> struck just as <strong>Martin Van Buren<\/strong> took office, bringing a long depression. Van Buren responded with the <strong>Independent Treasury<\/strong> (1840), keeping federal money in government vaults rather than banks.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Jackson views the Bank as an unconstitutional monopoly of the rich<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Bank veto (1832), removal of deposits to pet banks, Specie Circular (1836)<\/div><span>→<\/span><div><b>Consequence<\/b>Speculation, then the Panic of 1837 and depression under Van Buren<\/div><\/div>\n<h2>The second party system: Democrats vs. Whigs<\/h2>\n<p>Opponents of \"<strong>King Andrew I<\/strong>\" formed the <strong>Whig Party<\/strong> in 1834 (named after the British party that opposed royal power). The two parties competed nationally, in both North and South:<\/p>\n<ul><li><strong>Democrats<\/strong> (Jackson, Van Buren): limited federal government, opposition to the national bank and high tariffs, suspicion of concentrated economic power, support for westward expansion. Strong among small farmers, southern planters, urban workers, and <strong>Irish Catholic immigrants<\/strong>.<\/li><li><strong>Whigs<\/strong> (Henry Clay, Daniel Webster): an active federal government promoting economic growth through Clay's <strong>American System<\/strong> — tariffs, a national bank, internal improvements — and a strong <strong>Congress<\/strong> over the presidency. Strong among businessmen, northern merchants, many evangelical <strong>Protestant reformers<\/strong>, and some southern planters.<\/li><\/ul>\n<p>In the <strong>election of 1840<\/strong>, Whigs beat Van Buren, blamed for the depression, by copying Democratic tactics. They ran war hero <strong>William Henry Harrison<\/strong> as a humble man of the people with a \"<strong>log cabin and hard cider<\/strong>\" campaign and the slogan \"<strong>Tippecanoe and Tyler Too<\/strong>\" — even though Harrison came from a wealthy Virginia family. Turnout reached about 80%. Harrison died a month after his inauguration, and Vice President <strong>John Tyler<\/strong>, a former Democrat and states' rights southerner, vetoed most Whig bills, including a new national bank. His own party expelled him.<\/p>\n<p>Tyler's secretary of state, Daniel Webster, negotiated the <strong>Webster–Ashburton Treaty (1842)<\/strong> with Britain, settling the <strong>Maine–Canada border<\/strong>.<\/p>\n<h2>The Taney Court<\/h2>\n<p>Chief Justice <strong>Roger Taney<\/strong> (1836–1864) moved the Court away from Marshall's protections of existing corporate privileges. In <strong>Charles River Bridge v. Warren Bridge (1837)<\/strong>, the Court ruled that a charter did not give an old bridge company a monopoly when the community would benefit from a new bridge — favoring <strong>competition and the public interest<\/strong> over exclusive privileges. Taney is best known, however, for the <strong>Dred Scott<\/strong> decision (Unit 10).<\/p>\n<h2>Assessing Jackson<\/h2>\n<p>Jackson expanded <strong>presidential power<\/strong>, strengthened party politics, and championed the \"common man\" against privilege. But his era also produced Indian Removal, the defense of slavery, and economic instability. On exams, expect to weigh both sides.<\/p>","words":1737,"minutes":12,"must":["Jacksonian democracy = <strong>universal white male suffrage<\/strong> (property tests dropped), nominating conventions, mass campaigns — but free Black men lost votes in some states; women excluded.","<strong>Spoils system / rotation in office<\/strong>; <strong>Kitchen Cabinet<\/strong>; frequent <strong>vetoes<\/strong>.","<strong>Indian Removal Act (1830)<\/strong> → <strong>Worcester v. Georgia (1832)<\/strong> (Georgia law void; Jackson ignored it) → <strong>Trail of Tears (1838)<\/strong>, ~4,000 Cherokee deaths.","<strong>Cherokee Nation v. Georgia (1831):<\/strong> \"domestic dependent nation.\"","<strong>Nullification crisis:<\/strong> <strong>Tariff of Abominations (1828)<\/strong>, Calhoun's <em>Exposition and Protest<\/em>, SC nullifies (1832), <strong>Force Bill<\/strong> + <strong>Compromise Tariff (1833)<\/strong>.","<strong>Webster–Hayne debate (1830):<\/strong> \"Liberty and Union, now and forever, one and inseparable!\"","<strong>Bank War:<\/strong> Jackson <strong>vetoed recharter (1832)<\/strong>, moved deposits to <strong>pet banks<\/strong>, <strong>Specie Circular (1836)<\/strong> → <strong>Panic of 1837<\/strong> (Van Buren).","<strong>Whigs<\/strong> (Clay, Webster: American System, strong Congress) vs. <strong>Democrats<\/strong> (Jackson: limited government, anti-Bank).","<strong>Election of 1840:<\/strong> \"log cabin and hard cider,\" \"Tippecanoe and Tyler Too.\"","<strong>Charles River Bridge (1837):<\/strong> Taney Court favors community interest and competition over monopoly."],"timeline":[{"y":"1828","e":"Jackson elected; Tariff of Abominations; Calhoun's Exposition and Protest","th":"P","key":true},{"y":"1830","e":"Indian Removal Act; Webster–Hayne debate","th":"P","key":true},{"y":"1831","e":"Cherokee Nation v. Georgia; first national nominating convention","th":"P","key":false},{"y":"1832","e":"Worcester v. Georgia; Bank recharter veto; South Carolina nullification","th":"P","key":true},{"y":"1832","e":"Black Hawk War","th":"D","key":false},{"y":"1833","e":"Force Bill and Compromise Tariff end the nullification crisis","th":"P","key":true},{"y":"1834","e":"Whig Party formed","th":"P","key":false},{"y":"1835–1842","e":"Second Seminole War","th":"D","key":false},{"y":"1836","e":"Specie Circular","th":"E","key":false},{"y":"1837","e":"Panic of 1837; Charles River Bridge decision","th":"E","key":false},{"y":"1838","e":"Trail of Tears","th":"S","key":true},{"y":"1840","e":"\"Log cabin\" campaign; Harrison elected","th":"P","key":true},{"y":"1842","e":"Webster–Ashburton Treaty","th":"D","key":false}],"cards":[{"id":"c8-1","u":8,"f":"White male suffrage","b":"Elimination of property requirements for voting by most states (1810s–1840s); excluded women and often free Black men."},{"id":"c8-2","u":8,"f":"Spoils system","b":"Rewarding party supporters with government jobs; defended by Jackson as \"rotation in office.\""},{"id":"c8-3","u":8,"f":"Kitchen Cabinet","b":"Jackson's informal group of trusted advisers outside the official cabinet."},{"id":"c8-4","u":8,"f":"Indian Removal Act (1830)","b":"Authorized treaties to move eastern Native nations to Indian Territory west of the Mississippi."},{"id":"c8-5","u":8,"f":"Worcester v. Georgia (1832)","b":"Marshall ruled Georgia's laws had no force over the Cherokee; Jackson refused to enforce it."},{"id":"c8-6","u":8,"f":"Cherokee Nation v. Georgia (1831)","b":"Court called the Cherokee a \"domestic dependent nation\" and declined jurisdiction."},{"id":"c8-7","u":8,"f":"Trail of Tears (1838)","b":"Forced removal of the Cherokee to Indian Territory; about 4,000 died."},{"id":"c8-8","u":8,"f":"Tariff of Abominations (1828)","b":"Very high protective tariff that angered the South and triggered the nullification crisis."},{"id":"c8-9","u":8,"f":"Nullification","b":"Theory that a state can declare a federal law void within its borders (Calhoun; South Carolina 1832)."},{"id":"c8-10","u":8,"f":"Force Bill (1833)","b":"Authorized Jackson to use military force to collect tariffs in South Carolina."},{"id":"c8-11","u":8,"f":"Compromise Tariff of 1833","b":"Clay's gradual tariff reduction that ended the nullification crisis."},{"id":"c8-12","u":8,"f":"Webster–Hayne debate (1830)","b":"Senate debate on states' rights; Webster: \"Liberty and Union, now and forever, one and inseparable!\""},{"id":"c8-13","u":8,"f":"Bank War","b":"Jackson's fight against the Second Bank: 1832 recharter veto, removal of deposits to state \"pet banks.\""},{"id":"c8-14","u":8,"f":"Specie Circular (1836)","b":"Jackson's order requiring gold or silver for federal land purchases; helped trigger the Panic of 1837."},{"id":"c8-15","u":8,"f":"Panic of 1837","b":"Severe depression under Van Buren after speculation and the Specie Circular."},{"id":"c8-16","u":8,"f":"Whig Party","b":"Formed 1834 against \"King Andrew\"; Clay and Webster; favored the American System and a strong Congress."},{"id":"c8-17","u":8,"f":"Election of 1840","b":"Whig William Henry Harrison won with the \"log cabin and hard cider\" campaign; \"Tippecanoe and Tyler Too.\""},{"id":"c8-18","u":8,"f":"Charles River Bridge v. Warren Bridge (1837)","b":"Taney Court held that community interest and competition outweighed an implied monopoly."}],"quiz":["q8-1","q8-2","q8-3","q8-4","q8-5","q8-6","q8-7","q8-8","q8-9","q8-10","q8-11","q8-12"]},{"n":9,"title":"Antebellum Society, Reform & Slavery","short":"Reform & Slavery","years":"1820–1860","weight":10,"lesson":"<h2>Why this unit matters<\/h2>\n<p>\"Antebellum\" means \"before the war.\" Between 1820 and 1860, Americans built a remarkable culture of <strong>religious revival<\/strong>, <strong>reform movements<\/strong>, and <strong>literature<\/strong> — while the South built an economy ever more dependent on <strong>slavery<\/strong>. This unit carries much of the exam's <strong>cultural/intellectual<\/strong> and <strong>social<\/strong> weight. Expect matching questions (<em>reformer → cause<\/em>, <em>writer → work<\/em>) and cause-effect questions linking <strong>revivalism to reform<\/strong>.<\/p>\n<h2>The Second Great Awakening<\/h2>\n<p>The <strong>Second Great Awakening<\/strong> (roughly 1790s–1840s) was a wave of Protestant revivals larger than the first. Frontier <strong>camp meetings<\/strong> — like the huge gathering at <strong>Cane Ridge, Kentucky (1801)<\/strong> — drew thousands. The most famous revivalist, <strong>Charles Grandison Finney<\/strong>, held emotional meetings across western New York, a region swept by so many revivals it w
