/* ---------- study plan ---------- */
function planTasks(){
  const H=DATA.meta.hours, t=[];
  if(!S.diag) t.push({l:'Diagnostic test (30 Q)',h:H.diag,href:'#diag'});
  U.forEach((u,i)=>{
    const f=diagFactor(u.n), base=unitHours(u.n)*f, cs=cardStats(u.cards), lab=diagLabel(u.n);
    const tag=lab==='skim'?' (skim)':'';
    if(!S.read[u.n]) t.push({l:`Unit ${u.n} lesson${tag}: ${u.short}`,h:base*.45,href:'#unit/'+u.n});
    if(!S.quiz[u.n]) t.push({l:`Unit ${u.n} quiz + review explanations`,h:base*.3,href:'#unit/'+u.n+'/quiz'});
    if(cs.learned<cs.total) t.push({l:`Unit ${u.n} flashcards`,h:base*.25*(1-cs.learned/Math.max(1,cs.total)),href:'#unit/'+u.n+'/cards'});
    if((i+1)%4===0) t.push({l:'Cumulative review: due flashcards + mistake log',h:.5,href:'#mistakes'});
  });
  t.push({l:'Mistake-log drill + redraw the cheat sheet from memory',h:H.final,href:'#cheat'});
  return t.filter(x=>x.h>0.04);
}
function makePlan(hpd,examDay){
  const today=TODAY(), days=[];
  const nDays=examDay-today; if(nDays<1) return {err:'Pick an exam date after today.'};
  const tasks=planTasks().map(x=>Object.assign({},x));
  const H=DATA.meta.hours;
  const examSlots = nDays>=3 ? [examDay-2,examDay-1] : nDays===2 ? [examDay-2,examDay-1] : [examDay-1,examDay-1];
  const lastStudy = Math.min(...examSlots); // content days: today .. lastStudy-1 (or same day if squeezed)
  const contentDays=Math.max(1,lastStudy-today);
  const need=tasks.reduce((a,b)=>a+b.h,0), cap=contentDays*hpd;
  for(let d=today; d<=examDay; d++) days.push({d,items:[]});
  const at=d=>days[d-today];
  let di=today, room=hpd;
  for(const tk of tasks){
    let h=tk.h, part=0;
    while(h>0.04){
      if(di>=lastStudy && lastStudy>today){ at(lastStudy-1).items.push({l:tk.l+(part?' (cont.)':''),h,href:tk.href,over:true}); h=0; break; }
      const take=Math.min(h,room);
      if(take>0.04){at(di).items.push({l:tk.l+(part?' (cont.)':''),h:take,href:tk.href}); h-=take; room-=take; part++;}
      if(room<=0.04){di++; room=hpd;}
      if(lastStudy===today&&di>today){at(today).items.push({l:tk.l,h,href:tk.href,over:true});h=0;}
    }
  }
  for(let d=di+(room<hpd?1:0); d<lastStudy; d++) if(!at(d).items.length) at(d).items.push({l:'Review: retake your 2 weakest unit quizzes, due flashcards, mistake log',h:Math.min(hpd,1.5),href:'#mistakes'});
  const ex=(k,d)=>{ if(!S.exams[k]) at(d).items.push({l:`Practice exam ${k===1?'A':'B'} (90 min, timed) + review every miss`,h:H.exam,href:'#exam/'+k}); else at(d).items.push({l:`Practice exam ${k===1?'A':'B'} done (${S.exams[k].score}%) — retake weakest units' quizzes`,h:1,href:'#mistakes'}); };
  ex(1,examSlots[0]); ex(2,examSlots[1]);
  at(examDay).items.push({l:'EXAM DAY — 20-minute cheat-sheet skim, then go. No new material.',h:.3,href:'#cheat'});
  return {days:days.filter(x=>x.items.length),need,cap,contentDays,warn: need>cap?`This plan needs about ${need.toFixed(1)} h of content before the practice exams but you have ${cap.toFixed(1)} h. Increase to ~${Math.ceil(10*need/contentDays)/10} h/day or move the date.`:''};
}
function planHTML(p){
  if(p.err) return `<p class="fb bad">${esc(p.err)}</p>`;
  const t=TODAY();
  return `${p.warn?`<div class="banner">${esc(p.warn)}</div>`:`<p class="small muted">Content left: ${p.need.toFixed(1)} h across ${p.contentDays} study day(s), then the two practice exams.</p>`}
  ${p.days.map(x=>`<div class="plan-day ${x.d===t?'today':''}"><div><b>${fmtDay(x.d)}</b>${x.d===t?'<div class="tiny">today</div>':''}<div class="tiny muted">${x.items.reduce((a,b)=>a+b.h,0).toFixed(1)} h</div></div>
   <ul>${x.items.map(i=>`<li><a href="${i.href}">${esc(i.l)}</a> <span class="muted small">· ${Math.round(i.h*60)} min${i.over?' · over budget':''}</span></li>`).join('')}</ul></div>`).join('')}`;
}
function planToday(){
  if(!S.plan) return '';
  const p=makePlan(S.plan.hpd,S.plan.day); if(p.err) return '';
  const d=p.days.find(x=>x.d===TODAY()); if(!d) return '';
  return `<div class="card" style="margin-bottom:14px"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Today’s plan</h2><a class="small" href="#plan">full schedule</a></div>
  <ul style="margin:8px 0 0;padding-left:1.1em">${d.items.map(i=>`<li><a href="${i.href}">${esc(i.l)}</a> <span class="muted small">· ${Math.round(i.h*60)} min</span></li>`).join('')}</ul></div>`;
}
function viewPlan(v){
  const p=S.plan, def=new Date(Date.now()+21*864e5).toISOString().slice(0,10);
  const dstr=p?new Date(p.day*864e5).toISOString().slice(0,10):def;
  v.innerHTML=`<h1>Study plan</h1><div class="card"><p class="small" style="margin-top:0">Builds a day-by-day schedule from what you have <i>not</i> finished yet, weighted by the exam outline and your diagnostic (skim units get ~55% of the time, must-study units ~115%). Practice exams land 2 days and 1 day before the exam. Regenerate any time — it adapts to your progress.</p>
  <div class="row"><label class="f">Hours per day<input type="number" id="hpd" min="0.5" max="12" step="0.5" value="${p?p.hpd:1.5}"></label>
  <label class="f">Exam date<input type="date" id="edate" value="${dstr}"></label><button class="btn pri" id="mk" style="align-self:flex-end">Generate plan</button></div>
  <p class="small muted">Total budget for a beginner: ≈ ${DATA.meta.hours.total} h. Currently left: ≈ ${hoursLeft().toFixed(1)} h.</p></div><div class="card" id="pl" style="margin-top:14px"></div>`;
  const show=()=>{ if(!S.plan){$('#pl').innerHTML='<p class="muted">Enter your hours and date, then generate.</p>';return;} $('#pl').innerHTML=planHTML(makePlan(S.plan.hpd,S.plan.day)); };
  $('#mk').onclick=()=>{const h=+$('#hpd').value, ds=$('#edate').value; if(!(h>0)||!ds){alert('Enter hours per day and a date.');return;}
    const [y,m,d]=ds.split('-').map(Number); S.plan={hpd:h,day:dayNum(new Date(y,m-1,d))}; save(); show();};
  show();
}

/* ---------- about / data ---------- */

  const M=DATA.meta, st=s=>s==='verified-via-search'?'<span class="pill acc" title="Confirmed from search-indexed text of the official page">verified (search)</span>':'<span class="unver">unverified</span>';
  const counts=U.map(u=>{const all=Object.values(Q).filter(q=>q.u===u.n).length;return `<tr><td>${u.n}. ${esc(u.short)}</td><td>${u.weight}%</td><td>1 (${u.minutes} min)</td><td>${u.quiz.length}</td><td>${all}</td><td>${pct(all,Object.keys(Q).length)}%</td><td>${u.cards.length}</td><td>${pct(u.cards.length,allCards().length)}%</td></tr>`}).join('');

   <p class="small muted">${esc(M.note)}</p>
   <p class="small">Sources: ${M.sources.map(s=>`<a href="${s.url}" target="_blank" rel="noopener">${esc(s.label)}</a>`).join(' · ')}</p></div>
  <div class="card" style="margin-top:14px"><h2>Official topical weights vs. this guide’s question bank</h2><div class="tbl-wrap"><table><tr><th>Category</th><th>Official</th><th>Questions</th><th>Share</th></tr>${thc}</table></div></div>
  <div class="card" style="margin-top:14px"><h2>Content budget by unit</h2><div class="tbl-wrap"><table><tr><th>Unit</th><th>Weight</th><th>Lesson</th><th>Quiz Q</th><th>All Q</th><th>Q share</th><th>Cards</th><th>Card share</th></tr>${counts}</table></div>
   <p class="small muted">Totals: ${Object.keys(Q).length} original questions (quiz ${U.reduce((a,u)=>a+u.quiz.length,0)} · diagnostic ${DATA.diag.length} · exam A ${DATA.exams[0].length} · exam B ${DATA.exams[1].length}, no overlap), ${allCards().length} flashcards. Questions are original, written for this guide.</p></div>
  <div class="card" style="margin-top:14px"><h2>Your data</h2><p class="small">Progress is saved in this browser (localStorage)${storageOK?'':' — <b>currently blocked</b>'}. Export a JSON backup to move between devices.</p>
   <div class="row"><button class="btn pri" id="exp">Export progress (.json)</button><label class="btn">Import progress<input type="file" id="imp" accept="application/json,.json" class="hide"></label><button class="btn" id="rst">Reset everything</button></div></div>`;
  $('#exp').onclick=()=>{const b=new Blob([JSON.stringify({app:KEY,exported:new Date().toISOString(),state:S},null,1)],{type:'application/json'});const a=document.createElement('a');a.href=URL.createObjectURL(b);a.download='clep-ush1-progress-'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);};
  $('#imp').onchange=e=>{const f=e.target.files[0]; if(!f) return; const r=new FileReader(); r.onload=()=>{try{const o=JSON.parse(r.result); const st=o.state||o; if(typeof st!=='object'||!('read' in st)) throw new Error('Not a progress file'); S=Object.assign(defState(),st); save(); applyTheme(); alert('Progress imported.'); location.hash='#home'; route();}catch(err){alert('Could not import: '+err.message)}}; r.readAsText(f);};
  $('#rst').onclick=()=>{if(confirm('Erase all progress? Export first if unsure.')){S=defState();save();applyTheme();route();}};
}
