g> (British view) vs. <strong>actual representation<\/strong> (colonial view).","<strong>Townshend Acts (1767)<\/strong> duties on imports → <strong>Boston Massacre (1770)<\/strong>; all repealed but the <strong>tea<\/strong> tax.","<strong>Tea Act (1773)<\/strong> → <strong>Boston Tea Party<\/strong> → <strong>Coercive/Intolerable Acts (1774)<\/strong> → <strong>First Continental Congress<\/strong>.","<strong>Lexington and Concord (April 1775)<\/strong> start the war; <strong>Olive Branch Petition<\/strong> = last attempt at reconciliation.","<strong>Common Sense (Jan. 1776)<\/strong>, Thomas Paine: attacked monarchy, pushed independence.","<strong>Declaration of Independence:<\/strong> Jefferson, Locke's natural rights, grievances against <strong>George III<\/strong>.","<strong>Saratoga (1777)<\/strong> = turning point → <strong>French alliance (1778)<\/strong>. <strong>Yorktown (1781)<\/strong> = Cornwallis surrenders.","<strong>Treaty of Paris (1783):<\/strong> independence; western border at the <strong>Mississippi<\/strong>."],"timeline":[{"y":"1763","e":"Pontiac's Rebellion; Proclamation of 1763","th":"P","key":true},{"y":"1764","e":"Sugar Act and Currency Act","th":"E","key":false},{"y":"1765","e":"Stamp Act; Stamp Act Congress; Quartering Act","th":"P","key":true},{"y":"1766","e":"Stamp Act repealed; Declaratory Act","th":"P","key":false},{"y":"1767","e":"Townshend Acts","th":"E","key":false},{"y":"1770","e":"Boston Massacre","th":"S","key":true},{"y":"1772","e":"Committees of correspondence formed","th":"P","key":false},{"y":"1773","e":"Tea Act; Boston Tea Party","th":"E","key":true},{"y":"1774","e":"Coercive (Intolerable) Acts; First Continental Congress","th":"P","key":true},{"y":"1775","e":"Lexington and Concord; Second Continental Congress; Olive Branch Petition","th":"D","key":true},{"y":"1776","e":"Paine's Common Sense (January)","th":"C","key":false},{"y":"1776","e":"Declaration of Independence (July 4)","th":"P","key":true},{"y":"1777","e":"Battle of Saratoga — turning point","th":"D","key":true},{"y":"1778","e":"Franco-American alliance","th":"D","key":false},{"y":"1780","e":"Pennsylvania passes gradual emancipation","th":"S","key":false},{"y":"1781","e":"Cornwallis surrenders at Yorktown","th":"D","key":true},{"y":"1783","e":"Treaty of Paris recognizes independence","th":"D","key":true}],"cards":[{"id":"c4-1","u":4,"f":"Proclamation of 1763","b":"British order forbidding colonial settlement west of the Appalachian Mountains, issued after Pontiac's Rebellion."},{"id":"c4-2","u":4,"f":"Pontiac's Rebellion (1763)","b":"Ottawa-led Native uprising against British forts and settlers in the Ohio Valley and Great Lakes region."},{"id":"c4-3","u":4,"f":"Sugar Act (1764)","b":"Lowered the molasses duty but strictly enforced it; smugglers tried in vice-admiralty courts without juries."},{"id":"c4-4","u":4,"f":"Stamp Act (1765)","b":"First direct tax on colonists (printed papers); sparked the Stamp Act Congress and boycotts; repealed 1766."},{"id":"c4-5","u":4,"f":"Virtual representation","b":"British claim that Parliament represented all British subjects, including colonists who elected no members."},{"id":"c4-6","u":4,"f":"Declaratory Act (1766)","b":"Passed with Stamp Act repeal; asserted Parliament's authority over the colonies \"in all cases whatsoever.\""},{"id":"c4-7","u":4,"f":"Townshend Acts (1767)","b":"Import duties on glass, lead, paint, paper, and tea; revenue paid royal officials; repealed in 1770 except tea."},{"id":"c4-8","u":4,"f":"Boston Massacre (1770)","b":"British soldiers killed five colonists including Crispus Attucks; John Adams defended the soldiers."},{"id":"c4-9","u":4,"f":"Committees of correspondence","b":"Networks (Samuel Adams, 1772) that spread news and coordinated resistance across towns and colonies."},{"id":"c4-10","u":4,"f":"Coercive (Intolerable) Acts (1774)","b":"Punished Boston for the Tea Party — closed the port, limited Massachusetts self-government."},{"id":"c4-11","u":4,"f":"First Continental Congress (1774)","b":"Delegates from 12 colonies; endorsed boycotts via the Continental Association; sought rights, not independence."},{"id":"c4-12","u":4,"f":"Olive Branch Petition (1775)","b":"Second Continental Congress's final appeal to George III for reconciliation; he rejected it."},{"id":"c4-13","u":4,"f":"Common Sense (1776)","b":"Thomas Paine's pamphlet attacking monarchy and urging independence in plain language."},{"id":"c4-14","u":4,"f":"Declaration of Independence","b":"July 4, 1776; Jefferson; natural rights and consent of the governed; grievances against George III."},{"id":"c4-15","u":4,"f":"Saratoga (1777)","b":"American victory that convinced France to ally with the United States — the war's turning point."},{"id":"c4-16","u":4,"f":"Yorktown (1781)","b":"Cornwallis surrenders to American and French forces aided by the French navy; ends major fighting."},{"id":"c4-17","u":4,"f":"Treaty of Paris (1783)","b":"Britain recognizes US independence with boundaries to the Mississippi River."},{"id":"c4-18","u":4,"f":"Loyalists","b":"Colonists (about one-fifth) who remained loyal to Britain; many emigrated to Canada or Britain."}],"quiz":["q4-1","q4-2","q4-3","q4-4","q4-5","q4-6","q4-7","q4-8","q4-9","q4-10","q4-11","q4-12"]},{"n":5,"title":"Confederation & Constitution","short":"Constitution","years":"1781–1789","weight":5,"lesson":"<h2>Why this unit matters<\/h2>\n<p>Having rejected a powerful king and Parliament, Americans first built a <strong>deliberately weak<\/strong> national government — the <strong>Articles of Confederation<\/strong>. Its failures led to the <strong>Constitution of 1787<\/strong>. The exam tests the <strong>weaknesses of the Articles<\/strong>, its one big success (the <strong>Northwest Ordinance<\/strong>), <strong>Shays' Rebellion<\/strong>, the <strong>compromises<\/strong> of the Constitutional Convention, and the <strong>Federalist vs. Anti-Federalist<\/strong> debate. Think of it as a story: <em>fear of tyranny → too-weak government → crisis → stronger but limited government<\/em>.<\/p>\n<h2>State constitutions first<\/h2>\n<p>After 1776, each state wrote a <strong>written constitution<\/strong> — a new idea, since Britain's constitution was unwritten. Most included a <strong>bill of rights<\/strong>, made the <strong>legislature<\/strong> the strongest branch, and kept <strong>governors weak<\/strong>, reflecting distrust of executive power after George III. Massachusetts (1780) pioneered having a special <strong>convention<\/strong> write the constitution and the people ratify it — the model later used for the federal Constitution.<\/p>\n<h2>The Articles of Confederation (ratified 1781)<\/h2>\n<p>Drafted in 1777, the <strong>Articles of Confederation<\/strong> created a \"<strong>firm league of friendship<\/strong>\" among sovereign states. Ratification was delayed until <strong>1781<\/strong> because <strong>Maryland<\/strong> refused to sign until states with western land claims (like Virginia) gave those lands to the national government.<\/p>\n<p>How it worked:<\/p>\n<ul><li>A <strong>one-house (unicameral) Congress<\/strong>; each state had <strong>one vote<\/strong>, regardless of population.<\/li><li><strong>No executive<\/strong> (no president) and <strong>no national courts<\/strong>.<\/li><li>Major laws needed <strong>9 of 13<\/strong> states; amendments needed <strong>all 13<\/strong> (unanimity).<\/li><li>Congress could make war and treaties, borrow money, and run a postal system.<\/li><li>But Congress <strong>could not tax<\/strong> (it could only request money from the states), <strong>could not regulate interstate or foreign commerce<\/strong>, and <strong>could not force states<\/strong> to obey.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Fear of centralized tyranny after the Revolution<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Articles create a weak league of sovereign states<\/div><span>→<\/span><div><b>Consequence<\/b>National government cannot tax, pay debts, regulate trade, or enforce its laws<\/div><\/div>\n<h2>The great success: western lands<\/h2>\n<p>Congress handled the western lands well — its most lasting achievement.<\/p>\n<ul><li><strong>Land Ordinance of 1785:<\/strong> surveyed the Northwest Territory into <strong>townships<\/strong> six miles square, each divided into 36 sections; one section in each township was reserved to support <strong>public schools<\/strong>. Land sales were meant to pay the national debt.<\/li><li><strong>Northwest Ordinance of 1787:<\/strong> created a government for the territory north of the Ohio River and set a path to <strong>statehood on equal footing<\/strong> with the original states (when a territory reached 60,000 free inhabitants). It <strong>banned slavery<\/strong> in the Northwest Territory, protected religious freedom and trial by jury, and encouraged education.<\/li><\/ul>\n<div class=\"tip\"><b>Exam tip:<\/b> The Northwest Ordinance is a classic test item: <em>equal statehood<\/em> + <em>ban on slavery north of the Ohio River<\/em> + <em>the Articles' greatest achievement<\/em>.<\/div>\n<h2>Troubles of the 1780s<\/h2>\n<ul><li><strong>Money and debt:<\/strong> Congress could not pay soldiers or foreign loans; states printed paper money that lost value.<\/li><li><strong>Trade:<\/strong> states taxed one another's goods; Britain closed its West Indies ports to American ships.<\/li><li><strong>Foreign weakness:<\/strong> Britain kept <strong>forts in the Northwest<\/strong> despite the peace treaty; <strong>Spain closed the Mississippi River<\/strong> and New Orleans to American trade; <strong>Barbary pirates<\/strong> of North Africa seized American ships.<\/li><\/ul>\n<p>The crisis that shocked leaders was <strong>Shays' Rebellion (1786–1787)<\/strong>. In western Massachusetts, farmers — many Revolutionary veterans — faced high state taxes, debts, and the <strong>foreclosure<\/strong> of their farms. Led by <strong>Daniel Shays<\/strong>, they closed courts to stop foreclosures and marched on the federal arsenal at Springfield. The national government <strong>could not respond<\/strong>; Massachusetts merchants funded a state militia that crushed the rebellion.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Debt, high state taxes, and farm foreclosures<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Shays' Rebellion (1786–1787)<\/div><span>→<\/span><div><b>Consequence<\/b>Leaders fear disorder and call for a stronger national government at the Philadelphia Convention<\/div><\/div>\n<p>A meeting on trade at the <strong>Annapolis Convention (1786)<\/strong> drew only five states, but <strong>Alexander Hamilton<\/strong> and <strong>James Madison<\/strong> used it to call for a broader convention in Philadelphia in 1787.<\/p>\n<h2>The Constitutional Convention (1787)<\/h2>\n<p>Fifty-five delegates met in Philadelphia from May to September 1787, with <strong>George Washington<\/strong> presiding. <strong>James Madison<\/strong> did so much of the planning that he is called the \"<strong>Father of the Constitution<\/strong>.\" They quickly decided to replace the Articles rather than revise them, and worked in secret.<\/p>\n<p>The key debates ended in compromises:<\/p>\n<ul><li><strong>Representation:<\/strong> The <strong>Virginia Plan<\/strong> (Madison; favored large states) proposed a two-house legislature with representation by <strong>population<\/strong>. The <strong>New Jersey Plan<\/strong> (favored small states) kept one house with <strong>equal<\/strong> votes per state. The <strong>Great (Connecticut) Compromise<\/strong>, proposed by <strong>Roger Sherman<\/strong>, created a <strong>House of Representatives<\/strong> based on population and a <strong>Senate<\/strong> with <strong>two senators per state<\/strong>.<\/li><li><strong>Slavery and representation:<\/strong> The <strong>Three-Fifths Compromise<\/strong> counted three-fifths of the enslaved population for both representation and direct taxes — boosting southern power in the House and Electoral College.<\/li><li><strong>Slave trade:<\/strong> Congress could not ban the <strong>international slave trade before 1808<\/strong> (it did so in 1808). A <strong>fugitive slave clause<\/strong> required the return of escaped enslaved people. The word \"slavery\" never appears.<\/li><li><strong>Commerce:<\/strong> Congress could regulate interstate and foreign trade, but could <strong>not tax exports<\/strong> (a concession to southern exporters).<\/li><li><strong>Choosing a president:<\/strong> the <strong>Electoral College<\/strong>, a compromise between election by Congress and by direct popular vote.<\/li><\/ul>\n<h2>Principles of the Constitution<\/h2>\n<ul><li><strong>Popular sovereignty:<\/strong> power comes from the people (\"We the People\").<\/li><li><strong>Federalism:<\/strong> power divided between national and state governments; the <strong>supremacy clause<\/strong> makes the Constitution and federal laws the \"supreme law of the land.\"<\/li><li><strong>Separation of powers<\/strong> among legislative, executive, and judicial branches, with <strong>checks and balances<\/strong> (veto, veto override, Senate confirmation, impeachment).<\/li><li><strong>Limited government<\/strong> and an <strong>amendment process<\/strong> (two-thirds of Congress, three-fourths of states).<\/li><li>Congress gained the powers the Articles lacked: to <strong>tax<\/strong>, <strong>regulate commerce<\/strong>, and make laws \"<strong>necessary and proper<\/strong>\" for its powers.<\/li><\/ul>\n<h2>Ratification: Federalists vs. Anti-Federalists<\/h2>\n<p>The Constitution required approval by <strong>9 of 13<\/strong> state conventions. A fierce debate followed.<\/p>\n<ul><li><strong>Federalists<\/strong> supported the Constitution. Hamilton, Madison, and John Jay wrote <strong>The Federalist Papers<\/strong> (85 essays) to win over New York. In <strong>Federalist No. 10<\/strong>, Madison argued that a <strong>large republic<\/strong> would control <strong>factions<\/strong> because so many interests would check each other. Federalists tended to be merchants, urban dwellers, and the well-educated.<\/li><li><strong>Anti-Federalists<\/strong> — including <strong>Patrick Henry<\/strong> and <strong>George Mason<\/strong> — feared the strong central government would crush the states and individual liberty, that a president might become a king, and above all that the Constitution lacked a <strong>bill of rights<\/strong>. They were often small farmers and backcountry people.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Anti-Federalist fear that the Constitution lacked protection for individual liberties<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Federalists promise to add amendments<\/div><span>→<\/span><div><b>Consequence<\/b>Bill of Rights (ratified 1791)<\/div><\/div>\n<p><strong>New Hampshire<\/strong> became the ninth state in June <strong>1788<\/strong>, putting the Constitution into effect, but the large states of <strong>Virginia<\/strong> and <strong>New York<\/strong> ratified only narrowly after Federalists promised a bill of rights. North Carolina and Rhode Island joined after the new government began. <strong>George Washington<\/strong> was inaugurated in <strong>1789<\/strong>, and Madison drafted the <strong>Bill of Rights<\/strong> — the first ten amendments, ratified in <strong>1791<\/strong> (covered in Unit 6).<\/p>","words":1332,"minutes":9,"must":["<strong>Articles of Confederation (1781):<\/strong> one-house Congress, one vote per state, <strong>no power to tax or regulate commerce<\/strong>, no executive or courts, amendments need unanimity.","<strong>Northwest Ordinance (1787):<\/strong> path to statehood on equal footing; <strong>banned slavery<\/strong> north of the Ohio River — the Articles' biggest success.","<strong>Land Ordinance of 1785:<\/strong> townships surveyed; a section reserved for schools.","<strong>Shays' Rebellion (1786–87):<\/strong> indebted Massachusetts farmers revolt → proves the Articles too weak.","<strong>Great (Connecticut) Compromise:<\/strong> House by population + Senate equal (Roger Sherman).","<strong>Three-Fifths Compromise:<\/strong> three-fifths of enslaved people counted for representation and taxation.","Slave trade could not be banned <strong>before 1808<\/strong>; Congress could not tax exports.","<strong>Federalists<\/strong> (Hamilton, Madison, Jay; <em>The Federalist Papers<\/em>, No. 10 on factions) vs. <strong>Anti-Federalists<\/strong> (Patrick Henry, George Mason; wanted a bill of rights).","<strong>Madison<\/strong> = \"Father of the Constitution\"; ratified 1788 (9 states); Bill of Rights 1791."],"timeline":[{"y":"1777","e":"Articles of Confederation drafted","th":"P","key":false},{"y":"1780","e":"Massachusetts constitution ratified by the people","th":"P","key":false},{"y":"1781","e":"Articles of Confederation ratified","th":"P","key":true},{"y":"1785","e":"Land Ordinance surveys the Northwest","th":"E","key":false},{"y":"1786","e":"Annapolis Convention","th":"P","key":false},{"y":"1786–1787","e":"Shays' Rebellion in Massachusetts","th":"S","key":true},{"y":"1787","e":"Constitutional Convention in Philadelphia","th":"P","key":true},{"y":"1787","e":"Northwest Ordinance","th":"P","key":true},{"y":"1787–1788","e":"The Federalist Papers published","th":"C","key":false},{"y":"1788","e":"Constitution ratified (New Hampshire is the ninth state)","th":"P","key":true},{"y":"1789","e":"Washington inaugurated","th":"P","key":true},{"y":"1791","e":"Bill of Rights ratified","th":"P","key":false}],"cards":[{"id":"c5-1","u":5,"f":"Articles of Confederation","b":"First US national government (1781–1789): unicameral Congress, one vote per state, no power to tax or regulate trade, no executive."},{"id":"c5-2","u":5,"f":"Northwest Ordinance (1787)","b":"Organized the Northwest Territory, set a path to equal statehood, and banned slavery north of the Ohio River."},{"id":"c5-3","u":5,"f":"Land Ordinance of 1785","b":"Surveyed western land into 6-mile-square townships of 36 sections, reserving one section for public schools."},{"id":"c5-4","u":5,"f":"Shays' Rebellion (1786–87)","b":"Revolt of indebted Massachusetts farmers against foreclosures and taxes; exposed the Articles' weakness."},{"id":"c5-5","u":5,"f":"Virginia Plan","b":"Madison's plan for a strong national government with a two-house legislature based on population (favored large states)."},{"id":"c5-6","u":5,"f":"New Jersey Plan","b":"Plan for a one-house legislature with equal votes per state (favored small states)."},{"id":"c5-7","u":5,"f":"Great (Connecticut) Compromise","b":"House of Representatives by population, Senate with two members per state; proposed by Roger Sherman."},{"id":"c5-8","u":5,"f":"Three-Fifths Compromise","b":"Counted three-fifths of enslaved people toward a state's representation and direct taxes."},{"id":"c5-9","u":5,"f":"Federalism","b":"Division of power between national and state governments."},{"id":"c5-10","u":5,"f":"Checks and balances","b":"Each branch can limit the others (veto, override, confirmation, impeachment, judicial review)."},{"id":"c5-11","u":5,"f":"Federalists","b":"Supporters of the Constitution — Hamilton, Madison, Jay; wrote The Federalist Papers."},{"id":"c5-12","u":5,"f":"Federalist No. 10","b":"Madison's essay arguing a large republic controls the dangers of faction."},{"id":"c5-13","u":5,"f":"Anti-Federalists","b":"Opponents of the Constitution (Patrick Henry, George Mason); feared central power and demanded a bill of rights."}],"quiz":["q5-1","q5-2","q5-3","q5-4","q5-5","q5-6","q5-7","q5-8","q5-9","q5-10"]}],"Q":{"q1-1":{"id":"q1-1","u":1,"t":"S","d":1,"q":"Which of the following best explains the dramatic decline of Native American populations after 1492?","o":["Large-scale warfare among Native nations over European trade goods","Mass emigration of Native peoples to Asia across the Bering Strait","A deliberate Spanish policy of extermination ordered by the Treaty of Tordesillas","Epidemic diseases such as smallpox to which Native peoples had no immunity","Famine caused by the introduction of maize from Europe"],"e":["Intertribal war did occur, but it was not the main cause of the population collapse.","There was no such reverse migration; the Bering land bridge migration happened thousands of years earlier.","The Treaty of Tordesillas divided territory between Spain and Portugal; it said nothing about extermination.","Disease killed far more Native people than warfare or enslavement; it often spread ahead of the Europeans themselves.","Maize was native to the Americas and went the other way, to Europe."],"a":3},"q1-2":{"id":"q1-2","u":1,"t":"C","d":2,"q":"The Spanish friar Bartolomé de Las Casas is best known for","o":["condemning the brutal treatment of Native peoples under Spanish rule","leading the conquest of the Inca Empire","negotiating the Treaty of Tordesillas with Portugal","founding the first Spanish mission in New Mexico","introducing the printing press to the Americas"],"e":["Las Casas wrote passionately against the abuses of the encomienda system and conquest.","That was Francisco Pizarro.","The treaty was negotiated by the Spanish and Portuguese crowns with papal backing, not by Las Casas.","Missions in New Mexico followed Oñate's 1598 expedition; Las Casas worked in the Caribbean and Mexico.","Las Casas is known as a critic and writer, not for printing."],"a":0},"q1-3":{"id":"q1-3","u":1,"t":"D","d":1,"q":"The Treaty of Tordesillas (1494) is significant because it","o":["gave England the right to colonize North America","ended the Spanish Armada's war with England","established peace between France and the Iroquois","divided newly encountered lands between Spain and Portugal","ended the Reconquista in Spain"],"e":["England was not a party and ignored the treaty.","The Armada sailed in 1588, almost a century later.","That is unrelated; the treaty predates French colonization.","The line gave Spain most of the Americas and Portugal Brazil and the route to Asia around Africa.","The Reconquista ended with the fall of Granada in January 1492."],"a":3},"q1-4":{"id":"q1-4","u":1,"t":"S","d":2,"q":"Compared with English colonizers, French colonizers in North America generally","o":["brought far larger numbers of farming families","relied on trade and alliances with Native peoples because they had few settlers","avoided all contact with Native religion and culture","settled primarily in the Caribbean rather than the mainland","established large plantations worked by enslaved Native people"],"e":["The opposite: New France stayed thinly populated, while English colonies filled with families.","New France's fur trade economy depended on Native partners, so the French had fewer land conflicts.","French Jesuits lived among Native peoples precisely to convert them.","New France was centered on the St. Lawrence River and Great Lakes.","That better describes Spanish encomienda labor, not New France."],"a":1},"q1-5":{"id":"q1-5","u":1,"t":"P","d":2,"q":"Which of the following was a major reason England began to colonize North America in the late 1500s and early 1600s?","o":["England's population was shrinking, leaving labor shortages at home","The Pope granted England exclusive rights to North America","The defeat of the Spanish Armada reduced the threat of Spanish naval power","England had already conquered the Aztec Empire and sought more gold","The Treaty of Tordesillas assigned North America to England"],"e":["England's population was growing; colonization advocates talked of \"surplus\" people.","England had broken with Rome; the papacy backed Spain and Portugal.","After 1588 England could challenge Spain at sea and plant colonies more safely.","The Aztecs were conquered by Spain under Cortés.","The treaty divided lands only between Spain and Portugal."],"a":2},"q1-6":{"id":"q1-6","u":1,"t":"E","d":2,"q":"The encomienda system in Spanish America","o":["was a French system of fur-trade partnerships","required colonists to pay wages to enslaved Africans","allowed Native peoples to vote for colonial governors","distributed land equally among Native families","gave colonists the right to demand labor and tribute from Native people"],"e":["Encomienda was Spanish; the French relied on trade alliances.","Enslaved Africans were not paid; encomienda concerned Native labor.","Spanish colonies had no elected governors for anyone.","It was a labor grant to Spaniards, not land reform for Native people.","In return colonists were supposed to protect and Christianize them, but abuse was widespread."],"a":4},"q1-7":{"id":"q1-7","u":1,"t":"D","d":3,"q":"Which of the following lists events in the correct chronological order?","o":["Defeat of the Spanish Armada, Columbus's first voyage, Pueblo Revolt, Cortés's conquest of the Aztecs","Columbus's first voyage, Cortés's conquest of the Aztecs, defeat of the Spanish Armada, Pueblo Revolt","Pueblo Revolt, defeat of the Spanish Armada, Columbus's first voyage, Cortés's conquest of the Aztecs","Cortés's conquest of the Aztecs, Columbus's first voyage, Pueblo Revolt, defeat of the Spanish Armada","Columbus's first voyage, Pueblo Revolt, Cortés's conquest of the Aztecs, defeat of the Spanish Armada"],"e":["The Armada (1588) came long after Columbus (1492).","1492, 1519–1521, 1588, 1680.","This reverses most of the actual order.","Cortés could not conquer before Columbus reached the Americas.","The Pueblo Revolt (1680) was the latest of the four."],"a":1},"q1-8":{"id":"q1-8","u":1,"t":"S","d":2,"q":"Which Native American society is correctly matched with a characteristic feature?","o":["Pacific Northwest peoples — large-scale maize plantations","Aztecs — small bands of hunter-gatherers in the Great Basin","Mississippian culture — stone cities high in the Andes Mountains","Pueblo peoples — nomadic buffalo hunting on horseback","Iroquois Confederacy — a political alliance in which clan mothers helped choose leaders"],"e":["Abundant salmon let them live in villages without farming.","The Aztecs ruled a large empire from Tenochtitlán in central Mexico.","That describes the Inca; Mississippians built earthen mound cities like Cahokia.","Pueblos were settled farmers in the Southwest; horses came later via the Spanish.","The Haudenosaunee league of five nations gave women real political influence."],"a":4},"q1-9":{"id":"q1-9","u":1,"t":"P","d":3,"q":"The Pueblo Revolt of 1680 is significant primarily because it","o":["temporarily expelled Spanish colonizers and led Spain to tolerate more Pueblo customs after it returned","permanently ended Spanish presence in North America","marked the first contact between Europeans and Native Americans in the Southwest","was a revolt by English settlers against the Spanish crown","led directly to the founding of St. Augustine"],"e":["It was the most successful Native revolt against colonization; Spain later eased religious suppression.","Spain reconquered New Mexico in the 1690s and held Florida and other lands into the 1800s.","Coronado entered the region in 1540, and Oñate colonized it in 1598.","It was a Native uprising led by Popé.","St. Augustine was founded in 1565, more than a century earlier."],"a":0},"q1-10":{"id":"q1-10","u":1,"t":"C","d":1,"q":"Which development in fifteenth-century Europe most directly helped spread knowledge of new lands and encouraged further exploration?","o":["The Protestant Reformation of 1517","The encomienda system","The printing press","The enclosure movement","The Great Law of Peace"],"e":["Important to later rivalries, but it came after Columbus and did not spread geographic knowledge.","That was a Spanish colonial labor system in the Americas.","Printed maps and travel accounts circulated widely and quickly.","Enclosure pushed English farmers off land; it did not spread knowledge.","That was the founding constitution of the Iroquois Confederacy."],"a":2},"q2-1":{"id":"q2-1","u":2,"t":"E","d":1,"q":"Which crop became the economic foundation of early Virginia?","o":["Tobacco","Cotton","Sugar","Wheat","Rice"],"e":["John Rolfe's tobacco became Virginia's cash crop in the 1610s and drove demand for land and labor.","Cotton became dominant in the South only after the cotton gin (1793).","Sugar was the crop of the Caribbean islands such as Barbados.","Wheat was the main export of the Middle colonies.","Rice became important in South Carolina, not Virginia."],"a":0},"q2-2":{"id":"q2-2","u":2,"t":"P","d":2,"q":"The Mayflower Compact is significant because it","o":["granted land to the Pilgrims from the Virginia Company","established a precedent for self-government based on the consent of the settlers","guaranteed religious freedom for all Christians in Plymouth","created the first elected legislature in English America","united the New England colonies against Native attacks"],"e":["It was a political agreement among settlers, not a land grant.","The signers agreed to form a \"civil body politic\" and obey laws for the general good.","That describes Maryland's Act of Toleration (1649); the Compact did not address religious freedom.","That was Virginia's House of Burgesses (1619).","That was the New England Confederation (1643)."],"a":1},"q2-3":{"id":"q2-3","u":2,"t":"S","d":2,"q":"Which of the following best describes a difference between the Chesapeake and New England colonies in the 1600s?","o":["The Chesapeake had more towns and town meetings than New England","New England settlers more often migrated as families and lived longer than Chesapeake settlers","Chesapeake colonists were mostly religious dissenters seeking to purify the Church of England","New England relied more heavily on tobacco exports","New England had a higher proportion of indentured servants"],"e":["The opposite: New England was organized around towns; the Chesapeake had scattered plantations.","Healthier climates and family migration gave New England balanced sex ratios and longer lives.","That describes the Puritans of New England; the Chesapeake was founded mainly for profit.","Tobacco was the Chesapeake staple; New England relied on fishing, lumber, and trade.","Indentured servants were concentrated in the Chesapeake."],"a":1},"q2-4":{"id":"q2-4","u":2,"t":"S","d":3,"q":"A major long-term consequence of Bacon's Rebellion was that","o":["Governor Berkeley adopted a policy of aggressive war against all Native peoples","tobacco cultivation was abandoned in favor of wheat","the House of Burgesses was abolished","Virginia became a royal colony for the first time","Virginia planters increasingly replaced indentured servants with enslaved Africans"],"e":["Berkeley had resisted frontier war; that was one cause of the rebellion.","Tobacco remained Virginia's main crop for another century.","The Burgesses continued to meet.","Virginia became a royal colony in 1624, a half-century earlier.","Planters saw landless freedmen as a threat; enslaved people could not become free and claim land."],"a":4},"q2-5":{"id":"q2-5","u":2,"t":"C","d":2,"q":"Roger Williams and Anne Hutchinson were similar in that both","o":["were Quaker missionaries in Pennsylvania","founded colonies as refuges for English Catholics","led armed rebellions against the royal governor","supported strict union of church and state","were banished from Massachusetts Bay for challenging Puritan authorities"],"e":["Pennsylvania was founded in 1681, decades later; neither was a Quaker.","Maryland was the Catholic refuge, founded by Lord Baltimore.","Neither led an armed rebellion; Bacon did, in Virginia.","Williams argued for separation of church and state.","Both questioned the religious and political order and were expelled in the 1630s."],"a":4},"q2-6":{"id":"q2-6","u":2,"t":"P","d":2,"q":"Pennsylvania differed from Massachusetts Bay in that Pennsylvania","o":["was founded by Separatists who rejected the Church of England","had no representative assembly","relied on rice grown by enslaved majority labor","offered religious toleration and generally purchased land from Native peoples","restricted voting to members of a single established church"],"e":["That describes the Pilgrims of Plymouth.","Pennsylvania had an elected assembly.","That describes South Carolina.","Penn's Quaker \"holy experiment\" welcomed many faiths and dealt fairly with the Lenape.","That describes Puritan Massachusetts, where voting was tied to church membership."],"a":3},"q2-7":{"id":"q2-7","u":2,"t":"S","d":2,"q":"King Philip's War (1675–1676) resulted in","o":["a lasting alliance between Puritans and the Wampanoag","the expulsion of the English from Massachusetts","French control of New England's fur trade","the destruction of Native power in southern New England","the abolition of slavery in Massachusetts"],"e":["The war destroyed the earlier alliance with the Wampanoag.","Colonists suffered badly but won the war.","The French did not gain New England.","Despite heavy colonial losses, Metacom's forces were defeated and survivors were killed, enslaved, or displaced.","Many defeated Native people were actually sold into slavery."],"a":3},"q2-8":{"id":"q2-8","u":2,"t":"C","d":3,"q":"The Half-Way Covenant of 1662 is best understood as evidence of","o":["a peace treaty ending the Pequot War","King Charles II's effort to impose the Church of England on Massachusetts","declining religious fervor among the children and grandchildren of the first Puritans","the growing power of Quakers in New England","Puritan acceptance of separation of church and state"],"e":["The Covenant was a church membership rule, not a treaty.","The Covenant was adopted by Puritan ministers themselves.","Fewer people reported conversion experiences, so churches relaxed baptism rules to keep families in the church.","Quakers were persecuted in Massachusetts; the Covenant was an internal Puritan reform.","Church and state remained closely linked in Massachusetts."],"a":2},"q2-9":{"id":"q2-9","u":2,"t":"P","d":3,"q":"Read the excerpt below. The author of this statement most likely intended to<blockquote>\"We must consider that we shall be as a city upon a hill. The eyes of all people are upon us.\"<\/blockquote>","o":["urge Massachusetts Bay colonists to build a model Christian community","call for colonial independence from England","encourage toleration of Quakers and Catholics","defend the separation of church and state","justify Virginia's search for gold and profit"],"e":["John Winthrop (1630) wanted the Puritan colony to be an example to the world.","Independence was not on the table in 1630.","Puritan Massachusetts did not tolerate dissenting faiths.","That was Roger Williams's position, not Winthrop's.","Winthrop spoke of religious mission, not profit."],"a":0},"q2-10":{"id":"q2-10","u":2,"t":"D","d":3,"q":"The collapse of the Dominion of New England in 1689 was most directly connected to","o":["the end of King Philip's War","the English conquest of New Netherland","the Glorious Revolution that overthrew James II in England","the outbreak of the French and Indian War","the Salem witch trials"],"e":["King Philip's War ended in 1676, a decade before the Dominion was formed.","That occurred in 1664, before the Dominion was created.","When James II fell, Boston colonists arrested Governor Andros and the Dominion ended.","That war began in 1754.","The trials took place in 1692, after the Dominion had already collapsed."],"a":2},"q3-1":{"id":"q3-1","u":3,"t":"E","d":1,"q":"Under the theory of mercantilism, the primary purpose of colonies was to","o":["serve as penal colonies for convicted criminals","provide religious refuge for persecuted groups","trade freely with all nations to maximize profits","develop independent manufacturing to compete with the mother country","supply raw materials and buy manufactured goods from the mother country"],"e":["Some convicts were sent, but this was not the theory's goal.","Some colonies did, but that was not the economic purpose under mercantilism.","Free trade is the opposite of mercantilism; that idea came from Adam Smith.","Mercantilism discouraged colonial manufacturing that competed with home industries.","Mercantilism aimed to enrich the home country through a favorable balance of trade."],"a":4},"q3-2":{"id":"q3-2","u":3,"t":"P","d":2,"q":"The policy of \"salutary neglect\" contributed to the American Revolution primarily because it","o":["allowed colonists to grow accustomed to self-government through their own assemblies","banned colonial assemblies from meeting","encouraged the colonies to form a military alliance with France","imposed heavy taxes on the colonies during the early 1700s","required colonists to quarter British soldiers"],"e":["When Britain tightened control after 1763, colonists saw it as a violation of established practice.","Assemblies grew stronger during this period.","The colonies fought against France.","Salutary neglect meant loose enforcement and few new taxes.","The Quartering Act came in 1765, after salutary neglect ended."],"a":0},"q3-3":{"id":"q3-3","u":3,"t":"C","d":1,"q":"Jonathan Edwards and George Whitefield are most closely associated with","o":["the founding of Pennsylvania","the Salem witch trials","the Enlightenment","the Albany Plan of Union","the Great Awakening"],"e":["Pennsylvania was founded by William Penn in 1681.","Those occurred in 1692, before both men's careers.","The Enlightenment was associated with figures like Locke and Franklin and stressed reason.","That was Benjamin Franklin's plan.","Both were leading revival preachers of the 1730s–1740s."],"a":4},"q3-4":{"id":"q3-4","u":3,"t":"C","d":2,"q":"Which of the following was a significant effect of the Great Awakening?","o":["It led directly to the passage of the Navigation Acts","It divided congregations and encouraged colonists to challenge established religious authority","It caused most colonists to adopt deism","It strengthened the authority of the Church of England in all colonies","It ended slavery in the northern colonies"],"e":["The Navigation Acts began in 1651, long before the Awakening.","New Light vs. Old Light splits and new denominations taught people to question authority.","Deism was an Enlightenment belief held by a small elite; the Awakening moved people toward emotional Christianity.","The revivals weakened established churches, including the Anglican Church.","Slavery remained legal in all colonies at this time."],"a":1},"q3-5":{"id":"q3-5","u":3,"t":"C","d":2,"q":"The ideas of John Locke most directly influenced colonists' belief that","o":["emotional conversion is necessary for salvation","government derives its power from the consent of the governed","colonies should exist to enrich the mother country","a strong central government should control the economy","kings rule by divine right"],"e":["That was the message of Great Awakening preachers.","Locke argued that people form governments to protect natural rights and may replace governments that violate them.","That is mercantilism.","Locke focused on natural rights and limited government.","Locke wrote against divine-right monarchy."],"a":1},"q3-6":{"id":"q3-6","u":3,"t":"S","d":2,"q":"The Stono Rebellion of 1739 led South Carolina to","o":["shift its economy from rice to tobacco","abolish the slave trade","declare war on Spanish Florida","adopt a stricter slave code restricting enslaved people's movement and assembly","grant freedom to enslaved people who converted to Christianity"],"e":["Rice and indigo remained South Carolina's staples.","South Carolina continued importing enslaved Africans for decades.","The legislature tightened laws; it did not declare war.","Authorities responded to the revolt with tighter controls.","Baptism did not bring freedom; laws said so explicitly."],"a":3},"q3-7":{"id":"q3-7","u":3,"t":"P","d":2,"q":"Georgia, founded in 1732, was originally intended to","o":["serve as the capital of the Dominion of New England","protect French fur traders in the Ohio Valley","provide a refuge for English Catholics","serve as a buffer against Spanish Florida and offer a new start for poor English settlers","be a center of large-scale rice plantations worked by enslaved people from the start"],"e":["The Dominion was in the North and had collapsed in 1689.","Georgia was a British colony on the southern frontier.","That was Maryland.","Oglethorpe's colony banned slavery and large estates at first.","Georgia originally banned slavery; it was legalized only in 1751."],"a":3},"q3-8":{"id":"q3-8","u":3,"t":"D","d":2,"q":"The Albany Plan of Union (1754) is significant because it","o":["was an early proposal for colonial cooperation, even though the colonies rejected it","ended the French and Indian War","was approved by Parliament and every colonial assembly","created the first written constitution in America","formally united the colonies against Britain"],"e":["Franklin's plan for a joint council failed because assemblies guarded their taxing power.","The war ended with the Treaty of Paris in 1763.","Both colonial assemblies and the Crown declined to adopt it.","That honor usually goes to the Fundamental Orders of Connecticut (1639).","It was meant to coordinate defense against France, not resist Britain, and was never adopted."],"a":0},"q3-9":{"id":"q3-9","u":3,"t":"D","d":2,"q":"As a result of the Treaty of Paris of 1763,","o":["France lost nearly all of its North American territory","France gained Florida from Spain","Britain ceded Canada to Spain","Native peoples received guaranteed title to the Ohio Valley","the United States gained independence"],"e":["Britain took Canada and land east of the Mississippi; Spain took Louisiana.","Britain, not France, gained Florida.","Britain gained Canada.","The treaty did not protect Native land claims; Native peoples were not party to it.","That was the Treaty of Paris of 1783."],"a":0},"q3-10":{"id":"q3-10","u":3,"t":"E","d":3,"q":"Read the table below on colonial exports (illustrative figures, about 1770). Which conclusion is best supported by the table?<table><tr><th>Region<\/th><th>Leading exports<\/th><\/tr><tr><td>New England<\/td><td>Fish, lumber, ships, rum<\/td><\/tr><tr><td>Middle colonies<\/td><td>Wheat, flour, livestock<\/td><\/tr><tr><td>Chesapeake<\/td><td>Tobacco<\/td><\/tr><tr><td>Lower South<\/td><td>Rice, indigo<\/td><\/tr><\/table>","o":["New England's economy depended mainly on staple crops grown by enslaved labor","Tobacco was grown chiefly in the Middle colonies","Each colonial region's economy was shaped by its environment and labor system","The colonies had already industrialized by 1770","All regions exported the same goods to Britain"],"e":["New England relied on fishing, lumber, shipbuilding, and trade.","The table lists tobacco under the Chesapeake.","Plantation staples dominated the South, grain the Middle colonies, and maritime trades New England.","Exports were mostly raw materials and agricultural products.","The table shows clear regional differences."],"a":2},"q3-11":{"id":"q3-11","u":3,"t":"P","d":3,"q":"The acquittal of John Peter Zenger in 1735 was significant because it","o":["ended the practice of salutary neglect","created the first colonial newspaper","helped establish that printing truthful criticism of officials should not be punished as libel","led to the repeal of the Navigation Acts","established the principle of judicial review"],"e":["Salutary neglect continued until 1763.","Colonial newspapers existed before Zenger's trial.","The jury accepted the argument that true statements are not libel, a milestone for press freedom.","The Navigation Acts remained in force.","Judicial review was established in Marbury v. Madison (1803)."],"a":2},"q4-1":{"id":"q4-1","u":4,"t":"P","d":1,"q":"Colonists objected to the Stamp Act of 1765 primarily because it","o":["was a direct tax levied by a Parliament in which they had no elected representatives","was the first tax ever placed on colonial trade","forced colonists to house British soldiers","banned settlement west of the Appalachians","closed the port of Boston"],"e":["\"No taxation without representation\" was the core objection.","Trade duties under the Navigation Acts had existed for a century.","That was the Quartering Act.","That was the Proclamation of 1763.","That was one of the Coercive Acts (1774)."],"a":0},"q4-2":{"id":"q4-2","u":4,"t":"P","d":2,"q":"The British argument that Parliament represented all British subjects, including colonists who could not vote for members, was known as","o":["mercantilism","virtual representation","popular sovereignty","the Declaratory Act","salutary neglect"],"e":["Mercantilism is an economic theory, not a theory of representation.","Colonists rejected it, insisting on actual representation by people they elected.","Popular sovereignty is the idea that the people are the source of power (and, later, that territories decide on slavery).","The Declaratory Act asserted Parliament's power but was a law, not the theory of representation itself.","That was the earlier policy of loose enforcement of trade laws."],"a":1},"q4-3":{"id":"q4-3","u":4,"t":"D","d":2,"q":"Which of the following lists British actions in correct chronological order?","o":["Proclamation of 1763, Townshend Acts, Stamp Act, Coercive Acts","Proclamation of 1763, Stamp Act, Townshend Acts, Coercive Acts","Coercive Acts, Townshend Acts, Stamp Act, Proclamation of 1763","Townshend Acts, Stamp Act, Proclamation of 1763, Coercive Acts","Stamp Act, Proclamation of 1763, Coercive Acts, Townshend Acts"],"e":["The Stamp Act (1765) came before the Townshend Acts (1767).","1763, 1765, 1767, 1774.","This is the reverse order.","This reverses the first three.","The Proclamation (1763) came first, and the Townshend Acts (1767) preceded the Coercive Acts (1774)."],"a":1},"q4-4":{"id":"q4-4","u":4,"t":"E","d":2,"q":"The Tea Act of 1773 angered many colonists even though it lowered the price of tea because","o":["it required colonists to buy tea only from Dutch smugglers","colonists believed it was a trick to make them accept Parliament's right to tax them and feared monopoly","it was passed by the First Continental Congress","it banned colonists from drinking tea","it placed a new direct tax on all printed documents"],"e":["Smugglers sold Dutch tea; the Act favored the East India Company.","The East India Company's privileged sales kept the Townshend tea duty and threatened colonial merchants.","It was passed by Parliament.","It did no such thing; it made company tea cheaper.","That was the Stamp Act."],"a":1},"q4-5":{"id":"q4-5","u":4,"t":"P","d":2,"q":"Parliament passed the Coercive (Intolerable) Acts in direct response to the","o":["Boston Tea Party","Boston Massacre","publication of Common Sense","Battle of Saratoga","Stamp Act Congress"],"e":["The Acts punished Massachusetts for destroying the East India Company's tea.","The Massacre was in 1770; the Coercive Acts were in 1774.","Common Sense appeared in 1776.","Saratoga was in 1777, during the war.","The Stamp Act Congress met in 1765."],"a":0},"q4-6":{"id":"q4-6","u":4,"t":"C","d":2,"q":"Thomas Paine's Common Sense (1776) was influential primarily because it","o":["defended the British soldiers involved in the Boston Massacre","was the official declaration of war adopted by Congress","argued that Parliament could regulate trade but not levy revenue taxes","proposed a plan for colonial union against France","attacked monarchy and argued for independence in language ordinary colonists could understand"],"e":["John Adams defended the soldiers in court.","It was a private pamphlet, not a congressional document.","That was John Dickinson's argument in Letters from a Farmer in Pennsylvania.","That was the Albany Plan (1754).","It sold widely and shifted public opinion toward independence."],"a":4},"q4-7":{"id":"q4-7","u":4,"t":"C","d":2,"q":"Read the excerpt below. The ideas in this passage most directly reflect the influence of<blockquote>\"...that to secure these rights, Governments are instituted among Men, deriving their just powers from the consent of the governed...\"<\/blockquote>","o":["John Locke","John Winthrop","Adam Smith","Jonathan Edwards","King George III"],"e":["Locke argued that legitimate government rests on consent and exists to protect natural rights.","Winthrop described a Puritan religious commonwealth, not natural-rights government.","Smith wrote about free markets, not consent of the governed.","Edwards was a revival preacher focused on sin and salvation.","The Declaration was written against George III."],"a":0},"q4-8":{"id":"q4-8","u":4,"t":"D","d":1,"q":"The American victory at Saratoga (1777) was a turning point in the Revolutionary War because it","o":["led to Spain declaring war on the United States","gave the Americans control of Canada","ended the war and forced Britain to recognize independence","persuaded France to form a military alliance with the United States","caused the Loyalists to join the Patriot side"],"e":["Spain later fought against Britain, not the United States.","American attempts on Canada failed.","The war continued until Yorktown (1781) and the Treaty of Paris (1783).","The French alliance of 1778 brought money, troops, and naval power.","Loyalists remained loyal."],"a":3},"q4-9":{"id":"q4-9","u":4,"t":"D","d":2,"q":"Which of the following contributed most directly to the British surrender at Yorktown in 1781?","o":["The Spanish captured London","The Second Continental Congress personally negotiated Cornwallis's surrender","A French fleet blocked British escape by sea while American and French troops besieged the town","A large Loyalist army switched sides to support Washington","Native American allies of the British refused to fight"],"e":["Spain never captured London.","Cornwallis surrendered to Washington and French commanders on the field.","Cooperation with France trapped Cornwallis.","No such defection occurred.","Yorktown was decided by the siege and French navy."],"a":2},"q4-10":{"id":"q4-10","u":4,"t":"S","d":2,"q":"During the Revolution, Lord Dunmore's Proclamation (1775) offered freedom to","o":["Loyalists who joined the Continental Army","indentured servants who paid their debts","Native Americans who moved west of the Appalachians","enslaved people who escaped to fight for the British","all enslaved people in the northern colonies"],"e":["Dunmore was the royal governor of Virginia; he recruited for Britain.","It was aimed at enslaved people (and servants of rebels) who would fight for the Crown.","It concerned enslaved people, not Native land.","Thousands of enslaved people fled to British lines seeking freedom.","It applied to those who joined British forces, mainly in Virginia."],"a":3},"q4-11":{"id":"q4-11","u":4,"t":"P","d":3,"q":"Which of the following best describes the purpose of the Olive Branch Petition (1775)?","o":["It declared the colonies independent from Britain","It proposed the Articles of Confederation","It was a final attempt by the Second Continental Congress to reconcile with King George III","It organized a boycott of British goods through the Continental Association","It requested French military assistance"],"e":["That was the Declaration of Independence (1776).","The Articles were drafted in 1776–1777 and ratified in 1781.","The king rejected it and declared the colonies in open rebellion.","That was the First Continental Congress (1774).","Formal alliance came only after Saratoga."],"a":2},"q4-12":{"id":"q4-12","u":4,"t":"S","d":3,"q":"Which of the following was a social change that resulted, at least in part, from the American Revolution?","o":["Women gained the right to vote in all states","Property requirements for voting were abolished everywhere","The Church of England became the established church in all states","Native nations received full citizenship","Several northern states began gradual abolition of slavery"],"e":["Women did not gain voting rights (New Jersey briefly allowed some propertied women to vote, but ended it in 1807).","Most states kept property requirements for decades.","The opposite: many states disestablished churches.","Native peoples were not granted citizenship.","Pennsylvania's 1780 law was the first; revolutionary ideals of liberty exposed the contradiction of slavery."],"a":4},"q5-1":{"id":"q5-1","u":5,"t":"P","d":1,"q":"Which of the following was a major weakness of the Articles of Confederation?","o":["Congress had no power to levy taxes","Congress could easily amend the Articles with a simple majority","The president had too much power over Congress","Large states dominated the national legislature","National courts overruled state laws too often"],"e":["Congress could only request money from the states, which often refused.","Amendments required the approval of all thirteen states.","There was no president or separate executive under the Articles.","Each state had one vote regardless of size.","There were no national courts."],"a":0},"q5-2":{"id":"q5-2","u":5,"t":"P","d":2,"q":"The Northwest Ordinance of 1787 is considered the most important achievement of the Confederation government because it","o":["created the Electoral College","gave the national government the power to tax","established a process for territories to become states equal to the original states","ended the Barbary pirates' attacks on American shipping","allowed slavery to expand north of the Ohio River"],"e":["The Electoral College was created by the Constitution.","The Articles never gained a taxing power.","It also banned slavery in the Northwest Territory and protected civil liberties.","The Barbary problem continued until the early 1800s.","It banned slavery in the Northwest Territory."],"a":2},"q5-3":{"id":"q5-3","u":5,"t":"S","d":2,"q":"Shays' Rebellion (1786–1787) was significant because it","o":["led to the immediate abolition of debtor prisons","was supported by Massachusetts merchants and creditors","forced Britain to give up its forts in the Northwest","was the first battle of the American Revolution","convinced many leaders that a stronger national government was needed"],"e":["It did not have that result.","Merchants funded the militia that suppressed it.","Britain kept the forts until after Jay's Treaty (1794).","The Revolution began at Lexington and Concord in 1775.","The Confederation could not respond, adding urgency to the Philadelphia Convention."],"a":4},"q5-4":{"id":"q5-4","u":5,"t":"P","d":2,"q":"The Great (Connecticut) Compromise resolved a dispute over","o":["how the president would be chosen","representation of large and small states in Congress","whether Congress could tax exports","whether to count enslaved people for representation","whether to include a bill of rights"],"e":["That was resolved through the Electoral College.","It created a House based on population and a Senate with equal representation.","That was settled separately: Congress could not tax exports.","That was resolved by the Three-Fifths Compromise.","The Bill of Rights was added after ratification."],"a":1},"q5-5":{"id":"q5-5","u":5,"t":"P","d":1,"q":"Which group opposed ratification of the Constitution largely because it lacked a bill of rights?","o":["Federalists","Anti-Federalists","Loyalists","Sons of Liberty","Whigs"],"e":["Federalists supported ratification as written, later agreeing to add amendments.","Leaders like Patrick Henry and George Mason feared a strong government without protections for individual liberties.","Loyalists had supported Britain during the Revolution.","That was a pre-Revolutionary protest group.","The Whig Party formed in the 1830s."],"a":1},"q5-6":{"id":"q5-6","u":5,"t":"C","d":2,"q":"In Federalist No. 10, James Madison argued that","o":["a large republic would make it difficult for any single faction to dominate","the national government should be abolished in favor of state sovereignty","the president should serve for life","only a small republic could preserve liberty","the states should be allowed to secede at will"],"e":["Many competing interests would check one another.","Madison argued for a stronger national government.","Madison made no such argument.","That was a common Anti-Federalist argument; Madison argued the opposite.","Federalist No. 10 is about controlling factions."],"a":0},"q5-7":{"id":"q5-7","u":5,"t":"S","d":3,"q":"The Three-Fifths Compromise had which of the following effects?","o":["It applied only to the Senate","It gave enslaved people three-fifths of a vote in elections","It reduced southern power in the Electoral College","It increased the representation of southern states in the House of Representatives","It abolished the international slave trade in 1787"],"e":["It affected the House (and direct taxes), not the Senate.","Enslaved people could not vote at all; the clause counted population for apportionment.","Because electors are based on representation, it increased southern power.","Counting part of the enslaved population gave slaveholding states more seats and electoral votes.","The Constitution barred Congress from ending the trade before 1808."],"a":3},"q5-8":{"id":"q5-8","u":5,"t":"E","d":2,"q":"Under the Articles of Confederation, which of the following was a major economic problem?","o":["Too much gold flowed into the country from Spain","The national bank charged interest rates that were too high","Congress's high federal income tax burdened farmers","Federal tariffs protected manufacturing too heavily","States imposed tariffs on each other's goods and Congress could not regulate commerce"],"e":["The problem was scarce hard money, not too much gold.","There was no national bank under the Articles (Hamilton's came in 1791).","Congress had no taxing power.","The Confederation could not levy tariffs.","The lack of a national commerce power produced trade disputes."],"a":4},"q5-9":{"id":"q5-9","u":5,"t":"P","d":3,"q":"Which of the following was a concession made to southern delegates at the Constitutional Convention?","o":["Congress was given power to abolish slavery in 1800","The New Jersey Plan was adopted without change","The president had to be from a southern state","Congress was prohibited from taxing exports","The Senate was based on population"],"e":["No such power was granted.","The final plan was a compromise; the New Jersey Plan was a small-state plan, not a southern one.","No such rule exists.","Southern states depended on exporting tobacco, rice, and indigo.","The Senate gives each state two members."],"a":3},"q5-10":{"id":"q5-10","u":5,"t":"D","d":3,"q":"Which of the following foreign policy problems faced the United States under the Articles of Confederation?","o":["France invaded the Northwest Territory","Mexico seized Texas from the United States","Spain closed the lower Mississippi River and New Orleans to American trade","Russia blockaded American ports","Britain demanded the return of the thirteen colonies by treaty"],"e":["France was an ally and made no such invasion.","Texas was Spanish territory, and Mexico was not yet independent.","Western farmers depended on the river to ship crops; Congress could do little.","Russia posed no such threat.","Britain had recognized independence in 1783, though it kept frontier forts."],"a":2}},"diag":[],"exams":[[],[]],"cheat":"<p>Cheat sheet coming soon.<\/p>"};

<script>
'use strict';
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const pct=(c,t)=>t?Math.round(100*c/t):0;
const U=DATA.units, Q=DATA.Q, TH=DATA.themes;
const KEY='clep-ush1-v1';
const LETTERS='ABCDE';
const dayNum=d=>Math.floor((d.getTime()-d.getTimezoneOffset()*6e4)/864e5);
const TODAY=()=>dayNum(new Date());
const fmtDay=n=>new Date(n*864e5+new Date(n*864e5).getTimezoneOffset()*6e4).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
let storageOK=true;

/* ---------- state ---------- */
function defState(){return {v:1,theme:null,read:{},quiz:{},diag:null,cards:{},mis:{},misCleared:0,exams:{},run:null,plan:null}}
function load(){
  try{const r=localStorage.getItem(KEY); if(r){const o=JSON.parse(r); if(o&&typeof o==='object') return Object.assign(defState(),o);}}
  catch(e){storageOK=false}
  return defState();
}
let S=load();
function save(){
  try{localStorage.setItem(KEY,JSON.stringify(S)); storageOK=true}
  catch(e){storageOK=false}
}

/* ---------- theme ---------- */
function applyTheme(){ if(S.theme) document.documentElement.setAttribute('data-theme',S.theme); else document.documentElement.removeAttribute('data-theme'); }
function toggleTheme(){
  const cur=S.theme||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light');
  S.theme=cur==='dark'?'light':'dark'; save(); applyTheme();
}
applyTheme();

/* ---------- derived progress ---------- */
const unitCards=u=>U[u-1].cards;
const allCards=()=>U.flatMap(u=>u.cards);
function cardStats(cards){
  let n=0,learned=0,mastered=0;
  for(const c of cards){const s=S.cards[c.id]; if(s){n++; if(s.b>=3)learned++; if(s.b>=4)mastered++;}}
  return {seen:n,learned,mastered,total:cards.length};
}
function unitDone(u){return !!S.read[u] && !!S.quiz[u]}
function unitHours(u){return DATA.meta.hours.unitsTotal*U[u-1].weight/100}
function unitProgress(u){
  const cs=cardStats(unitCards(u));
  return (S.read[u]?0.45:0)+(S.quiz[u]?0.3:0)+0.25*(cs.total?cs.learned/cs.total:0);
}
function hoursLeft(){
  const H=DATA.meta.hours; let h=0;
  if(!S.diag) h+=H.diag;
  for(const u of U) h+=unitHours(u.n)*(1-unitProgress(u.n))*diagFactor(u.n);
  for(const k of [1,2]) if(!S.exams[k]) h+=H.exam;
  h+=H.final*(Object.keys(S.exams).length>=2?0:1);
  return Math.max(0,h);
}
function diagLabel(u){
  if(!S.diag) return null; const r=S.diag.byUnit[u]; if(!r||!r[1]) return null;
  const p=r[0]/r[1]; return p===1?'skim':p>=.5?'study':'must';
}
function diagFactor(u){const l=diagLabel(u); return l==='skim'?.55:l==='must'?1.15:1}
function quizAvg(){const v=Object.values(S.quiz).map(q=>q.best); return v.length?Math.round(v.reduce((a,b)=>a+b,0)/v.length):null}
function readiness(){
  const done=U.filter(u=>unitDone(u.n)).length/U.length;
  const qa=(quizAvg()||0)/100, e1=S.exams[1]?S.exams[1].score/100:0, e2=S.exams[2]?S.exams[2].score/100:0;
  const score=Math.round(100*(0.3*done+0.2*qa+0.25*e1+0.25*e2));
  const ready=!!(S.exams[1]&&S.exams[2]&&S.exams[1].score>=75&&S.exams[2].score>=75);
  return {score,ready,done,qa,e1,e2};
}

/* ---------- nav ---------- */
function navHTML(route){
  const misN=Object.keys(S.mis).length, due=dueCards(allCards()).length;
  const L=(h,t,b='')=>`<a href="${h}" class="${route===h?'on':''}"><span>${t}</span><span class="badge">${b}</span></a>`;
  let h=L('#home','Dashboard')+L('#diag','Diagnostic test',S.diag?S.diag.score+'%':'start')+'<div class="grp">Units</div>';
  for(const u of U) h+=L('#unit/'+u.n,`${u.n}. ${esc(u.short)}`,unitDone(u.n)?'✓':u.weight+'%');
  h+='<div class="grp">Practice</div>'+L('#cards','Flashcards',due?due+' due':'')+L('#mistakes','Mistake log',misN||'')
    +L('#exam/1','Practice exam A',S.exams[1]?S.exams[1].score+'%':'')+L('#exam/2','Practice exam B',S.exams[2]?S.exams[2].score+'%':'')
    +'<div class="grp">Tools</div>'+L('#cheat','Cheat sheet')+L('#plan','Study plan')+L('#about','About & data')
    +`<div class="grp"></div><a href="#" id="themeBtn"><span>Toggle dark mode</span><span class="badge"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></span></a>`;
  return h;
}
function setNav(route){
  $('#nav').innerHTML=navHTML(route);
  $('#themeBtn').onclick=e=>{e.preventDefault();toggleTheme()};
}

/* ---------- router ---------- */
let RUN=null, timerInt=null;
function route(){
  clearInterval(timerInt); timerInt=null;
  const h=location.hash||'#home'; const p=h.slice(1).split('/');
  closeMenu();
  const main=$('#main'); let title='CLEP US History I';
  let html='';
  if(!storageOK) html+='<div class="banner">Browser storage is blocked, so progress will not be saved after you close this tab. Use <a href="#about">Export progress</a> to keep a copy.</div>';
  main.innerHTML=html+'<div id="view"></div>';
  const v=$('#view');
  switch(p[0]){
    case 'unit': {const n=+p[1]; if(U[n-1]){title=`Unit ${n}`; viewUnit(v,n,p[2]||'lesson');} else viewHome(v); break;}
    case 'diag': title='Diagnostic'; viewDiag(v); break;
    case 'exam': title='Practice exam '+(p[1]==='2'?'B':'A'); viewExam(v,p[1]==='2'?2:1); break;
    case 'cards': title='Flashcards'; viewCards(v,0); break;
    case 'mistakes': title='Mistake log'; viewMistakes(v); break;
    case 'cheat': title='Cheat sheet'; viewCheat(v); break;
    case 'plan': title='Study plan'; viewPlan(v); break;
    case 'about': title='About & data'; viewAbout(v); break;
    default: viewHome(v);
  }
  $('#topTitle').textContent=title;
  setNav('#'+p.slice(0,p[0]==='unit'?2:p[0]==='exam'?2:1).join('/'));
  window.scrollTo(0,0);
}
window.addEventListener('hashchange',route);
function openMenu(){$('#side').classList.add('open');$('#scrim').classList.add('on')}
function closeMenu(){$('#side').classList.remove('open');$('#scrim').classList.remove('on')}
$('#menuBtn').onclick=openMenu; $('#scrim').onclick=closeMenu; $('#themeBtn2').onclick=toggleTheme;

/* ---------- home ---------- */
function meterHTML(){
  const r=readiness();
  const e=k=>S.exams[k]?`<span class="pill ${S.exams[k].score>=75?'good':'bad'}">Exam ${k===1?'A':'B'}: ${S.exams[k].score}%</span>`:`<span class="pill">Exam ${k===1?'A':'B'}: not taken</span>`;
  return `<div class="card"><div class="row" style="justify-content:space-between"><h2 style="margin:0">Readiness</h2>
  <span class="ready" style="color:${r.ready?'var(--good)':'var(--warn)'}">${r.ready?'✓ Ready to book':'Not ready yet'}</span></div>
  <div class="meter" style="margin:12px 0 6px" title="Overall readiness ${r.score}%"><i style="width:${r.score}%"></i><span class="mark"></span></div>
  <div class="row small muted" style="justify-content:space-between"><span>Overall ${r.score}%</span><span>Rule: both practice exams ≥ 75%</span></div>
  <div class="row" style="margin-top:10px">${e(1)}${e(2)}<span class="pill">Units done: ${U.filter(u=>unitDone(u.n)).length}/${U.length}</span><span class="pill">Quiz avg: ${quizAvg()==null?'—':quizAvg()+'%'}</span></div></div>`;
}
function nextStep(){
  if(S.run) return {t:`Resume your ${S.run.kind==='exam'?'practice exam (timer is running)':'diagnostic'}`,h:S.run.kind==='exam'?'#exam/'+S.run.key:'#diag'};
  if(!S.diag) return {t:'Take the 30-question diagnostic (≈25 min) to find what you can skim',h:'#diag'};
  const order=[...U].sort((a,b)=>a.n-b.n);
  for(const u of order){ if(!S.read[u.n]) return {t:`Read Unit ${u.n}: ${u.title}`+(diagLabel(u.n)==='skim'?' (skim it)':''),h:'#unit/'+u.n}; if(!S.quiz[u.n]) return {t:`Take the Unit ${u.n} quiz`,h:'#unit/'+u.n+'/quiz'}; }
  if(dueCards(allCards()).length>20) return {t:'Clear your due flashcards',h:'#cards'};
  if(!S.exams[1]) return {t:'Take Practice exam A (120 Q, 90 min, no pausing)',h:'#exam/1'};
  if(Object.keys(S.mis).length) return {t:`Drill your mistake log (${Object.keys(S.mis).length} questions)`,h:'#mistakes'};
  if(!S.exams[2]) return {t:'Take Practice exam B',h:'#exam/2'};
  return {t:'Redraw the cheat sheet from memory, then book the exam',h:'#cheat'};
}
function viewHome(v){

  <div class="card" style="border-color:var(--accent);margin-bottom:14px"><div class="small muted">Next step</div>
   <div class="row" style="justify-content:space-between"><div style="font-weight:700;font-size:1.05rem">${esc(ns.t)}</div><a class="btn pri" href="${ns.h}">Go →</a></div></div>
  ${todays}
  <div class="grid g2" style="margin-bottom:14px">${meterHTML()}

   <div class="stat"><div class="n">${cs.mastered}/${cs.total}</div><div class="l">cards mastered (box 4–5)</div></div>

/* ---------- unit ---------- */

}

function unitQuizIntro(t,n){
  const ids=U[n-1].quiz, q=S.quiz[n];
  t.innerHTML=`<div class="card"><h2>Unit ${n} quiz</h2><p>${ids.length} CLEP-style questions. You see the explanation for every option right after you answer. Missed questions go to your mistake log.</p>
  <p class="small muted">Keys: <span class="kbd">1</span>–<span class="kbd">5</span> answer · <span class="kbd">Enter</span> next</p>
  ${q?`<p>Best: <b>${q.best}%</b> · Last: ${q.last}% · Attempts: ${q.n}</p>`:''}
  <button class="btn pri" id="go">${q?'Retake':'Start'} quiz</button></div>`;
