<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CLEP US History I</title>
<meta name="description" content="Self-paced CLEP History of the United States I study guide: lessons, quizzes, flashcards, diagnostic and two timed practice exams.">
<style>
:root{
  --bg:#f7f6f2; --surface:#ffffff; --surface2:#f0eee8; --text:#1d1d1b; --muted:#5f5d57; --border:#dcd9d0;
  --accent:#1f5f8b; --accent-ink:#ffffff; --accent-soft:#e3eef6;
  --good:#1e7a46; --good-soft:#e2f3e8; --bad:#b3261e; --bad-soft:#fbe7e5; --warn:#9a6200; --warn-soft:#fbf0d9;
  --tP:#1f5f8b; --tS:#7a3e9d; --tE:#1e7a46; --tC:#b05a00; --tD:#a8324a;
  --radius:10px; --shadow:0 1px 2px rgba(0,0,0,.06),0 2px 8px rgba(0,0,0,.04);
  --sans: system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  --serif: Charter,"Bitstream Charter","Sitka Text",Cambria,Georgia,serif;
}
:root[data-theme="dark"]{
  --bg:#141517; --surface:#1d1f22; --surface2:#25282c; --text:#e8e6e1; --muted:#a19e97; --border:#34373c;
  --accent:#6fb0dc; --accent-ink:#0d1b26; --accent-soft:#1c2f3d;
  --good:#5cc489; --good-soft:#163024; --bad:#f08b83; --bad-soft:#3a1b19; --warn:#e3b04f; --warn-soft:#382c12;
  --tP:#6fb0dc; --tS:#c08ee0; --tE:#5cc489; --tC:#e9a050; --tD:#ec8095;
  --shadow:none;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#141517; --surface:#1d1f22; --surface2:#25282c; --text:#e8e6e1; --muted:#a19e97; --border:#34373c;
    --accent:#6fb0dc; --accent-ink:#0d1b26; --accent-soft:#1c2f3d;
    --good:#5cc489; --good-soft:#163024; --bad:#f08b83; --bad-soft:#3a1b19; --warn:#e3b04f; --warn-soft:#382c12;
    --tP:#6fb0dc; --tS:#c08ee0; --tE:#5cc489; --tC:#e9a050; --tD:#ec8095;
    --shadow:none;
  }
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.55 var(--sans)}
a{color:var(--accent)}
button,input,select{font:inherit;color:inherit}
h1,h2,h3{line-height:1.25;margin:0 0 .5em}
h1{font-size:1.6rem} h2{font-size:1.25rem} h3{font-size:1.05rem}
.app{display:flex;min-height:100vh}
.side{width:248px;flex:none;border-right:1px solid var(--border);background:var(--surface);position:sticky;top:0;height:100vh;overflow:auto;padding:16px 12px}
.brand{font-weight:700;font-size:1.05rem;margin:4px 8px 14px;display:flex;gap:8px;align-items:center}
.brand small{display:block;font-weight:500;color:var(--muted);font-size:.78rem}
.nav a{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:7px 10px;border-radius:8px;color:var(--text);text-decoration:none;font-size:.94rem}
.nav a:hover{background:var(--surface2)}
.nav a.on{background:var(--accent-soft);color:var(--accent);font-weight:600}
.nav .grp{font-size:.72rem;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);margin:14px 10px 4px}
.nav .badge{font-size:.72rem;color:var(--muted);font-weight:500}
.main{flex:1;min-width:0;padding:24px 28px 80px;max-width:980px}
.top{display:none}
@media (max-width:900px){
  .side{position:fixed;z-index:30;left:0;top:0;transform:translateX(-105%);transition:transform .2s;box-shadow:0 0 40px rgba(0,0,0,.25)}
  .side.open{transform:none}
  .top{display:flex;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:10px 16px;background:var(--surface);border-bottom:1px solid var(--border)}
  .top .t{font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .main{padding:16px 16px 80px}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.35);z-index:25;display:none}
  .scrim.on{display:block}
}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:9px 16px;border-radius:8px;border:1px solid var(--border);background:var(--surface);cursor:pointer;text-decoration:none;color:var(--text);font-weight:600;font-size:.94rem;min-height:40px}
.btn:hover{border-color:var(--accent)}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.sm{padding:5px 10px;min-height:32px;font-size:.85rem}
.btn.ghost{background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.icon-btn{border:1px solid var(--border);background:var(--surface);border-radius:8px;width:38px;height:38px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
.muted{color:var(--muted)} .small{font-size:.86rem} .tiny{font-size:.76rem}
.stat .n{font-size:1.6rem;font-weight:700} .stat .l{color:var(--muted);font-size:.85rem}
.pill{display:inline-block;padding:2px 9px;border-radius:99px;font-size:.75rem;font-weight:600;border:1px solid var(--border);color:var(--muted);white-space:nowrap}
.pill.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.pill.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.pill.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.pill.acc{background:var(--accent-soft);color:var(--accent);border-color:transparent}
.unver{background:var(--warn-soft);color:var(--warn);border-radius:4px;padding:0 5px;font-size:.75rem;font-weight:600}
.bar{height:8px;background:var(--surface2);border-radius:99px;overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.good>i{background:var(--good)} .bar.bad>i{background:var(--bad)} .bar.warn>i{background:var(--warn)}
table{border-collapse:collapse;width:100%;font-size:.92rem}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--border);vertical-align:top}
th{font-size:.78rem;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.tbl-wrap{overflow-x:auto}
.unit-row{display:grid;grid-template-columns:34px 1fr auto;gap:12px;align-items:center;padding:12px 4px;border-bottom:1px solid var(--border);text-decoration:none;color:inherit}
.unit-row:hover{background:var(--surface2)}
.unit-num{width:34px;height:34px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;background:var(--surface2);font-size:.9rem}
.unit-num.done{background:var(--good);color:#fff}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin:14px 0 18px;overflow-x:auto}
.tabs a{padding:9px 14px;text-decoration:none;color:var(--muted);font-weight:600;border-bottom:2px solid transparent;white-space:nowrap}
.tabs a.on{color:var(--accent);border-color:var(--accent)}
/* lesson */
.lesson{font-family:var(--serif);font-size:1.08rem;line-height:1.7;max-width:70ch}
.lesson h2{font-family:var(--sans);font-size:1.15rem;margin:1.6em 0 .5em}
.lesson p{margin:0 0 1em}
.lesson ul{padding-left:1.2em;margin:0 0 1em}
.lesson strong{font-weight:700}
.chain{display:grid;grid-template-columns:1fr auto 1fr auto 1fr;gap:6px;align-items:stretch;margin:1em 0 1.3em;font-family:var(--sans);font-size:.9rem;line-height:1.4}
.chain>div{border:1px solid var(--border);border-radius:8px;padding:8px 10px;background:var(--surface)}
.chain>div b{display:block;font-size:.68rem;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:2px}
.chain>div.ev{border-color:var(--accent);background:var(--accent-soft)}
.chain>span{align-self:center;color:var(--muted)}
@media (max-width:640px){.chain{grid-template-columns:1fr}.chain>span{transform:rotate(90deg);justify-self:center;line-height:1}}
.tip{font-family:var(--sans);font-size:.92rem;background:var(--warn-soft);border-left:3px solid var(--warn);padding:9px 12px;border-radius:6px;margin:0 0 1em}
.must{border:2px solid var(--accent);border-radius:var(--radius);padding:14px 18px;background:var(--accent-soft)}
.must h3{color:var(--accent)}
.must ol{margin:0;padding-left:1.3em}
.must li{margin:.35em 0}
/* timeline */
.tl{position:relative;margin:6px 0 0;padding-left:0;list-style:none}
.tl li{display:grid;grid-template-columns:86px 18px 1fr;gap:8px;align-items:start;padding:5px 0}
.tl .y{font-weight:700;text-align:right;font-variant-numeric:tabular-nums;font-size:.92rem}
.tl .dot{width:12px;height:12px;border-radius:50%;margin-top:5px;background:var(--muted);position:relative}
.tl li:not(:last-child) .dot::after{content:"";position:absolute;left:5px;top:12px;width:2px;height:calc(100% + 26px);background:var(--border)}
.tl .ev{font-size:.94rem}
.tl .key .ev{font-weight:600}
.th-P{--tc:var(--tP)} .th-S{--tc:var(--tS)} .th-E{--tc:var(--tE)} .th-C{--tc:var(--tC)} .th-D{--tc:var(--tD)}
.tl .dot{background:var(--tc,var(--muted))}
.ttag{display:inline-block;font-size:.66rem;font-weight:700;padding:0 5px;border-radius:4px;color:var(--tc);border:1px solid var(--tc);margin-left:6px;vertical-align:1px;font-family:var(--sans)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.8rem;color:var(--muted);margin:8px 0}
.legend span::before{content:"";display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--tc);margin-right:5px}
/* quiz */
.qhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.timer{font-variant-numeric:tabular-nums;font-weight:700;font-size:1.1rem;padding:4px 10px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.qtext{font-size:1.08rem;margin:6px 0 14px}
.qtext blockquote{margin:8px 0;padding:8px 14px;border-left:3px solid var(--border);font-family:var(--serif);color:var(--text);background:var(--surface2);border-radius:0 6px 6px 0}
.qtext table{margin:8px 0;width:auto;min-width:60%}
.opts{display:grid;gap:8px}
.opt{display:grid;grid-template-columns:30px 1fr;gap:10px;text-align:left;padding:11px 12px;border:1.5px solid var(--border);border-radius:9px;background:var(--surface);cursor:pointer;width:100%;line-height:1.4}
.opt:hover{border-color:var(--accent)}
.opt .k{width:26px;height:26px;border-radius:6px;background:var(--surface2);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.opt.sel{border-color:var(--accent);background:var(--accent-soft)}
.opt.sel .k{background:var(--accent);color:var(--accent-ink)}
.opt.right{border-color:var(--good);background:var(--good-soft)}
.opt.right .k{background:var(--good);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .k{background:var(--bad);color:#fff}
.opt .why{grid-column:2;font-size:.88rem;color:var(--muted);margin-top:4px}
.opt.right .why,.opt.wrong .why{color:var(--text)}
.opt[disabled]{cursor:default}
.navgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(38px,1fr));gap:5px;margin-top:12px}
.navgrid button{padding:6px 0;border-radius:6px;border:1px solid var(--border);background:var(--surface);cursor:pointer;font-size:.8rem;font-variant-numeric:tabular-nums}
.navgrid button.a{background:var(--accent-soft);border-color:var(--accent)}
.navgrid button.m{box-shadow:inset 0 -3px 0 var(--warn)}
.navgrid button.cur{outline:2px solid var(--text)}
.kbd{font:600 .75rem var(--sans);border:1px solid var(--border);border-bottom-width:2px;border-radius:5px;padding:0 5px;color:var(--muted)}
.fb{margin-top:12px;padding:10px 14px;border-radius:8px;font-weight:600}
.fb.good{background:var(--good-soft);color:var(--good)} .fb.bad{background:var(--bad-soft);color:var(--bad)}
.foot{display:flex;justify-content:space-between;gap:10px;margin-top:16px;flex-wrap:wrap}
/* flashcards */
.fc{min-height:210px;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;padding:28px 22px;user-select:none}
.fc .front{font-size:1.3rem;font-weight:700}
.fc .back{font-size:1.02rem;margin-top:14px;padding-top:14px;border-top:1px solid var(--border);max-width:60ch;font-family:var(--serif)}
.boxes{display:flex;gap:6px}
.boxes div{flex:1;text-align:center;background:var(--surface2);border-radius:8px;padding:6px 2px;font-size:.78rem}
.boxes div b{display:block;font-size:1.05rem}
/* meter */
.meter{height:16px;border-radius:99px;background:var(--surface2);overflow:hidden;position:relative}
.meter>i{display:block;height:100%;background:linear-gradient(90deg,var(--warn),var(--good))}
.meter .mark{position:absolute;top:-3px;bottom:-3px;width:2px;background:var(--text);left:75%}
.ready{font-weight:700;font-size:1.15rem}
.banner{background:var(--warn-soft);color:var(--warn);padding:8px 14px;border-radius:8px;margin-bottom:14px;font-size:.9rem}
.hide{display:none!important}
input[type=number],input[type=date],select{padding:8px 10px;border:1px solid var(--border);border-radius:8px;background:var(--surface)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:.88rem;font-weight:600}
.plan-day{border-bottom:1px solid var(--border);padding:10px 0;display:grid;grid-template-columns:120px 1fr;gap:12px}
.plan-day.today{background:var(--accent-soft);border-radius:8px;padding:10px}
.plan-day ul{margin:0;padding-left:1.1em}
@media (max-width:640px){.plan-day{grid-template-columns:1fr;gap:2px}}
/* cheat sheet */
.cheat{font-size:.86rem;line-height:1.38}
.cheat h2{font-size:1rem;margin:10px 0 4px;border-bottom:2px solid var(--text);padding-bottom:2px}
.cheat table{font-size:.8rem}
.cheat td,.cheat th{padding:3px 5px}
.cheat .cols{columns:2 300px;column-gap:22px}
.cheat .cols>*{break-inside:avoid}
.cheat ul{margin:0;padding-left:1.1em}
.cheat.recall .hidev{color:transparent;background:var(--surface2);border-radius:3px;cursor:pointer}
.cheat.recall .hidev.show{color:inherit;background:none}
.cheat .mt{columns:3 220px;column-gap:18px}
.cheat .mt div{break-inside:avoid;padding:1px 0}
.cheat .mt b{font-variant-numeric:tabular-nums;display:inline-block;min-width:3.2em}
@media print{
  body{background:#fff;color:#000}
  .side,.top,.noprint,.scrim{display:none!important}
  .main{padding:0;max-width:none}
  .card{border:none;box-shadow:none;padding:0}
  .cheat{font-size:7.4pt;line-height:1.25}
  .cheat h2{font-size:8.6pt;margin:4px 0 2px}
  .cheat table{font-size:7pt}
  @page{size:letter;margin:.35in}
}
</style>
</head>

</div>
<script>
const DATA={"meta":{"exam":"CLEP History of the United States I: Early Colonization to 1877","format":{"questions":120,"minutes":90,"qStatus":"verified-via-search","tStatus":"verified-via-search","sStatus":"verified-via-search"},"chronological":[{"period":"1500-1789","weight":30,"status":"verified-via-search"},{"period":"1790-1877","weight":70,"status":"verified-via-search"}],"sources":[{"label":"College Board exam page (official)","url":"https://clep.collegeboard.org/exam/history-us-i"},{"label":"College Board exam page (alternate URL)","url":"https://clep.collegeboard.org/clep-exams/history-of-the-us-1"},{"label":"College Board fact sheet (PDF)","url":"https://secure-media.collegeboard.org/digitalServices/pdf/clep/history_united_states_I_fact_sheet.pdf"}],"note":"The build environment's network policy blocked direct access to collegeboard.org. Figures below were confirmed from search-engine indexed text of the official page (two independent searches agreed) and cross-checked against a university testing page (Ferris State). Status per field is given in 'status'. Re-check the official page before booking.","hours":{"diag":0.6,"unitsTotal":17,"exam":2.75,"final":2,"total":25}},"themes":{"P":{"name":"Political institutions, political developments & public policy","short":"Political","weight":25,"status":"verified-via-search"},"S":{"name":"Social developments","short":"Social","weight":25,"status":"verified-via-search"},"E":{"name":"Economic developments","short":"Economic","weight":15,"status":"verified-via-search"},"C":{"name":"Cultural & intellectual developments","short":"Cultural","weight":20,"status":"verified-via-search"},"D":{"name":"Diplomacy & transnational interactions","short":"Diplomacy","weight":15,"status":"verified-via-search"}},"units":[{"n":1,"title":"Native Peoples & European Exploration","short":"Natives & Exploration","years":"to 1607","weight":5,"lesson":"<h2>Why this unit matters<\/h2>\n<p>The exam opens where American history opens: millions of people already living in the Americas, and Europeans arriving with new motives and new tools. Expect questions on <strong>Native American diversity<\/strong>, <strong>why Europeans explored<\/strong>, the <strong>Columbian Exchange<\/strong>, and how <strong>Spain, France, and England<\/strong> built very different empires. This unit is only about 5% of the exam, so focus on the big contrasts, not every explorer.<\/p>\n<h2>The Americas before 1492<\/h2>\n<p>Before Europeans arrived, the Americas held somewhere between 50 and 100 million people (estimates vary widely). They were not one culture but hundreds, shaped by environment.<\/p>\n<ul><li><strong>Mesoamerica and the Andes:<\/strong> the <strong>Maya<\/strong>, <strong>Aztecs<\/strong> (capital Tenochtitlán, in today's Mexico City), and <strong>Inca<\/strong> (Andes Mountains) built large empires with cities, roads, tribute systems, and advanced astronomy. <strong>Maize (corn)<\/strong> cultivation was the foundation that made large populations possible.<\/li><li><strong>Southwest:<\/strong> the <strong>Ancestral Puebloans<\/strong> (Anasazi) and later <strong>Pueblo<\/strong> peoples farmed corn with irrigation in a dry land and built multistory adobe and cliff dwellings.<\/li><li><strong>Mississippi River valley:<\/strong> the <strong>Mississippian culture<\/strong> built mound cities. <strong>Cahokia<\/strong> (near today's St. Louis) may have held 10,000–20,000 people around 1100 CE.<\/li><li><strong>Northeast woodlands:<\/strong> the <strong>Iroquois Confederacy<\/strong> (Haudenosaunee) united five nations — Mohawk, Oneida, Onondaga, Cayuga, Seneca — under the Great Law of Peace. Many eastern peoples combined farming (the \"Three Sisters\": corn, beans, squash) with hunting. In many of these societies, women farmed and held real political influence; Iroquois clan mothers helped choose leaders.<\/li><li><strong>Great Plains and Great Basin:<\/strong> more mobile hunting and gathering. (The horse-centered Plains culture came <em>later<\/em>, after Spanish horses spread north.)<\/li><li><strong>Pacific Northwest:<\/strong> abundant salmon allowed settled villages without farming; the <strong>potlatch<\/strong> was a gift-giving ceremony that displayed status.<\/li><\/ul>\n<div class=\"tip\"><b>Exam tip:<\/b> The exam likes the idea that Native societies adapted to their environment, and that most Native peoples viewed land as something used in common, not owned as private property. That difference fueled centuries of conflict.<\/div>\n<h2>Why Europe went exploring<\/h2>\n<p>Europe in the 1400s was changing fast. Historians often summarize motives as <strong>\"God, gold, and glory.\"<\/strong><\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Ottoman control of eastern trade routes and demand for Asian spices<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Search for an all-water route to Asia<\/div><span>→<\/span><div><b>Consequence<\/b>Portuguese voyages around Africa and Columbus sailing west<\/div><\/div>\n<ul><li><strong>Gold:<\/strong> Europeans wanted Asian spices, silks, and gold without paying Muslim and Italian middlemen.<\/li><li><strong>God:<\/strong> the <strong>Reconquista<\/strong> — Spain's centuries-long campaign to drive Muslim rulers out of Iberia — ended in <strong>1492<\/strong> with the fall of Granada, leaving Spain's monarchs, <strong>Ferdinand and Isabella<\/strong>, eager to spread Catholicism. Later, the <strong>Protestant Reformation<\/strong> (begun by <strong>Martin Luther<\/strong> in <strong>1517<\/strong>) turned Catholic–Protestant rivalry into a reason to compete overseas.<\/li><li><strong>Glory:<\/strong> new centralized <strong>nation-states<\/strong> (Portugal, Spain, France, England) could fund expeditions and wanted prestige.<\/li><li><strong>Tools:<\/strong> the <strong>Renaissance<\/strong> spread curiosity and learning; the <strong>printing press<\/strong> spread maps and travel accounts; the <strong>caravel<\/strong> ship, the <strong>compass<\/strong>, and the <strong>astrolabe<\/strong> made long voyages possible.<\/li><\/ul>\n<p><strong>Portugal<\/strong> led first. <strong>Prince Henry the Navigator<\/strong> sponsored voyages down Africa's coast. <strong>Bartolomeu Dias<\/strong> rounded the Cape of Good Hope (1488) and <strong>Vasco da Gama<\/strong> reached India (1498). Portugal also began the Atlantic trade in enslaved Africans to work sugar plantations on Atlantic islands — a model later copied in the Americas.<\/p>\n<h2>Columbus and the Spanish empire<\/h2>\n<p><strong>Christopher Columbus<\/strong>, an Italian sailing for Spain, reached the Caribbean in <strong>1492<\/strong>, believing he was near Asia. Spain and Portugal quickly divided the non-European world in the <strong>Treaty of Tordesillas (1494)<\/strong>, which is why Brazil speaks Portuguese and most of Latin America speaks Spanish.<\/p>\n<p>Spanish <strong>conquistadores<\/strong> followed. <strong>Hernán Cortés<\/strong> conquered the Aztec Empire (1519–1521) and <strong>Francisco Pizarro<\/strong> the Inca (1530s). They won with small forces because of <strong>disease<\/strong> (smallpox killed huge numbers), Native allies who hated Aztec rule, steel weapons, and horses. Silver from mines like <strong>Potosí<\/strong> made Spain the richest power in Europe for a century.<\/p>\n<p>Spain controlled labor through the <strong>encomienda system<\/strong>, which granted colonists the labor and tribute of Native people in return for \"protecting\" and Christianizing them — in practice, near-slavery. The Dominican friar <strong>Bartolomé de Las Casas<\/strong> denounced these abuses in his writings. Spain's colonies became a rigid, <strong>hierarchical society<\/strong> in which Spanish-born <em>peninsulares<\/em> ranked above American-born <em>creoles<\/em>, <em>mestizos<\/em> (mixed Spanish and Native ancestry), Native people, and enslaved Africans. Spanish men frequently intermarried with Native women, unlike most later English colonists.<\/p>\n<p>In what is now the United States, Spain founded <strong>St. Augustine, Florida (1565)<\/strong> — the oldest continuously occupied European city in the US — and pushed into New Mexico under <strong>Juan de Oñate<\/strong> (1598). Catholic <strong>missions<\/strong> tried to convert Pueblo peoples while suppressing their religion and demanding labor. In the <strong>Pueblo Revolt of 1680<\/strong>, a leader named <strong>Popé<\/strong> united the Pueblos and drove the Spanish out of New Mexico for about twelve years — the most successful Native uprising against European colonization. When Spain returned, it allowed more tolerance of Pueblo customs.<\/p>\n<h2>The Columbian Exchange<\/h2>\n<p>The <strong>Columbian Exchange<\/strong> was the transfer of plants, animals, people, and diseases between the Eastern and Western Hemispheres after 1492. It is one of the most tested ideas in this unit.<\/p>\n<ul><li><strong>Americas → Europe/Africa/Asia:<\/strong> maize, potatoes, tomatoes, cacao, tobacco. American crops fed Europe's population growth.<\/li><li><strong>Europe/Africa → Americas:<\/strong> horses, cattle, pigs, wheat, sugarcane, and — most important — <strong>diseases<\/strong> such as <strong>smallpox<\/strong> and measles, to which Native peoples had no immunity. Epidemics killed a large majority of the Native population in many regions.<\/li><li><strong>People:<\/strong> Europeans and, increasingly, enslaved Africans brought to replace dying Native laborers.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Native peoples had no immunity to Old World diseases<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Smallpox and other epidemics spread ahead of colonizers<\/div><span>→<\/span><div><b>Consequence<\/b>Native population collapse made conquest easier and drove demand for enslaved African labor<\/div><\/div>\n<h2>France and the Netherlands<\/h2>\n<p>The French came for <strong>fur, fish, and souls<\/strong>, not gold. <strong>Jacques Cartier<\/strong> explored the St. Lawrence River (1530s), and <strong>Samuel de Champlain<\/strong> founded <strong>Quebec (1608)<\/strong>. New France stayed thinly populated; the French relied on <strong>alliances and trade with Native peoples<\/strong> (especially the Huron), intermarried, and sent <strong>Jesuit missionaries<\/strong> who lived among Native communities. Because they needed Native partners rather than land, the French generally had better relations with Native peoples than the English did.<\/p>\n<p>The Dutch, sailing with <strong>Henry Hudson<\/strong> (1609), built a fur-trading colony, <strong>New Netherland<\/strong>, with its capital <strong>New Amsterdam<\/strong> on Manhattan (more in Unit 2).<\/p>\n<h2>England's late start<\/h2>\n<p>England was slower. <strong>John Cabot<\/strong> claimed Newfoundland for England in <strong>1497<\/strong>, but England was absorbed in religious upheaval after <strong>Henry VIII<\/strong> broke with the pope (1530s) and founded the Church of England. Under <strong>Elizabeth I<\/strong>, English \"sea dogs\" like <strong>Francis Drake<\/strong> raided Spanish treasure ships.<\/p>\n<p>The defeat of the <strong>Spanish Armada in 1588<\/strong> was a turning point: it weakened Spanish sea power and opened North America to English colonization.<\/p>\n<p>England's first attempt, <strong>Roanoke<\/strong> (Sir Walter Raleigh's colony, 1585–1587), failed; the 1587 colonists vanished — the \"<strong>Lost Colony<\/strong>.\" Writers like <strong>Richard Hakluyt<\/strong> urged colonization to rival Spain, spread Protestantism, and employ England's \"surplus\" poor.<\/p>\n<p>Why did English people eventually come in large numbers? At home, the <strong>enclosure movement<\/strong> pushed farmers off land, the population grew, and inheritance by <strong>primogeniture<\/strong> (eldest son inherits) left younger sons looking for opportunity. New <strong>joint-stock companies<\/strong> let investors pool money and share risk — the tool that would fund Jamestown in 1607.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Spanish Armada defeated; overpopulation and enclosure at home; joint-stock companies<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>England turns to colonization<\/div><span>→<\/span><div><b>Consequence<\/b>Jamestown (1607) and the English colonies of Unit 2<\/div><\/div>\n<h2>Big comparisons to remember<\/h2>\n<ul><li><strong>Spain:<\/strong> conquest, gold and silver, missions, encomienda, intermarriage, rigid hierarchy.<\/li><li><strong>France:<\/strong> fur trade, few settlers, Native alliances, Jesuits.<\/li><li><strong>England:<\/strong> many settlers, farming families, took land, kept Native peoples separate — the subject of the rest of this course.<\/li><\/ul>","words":1507,"minutes":10,"must":["<strong>Columbian Exchange:<\/strong> crops (maize, potatoes) went east; horses, livestock, wheat, sugar, and especially <strong>smallpox<\/strong> came west — disease caused the Native population collapse.","Motives for exploration: <strong>God, gold, glory<\/strong> + new technology (caravel, compass, printing press) + desire for an all-water route to Asia.","<strong>1492:<\/strong> Columbus reaches the Caribbean; Reconquista ends. <strong>1494 Treaty of Tordesillas<\/strong> splits the world between Spain and Portugal.","<strong>Encomienda system<\/strong> = Spanish grant of Native labor/tribute; <strong>Las Casas<\/strong> condemned the abuses.","<strong>Pueblo Revolt (1680)<\/strong> led by <strong>Popé<\/strong> expelled the Spanish from New Mexico for about 12 years.","<strong>French<\/strong> colonization = fur trade, small population, Native alliances, Jesuit missionaries.","<strong>Iroquois Confederacy<\/strong> = league of five nations in the Northeast; women (clan mothers) held political influence.","<strong>Spanish Armada (1588)<\/strong> defeat opened the way for English colonization; <strong>Roanoke<\/strong> = the \"Lost Colony.\"","<strong>Joint-stock companies<\/strong>, enclosure, and primogeniture explain <em>why<\/em> England colonized."],"timeline":[{"y":"c. 1100","e":"Cahokia, largest Mississippian mound city, at its peak","th":"S","key":false},{"y":"1488","e":"Dias rounds the Cape of Good Hope","th":"D","key":false},{"y":"1492","e":"Columbus reaches the Caribbean; Reconquista ends","th":"D","key":true},{"y":"1494","e":"Treaty of Tordesillas divides lands between Spain and Portugal","th":"D","key":false},{"y":"1497","e":"John Cabot claims Newfoundland for England","th":"D","key":false},{"y":"1517","e":"Luther begins the Protestant Reformation","th":"C","key":false},{"y":"1519–1521","e":"Cortés conquers the Aztec Empire","th":"D","key":false},{"y":"1534","e":"Henry VIII breaks with Rome; Cartier explores the St. Lawrence","th":"C","key":false},{"y":"1565","e":"St. Augustine, Florida founded by Spain","th":"P","key":true},{"y":"1587","e":"Roanoke \"Lost Colony\" settled","th":"S","key":false},{"y":"1588","e":"English defeat the Spanish Armada","th":"D","key":true},{"y":"1598","e":"Oñate colonizes New Mexico","th":"P","key":false},{"y":"1680","e":"Pueblo Revolt (Popé) drives Spain from New Mexico","th":"S","key":true}],"cards":[{"id":"c1-1","u":1,"f":"Columbian Exchange","b":"Transfer of crops, animals, people, and diseases between the hemispheres after 1492 (maize and potatoes east; horses, wheat, sugar, smallpox west)."},{"id":"c1-2","u":1,"f":"Encomienda","b":"Spanish grant giving colonists the labor and tribute of Native people in exchange for \"protection\" and Christian instruction — near-slavery in practice."},{"id":"c1-3","u":1,"f":"Bartolomé de Las Casas","b":"Spanish Dominican friar who condemned the cruelty of the encomienda system and Spanish treatment of Native peoples."},{"id":"c1-4","u":1,"f":"Treaty of Tordesillas (1494)","b":"Divided newly found lands between Spain (west) and Portugal (east, including Brazil)."},{"id":"c1-5","u":1,"f":"Pueblo Revolt (1680)","b":"Uprising led by Popé that drove the Spanish out of New Mexico for about 12 years."},{"id":"c1-6","u":1,"f":"Iroquois Confederacy","b":"Alliance of five (later six) Northeastern nations under the Great Law of Peace; clan mothers chose leaders."},{"id":"c1-7","u":1,"f":"Cahokia","b":"Largest city of the Mississippian mound-building culture, near present-day St. Louis."},{"id":"c1-8","u":1,"f":"\"God, gold, and glory\"","b":"Shorthand for European motives for exploration: spreading Christianity, wealth, and national/personal prestige."},{"id":"c1-9","u":1,"f":"Spanish Armada (1588)","b":"Spanish fleet defeated by England; weakened Spain and opened North America to English colonization."},{"id":"c1-10","u":1,"f":"Roanoke","b":"England's failed 1580s colony off North Carolina; the 1587 settlers disappeared (\"Lost Colony\")."},{"id":"c1-11","u":1,"f":"Joint-stock company","b":"Business in which investors pool money and share risk; funded early English colonies such as Jamestown."},{"id":"c1-12","u":1,"f":"New France","b":"French colony centered on Quebec (1608); built on the fur trade, Native alliances, and Jesuit missions, with few settlers."},{"id":"c1-13","u":1,"f":"Primogeniture","b":"Inheritance by the eldest son; left younger English sons seeking land and fortune in the colonies."}],"quiz":["q1-1","q1-2","q1-3","q1-4","q1-5","q1-6","q1-7","q1-8","q1-9","q1-10"]},{"n":2,"title":"Founding the Colonies","short":"Founding the Colonies","years":"1607–1700","weight":6,"lesson":"<h2>Why this unit matters<\/h2>\n<p>In less than a century, England planted colonies from Maine to the Carolinas. The exam tests the <strong>contrasts between regions<\/strong> — the Chesapeake, New England, the Middle colonies, and the Carolinas — and the moments that shaped them: <strong>Jamestown<\/strong>, the <strong>Mayflower Compact<\/strong>, <strong>Puritan dissenters<\/strong>, <strong>Bacon's Rebellion<\/strong>, and <strong>King Philip's War<\/strong>. Learn each region as a package: <em>who came, why, what they grew, and how they governed<\/em>.<\/p>\n<h2>The Chesapeake: Virginia and Maryland<\/h2>\n<p><strong>Jamestown (1607)<\/strong> was founded by the <strong>Virginia Company<\/strong>, a joint-stock company hoping for gold. The first years were a disaster: colonists chose a swampy site, many were gentlemen unused to labor, and disease and hunger killed most of them. <strong>John Smith<\/strong> imposed discipline (\"he that will not work shall not eat\"), and the colony survived only with food from the <strong>Powhatan Confederacy<\/strong>. The winter of 1609–1610 was the <strong>\"starving time.\"<\/strong><\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Search for profit; no gold found<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>John Rolfe's tobacco (1612) becomes a cash crop<\/div><span>→<\/span><div><b>Consequence<\/b>Demand for land and labor, war with the Powhatans, and a boom economy<\/div><\/div>\n<p><strong>Tobacco<\/strong> saved Virginia. <strong>John Rolfe<\/strong> introduced a sweet strain around 1612 (he also married <strong>Pocahontas<\/strong>, daughter of Powhatan, bringing a brief peace). Tobacco needed vast land and many workers. Virginia attracted labor with the <strong>headright system<\/strong>: anyone who paid a person's passage received 50 acres per head. Most early laborers were <strong>indentured servants<\/strong> — mostly poor young Englishmen who worked 4–7 years in return for passage and \"freedom dues.\"<\/p>\n<p><strong>1619<\/strong> was a landmark year: the <strong>House of Burgesses<\/strong>, the first elected representative assembly in English America, met; and the first recorded <strong>Africans<\/strong> arrived in Virginia. After a Powhatan attack in 1622, the king revoked the Virginia Company's charter and made Virginia a <strong>royal colony (1624)<\/strong>.<\/p>\n<p><strong>Maryland (1634)<\/strong> was a <strong>proprietary colony<\/strong> granted to <strong>Lord Baltimore<\/strong> (the Calvert family) as a refuge for English <strong>Catholics<\/strong>. Because Protestants soon outnumbered Catholics, Maryland passed the <strong>Act of Toleration (1649)<\/strong>, protecting all <em>Christians<\/em> (not non-Christians) — an early but limited step toward religious freedom.<\/p>\n<p>Chesapeake society was rough: heavily male, high death rates from malaria, scattered tobacco plantations along rivers, few towns, and weak churches and schools.<\/p>\n<h2>Bacon's Rebellion and the turn to slavery<\/h2>\n<p>By the 1670s, many freed servants were landless and angry. Rich planters held the best land near the coast, and Governor <strong>William Berkeley<\/strong> refused to attack Native peoples on the frontier (he profited from the fur trade). In <strong>1676<\/strong>, <strong>Nathaniel Bacon<\/strong> led frontiersmen and servants in <strong>Bacon's Rebellion<\/strong>, attacking Native villages and burning <strong>Jamestown<\/strong>. The revolt collapsed when Bacon died of disease.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Landless freedmen, falling tobacco prices, frontier conflict with Native peoples<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Bacon's Rebellion (1676)<\/div><span>→<\/span><div><b>Consequence<\/b>Planters turn from indentured servants to enslaved Africans, who could not become free and rebellious landless men<\/div><\/div>\n<p>Planters concluded that freed servants were dangerous. As English wages improved and fewer servants came, and as the <strong>Royal African Company<\/strong> supplied more captives, the Chesapeake shifted to <strong>African slavery<\/strong>. Virginia's laws hardened: a 1662 law made a child's status follow the <strong>mother<\/strong> (so children of enslaved women were enslaved), and later <strong>slave codes<\/strong> made slavery lifelong, hereditary, and racial.<\/p>\n<h2>New England: Pilgrims and Puritans<\/h2>\n<p>New England was founded for <strong>religious<\/strong> reasons. Two groups matter:<\/p>\n<ul><li><strong>Pilgrims<\/strong> were <strong>Separatists<\/strong> — they believed the Church of England was so corrupt they had to leave it entirely. Sailing on the <em>Mayflower<\/em>, they founded <strong>Plymouth (1620)<\/strong>. Before landing they signed the <strong>Mayflower Compact<\/strong>, an agreement to form a \"civil body politic\" and obey laws made for the general good — an early example of <strong>self-government by consent<\/strong>. With help from <strong>Squanto<\/strong> (Tisquantum) and the Wampanoag leader <strong>Massasoit<\/strong>, they survived.<\/li><li><strong>Puritans<\/strong> wanted to <strong>purify<\/strong> the Church of England from within (non-separatists). Led by <strong>John Winthrop<\/strong>, they founded the <strong>Massachusetts Bay Colony (1630)<\/strong>, part of the <strong>Great Migration<\/strong> of about 20,000 people in the 1630s. Winthrop told them they would be \"<strong>a city upon a hill<\/strong>\" — a model Christian community watched by the world.<\/li><\/ul>\n<p>Puritans believed in <strong>predestination<\/strong> (God already chose the saved, the \"elect\") and the <strong>covenant<\/strong>: a community bound to God and each other. Only church members (the \"visible saints\") could vote in the colony. Puritans valued literacy so people could read the Bible: they founded <strong>Harvard (1636)<\/strong> and passed laws requiring towns to support schools.<\/p>\n<p>New England grew differently from the Chesapeake. Puritans came as <strong>families<\/strong>, the climate was healthier, and people lived longer. Settlement was organized around compact <strong>towns<\/strong> with a church and a <strong>town meeting<\/strong>. The rocky soil supported small <strong>subsistence farms<\/strong>, so the economy turned to <strong>fishing, lumber, shipbuilding, and trade<\/strong>.<\/p>\n<h2>Dissent and new colonies<\/h2>\n<p>Puritans wanted religious freedom for themselves, not for others. Dissenters were expelled:<\/p>\n<ul><li><strong>Roger Williams<\/strong> argued for <strong>separation of church and state<\/strong> and that colonists should buy land fairly from Native peoples. Banished, he founded <strong>Rhode Island (1636)<\/strong>, which offered broad religious toleration.<\/li><li><strong>Anne Hutchinson<\/strong> claimed believers could receive direct revelation from God and that ministers were stressing good works (a view called <strong>antinomianism<\/strong>). She was tried and banished in 1638 — a challenge both to Puritan theology and to expectations of women.<\/li><li><strong>Thomas Hooker<\/strong> led settlers to <strong>Connecticut<\/strong>; its <strong>Fundamental Orders (1639)<\/strong> are often called the first written constitution in America.<\/li><\/ul>\n<p>As fewer children of Puritans had a conversion experience, churches adopted the <strong>Half-Way Covenant (1662)<\/strong>, allowing their children to be baptized without full membership — a sign of declining religious zeal. The <strong>Salem witch trials (1692)<\/strong>, in which 20 people were executed, reflected social tensions, fear, and anxiety in late-1600s Massachusetts.<\/p>\n<h2>Conflict with Native peoples<\/h2>\n<p>Expansion brought war. The <strong>Pequot War (1637)<\/strong> ended with a massacre of Pequots at Mystic. The bloodiest conflict was <strong>King Philip's War (1675–1676)<\/strong>, led by the Wampanoag leader <strong>Metacom<\/strong> (called King Philip by the English). Native forces destroyed many frontier towns, but disease, food shortages, and Mohawk attacks defeated them. Afterward, Native power in southern New England was broken.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>English settlers pressing onto Native land and pressure to adopt English ways<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>King Philip's War (1675–1676)<\/div><span>→<\/span><div><b>Consequence<\/b>Native resistance in southern New England crushed; colonists' hostility toward Native peoples hardened<\/div><\/div>\n<h2>The Middle colonies<\/h2>\n<p>After 1660, the restored king <strong>Charles II<\/strong> granted land to his supporters (the \"Restoration colonies\").<\/p>\n<ul><li><strong>New York:<\/strong> the English seized Dutch <strong>New Netherland<\/strong> in <strong>1664<\/strong> and renamed it for the <strong>Duke of York<\/strong>. It kept a diverse population — Dutch, English, Jews, Africans — and New York City became a trading hub.<\/li><li><strong>Pennsylvania (1681):<\/strong> <strong>William Penn<\/strong>, a <strong>Quaker<\/strong>, founded a \"<strong>holy experiment<\/strong>.\" Quakers believed in an <strong>inner light<\/strong> in every person, pacifism, and equality (women could preach). Pennsylvania offered <strong>religious toleration<\/strong>, a representative assembly, and fair purchase of land from the <strong>Lenape<\/strong> (Delaware) — Philadelphia became the fastest-growing colonial city.<\/li><li><strong>New Jersey<\/strong> and <strong>Delaware<\/strong> completed the region.<\/li><\/ul>\n<p>The Middle colonies were the most <strong>ethnically and religiously diverse<\/strong>. Fertile soil made them the \"<strong>breadbasket<\/strong>\" colonies, exporting wheat and flour.<\/p>\n<h2>The Carolinas<\/h2>\n<p><strong>Carolina (1663)<\/strong> was granted to eight proprietors. Its southern part was settled by planters from <strong>Barbados<\/strong>, an English sugar island where slavery was harsh and dominant. They brought the West Indian slave model with them; later, <strong>rice<\/strong> cultivation (relying on the skills of West Africans) made <strong>South Carolina<\/strong> a majority-enslaved colony by the early 1700s. <strong>Charleston<\/strong> was its port. North Carolina, poorer and more independent, had small tobacco farms.<\/p>\n<h2>Governing the empire<\/h2>\n<p>Colonies were <strong>royal<\/strong> (crown-run), <strong>proprietary<\/strong> (owned by an individual), or <strong>corporate/charter<\/strong> (self-governing, like Connecticut and Rhode Island). England briefly tried to tighten control: James II combined the northern colonies into the <strong>Dominion of New England (1686)<\/strong> under <strong>Edmund Andros<\/strong>, abolishing assemblies. When James II was overthrown in England's <strong>Glorious Revolution (1688–1689)<\/strong>, colonists ousted Andros and the Dominion collapsed — a precedent for resisting arbitrary royal power.<\/p>\n<h2>Big comparison<\/h2>\n<ul><li><strong>Chesapeake:<\/strong> profit, tobacco, servants then slaves, men, scattered plantations, high death rate.<\/li><li><strong>New England:<\/strong> religion, families, towns, town meetings, diverse small-scale economy, long lives.<\/li><li><strong>Middle:<\/strong> diversity, toleration, grain, trade cities.<\/li><li><strong>Carolinas:<\/strong> Barbados model, rice, slave majority.<\/li><\/ul>","words":1587,"minutes":11,"must":["<strong>Jamestown (1607)<\/strong> survived thanks to <strong>tobacco<\/strong> (John Rolfe); labor came from <strong>indentured servants<\/strong> recruited through the <strong>headright system<\/strong>.","<strong>1619:<\/strong> <strong>House of Burgesses<\/strong> (first representative assembly) + first Africans in Virginia.","<strong>Bacon's Rebellion (1676):<\/strong> frontier freedmen vs. Gov. Berkeley → planters shift to <strong>enslaved African labor<\/strong>.","<strong>Mayflower Compact (1620):<\/strong> Pilgrims (Separatists) agree to self-government by consent.","<strong>Puritans<\/strong> (Massachusetts Bay, 1630, Winthrop's \"<strong>city upon a hill<\/strong>\") wanted to purify, not leave, the Church of England.","Dissenters: <strong>Roger Williams<\/strong> (church–state separation, Rhode Island) and <strong>Anne Hutchinson<\/strong> (banished).","<strong>King Philip's War (1675–76)<\/strong> broke Native power in southern New England.","<strong>Pennsylvania (1681):<\/strong> William Penn, <strong>Quakers<\/strong>, toleration, fair dealings with the Lenape.","<strong>Maryland Act of Toleration (1649)<\/strong> protected all Christians; Maryland was a Catholic refuge.","<strong>Half-Way Covenant (1662)<\/strong> = sign of declining Puritan zeal."],"timeline":[{"y":"1607","e":"Jamestown founded by the Virginia Company","th":"P","key":true},{"y":"1612","e":"John Rolfe begins growing tobacco","th":"E","key":false},{"y":"1619","e":"House of Burgesses meets; first Africans arrive in Virginia","th":"P","key":true},{"y":"1620","e":"Pilgrims sign the Mayflower Compact; Plymouth founded","th":"P","key":true},{"y":"1624","e":"Virginia becomes a royal colony","th":"P","key":false},{"y":"1630","e":"Massachusetts Bay Colony founded (Winthrop)","th":"C","key":true},{"y":"1636","e":"Roger Williams founds Rhode Island; Harvard founded","th":"C","key":false},{"y":"1638","e":"Anne Hutchinson banished","th":"C","key":false},{"y":"1639","e":"Fundamental Orders of Connecticut","th":"P","key":false},{"y":"1649","e":"Maryland Act of Toleration","th":"C","key":false},{"y":"1662","e":"Half-Way Covenant","th":"C","key":false},{"y":"1664","e":"English seize New Netherland (New York)","th":"D","key":false},{"y":"1675–1676","e":"King Philip's War","th":"S","key":true},{"y":"1676","e":"Bacon's Rebellion","th":"S","key":true},{"y":"1681","e":"Pennsylvania granted to William Penn","th":"C","key":false},{"y":"1686–1689","e":"Dominion of New England; collapses after the Glorious Revolution","th":"P","key":false},{"y":"1692","e":"Salem witch trials","th":"S","key":false}],"cards":[{"id":"c2-1","u":2,"f":"Headright system","b":"Virginia policy granting 50 acres to anyone who paid a person's passage; fueled indentured servitude and land concentration."},{"id":"c2-2","u":2,"f":"Indentured servant","b":"Laborer who worked 4–7 years in exchange for passage to America and \"freedom dues\"; main Chesapeake labor force before 1680."},{"id":"c2-3","u":2,"f":"House of Burgesses (1619)","b":"Virginia's elected assembly — the first representative legislature in English America."},{"id":"c2-4","u":2,"f":"Bacon's Rebellion (1676)","b":"Revolt of Virginia frontiersmen and freedmen against Gov. Berkeley; pushed planters toward enslaved African labor."},{"id":"c2-5","u":2,"f":"Mayflower Compact (1620)","b":"Pilgrims' agreement to form a \"civil body politic\" and obey just laws — early self-government by consent."},{"id":"c2-6","u":2,"f":"Separatists vs. Puritans","b":"Separatists (Pilgrims) left the Church of England; Puritans wanted to purify it from within."},{"id":"c2-7","u":2,"f":"\"City upon a hill\"","b":"John Winthrop's 1630 vision of Massachusetts Bay as a model Christian community for the world."},{"id":"c2-8","u":2,"f":"Roger Williams","b":"Banished Puritan minister who argued for separation of church and state and founded Rhode Island (1636)."},{"id":"c2-9","u":2,"f":"Anne Hutchinson","b":"Challenged Puritan ministers with claims of direct revelation (antinomianism); banished in 1638."},{"id":"c2-10","u":2,"f":"Fundamental Orders (1639)","b":"Connecticut's plan of government, often called the first written constitution in America."},{"id":"c2-11","u":2,"f":"Half-Way Covenant (1662)","b":"Let children of baptized but unconverted Puritans be baptized; showed declining religious zeal."},{"id":"c2-12","u":2,"f":"King Philip's War (1675–76)","b":"War led by Metacom (Wampanoag) against New England colonists; ended Native power in southern New England."},{"id":"c2-13","u":2,"f":"Quakers / Pennsylvania","b":"William Penn's 1681 \"holy experiment\": inner light, pacifism, toleration, and fair land purchases from the Lenape."},{"id":"c2-14","u":2,"f":"Maryland Act of Toleration (1649)","b":"Granted religious freedom to all Christians in Maryland, a proprietary refuge for Catholics."},{"id":"c2-15","u":2,"f":"Dominion of New England (1686–89)","b":"James II's consolidation of northern colonies under Gov. Andros; collapsed after the Glorious Revolution."}],"quiz":["q2-1","q2-2","q2-3","q2-4","q2-5","q2-6","q2-7","q2-8","q2-9","q2-10"]},{"n":3,"title":"Colonial Society, Economy & Empire","short":"Colonial Society & Empire","years":"1680–1763","weight":7,"lesson":"<h2>Why this unit matters<\/h2>\n<p>Between about 1680 and 1763 the colonies grew from struggling outposts into prosperous, crowded, increasingly self-confident societies. This unit explains the <strong>economic system<\/strong> that bound them to Britain (<strong>mercantilism<\/strong>), the spread of <strong>slavery<\/strong>, two big intellectual currents (<strong>the Great Awakening<\/strong> and <strong>the Enlightenment<\/strong>), the habit of <strong>self-government<\/strong> that grew under <strong>salutary neglect<\/strong>, and the <strong>French and Indian War<\/strong> that changed everything. Unit 4's revolution grows directly out of this unit.<\/p>\n<h2>Mercantilism and the Navigation Acts<\/h2>\n<p><strong>Mercantilism<\/strong> was the economic theory behind the British Empire: a nation grows rich by exporting more than it imports and piling up gold and silver. Colonies existed to benefit the <strong>mother country<\/strong> — supplying raw materials (tobacco, rice, lumber, furs) and buying finished British goods.<\/p>\n<p>Parliament enforced this through the <strong>Navigation Acts<\/strong> (beginning in 1651 and 1660). Key rules:<\/p>\n<ul><li>Colonial trade had to use <strong>English or colonial ships<\/strong>.<\/li><li>Certain \"<strong>enumerated goods<\/strong>\" — like tobacco, sugar, and later rice — could be shipped <strong>only to England<\/strong>.<\/li><li>Most European goods bound for the colonies had to pass through England first.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Mercantilist belief that colonies should enrich the mother country<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Navigation Acts restrict colonial trade<\/div><span>→<\/span><div><b>Consequence<\/b>Colonial resentment and widespread smuggling; later British enforcement after 1763 sparks protest<\/div><\/div>\n<p>In practice, the system worked tolerably well for colonists: they had a protected market, and British naval protection. Many merchants simply <strong>smuggled<\/strong> to avoid duties, especially molasses from the French West Indies (the <strong>Molasses Act of 1733<\/strong> taxed it but was rarely enforced).<\/p>\n<h2>Salutary neglect and colonial self-government<\/h2>\n<p>From about the 1720s to 1763, Britain — under Prime Minister <strong>Robert Walpole<\/strong> — followed a policy later called <strong>salutary neglect<\/strong>: it loosely enforced trade laws and let colonies run their own affairs as long as they stayed loyal and profitable. Edmund Burke later praised this as a wise \"neglect.\"<\/p>\n<p>During these decades <strong>colonial assemblies<\/strong> grew powerful. Royal governors were appointed in London, but assemblies controlled the <strong>\"power of the purse\"<\/strong> — taxes and even the governor's salary. Colonists came to see their assemblies as small parliaments and believed only their own elected representatives could tax them. Voting was limited to property-owning white men, but because land was widespread, a much larger share of men could vote than in England.<\/p>\n<p>The <strong>Zenger trial (1735)<\/strong> advanced freedom of the press: New York printer <strong>John Peter Zenger<\/strong> was acquitted of libel for criticizing the governor because what he printed was true.<\/p>\n<div class=\"tip\"><b>Exam tip:<\/b> Salutary neglect matters because it explains <em>why<\/em> colonists reacted so strongly after 1763: they had grown used to self-government, and new British taxes felt like a break from long tradition.<\/div>\n<h2>The Atlantic economy and slavery<\/h2>\n<p>Colonial trade formed a web often called the <strong>triangular trade<\/strong>: for example, New England rum went to Africa to buy enslaved people; enslaved Africans were carried to the West Indies and mainland colonies; and sugar and molasses went back to New England to make more rum.<\/p>\n<p>The voyage of captives across the Atlantic was the <strong>Middle Passage<\/strong> — weeks chained below decks, with very high death rates. Roughly 10–12 million Africans were carried across the Atlantic over the whole slave trade; most went to the Caribbean and Brazil, and roughly 400,000 to mainland North America.<\/p>\n<p>By the 1700s, slavery existed in <strong>every colony<\/strong>, but it was the base of the southern economy: <strong>tobacco<\/strong> in the Chesapeake, <strong>rice and indigo<\/strong> in South Carolina and Georgia. In South Carolina enslaved people outnumbered whites. Unlike Caribbean populations, the enslaved population of North America grew by <strong>natural increase<\/strong> after the early 1700s, and enslaved people built families, churches, and a distinctive culture blending African traditions.<\/p>\n<p>Enslaved people resisted — by working slowly, running away, and occasionally by revolt. In the <strong>Stono Rebellion (1739)<\/strong> in South Carolina, about 60–100 enslaved people marched toward Spanish Florida, which promised freedom; the revolt was crushed and South Carolina passed a harsher <strong>slave code<\/strong>. <strong>Slave codes<\/strong> across the colonies denied enslaved people the right to assemble, travel, own weapons, or learn to read.<\/p>\n<p><strong>Georgia (1732)<\/strong>, the last of the thirteen colonies, was founded by <strong>James Oglethorpe<\/strong> as a <strong>buffer<\/strong> against Spanish Florida and a fresh start for the \"worthy poor\" (including some former debtors). It originally <strong>banned slavery<\/strong> and large landholdings, but settlers protested and slavery was legalized in <strong>1751<\/strong>.<\/p>\n<h2>A growing, diverse population<\/h2>\n<p>Colonial population roughly doubled every 25 years, from about 250,000 in 1700 to 2.5 million by 1775, through high birth rates and immigration. Newcomers included the <strong>Scots-Irish<\/strong> (Presbyterians who moved to the western frontier and clashed with Native peoples) and <strong>Germans<\/strong> (often called the \"Pennsylvania Dutch\"), many of whom settled in Pennsylvania's fertile backcountry.<\/p>\n<p>Society was hierarchical: a wealthy <strong>gentry<\/strong> of planters and merchants at the top, many small farmers in the middle, and servants and the enslaved at the bottom. Women under the legal doctrine of <strong>coverture<\/strong> lost their separate legal identity when they married — their property and earnings belonged to their husbands.<\/p>\n<h2>The Great Awakening<\/h2>\n<p>The <strong>Great Awakening<\/strong> (1730s–1740s) was a wave of emotional religious revivals. Preachers stressed personal conversion, sin, and an emotional relationship with God rather than formal learning.<\/p>\n<ul><li><strong>Jonathan Edwards<\/strong>, a Massachusetts minister, preached \"<strong>Sinners in the Hands of an Angry God<\/strong>\" (1741), warning listeners of hell.<\/li><li><strong>George Whitefield<\/strong>, an English evangelist, toured the colonies drawing huge outdoor crowds; even the skeptical Ben Franklin admired his speaking.<\/li><\/ul>\n<p>Churches split between \"<strong>New Lights<\/strong>\" (pro-revival) and \"<strong>Old Lights<\/strong>\" (traditional). New denominations, especially <strong>Baptists and Methodists<\/strong>, grew. New colleges — such as Princeton, Brown, Rutgers, and Dartmouth — were founded partly to train ministers.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Declining religious zeal; formal, intellectual preaching<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Great Awakening revivals (1730s–1740s)<\/div><span>→<\/span><div><b>Consequence<\/b>Splits in churches, growth of new denominations, more willingness to challenge established authority, and a shared intercolonial experience<\/div><\/div>\n<p>The Awakening's biggest political effect: it taught ordinary people that they could <strong>judge authority for themselves<\/strong> and break from established churches — habits that carried into the Revolution. It was also the first event experienced across <strong>all the colonies<\/strong>.<\/p>\n<h2>The Enlightenment<\/h2>\n<p>At the same time, educated colonists absorbed the <strong>Enlightenment<\/strong>, the European intellectual movement that stressed <strong>reason<\/strong>, science, and natural laws.<\/p>\n<ul><li><strong>John Locke<\/strong> (English philosopher) argued that people have <strong>natural rights<\/strong> to life, liberty, and property, and that government rests on the <strong>consent of the governed<\/strong>; if it violates those rights, people may change it. This idea runs straight into the Declaration of Independence.<\/li><li><strong>Benjamin Franklin<\/strong> embodied the colonial Enlightenment: printer, scientist (electricity experiments), inventor, and author of <strong>Poor Richard's Almanack<\/strong>.<\/li><li><strong>Deism<\/strong> — belief in a creator God who set up natural laws and then did not intervene — appealed to some elite thinkers, including Franklin and Jefferson.<\/li><\/ul>\n<div class=\"tip\"><b>Exam tip:<\/b> A favorite exam contrast: the Great Awakening appealed to <strong>emotion and faith<\/strong>; the Enlightenment appealed to <strong>reason and science<\/strong>. Both encouraged people to question traditional authority.<\/div>\n<h2>Imperial wars and the French and Indian War<\/h2>\n<p>Britain and France fought a series of wars for empire — <strong>King William's War<\/strong>, <strong>Queen Anne's War<\/strong>, and <strong>King George's War<\/strong> — with colonists and Native allies fighting in North America. The decisive one was the <strong>French and Indian War (1754–1763)<\/strong> (part of the global <strong>Seven Years' War<\/strong>).<\/p>\n<p><strong>Cause:<\/strong> both Britain and France claimed the <strong>Ohio River Valley<\/strong>. In 1754, a young Virginia militia officer, <strong>George Washington<\/strong>, clashed with French forces and was forced to surrender at <strong>Fort Necessity<\/strong>.<\/p>\n<p>That same year, delegates met at Albany. <strong>Benjamin Franklin<\/strong> proposed the <strong>Albany Plan of Union<\/strong>, a council of colonies to coordinate defense (his famous \"<strong>Join, or Die<\/strong>\" snake cartoon promoted it). The colonial assemblies <strong>rejected<\/strong> it because they did not want to give up control over taxes — but it was an early idea of colonial unity.<\/p>\n<p>The war went badly for Britain at first (General <strong>Braddock<\/strong> was killed in 1755). Then Prime Minister <strong>William Pitt<\/strong> poured money and troops into America. The British captured <strong>Quebec (1759)<\/strong>, where General <strong>Wolfe<\/strong> defeated <strong>Montcalm<\/strong> on the Plains of Abraham, and Montreal fell in 1760.<\/p>\n<p>The <strong>Treaty of Paris (1763)<\/strong> ended French power in North America:<\/p>\n<ul><li><strong>Britain<\/strong> gained <strong>Canada<\/strong> and all French land <strong>east of the Mississippi<\/strong>, plus <strong>Florida<\/strong> from Spain.<\/li><li><strong>Spain<\/strong> received <strong>Louisiana<\/strong> (land west of the Mississippi and New Orleans) from France.<\/li><\/ul>\n<div class=\"chain\"><div><b>Cause<\/b>Rivalry over the Ohio Valley<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>French and Indian War (1754–1763)<\/div><span>→<\/span><div><b>Consequence<\/b>Britain dominates eastern North America but has a huge war debt; Native peoples lose their French ally; Britain ends salutary neglect<\/div><\/div>\n<h2>Consequences that set up the Revolution<\/h2>\n<p>The war left Britain with an enormous <strong>debt<\/strong> and a belief that colonists should help pay for their own defense. Colonists, meanwhile, felt proud of their contribution and no longer needed British protection from France. Many British officers had looked down on colonial soldiers, and colonists resented it. Native peoples, no longer able to play France against Britain, faced a flood of settlers. Unit 4 begins at this exact moment.<\/p>","words":1715,"minutes":11,"must":["<strong>Mercantilism:<\/strong> colonies exist to enrich the mother country; enforced by the <strong>Navigation Acts<\/strong> (enumerated goods to England only; English/colonial ships).","<strong>Salutary neglect<\/strong> (c. 1720s–1763, Walpole): loose enforcement → strong <strong>colonial assemblies<\/strong> with the power of the purse.","<strong>Great Awakening<\/strong> (1730s–40s): <strong>Jonathan Edwards<\/strong>, <strong>George Whitefield<\/strong>; emotional revivals; New Lights vs. Old Lights; encouraged questioning authority.","<strong>Enlightenment:<\/strong> reason and natural law; <strong>John Locke<\/strong> = natural rights and consent of the governed; <strong>Franklin<\/strong> as the model colonial thinker.","<strong>Middle Passage<\/strong> = Atlantic crossing of enslaved Africans; <strong>triangular trade<\/strong> linked New England, Africa, the West Indies.","<strong>Stono Rebellion (1739)<\/strong> in South Carolina → harsher slave codes.","<strong>Georgia (1732):<\/strong> Oglethorpe; buffer against Spanish Florida; banned slavery until 1751.","<strong>Zenger trial (1735)<\/strong> → truth as a defense in libel; freedom of the press.","<strong>Albany Plan of Union (1754):<\/strong> Franklin's plan for colonial cooperation — <strong>rejected<\/strong> by the colonies.","<strong>Treaty of Paris (1763):<\/strong> France loses Canada and lands east of the Mississippi; Britain left with huge war debt."],"timeline":[{"y":"1651–1696","e":"Navigation Acts passed and expanded","th":"E","key":false},{"y":"1689–1763","e":"Series of Anglo-French imperial wars","th":"D","key":false},{"y":"1733","e":"Molasses Act (rarely enforced)","th":"E","key":false},{"y":"1732","e":"Georgia founded by James Oglethorpe","th":"P","key":true},{"y":"1735","e":"Zenger trial establishes truth as a libel defense","th":"P","key":false},{"y":"1739","e":"Stono Rebellion in South Carolina","th":"S","key":true},{"y":"1730s–1740s","e":"Great Awakening; Edwards's \"Sinners\" sermon (1741)","th":"C","key":true},{"y":"1751","e":"Georgia legalizes slavery","th":"S","key":false},{"y":"1754","e":"French and Indian War begins; Albany Plan of Union rejected","th":"D","key":true},{"y":"1755","e":"Braddock's defeat","th":"D","key":false},{"y":"1759","e":"British capture Quebec","th":"D","key":false},{"y":"1763","e":"Treaty of Paris ends the French and Indian War","th":"D","key":true}],"cards":[{"id":"c3-1","u":3,"f":"Mercantilism","b":"Theory that a nation grows rich through favorable trade balances and stores of gold; colonies supply raw materials and buy the mother country's goods."},{"id":"c3-2","u":3,"f":"Navigation Acts","b":"Laws (from 1651) requiring colonial trade to use English/colonial ships and sending enumerated goods like tobacco only to England."},{"id":"c3-3","u":3,"f":"Enumerated goods","b":"Colonial products (tobacco, sugar, later rice) that could be shipped only to England under the Navigation Acts."},{"id":"c3-4","u":3,"f":"Salutary neglect","b":"British policy (c. 1720s–1763) of loosely enforcing trade laws, letting colonial self-government grow."},{"id":"c3-5","u":3,"f":"Power of the purse","b":"Colonial assemblies' control over taxes and the governor's salary — their main lever over royal governors."},{"id":"c3-6","u":3,"f":"Triangular trade","b":"Atlantic trade network linking New England (rum), Africa (enslaved people), and the West Indies (sugar/molasses)."},{"id":"c3-7","u":3,"f":"Middle Passage","b":"The deadly voyage of enslaved Africans across the Atlantic."},{"id":"c3-8","u":3,"f":"Stono Rebellion (1739)","b":"South Carolina slave revolt; rebels headed for Spanish Florida; led to a harsher slave code."},{"id":"c3-9","u":3,"f":"Great Awakening","b":"1730s–40s religious revival stressing emotion and personal conversion; Edwards and Whitefield; split churches into New and Old Lights."},{"id":"c3-10","u":3,"f":"Jonathan Edwards","b":"Massachusetts minister of the Great Awakening; \"Sinners in the Hands of an Angry God\" (1741)."},{"id":"c3-11","u":3,"f":"George Whitefield","b":"English evangelist whose open-air preaching tours spread the Great Awakening across the colonies."},{"id":"c3-12","u":3,"f":"John Locke","b":"Enlightenment philosopher: natural rights to life, liberty, property; government by consent; right to change bad government."},{"id":"c3-13","u":3,"f":"Deism","b":"Belief in a rational creator who set natural laws and does not intervene; held by some Enlightenment figures like Franklin and Jefferson."},{"id":"c3-14","u":3,"f":"Zenger trial (1735)","b":"New York printer acquitted of libel because his criticism of the governor was true; advanced freedom of the press."},{"id":"c3-15","u":3,"f":"Albany Plan of Union (1754)","b":"Franklin's proposal for a colonial council for defense (\"Join, or Die\"); rejected by the colonial assemblies."},{"id":"c3-16","u":3,"f":"Treaty of Paris (1763)","b":"Ended the French and Indian War; France lost Canada and land east of the Mississippi; Spain gained Louisiana."},{"id":"c3-17","u":3,"f":"Coverture","b":"Legal doctrine under which a married woman's legal identity and property were absorbed by her husband."}],"quiz":["q3-1","q3-2","q3-3","q3-4","q3-5","q3-6","q3-7","q3-8","q3-9","q3-10","q3-11"]},{"n":4,"title":"Road to Revolution & Independence","short":"Revolution","years":"1763–1783","weight":7,"lesson":"<h2>Why this unit matters<\/h2>\n<p>In 1763, colonists celebrated being British. Thirteen years later they declared independence. The exam loves this <strong>chain of action and reaction<\/strong>: a British law, a colonial protest, a British response. Learn the laws <strong>in order<\/strong>, what each did, and how colonists answered. Then learn why the outnumbered Americans won the war.<\/p>\n<h2>The problem after 1763<\/h2>\n<p>Britain had won the French and Indian War but owed a massive <strong>debt<\/strong>, and now had to defend a huge new empire. Its leaders concluded the colonists should <strong>pay part of the cost<\/strong> and obey the trade laws they had long ignored. Salutary neglect was over.<\/p>\n<p>Trouble began in the West. Native peoples of the Ohio Valley, angry at British traders and settlers, rose up in <strong>Pontiac's Rebellion (1763)<\/strong>, led by the Ottawa leader <strong>Pontiac<\/strong>, capturing several British forts. To avoid more costly wars, Britain issued the <strong>Proclamation of 1763<\/strong>, forbidding colonists to settle <strong>west of the Appalachian Mountains<\/strong>. Colonists who had fought for that land were furious, and many ignored the line.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Pontiac's Rebellion and the cost of frontier wars<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Proclamation of 1763 bans settlement west of the Appalachians<\/div><span>→<\/span><div><b>Consequence<\/b>Colonists resent limits on westward expansion<\/div><\/div>\n<h2>Grenville's taxes and the Stamp Act crisis<\/h2>\n<p>Prime Minister <strong>George Grenville<\/strong> pushed new revenue laws:<\/p>\n<ul><li><strong>Sugar Act (1764):<\/strong> actually <em>lowered<\/em> the duty on molasses but meant to <strong>enforce<\/strong> it, with smugglers tried in <strong>vice-admiralty courts<\/strong> without juries.<\/li><li><strong>Currency Act (1764):<\/strong> banned colonial paper money as legal tender.<\/li><li><strong>Stamp Act (1765):<\/strong> the first <strong>direct tax<\/strong> on colonists — on newspapers, legal documents, licenses, playing cards. It hit lawyers, printers, and merchants, the most vocal people in the colonies.<\/li><li><strong>Quartering Act (1765):<\/strong> required colonies to house and supply British troops.<\/li><\/ul>\n<p>Colonists answered with the principle \"<strong>no taxation without representation<\/strong>.\" They argued that only their own assemblies could tax them. British officials replied with <strong>virtual representation<\/strong>: Parliament represented all British subjects, even those who could not vote for it. Colonists rejected this; they believed in <strong>actual representation<\/strong> by people they elected.<\/p>\n<p>Protest took many forms. Nine colonies sent delegates to the <strong>Stamp Act Congress (1765)<\/strong>, which petitioned the king. The <strong>Sons of Liberty<\/strong> intimidated stamp distributors, sometimes violently. Merchants organized <strong>nonimportation agreements<\/strong> (boycotts of British goods), and women in groups like the <strong>Daughters of Liberty<\/strong> spun homemade cloth to replace British textiles.<\/p>\n<p>Boycotts hurt British merchants, who pressured Parliament. In <strong>1766<\/strong> Parliament <strong>repealed the Stamp Act<\/strong> — but the same day passed the <strong>Declaratory Act<\/strong>, asserting its power to legislate for the colonies \"<strong>in all cases whatsoever<\/strong>.\"<\/p>\n<h2>The Townshend Acts and the Boston Massacre<\/h2>\n<p>In <strong>1767<\/strong>, <strong>Charles Townshend<\/strong> tried \"external\" taxes: the <strong>Townshend Acts<\/strong> placed duties on imported <strong>glass, lead, paint, paper, and tea<\/strong>, using the money to pay royal governors and judges (freeing them from the assemblies' power of the purse). <strong>John Dickinson's<\/strong> <em>Letters from a Farmer in Pennsylvania<\/em> argued that Parliament could regulate trade but not tax for revenue. Colonists renewed boycotts.<\/p>\n<p>British troops were sent to Boston. On <strong>March 5, 1770<\/strong>, a crowd taunted soldiers, who fired, killing five colonists, including <strong>Crispus Attucks<\/strong>, a man of African and Native descent. Patriots like <strong>Samuel Adams<\/strong> and <strong>Paul Revere<\/strong> (whose engraving shaped public opinion) called it the <strong>Boston Massacre<\/strong>. <strong>John Adams<\/strong> defended the soldiers in court to show that colonists respected law; most were acquitted. That same year Parliament repealed the Townshend duties <strong>except the tax on tea<\/strong>, kept as a symbol of its authority.<\/p>\n<p>In 1772, Samuel Adams organized <strong>committees of correspondence<\/strong> to share news and coordinate resistance among towns — and soon among colonies. They became a network for revolution.<\/p>\n<h2>Tea, punishment, and the First Continental Congress<\/h2>\n<p>The <strong>Tea Act (1773)<\/strong> helped the struggling <strong>British East India Company<\/strong> by letting it sell tea directly to the colonies. The tea was actually <strong>cheaper<\/strong>, even with the tax — but colonists saw a trick to make them accept Parliament's right to tax, and feared monopoly. On <strong>December 16, 1773<\/strong>, Bostonians disguised as Mohawks dumped 342 chests into the harbor: the <strong>Boston Tea Party<\/strong>.<\/p>\n<div class=\"chain\"><div><b>Cause<\/b>Tea Act (1773) grants the East India Company a monopoly<\/div><span>→<\/span><div class=\"ev\"><b>Event<\/b>Boston Tea Party<\/div><span>→<\/span><div><b>Consequence<\/b>Parliament passes the Coercive (Intolerable) Acts to punish Massachusetts<\/div><\/div>\n<p>Parliament responded with the <strong>Coercive Acts (1774)<\/strong>, which colonists called the <strong>Intolerable Acts<\/strong>: they <strong>closed Boston Harbor<\/strong> until the tea was paid for, restricted Massachusetts self-government and town meetings, allowed royal officials accused of crimes to be tried elsewhere, and expanded quartering. Separately, the <strong>Quebec Act (1774)<\/strong> extended Quebec's borders into the Ohio Valley and tolerated Catholicism there — colonists saw it as another blow.<\/p>\n<p>Rather than isolating Massachusetts, the Acts united the colonies. The <strong>First Continental Congress (1774)<\/strong> met in Philadelphia (Georgia did not attend), endorsed resistance, and created the <strong>Continental Association<\/strong> to boycott British goods. It still sought rights within the empire, not independence.<\/p>\n<h2>War begins<\/h2>\n<p>In <strong>April 1775<\/strong>, British troops marched from Boston to seize colonial weapons at Concord. Minutemen met them at <strong>Lexington and Concord<\/strong> — \"the shot heard round the world.\" The war had begun.<\/p>\n<p>The <strong>Second Continental Congress (May 1775)<\/strong> created the <strong>Continental Army<\/strong> with <strong>George Washington<\/strong> as commander, yet still sent the <strong>Olive Branch Petition<\/strong> to King George III, asking for reconciliation. The king rejected it and declared the colonies in rebellion. At <strong>Bunker Hill (Breed's Hill)<\/strong> in June 1775, colonists lost the ground but inflicted heavy British casualties.<\/p>\n<p>In January <strong>1776<\/strong>, <strong>Thomas Paine<\/strong> published <strong>Common Sense<\/strong>, a best-selling pamphlet in plain language that attacked monarchy itself and argued it was \"common sense\" for an island to stop ruling a continent. It turned many colonists toward independence.<\/p>\n<h2>The Declaration of Independence<\/h2>\n<p>On <strong>July 2, 1776<\/strong>, Congress voted for independence; on <strong>July 4<\/strong> it adopted the <strong>Declaration of Independence<\/strong>, written mainly by <strong>Thomas Jefferson<\/strong>. It has three parts: 1. A philosophy drawn from <strong>John Locke<\/strong>: all men are created equal with <strong>unalienable rights<\/strong> to \"Life, Liberty and the pursuit of Happiness\"; governments get power from the <strong>consent of the governed<\/strong>; people may alter or abolish a government that destroys these rights. 2. A long list of <strong>grievances against King George III<\/strong> (not Parliament, which colonists now denied had any authority over them). 3. A formal declaration that the colonies are \"Free and Independent States.\"<\/p>\n<div class=\"tip\"><b>Exam tip:<\/b> The Declaration blames the <strong>king<\/strong>, not Parliament — a classic exam detail. And its Lockean phrase \"consent of the governed\" is a favorite passage-identification item.<\/div>\n<h2>Who fought, and why the Americans won<\/h2>\n<p>Colonists were divided. Roughly a fifth were <strong>Loyalists<\/strong> (Tories) — often royal officials, Anglican clergy, some wealthy merchants, and recent immigrants; many fled to Canada or Britain. Most <strong>Native nations<\/strong> sided with Britain, which seemed less threatening to their lands; the <strong>Iroquois Confederacy split<\/strong>. In 1775 Virginia's royal governor issued <strong>Lord Dunmore's Proclamation<\/strong>, promising freedom to enslaved people who fought for Britain; thousands fled to British lines. About 5,000 African Americans served in the Continental forces.<\/p>\n<p>The war in brief:<\/p>\n<ul><li><strong>1776:<\/strong> Washington lost New York but won small victories at <strong>Trenton<\/strong> and <strong>Princeton<\/strong> that kept the army alive.<\/li><li><strong>1777:<\/strong> The American victory at <strong>Saratoga<\/strong> was the <strong>turning point<\/strong> because it convinced <strong>France<\/strong> to sign an <strong>alliance (1778)<\/strong>, bringing money, troops, and a navy. Spain and the Netherlands later joined against Britain.<\/li><li><strong>Winter 1777–1778:<\/strong> the army suffered at <strong>Valley Forge<\/strong>; the Prussian officer <strong>Baron von Steuben<\/strong> drilled it into a professional force. The <strong>Marquis de Lafayette<\/strong> served as a key French volunteer.<\/li><li><strong>1778–1781:<\/strong> Britain shifted its strategy to the <strong>South<\/strong>, hoping for Loyalist support; it took Charleston, but American forces under <strong>Nathanael Greene<\/strong> wore it down.<\/li><li><strong>1781:<\/strong> At <strong>Yorktown<\/strong>, Virginia, Washington's army and French troops besieged <strong>General Cornwallis<\/strong>, while the <strong>French navy<\/strong> blocked escape by sea. Cornwallis surrendered — the last major battle.<\/li><\/ul>\n<p>Americans won because they fought on home ground, needed only to survive rather than conquer, had strong leadership in Washington, received crucial <strong>French aid<\/strong>, and because Britain faced a long supply line and a costly global war.<\/p>\n<h2>The Treaty of Paris (1783)<\/h2>\n<p>The <strong>Treaty of Paris (1783)<\/strong> recognized American <strong>independence<\/strong>, set boundaries from the Atlantic to the <strong>Mississippi River<\/strong> and from Canada to Florida (which returned to Spain), granted fishing rights off Newfoundland, and recommended that states restore Loyalist property (states largely ignored this). Native allies of Britain were not even mentioned.<\/p>\n<h2>A revolution in society?<\/h2>\n<p>The Revolution raised questions it did not fully answer. <strong>Abigail Adams<\/strong> asked her husband to \"<strong>remember the ladies<\/strong>\" in the new laws; women did not gain political rights but the ideal of <strong>Republican Motherhood<\/strong> (Unit 6) gave them a role raising virtuous citizens. Several northern states began to abolish slavery — <strong>Pennsylvania<\/strong> passed the first <strong>gradual emancipation<\/strong> law in <strong>1780<\/strong>. Many states ended established churches; Virginia's <strong>Statute for Religious Freedom<\/strong> (Jefferson, 1786) is the famous example.<\/p>","words":1694,"minutes":11,"must":["<strong>Proclamation of 1763<\/strong> banned settlement west of the Appalachians (after <strong>Pontiac's Rebellion<\/strong>).","<strong>Stamp Act (1765):<\/strong> first direct tax → \"no taxation without representation,\" <strong>Stamp Act Congress<\/strong>, boycotts → repealed 1766 + <strong>Declaratory Act<\/strong>.","<strong>Virtual representation<\/stron
